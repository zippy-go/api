# Path item for /v1/customer/orders/{order_id}/delivery-rating. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: "The order."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
post:
  operationId: rateOrderDelivery
  summary: "Rate the delivery"
  description: "\"How was your delivery?\": rates the delivery of a delivered order once, for the Agent who carried it, apart from the food: a thumb and tags from its list, never edited. The Agent sees the thumb and the tags, never the customer's name. It counts in the Agent's rating in place of the order's review. Publishes `reviews.task_rating.written`."
  tags:
    - Reviews
  security:
    - Bearer: []
  requestBody:
    required: true
    description: "The rating."
    content:
      "application/json":
        schema:
          $ref: ../../components/schemas/reviews/DeliveryRatingInput.yaml
  responses:
    "201":
      description: "The order's rating state with the delivery's rating."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/OrderReviewState.yaml
    "400":
      description: "`validation_failed`: a tag named twice."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such order of the customer's."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`delivery_not_rateable` (no Agent delivered the order), `tag_not_offered`, or `already_rated`."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
