type: object
description: Cash an Agent collected at a drop.
required:
  - task_id
  - order_number
  - amount
  - collected_at
properties:
  task_id:
    type: string
    format: uuid
    description: The task.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB1234
  amount:
    $ref: ../common/Money.yaml
    description: What was collected.
  collected_at:
    type: string
    format: date-time
    description: When.
    examples:
      - 2026-10-16T09:00:00Z
examples:
  - task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
    order_number: AB1234
    amount:
      minor_units: 48000
      currency: INR
    collected_at: 2026-10-16T09:00:00Z
