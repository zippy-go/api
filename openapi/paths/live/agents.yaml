# Path item for /v1/live/agents. Referenced from openapi.yaml.
get:
  operationId: streamAgents
  summary: Stream agent positions and statuses
  description: |
    Opens a server-sent events stream (`text/event-stream`) that pushes agent
    positions and statuses as they change. The stream starts with a
    `snapshot` of every agent that matches the filters, then sends one frame
    per change. Each frame has an `event:` line naming the event type and a
    `data:` line carrying the JSON described below.

    | Event       | Data                                                            | When                              |
    | ----------- | --------------------------------------------------------------- | --------------------------------- |
    | `snapshot`  | `AgentSnapshot`: `{ "agents": [Agent, ...] }`                    | Once, when the stream opens       |
    | `position`  | `AgentPositionUpdate`: `{ "agent_id", "position", "status" }`   | An agent's position changed       |
    | `status`    | `AgentStatusUpdate`: `{ "agent_id", "status", "last_seen_at" }` | An agent went online or offline   |
    | `heartbeat` | empty                                                           | Every 15 seconds                  |

    Frames carry no `id` field and the `Last-Event-ID` request header is
    ignored: missed frames are not replayed. A client that loses the
    connection reconnects (with backoff) and receives a fresh `snapshot` to
    start from. Treat the absence of any frame for 45 seconds, three missed
    heartbeats, as a lost connection.
  tags:
    - Live
  parameters:
    - $ref: ../../components/parameters/PartnerIdQuery.yaml
  responses:
    '200':
      description: The stream is open. It stays open until the client closes it or the server restarts; frames follow as changes happen.
      content:
        text/event-stream:
          schema:
            $ref: ../../components/schemas/live/ServerSentEventStream.yaml
          example: |
            event: snapshot
            data: {"agents":[{"id":"0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10","partner_id":"0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02","display_name":"Agent 10","service_kind":"delivery","status":"online","last_seen_at":"2026-10-14T08:00:00Z","position":{"lat":12.9716,"lng":77.5946,"heading_deg":270.5,"speed_mps":4.2,"recorded_at":"2026-10-14T08:00:00Z"}}]}

            event: position
            data: {"agent_id":"0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10","position":{"lat":12.972,"lng":77.595,"heading_deg":270.5,"speed_mps":4.2,"recorded_at":"2026-10-14T08:00:05Z"},"status":"online"}

            event: status
            data: {"agent_id":"0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10","status":"offline","last_seen_at":"2026-10-14T08:00:05Z"}

            event: heartbeat
            data:

    '404':
      description: The `partner_id` names a partner the caller does not belong to, answered exactly like a partner that does not exist (`not_found`), so a partner cannot learn that another's id exists.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: A client error such as `400` (`validation_failed` with `malformed_identifier` for a `partner_id` that is not a UUID) or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
