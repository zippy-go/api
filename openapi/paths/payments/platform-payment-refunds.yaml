# Path item for /v1/platform/payments/{payment_id}/refunds. Referenced from openapi.yaml.
post:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: refundPayment
  summary: Refund a payment
  description: "A refund with a reason, a note and who bears it, to the original UPI or card payment first, up to what it was charged less what was refunded to it, and the rest to the Wallet, to the balance it was spent from; a cash order's refund goes to the Wallet's paid balance. Refunds together never exceed what was paid (`refund_exceeds_paid`, saying the most). `order:refund`, and a fresh step-up of this Mission Control session (`step_up_required`). Requires `Idempotency-Key`: a repeat makes one refund. Written to the audit log."
  parameters:
    - name: payment_id
      in: path
      required: true
      description: The payment.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The amount, the reason, the note and the payer.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payments/PaymentRefundRequest.yaml
  responses:
    "201":
      description: The refund.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/PaymentRefund.yaml
    "400":
      description: "`validation_failed`: `idempotency_key_missing`, or a malformed body."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), the member lacks `order:refund` (`access_denied`), or the session has no fresh proof (`step_up_required`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such payment (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`refund_exceeds_paid`: more than is left to refund; `not_refundable`: nothing was taken yet."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
