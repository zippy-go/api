# Path item for /v1/recommendations/{recommendation_id}/accepted. Referenced from openapi.yaml.
parameters:
  - name: recommendation_id
    in: path
    required: true
    description: The recommendation, as it was shown.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bf001
post:
  operationId: acceptRecommendation
  summary: Say a recommendation was taken
  description: |
    Called once the customer added the recommended item to a basket: publishes
    `crosssell.recommendation.accepted` with the kind and the item, once however
    often it is called, while the recommendation's `expires_at` has not passed.
    Public, as the recommendation was.
  tags:
    - Recommendations
  security:
    - Bearer: []
    - {}
  responses:
    "204":
      description: 'Recorded, or recorded already.'
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such recommendation, or its time passed (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
