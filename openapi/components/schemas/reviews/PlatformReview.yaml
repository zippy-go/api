type: object
description: "A review as Mission Control reads it: everything, the note and photos even when hidden, with who hid them."
required:
  - id
  - order_id
  - order_number
  - location_id
  - store_name
  - partner_id
  - customer_id
  - first_name
  - thumb
  - tags
  - note
  - photos
  - fulfilment
  - created_at
  - hidden
  - agent
  - delivery_rating
  - replies
properties:
  id:
    type: string
    format: uuid
    description: "The review."
  order_id:
    type: string
    format: uuid
    description: "The order."
  order_number:
    type: string
    examples:
      - AB0042
    description: "Its number."
  location_id:
    type: string
    format: uuid
    description: "The store."
  store_name:
    type: string
    examples:
      - "Dev Kitchen Gachibowli"
    description: "The store's name."
  partner_id:
    type: string
    format: uuid
    description: "The store's Partner."
  customer_id:
    type: string
    format: uuid
    description: "The customer."
  first_name:
    type: string
    examples:
      - Asha
    description: "The reviewer's first name."
  thumb:
    $ref: ./ReviewThumb.yaml
    description: "Up or down."
  tags:
    type: array
    items:
      $ref: ./ReviewTagOption.yaml
    description: "The tags chosen."
  note:
    type:
      - string
      - "null"
    examples:
      - "The biryani arrived cold."
    description: "The note."
  photos:
    type: array
    items:
      $ref: ./ReviewPhoto.yaml
    description: "The photos."
  fulfilment:
    $ref: ./ReviewFulfilment.yaml
    description: "How the order reached the customer."
  created_at:
    type: string
    format: date-time
    description: "When it was written."
  hidden:
    oneOf:
      - $ref: ./ReviewHiding.yaml
      - type: "null"
    description: "Who hid the note and photos, when and why; `null` while shown."
  agent:
    oneOf:
      - $ref: ./ReviewAgent.yaml
      - type: "null"
    description: "The Agent who carried the order."
  delivery_rating:
    oneOf:
      - $ref: ./DeliveryRating.yaml
      - type: "null"
    description: "The delivery's own rating."
  replies:
    type: array
    items:
      $ref: ./ReviewReply.yaml
    description: "The Partner's replies, oldest first."
  subscription:
    oneOf:
      - $ref: ./ReviewSubscription.yaml
      - type: "null"
    description: The subscription it reviews for a month; `null` on a review of an order.
  booking_id:
    type:
      - string
      - "null"
    format: uuid
    description: "Since 0.29.0, the booking a completed booking's review is about (its order is the booking's order of fulfilment on site); `null` on other reviews."
    examples:
      - null
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0001"
    order_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
    order_number: AB0042
    location_id: "01a13a48-9e00-7000-8000-000000000301"
    store_name: "Dev Kitchen Gachibowli"
    partner_id: "01a13a48-9e00-7000-8000-000000000001"
    customer_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70"
    first_name: Asha
    thumb: down
    tags:
      - code: cold_damaged
        label: Cold/damaged
    note: "The biryani arrived cold."
    photos:
      - asset_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005"
        url: "https://objects.zippygo.example/zippygo-private/reviews/0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005.jpg?signature=example"
    fulfilment: delivered
    created_at: "2026-10-22T10:10:00Z"
    hidden:
      at: "2026-10-22T12:30:00Z"
      by: "Platform admin"
      reason: "Names a member of staff"
    agent:
      agent_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
      name: "Ravi Kumar"
    delivery_rating:
