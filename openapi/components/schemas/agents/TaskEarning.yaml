type: object
description: What a task earned, with its breakdown under the rule version it was offered under.
required:
  - task_id
  - delivery_id
  - order_number
  - kind
  - outcome
  - rule_version
  - lines
  - total
  - earned_at
properties:
  task_id:
    type: string
    format: uuid
    description: The task.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
  delivery_id:
    type: string
    format: uuid
    description: The delivery.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB1234
  kind:
    $ref: ./TaskKind.yaml
    description: The stop's kind.
  outcome:
    $ref: ./EarningOutcome.yaml
    description: Why it paid.
  rule_version:
    type: integer
    format: int32
    description: The pay rule version.
    examples:
      - 3
  lines:
    type: array
    items:
      $ref: ./EarningLine.yaml
    description: The breakdown.
    examples:
      - - kind: distance
          label: 3.2 km at ₹6.00 per km
          amount:
            minor_units: 1920
            currency: INR
  total:
    $ref: ../common/Money.yaml
    description: The total, tip included.
  earned_at:
    type: string
    format: date-time
    description: "When it was earned: the step's recorded time."
    examples:
      - 2026-10-16T09:42:00Z
examples:
  - task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
    delivery_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
    order_number: AB1234
    kind: drop_off
    outcome: completed
    rule_version: 3
    lines:
      - kind: distance
        label: 3.2 km at ₹6.00 per km
        amount:
          minor_units: 1920
          currency: INR
    total:
      minor_units: 7160
      currency: INR
    earned_at: 2026-10-16T09:42:00Z
