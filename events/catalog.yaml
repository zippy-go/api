# Catalog of every event type ZippyGo publishes.
#
# One entry per (type, version). `payload_schema` and `example` are paths
# relative to this file; `pnpm events:check` compiles every schema and
# validates every example against the envelope and the payload schema.
#
# Adding a field to a payload is additive and keeps the version; removing or
# renaming a field, or changing its type, is a new version (see README.md).
events:
  - type: platform.ping
    version: 1
    domain: platform
    description: >-
      Sent on request to verify that a webhook endpoint receives and
      acknowledges deliveries. Carries no business data.
    payload_schema: ./payloads/platform.ping.v1.schema.json
    example: ./examples/platform.ping.v1.json

  - type: fleet.agent.online
    version: 1
    domain: fleet
    description: >-
      An agent went online in one of the partner's services and is
      reporting. The envelope's `partner_id` is the partner the agent is
      attached to.
    payload_schema: ./payloads/fleet.agent.online.v1.schema.json
    example: ./examples/fleet.agent.online.v1.json

  - type: fleet.agent.offline
    version: 1
    domain: fleet
    description: >-
      An agent went offline, by signing off or by not reporting for too
      long; the payload says when it was last heard from. The envelope's
      `partner_id` is the partner the agent is attached to.
    payload_schema: ./payloads/fleet.agent.offline.v1.schema.json
    example: ./examples/fleet.agent.offline.v1.json

  - type: identity.user.registered
    version: 1
    domain: identity
    description: >-
      A user was created, by the first successful one-time code for an
      identifier or by accepting an invitation. The envelope's `partner_id`
      is `null`; the payload carries no email address or phone number.
    payload_schema: ./payloads/identity.user.registered.v1.schema.json
    example: ./examples/identity.user.registered.v1.json

  - type: customers.customer.registered
    version: 1
    domain: customers
    description: >-
      A customer account was opened: a registration completed with a code to
      the number, in the same transaction as the account. The envelope's
      `partner_id` is `null`; the payload carries no phone number, email
      address or address. A new user is also announced by
      `identity.user.registered`; a person who already held a membership
      opens a customer account without one.
    payload_schema: ./payloads/customers.customer.registered.v1.schema.json
    example: ./examples/customers.customer.registered.v1.json

  - type: identity.session.created
    version: 1
    domain: identity
    description: >-
      A user signed in and a session was created; the session id is the
      `sid` claim of its access tokens. Refreshing a session does not
      publish this event. The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/identity.session.created.v1.schema.json
    example: ./examples/identity.session.created.v1.json

  - type: identity.invitation.sent
    version: 1
    domain: identity
    description: >-
      An invitation to join a partner was created and its email is being
      sent. The envelope's `partner_id` is the partner that invited; the
      payload carries no email address.
    payload_schema: ./payloads/identity.invitation.sent.v1.schema.json
    example: ./examples/identity.invitation.sent.v1.json

  - type: identity.invitation.accepted
    version: 1
    domain: identity
    description: >-
      An invitation was accepted and turned into a membership;
      `tenancy.membership.created` is published alongside. The envelope's
      `partner_id` is the partner that invited.
    payload_schema: ./payloads/identity.invitation.accepted.v1.schema.json
    example: ./examples/identity.invitation.accepted.v1.json

  - type: tenancy.partner.created
    version: 1
    domain: tenancy
    description: >-
      A partner was created with the status `pending` and its creator
      became its first owner (`tenancy.membership.created` is published
      alongside). The envelope's `partner_id` is the new partner.
    payload_schema: ./payloads/tenancy.partner.created.v1.schema.json
    example: ./examples/tenancy.partner.created.v1.json

  - type: tenancy.partner.status_changed
    version: 1
    domain: tenancy
    description: >-
      The platform realm changed a partner's status along its lifecycle
      (pending, active, suspended, archived). The envelope's `partner_id` is
      the partner.
    payload_schema: ./payloads/tenancy.partner.status_changed.v1.schema.json
    example: ./examples/tenancy.partner.status_changed.v1.json

  - type: tenancy.location.created
    version: 1
    domain: tenancy
    description: >-
      A location was added to a partner. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.location.created.v1.schema.json
    example: ./examples/tenancy.location.created.v1.json

  - type: tenancy.membership.created
    version: 1
    domain: tenancy
    description: >-
      A user became a member of a partner, as its creator and first owner
      or by accepting an invitation. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.membership.created.v1.schema.json
    example: ./examples/tenancy.membership.created.v1.json

  - type: tenancy.service.updated
    version: 1
    domain: tenancy
    description: >-
      A partner's service was registered, enabled, disabled, configured,
      switched on or off at a location, or repriced; readers ask the
      registry where it trades. The envelope's `partner_id` is the partner;
      the configuration is not in the payload.
    payload_schema: ./payloads/tenancy.service.updated.v1.schema.json
    example: ./examples/tenancy.service.updated.v1.json

  - type: tenancy.partner.updated
    version: 1
    domain: tenancy
    description: >-
      A partner's profile, legal identity, kind, contacts, logo or
      banner changed; the payload names the members, never their values.
      The envelope's `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.partner.updated.v1.schema.json
    example: ./examples/tenancy.partner.updated.v1.json

  - type: tenancy.location.updated
    version: 1
    domain: tenancy
    description: >-
      A location's profile, settings, fulfilment, order settings,
      listing, pause, pictures or typed fields changed; the payload
      names the members. The envelope's `partner_id` is the location's
      partner.
    payload_schema: ./payloads/tenancy.location.updated.v1.schema.json
    example: ./examples/tenancy.location.updated.v1.json

  - type: tenancy.location.status_changed
    version: 1
    domain: tenancy
    description: >-
      A location moved along its lifecycle (pending, active, suspended,
      archived), including going live with its partner's activation. The
      envelope's `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.status_changed.v1.schema.json
    example: ./examples/tenancy.location.status_changed.v1.json

  - type: tenancy.location.deleted
    version: 1
    domain: tenancy
    description: >-
      A location was deleted softly, into the bin, from where it can be
      restored. The envelope's `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.deleted.v1.schema.json
    example: ./examples/tenancy.location.deleted.v1.json

  - type: tenancy.location.restored
    version: 1
    domain: tenancy
    description: >-
      A location was restored from the bin. The envelope's `partner_id`
      is the location's partner.
    payload_schema: ./payloads/tenancy.location.restored.v1.schema.json
    example: ./examples/tenancy.location.restored.v1.json

  - type: tenancy.location.paused
    version: 1
    domain: tenancy
    description: >-
      A location was paused until a moment, with a reason; it resumes by
      itself at `until`. The envelope's `partner_id` is the location's
      partner.
    payload_schema: ./payloads/tenancy.location.paused.v1.schema.json
    example: ./examples/tenancy.location.paused.v1.json

  - type: tenancy.location.resumed
    version: 1
    domain: tenancy
    description: >-
      A paused location was resumed before its moment. The envelope's
      `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.resumed.v1.schema.json
    example: ./examples/tenancy.location.resumed.v1.json

  - type: tenancy.document.filed
    version: 1
    domain: tenancy
    description: >-
      A partner filed a compliance document for review. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.filed.v1.schema.json
    example: ./examples/tenancy.document.filed.v1.json

  - type: tenancy.document.removed
    version: 1
    domain: tenancy
    description: >-
      A compliance document was taken off file. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.removed.v1.schema.json
    example: ./examples/tenancy.document.removed.v1.json

  - type: tenancy.document.reviewed
    version: 1
    domain: tenancy
    description: >-
      Platform staff approved or rejected a compliance document;
      services waiting for it are enabled in the same act. The
      envelope's `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.reviewed.v1.schema.json
    example: ./examples/tenancy.document.reviewed.v1.json

  - type: tenancy.document.notice_sent
    version: 1
    domain: tenancy
    description: >-
      A notice about a document's expiry (thirty days, seven days, the
      day, the end of the grace) or rejection went to the partner's
      contacts, once per step. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.document.notice_sent.v1.schema.json
    example: ./examples/tenancy.document.notice_sent.v1.json

  - type: tenancy.payout_account.changed
    version: 1
    domain: tenancy
    description: >-
      A partner stated or changed its payout account, unverified again;
      a changed number or IFSC holds the next payout. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.payout_account.changed.v1.schema.json
    example: ./examples/tenancy.payout_account.changed.v1.json

  - type: tenancy.payout_account.verified
    version: 1
    domain: tenancy
    description: >-
      Platform staff verified a partner's payout account. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.payout_account.verified.v1.schema.json
    example: ./examples/tenancy.payout_account.verified.v1.json

  - type: tenancy.plan.changed
    version: 1
    domain: tenancy
    description: >-
      A partner's plan changed (by platform staff, at a scheduled
      moment, or when the trial ended); services of kinds the new plan
      lacks were disabled in the same act. The envelope's `partner_id`
      is the partner.
    payload_schema: ./payloads/tenancy.plan.changed.v1.schema.json
    example: ./examples/tenancy.plan.changed.v1.json

  - type: reference.vertical.transitioned
    version: 1
    domain: reference
    description: >-
      A Vertical moved along its lifecycle (active, inactive, archived), so
      every open screen re-reads its display grid. The envelope's
      `partner_id` is `null`.
    payload_schema: ./payloads/reference.vertical.transitioned.v1.schema.json
    example: ./examples/reference.vertical.transitioned.v1.json

  - type: reference.country.status_changed
    version: 1
    domain: reference
    description: >-
      A country's status or one of its switches (orders, sign-in) changed;
      the payload carries the country's whole operating state. The
      envelope's `partner_id` is `null`.
    payload_schema: ./payloads/reference.country.status_changed.v1.schema.json
    example: ./examples/reference.country.status_changed.v1.json

  - type: reference.service_area.status_changed
    version: 1
    domain: reference
    description: >-
      A service area's status changed; everything beneath it follows, since
      `effectively_active` is read through the chain. The envelope's
      `partner_id` is `null`.
    payload_schema: ./payloads/reference.service_area.status_changed.v1.schema.json
    example: ./examples/reference.service_area.status_changed.v1.json

  - type: identity.sign_in.failed
    version: 1
    domain: identity
    description: >-
      A sign-in, a second step, a proof of the signed-in person or a
      service credential failed, with its true reason, which the answer to
      the caller never carries, for detecting credential stuffing. The
      envelope's `partner_id` is `null`; the payload carries a digest of
      the identifier and never the address, the password or the code.
    payload_schema: ./payloads/identity.sign_in.failed.v1.schema.json
    example: ./examples/identity.sign_in.failed.v1.json

  - type: access.grant.granted
    version: 1
    domain: access
    description: >-
      A role was granted to a member at a scope: the whole partner, one
      Location or one Service, or the platform. The envelope's
      `partner_id` is the partner, or `null` for a platform grant.
    payload_schema: ./payloads/access.grant.granted.v1.schema.json
    example: ./examples/access.grant.granted.v1.json

  - type: access.grant.revoked
    version: 1
    domain: access
    description: >-
      A grant was revoked, directly, by setting the member's access, or by
      removing the membership. The envelope's `partner_id` is the partner,
      or `null` for a platform grant.
    payload_schema: ./payloads/access.grant.revoked.v1.schema.json
    example: ./examples/access.grant.revoked.v1.json

  - type: access.membership.status_changed
    version: 1
    domain: access
    description: >-
      A membership was disabled or enabled; a disabled member keeps their
      grants for re-enabling. The envelope's `partner_id` is the partner,
      or `null` for a platform membership.
    payload_schema: ./payloads/access.membership.status_changed.v1.schema.json
    example: ./examples/access.membership.status_changed.v1.json

  - type: access.membership.removed
    version: 1
    domain: access
    description: >-
      A membership was removed and its grants revoked; the person, their
      profile and their other memberships remain. The envelope's
      `partner_id` is the partner, or `null` for a platform membership.
    payload_schema: ./payloads/access.membership.removed.v1.schema.json
    example: ./examples/access.membership.removed.v1.json

  - type: access.role.changed
    version: 1
    domain: access
    description: >-
      A role was defined, renamed or given new permissions, or deleted.
      The envelope's `partner_id` is the partner that owns the role, or
      `null` for a platform role.
    payload_schema: ./payloads/access.role.changed.v1.schema.json
    example: ./examples/access.role.changed.v1.json

  - type: access.envelope.changed
    version: 1
    domain: access
    description: >-
      The platform changed what it withholds from a partner's
      entitlements; every role of the partner lost what is withheld at
      once. The envelope's `partner_id` is the partner.
    payload_schema: ./payloads/access.envelope.changed.v1.schema.json
    example: ./examples/access.envelope.changed.v1.json

  - type: catalog.item.changed
    version: 1
    domain: catalog
    description: >-
      An item of a store's catalogue was created, changed, deleted or
      duplicated, or its stock, prices, questions or categories changed;
      the store's menu is republished within about a second. The
      envelope's `partner_id` is the store's partner; the store's
      catalogue channel carries `catalog.changed`.
    payload_schema: ./payloads/catalog.item.changed.v1.schema.json
    example: ./examples/catalog.item.changed.v1.json

  - type: catalog.category.changed
    version: 1
    domain: catalog
    description: >-
      A category of a store's catalogue was created, changed, deleted,
      duplicated or reordered, or the items on it changed. The
      envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.category.changed.v1.schema.json
    example: ./examples/catalog.category.changed.v1.json

  - type: catalog.modifier.changed
    version: 1
    domain: catalog
    description: >-
      A question (a modifier) of a store's catalogue was created,
      changed, deleted or duplicated, or its answers changed. The
      envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.modifier.changed.v1.schema.json
    example: ./examples/catalog.modifier.changed.v1.json

  - type: catalog.brand.changed
    version: 1
    domain: catalog
    description: >-
      A brand of a store's own list was created, renamed (and so renamed
      on every item carrying it) or deleted (leaving its items without a
      brand). The envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.brand.changed.v1.schema.json
    example: ./examples/catalog.brand.changed.v1.json

  - type: catalog.menu.published
    version: 1
    domain: catalog
    description: >-
      A store's menu was rebuilt into a new published document, within
      about a second of the changes it carries; its version only rises.
      The envelope's `partner_id` is the store's partner; the store's
      public channel carries `menu.published` with the version only, and
      search re-indexes the store from the document.
    payload_schema: ./payloads/catalog.menu.published.v1.schema.json
    example: ./examples/catalog.menu.published.v1.json

  - type: catalog.search.missed
    version: 1
    domain: catalog
    description: >-
      A customer's search found nothing, across a service area or inside
      one store; kept without the customer's identity so synonym groups
      and catalogues can be improved. The envelope's `partner_id` is
      `null`.
    payload_schema: ./payloads/catalog.search.missed.v1.schema.json
    example: ./examples/catalog.search.missed.v1.json

  - type: notifications.notice.sent
    version: 1
    domain: notifications
    description: >-
      Mission Control sent a notice; it was stored for every Location it
      reached before any was told. Each Location's notices channel then
      carries `notice.sent` with the notice id, and the Location's signed-in
      devices are pushed. The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/notifications.notice.sent.v1.schema.json
    example: ./examples/notifications.notice.sent.v1.json

  - type: notifications.message.failed
    version: 1
    domain: notifications
    description: >-
      A message was given up: its provider refused it, or it was still
      undeliverable after the retries at 1, 5 and 30 minutes. Operations
      watch the share of failures per channel. Never the number, the
      address or the words.
    payload_schema: ./payloads/notifications.message.failed.v1.schema.json
    example: ./examples/notifications.message.failed.v1.json

  - type: payments.payment.authorized
    version: 1
    domain: payments
    description: "A payment is confirmed: what checkout needs is secured by the provider's word (a card held, a UPI payment made), by the Wallet's hold or by the cash to collect, so the order may be placed. Ordering places the order on it. The envelope's `partner_id` is the order's Partner, `null` for a top-up."
    payload_schema: ./payloads/payments.payment.authorized.v1.schema.json
    example: ./examples/payments.payment.authorized.v1.json

  - type: payments.payment.captured
    version: 1
    domain: payments
    description: "Money was taken: a UPI payment made, a card charged at acceptance or at checkout, the Wallet's hold spent at acceptance (the promotional balance first), cash collected, or a top-up paid. Each field is what this capture took, by part; the ledger posts it at once. The envelope's `partner_id` is the order's Partner, `null` for a top-up."
    payload_schema: ./payloads/payments.payment.captured.v1.schema.json
    example: ./examples/payments.payment.captured.v1.json

  - type: payments.payment.failed
    version: 1
    domain: payments
    description: A try at the provider did not succeed (declined, refused, expired), or the charge at acceptance was refused. `final` says whether the payment can still be tried again within the order's time; a final failure releases the Wallet's hold. The envelope's `partner_id` is the order's Partner, `null` for a top-up.
    payload_schema: ./payloads/payments.payment.failed.v1.schema.json
    example: ./examples/payments.payment.failed.v1.json

  - type: payments.payment.released
    version: 1
    domain: payments
    description: "Holds were given back without taking money: a card hold voided, the Wallet's hold returned, the cash to collect cancelled, because the order was declined, cancelled or expired, or because less was kept at acceptance. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.payment.released.v1.schema.json
    example: ./examples/payments.payment.released.v1.json

  - type: payments.refund.issued
    version: 1
    domain: payments
    description: "A refund was made: what goes back to the original UPI or card payment and what goes to the Wallet, by balance; whether it gives back money the order never kept (`unsettled`) or money of a settled order (`settled`) and who bears it. The ledger posts it at once; the source part is sent to the provider when the customer can no longer take it in the Wallet. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.refund.issued.v1.schema.json
    example: ./examples/payments.refund.issued.v1.json

  - type: payments.refund.settled
    version: 1
    domain: payments
    description: "The source part of a refund reached its end: the provider completed it, or it went to the Wallet's paid balance instead, because the provider refused it or the customer took it there before it was sent. The ledger moves what went to the Wallet. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.refund.settled.v1.schema.json
    example: ./examples/payments.refund.settled.v1.json

  - type: wallet.entry.recorded
    version: 1
    domain: wallet
    description: "A customer's Wallet changed: a top-up, a credit, a refund, a hold for an order, its spend or release, a withdrawal or a correction, as one entry of one balance. The customer's channel carries `wallet.changed` to read again. The ledger posts credits and corrections from it; the other kinds are posted from the payments events that caused them. The envelope's `partner_id` is `null`, or the Partner that pays for a credit."
    payload_schema: ./payloads/wallet.entry.recorded.v1.schema.json
    example: ./examples/wallet.entry.recorded.v1.json

  - type: ledger.entry.posted
    version: 1
    domain: ledger
    description: "A journal entry was posted: its kind, what it is about and its postings, the debits equal to the credits. The envelope's `partner_id` is the Partner the entry is about, `null` otherwise."
    payload_schema: ./payloads/ledger.entry.posted.v1.schema.json
    example: ./examples/ledger.entry.posted.v1.json

  - type: payments.alert.raised
    version: 1
    domain: payments
    description: "A nightly check found a difference: a payment or refund the provider does not know, one it holds that nobody recorded, an amount the two disagree on, the ledger's provider clearing against the payments, or a Wallet against its entries or the ledger. Listed in Mission Control's Finance section until resolved. The envelope's `partner_id` is `null`."
    payload_schema: ./payloads/payments.alert.raised.v1.schema.json
    example: ./examples/payments.alert.raised.v1.json

  - type: ordering.order.placed
    version: 1
    domain: ordering
    description: >-
      An order was placed: paid, held, or with nothing to take now
      (cash); the store hears it. Consumers: notifications (the
      customer, the store's new order with its sound), the ledger and
      payments.
    payload_schema: ./payloads/ordering.order.placed.v1.schema.json
    example: ./examples/ordering.order.placed.v1.json

  - type: ordering.order.accepted
    version: 1
    domain: ordering
    description: >-
      The store, or Mission Control, accepted an order with a
      preparation time: it is promised ready at acceptance plus that
      time. Consumers: notifications (the customer, with the time), the
      ledger, dispatch from step 4.
    payload_schema: ./payloads/ordering.order.accepted.v1.schema.json
    example: ./examples/ordering.order.accepted.v1.json

  - type: ordering.order.lines_removed
    version: 1
    domain: ordering
    description: >-
      Lines were left out as the store accepted: never charged. A
      payment taken at checkout has what they cost refunded the way it
      was paid (an `ordering.order.refunded` follows); a held card is
      charged less. Published with `ordering.order.accepted`.
    payload_schema: ./payloads/ordering.order.lines_removed.v1.schema.json
    example: ./examples/ordering.order.lines_removed.v1.json

  - type: ordering.order.declined
    version: 1
    domain: ordering
    description: >-
      A placed order was declined: by the store with a reason, by
      Mission Control, or by the platform when nobody answered in time
      (`not_answered`) or the card could not be charged
      (`payment_failed`). Every hold is released and a payment taken at
      checkout refunded. Consumers: notifications (the customer, whether
      they were charged), payments, the ledger.
    payload_schema: ./payloads/ordering.order.declined.v1.schema.json
    example: ./examples/ordering.order.declined.v1.json

  - type: ordering.order.cancelled
    version: 1
    domain: ordering
    description: >-
      An order was cancelled: by the customer before acceptance (while
      still paying too, when they gave up paying: `previous_status`
      `paying`, nothing taken and the store never told), by the store
      after it, or by Mission Control at any point. Everything held is
      released and everything paid goes back, each part where it came
      from; `payer` bears a refund after acceptance. Consumers:
      notifications, payments (releases what ordering's own call did
      not), the ledger (reverses an accepted order's split).
    payload_schema: ./payloads/ordering.order.cancelled.v1.schema.json
    example: ./examples/ordering.order.cancelled.v1.json

  - type: ordering.order.expired
    version: 1
    domain: ordering
    description: >-
      An order was not paid within the platform's window
      (`ordering.unpaid_expiry_minutes`) and expired: every hold
      released, anything taken refunded; the customer's basket still
      holds what they chose and the order is not listed.
    payload_schema: ./payloads/ordering.order.expired.v1.schema.json
    example: ./examples/ordering.order.expired.v1.json

  - type: ordering.order.preparation_extended
    version: 1
    domain: ordering
    description: >-
      An accepted order was given more preparation time; its promise
      moved and the customer is told.
    payload_schema: ./payloads/ordering.order.preparation_extended.v1.schema.json
    example: ./examples/ordering.order.preparation_extended.v1.json

  - type: ordering.order.ready
    version: 1
    domain: ordering
    description: >-
      An accepted order was marked ready: a pickup waits to be
      collected, a delivery for its agent. Consumers: notifications (a
      pickup's customer), dispatch from step 4.
    payload_schema: ./payloads/ordering.order.ready.v1.schema.json
    example: ./examples/ordering.order.ready.v1.json

  - type: ordering.order.handed_over
    version: 1
    domain: ordering
    description: >-
      A ready delivery was handed to the agent and is on its way.
    payload_schema: ./payloads/ordering.order.handed_over.v1.schema.json
    example: ./examples/ordering.order.handed_over.v1.json

  - type: ordering.order.collected
    version: 1
    domain: ordering
    description: >-
      A ready pickup was collected at the counter: the order is
      complete.
    payload_schema: ./payloads/ordering.order.collected.v1.schema.json
    example: ./examples/ordering.order.collected.v1.json

  - type: ordering.order.delivered
    version: 1
    domain: ordering
    description: >-
      A delivery on its way was delivered: the order is complete.
    payload_schema: ./payloads/ordering.order.delivered.v1.schema.json
    example: ./examples/ordering.order.delivered.v1.json

  - type: ordering.order.refunded
    version: 1
    domain: ordering
    description: >-
      Money went back on an order: lines left out at acceptance, a
      decline or a cancellation of a paid order, Mission Control's
      refund of lines and fees with a reason, or a payment confirmed
      after its order ended. The payments module made the refund (to the
      source first, up to what it was charged less what was refunded to
      it, the rest to the Wallet) and `refund_id` is its id; the ledger
      posts it from `payments.refund.issued`. Consumers: notifications.
    payload_schema: ./payloads/ordering.order.refunded.v1.schema.json
    example: ./examples/ordering.order.refunded.v1.json

  - type: ordering.order.help_requested
    version: 1
    domain: ordering
    description: >-
      A customer asked for help with an order; Mission Control sees it
      at once as needing somebody.
    payload_schema: ./payloads/ordering.order.help_requested.v1.schema.json
    example: ./examples/ordering.order.help_requested.v1.json

  - type: ordering.order.help_resolved
    version: 1
    domain: ordering
    description: >-
      Support resolved a help request with a sentence saying what was
      done; the customer is told.
    payload_schema: ./payloads/ordering.order.help_resolved.v1.schema.json
    example: ./examples/ordering.order.help_resolved.v1.json
