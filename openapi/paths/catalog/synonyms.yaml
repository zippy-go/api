post:
  operationId: createSearchSynonymGroup
  summary: Add a synonym group
  description: Adds a group of words, in any script, each of which finds what any other finds, ranked below an exact match, in one Vertical or in every one. Searches use it within a minute, with no rebuild. `setting:write`.
  tags:
    - Search
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The words.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/SearchSynonymGroupCreate.yaml
  responses:
    "201":
