type: object
description: A change of a plan; absent members keep what is stored. A changed price of an item is announced to every subscriber and applies to them seven days after.
properties:
  name:
    type: string
    minLength: 1
    maxLength: 80
    description: Its name.
    examples:
      - Daily milk
  description:
    type:
      - string
      - "null"
    maxLength: 500
    description: What it is; `null` clears.
    examples:
      - Fresh toned milk at your door every morning.
  items:
    type: array
    items:
      $ref: ./SubscriptionPlanItemInput.yaml
    description: "Its items, every one: an item left out stops being offered to new subscribers."
  frequencies:
    type: array
    items:
      $ref: ../subscriptions/SubscriptionFrequency.yaml
    description: The frequencies it allows.
  window:
    $ref: ../subscriptions/DeliveryWindow.yaml
    description: The delivery window; subscribers keep theirs until they change it.
  min_deliveries:
    type: integer
    minimum: 1
    maximum: 60
    description: The minimum term in deliveries.
    examples:
      - 7
  substitutions_allowed:
    type: boolean
    description: Whether substitutions are allowed.
    examples:
      - true
  delivery_fee:
    $ref: ../common/Money.yaml
    description: The delivery fee of each delivery.
examples:
  - name: Daily milk
    description: Fresh toned milk at your door every morning.
    items:
      - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7101
        variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
        unit_price:
          minor_units: 3200
          currency: INR
        default_quantity: 1
        min_quantity: 1
        max_quantity: 6
    frequencies:
      - daily
      - weekdays
    window:
      starts: 06:00
      ends: 08:00
    min_deliveries: 7
    substitutions_allowed: true
    delivery_fee:
      minor_units: 0
      currency: INR
