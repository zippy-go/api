# Path item for /v1/partners/{partner_id}/members/{membership_id}/grants. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: membership_id
    in: path
    required: true
    description: The membership, which must belong to the realm in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a30
post:
  operationId: createMemberGrant
  summary: Grant a role to a member
  description: Grants a role to a member at the whole partner, or at one Location or one Service of it; `staff:write`, and nobody hands out a role holding more than they hold.
  tags:
    - Access
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The role and where it applies.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/access/AccessGrantCreate.yaml
  responses:
    '201':
      description: The grant.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/AccessGrant.yaml
    '400':
      description: Malformed body, or `invalid_scope`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` or `permission_escalation`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner, membership or role.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`cross_tenant_role` or `cross_tenant_scope`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
