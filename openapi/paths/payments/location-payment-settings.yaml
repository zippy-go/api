# Path item for /v1/partners/{partner_id}/locations/{location_id}/payment-settings. Referenced from openapi.yaml.
get:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: getLocationPaymentSettings
  summary: How a Location takes cash
  description: Whether the Location takes cash on delivery and on collection, its own ceiling and the platform's, and the one that applies. A Location that never set them takes no cash. `location:read` at the Location; platform staff read with `location:read` platform-wide. Carries `ETag`.
  parameters:
    - $ref: ../../components/parameters/PartnerIdPath.yaml
    - name: location_id
      in: path
      required: true
      description: The Location.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The settings.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/LocationPaymentSettings.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401": &a1
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The member lacks `location:read` at the Location (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Partner or Location (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX: &a2
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default: &a3
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: setLocationPaymentSettings
  summary: Set how a Location takes cash
  description: Switches cash on delivery and on collection and sets the Location's own ceiling, which may only be lower than the platform's. `location:write` at the Location; `If-Match` guards against a stale version (`412`).
  parameters:
    - $ref: ../../components/parameters/PartnerIdPath.yaml
    - name: location_id
      in: path
      required: true
      description: The Location.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: The settings as a whole.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payments/LocationPaymentSettingsUpdate.yaml
  responses:
    "200":
      description: The settings.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/LocationPaymentSettings.yaml
    "400":
      description: "`validation_failed`: a ceiling above the platform's, or a malformed body."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401": *a1
    "403":
      description: The member lacks `location:write` at the Location (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Partner or Location (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "412":
      description: "`precondition_failed`: the settings changed since the `If-Match` version."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX: *a2
    default: *a3
