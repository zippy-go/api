# Path item for /v1/customer/wallet. Referenced from openapi.yaml.
get:
  tags:
    - Wallet
  security:
    - Bearer: []
  operationId: getWallet
  summary: The customer's Wallet
  description: The balance, what is held for open orders and what is available, each by paid and promotional. A Wallet that never moved holds nothing. Carries `ETag`; a change reaches the customer's open screens as the `wallet.changed` signal on their channel, to read again.
  responses:
    "200":
      description: The Wallet.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/wallet/Wallet.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
