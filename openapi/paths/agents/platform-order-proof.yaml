# Path item for /v1/platform/orders/{order_id}/proof-of-delivery. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order the delivery fulfils.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: getPlatformOrderProof
  summary: Read any order's proof of delivery
  description: The proof kept on the drop of any order, with ten-minute links to its files, every reading recorded. Needs platform `order:read`.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The proof.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ProofOfDelivery.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` naming the platform permission."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no drop for the order."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
