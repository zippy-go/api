# Path item for /v1/agent/tasks/{task_id}/help. Referenced from openapi.yaml.
parameters:
  - name: task_id
    in: path
    required: true
    description: "The task: one stop of a trip, held by the Agent."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
post:
  operationId: requestTaskHelp
  summary: Ask for help on a task
  description: Asks for help on a task in the Agent's words; the Partner's dispatcher and Mission Control see it on the delivery at once (`fleet.task.help_requested`). Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one.
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What is wrong.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/TaskHelpRequest.yaml
  responses:
    "201":
      description: The request.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/TaskHelp.yaml
    "400":
      description: "`validation_failed`: a message missing or over 500 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such task of the caller's memberships."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
