# Path item for /v1/agent/memberships/{agent_id}/zones. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: listDutyZones
  summary: List the zones to work in
  description: "The serving zones an Agent may choose when going on duty: the one the position given lies in first, then the zones of the service's area, then the rest of the city by name. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - name: lat
      in: query
      required: false
      description: The Agent's latitude.
      schema:
        type: number
        format: double
      example: 17.4401
    - name: lng
      in: query
      required: false
      description: The Agent's longitude.
      schema:
        type: number
        format: double
      example: 78.3489
  responses:
    "200":
      description: The zones.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/DutyZoneList.yaml
    "400":
      description: "`validation_failed`: a latitude or longitude out of range."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
