type: object
description: An item of a store's catalogue, sold as one or more variants, asking questions whose answers are items, as its staff keep it.
required:
  - id
  - location_id
  - name
  - description
  - status
  - listed
  - brand_id
  - brand_name
  - food_mark
  - spice_level
  - serves
  - dietary
  - allergens
  - tags
  - attributes
  - pictures
  - axes
  - variants
  - modifiers
  - availability
  - category_ids
  - answer_of
  - from_price
  - sellable
  - version
  - created_at
  - updated_at
  - created_by
  - updated_by
  - course
  - station_ids
properties:
  id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  name:
    $ref: ./LocalizedText.yaml
    description: Its name.
  description:
    oneOf:
      - $ref: ./LocalizedText.yaml
      - type: "null"
    description: What it says about itself.
  status:
    $ref: ./CatalogItemStatus.yaml
    description: On sale or off sale.
  listed:
    type: boolean
    description: On the menu in its own right; an item that is not is only an answer to questions and sits on no category.
  brand_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its brand, one of the store's, where the type carries brands.
    examples:
      - null
  food_mark:
    oneOf:
      - $ref: ./FoodMark.yaml
      - type: "null"
    description: Its veg or non-veg mark, required where the type carries the food mark.
  spice_level:
    oneOf:
      - $ref: ./SpiceLevel.yaml
      - type: "null"
    description: How hot it is, where the type carries food details.
  serves:
    type:
      - integer
      - "null"
    description: How many it serves, 1 to 20, where the type carries food details.
    minimum: 1
    maximum: 20
    examples:
      - 1
  dietary:
    type: array
    items:
      type: string
    description: Dietary tags from the type's closed set.
    examples:
      - - halal
  allergens:
    type: array
    items:
      type: string
    description: Allergen tags from the type's closed set.
    examples:
      - []
  tags:
    type: array
    items:
      type: string
    description: Words customers find it by, lower case.
    examples:
      - - biryani
        - dum
  attributes:
    type: object
    description: Values of the typed fields the type declares (`profile.product_fields`), key to value.
    additionalProperties: true
    examples:
      - {}
  brand_name:
    type:
      - string
      - "null"
    description: Its brand's name.
    examples:
      - null
  pictures:
    type: array
    items:
      $ref: ./CataloguePicture.yaml
    description: Its gallery; the first picture is its card.
  axes:
    type: array
    items:
      $ref: ./ItemAxis.yaml
    description: The axes it is sold along; none for an item sold one way.
  variants:
    type: array
    items:
      $ref: ./CatalogVariant.yaml
    description: "Its variants, at least one: one choosing nothing when it has no axes, one per combination it sells otherwise."
  modifiers:
    type: array
    items:
      $ref: ./ModifierUse.yaml
    description: The questions it asks, in order.
  availability:
    $ref: ./ItemAvailability.yaml
    description: When and how it may be ordered.
  category_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The categories it sits on.
  answer_of:
    type: array
    items:
      type: string
      format: uuid
    description: The questions offering it as an answer.
  from_price:
    $ref: ../common/Money.yaml
    description: The least an enabled variant costs, before offers.
  sellable:
    type: boolean
    description: "A customer can order it now: on sale with a variant that can be had."
  version:
    type: integer
    description: The version, raised by every change; the entity tag.
    examples:
      - 3
  created_at:
    type: string
    format: date-time
    description: When it was created.
    examples:
      - 2026-10-15T09:00:00Z
  updated_at:
    type: string
    format: date-time
    description: When it last changed.
    examples:
      - 2026-10-15T09:00:00Z
  created_by:
    type:
      - string
      - "null"
    format: uuid
    description: Who created it.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  updated_by:
    type:
      - string
      - "null"
    format: uuid
    description: Who last changed it.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  course:
    $ref: ./ItemCourse.yaml
    description: The course it is served in on the kitchen display; `none` when not set.
  station_ids:
    type: array
    items:
      type: string
      format: uuid
    maxItems: 12
    description: The kitchen stations it shows at, of its Location; empty for every station.
