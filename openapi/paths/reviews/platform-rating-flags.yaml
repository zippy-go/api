# Path item for /v1/platform/rating-flags. Referenced from openapi.yaml.
get:
  operationId: listPlatformRatingFlags
  summary: "Read the flags on Agents' ratings"
  description: "The flags Agents raised on ratings they find unfair: the platform fleet's, which Mission Control decides, by default, or a Partner's; open ones oldest first, decided ones newest first. Mission Control tokens only, with `review:read`."
  tags:
    - Reviews
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: "Only flags in this state; open ones by default."
      schema:
        $ref: ../../components/schemas/reviews/RatingFlagStatus.yaml
    - name: partner_id
      in: query
      required: false
      description: "Only this Partner's Agents'; the platform fleet's by default."
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 100; 50 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "A page of flags."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/RatingFlagPage.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
