# Path item for /v1/customer/refunds/{refund_id}/to-wallet. Referenced from openapi.yaml.
post:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: takeRefundInWallet
  summary: Take a refund in the Wallet now
  description: Takes the part of a refund still waiting to go back to the original UPI or card payment in the Wallet's paid balance at once, instead of waiting about 5 working days. Refused once the source refund has been sent to the provider (`refund_already_sent`). Requires `Idempotency-Key`.
  parameters:
    - name: refund_id
      in: path
      required: true
      description: The refund.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  responses:
    "200":
      description: The refund, its source part now in the Wallet.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/PaymentRefund.yaml
    "400":
      description: "`validation_failed`: `idempotency_key_missing`, or a malformed identifier."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such refund of the customer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`refund_already_sent`: the refund is already on its way to the account; or nothing of it goes to the source (`conflict`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
