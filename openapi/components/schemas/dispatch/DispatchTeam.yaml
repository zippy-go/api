type: object
description: A team of a delivery service's Agents.
required:
  - id
  - name
  - default
properties:
  id:
    type: string
    format: uuid
    description: The team.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd601
  name:
    type: string
    description: The team's name.
    examples:
      - Everyone
  default:
    type: boolean
    description: Whether it is the service's default team.
    examples:
      - true
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd601
    name: Everyone
    default: true
