type: object
description: The `AssetPurposeList` schema.
required:
  - items
properties:
  items:
    type: array
    items:
      $ref: ./AssetPurpose.yaml
    description: Every purpose with its rules.
examples:
  - items:
      - available: true
        code: vertical_image
        content_types:
          - image/png
          - image/jpeg
          - image/webp
          - image/svg+xml
        destination: public
        folder: verticals
        grantor: platform_staff
        label: Vertical image
        max_bytes: 2097152
        restricted: true
