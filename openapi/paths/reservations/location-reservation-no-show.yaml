# Path item for /v1/partners/{partner_id}/locations/{location_id}/reservations/{reservation_id}/no-show. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, one of the Partner's.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: reservation_id
    in: path
    required: true
    description: The reservation.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d1101
post:
  operationId: markReservationNoShow
  summary: Mark a no-show
  description: Marks a booked party that did not come, from 15 minutes after its time. Marking it again answers the same. Members need `reservation:manage` at the Location. Audited.
  tags:
    - Reservations
  security:
    - Bearer: []
  responses:
    "200":
      description: The reservation, a no-show.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reservations/LocationReservation.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without `reservation:manage` at the Location."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Partner, the Location or the reservation."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`no_show_too_early` before 15 minutes after its time; `conflict` when the party was seated or the reservation cancelled."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
