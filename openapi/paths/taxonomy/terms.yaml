# Path item for /v1/platform/taxonomy/terms. Referenced from openapi.yaml.
post:
  operationId: createTaxonomyTerm
  summary: Add a term to a Vertical's taxonomy
  description: |
    Adds a term under an active term of the same Vertical, or at the top of its
    tree, four levels deep at most. Its slug is made from the English name when
    none is given and is unique in the Vertical. Published as
    `catalog.taxonomy.changed` and audited. `taxonomy:write`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  requestBody:
    required: true
    description: 'The term.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/taxonomy/TaxonomyTermCreate.yaml
  responses:
    "201":
      description: 'The term.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyTerm.yaml
    "400":
      description: '`validation_failed`, with `taxonomy_too_deep`, `taxonomy_term_retired`, `taxonomy_term_elsewhere` or `taxonomy_slug_taken` on the field.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `taxonomy:write` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such Vertical or parent term (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
