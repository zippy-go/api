# Path item for /v1/auth/password. Referenced from openapi.yaml.
post:
  operationId: changePassword
  summary: Set or change the password
  description: |
    Sets the signed-in user's password, so that they can also sign in with
    `POST /v1/auth/password/sign-in`.

    A user who signed up with a one-time code has no password yet: they send
    `current_password` as `null` or omit it, and because a first password is
    a sensitive act they prove it is them first with `POST /v1/auth/step-up`
    (`403`, `step_up_required`, otherwise). Signing in is such a proof for the
    session's first ten minutes, so a first password chosen right after a
    code sign-in needs nothing more. Setting a first password ends the
    user's other sessions.

    A user who already has a password must send it; a missing or wrong one
    answers `403` (`forbidden`) and counts in the sign-in throttle (`429`
    after too many). A change ends every session of the user on every
    surface, this one included (its refresh cookie is cleared), and the user
    is told by email; sign in again with the new password.

    The new password must be 12 to 200 characters and not blank. Otherwise
    the response is `400` (`validation_failed`) with an `errors` entry that
    points at `/new_password` and carries the code `password_weak`.
  tags:
    - Auth
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The current password, when one is set, and the new one.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordChangeRequest.yaml
  responses:
    '204':
      description: The password was set. After a change every session of the user has ended, this one included.
      headers:
        Set-Cookie:
          description: After a change, clears the refresh cookie of this session's surface.
          schema:
            type: string
    '400':
      description: The body failed validation (`validation_failed`). A `new_password` that does not meet the policy is reported with the code `password_weak` on the `errors` entry that points at it.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The user has a password and `current_password` is missing or does not match it (`forbidden`), or a first password was sent without a fresh proof (`step_up_required`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: Too many wrong current passwords (`too_many_requests`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
