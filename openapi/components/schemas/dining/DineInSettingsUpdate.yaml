type: object
description: A change of the dine-in settings; absent members keep what is stored.
properties:
  enabled:
    type: boolean
    description: Whether tables open tabs.
    examples:
      - true
  service:
    $ref: ./DineInService.yaml
    description: How tables are served by default.
  pay_first_from:
    type:
      - string
      - "null"
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    description: Pay-first from this time; `null` turns it off.
    examples:
      - 22:00
  card_hold:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: A card hold; `null` asks for none.
  gst_percent:
    type:
      - integer
      - "null"
    minimum: 0
    maximum: 28
    description: GST added at the bill; `null` when prices include it.
    examples:
      - 5
  service_charge_percent:
    type:
      - integer
      - "null"
    minimum: 0
    maximum: 20
    description: A service charge; `null` takes none.
    examples:
      - 10
examples:
  - enabled: true
    service: order
    pay_first_from: 22:00
    card_hold:
      minor_units: 50000
      currency: INR
    gst_percent: 5
    service_charge_percent: 10
