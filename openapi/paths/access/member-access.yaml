# Path item for /v1/partners/{partner_id}/members/{membership_id}/access. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: membership_id
    in: path
    required: true
    description: The membership, which must belong to the realm in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a30
put:
  operationId: setMemberAccess
  summary: Set a member's access in one act
  description: Sets a member's access in one act as one role at the whole partner or at the Locations and Services named; the difference is applied as grants and revocations, each in the access history. `staff:write`, and the role must be held by who acts.
  tags:
    - Access
  security:
    - Bearer: []
  requestBody:
    required: true
    description: "The member's whole access: one role, at the whole partner or at the Locations and Services named."
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/access/AccessSet.yaml
  responses:
    '200':
      description: The member's grants after the change.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/AccessGrantList.yaml
    '400':
      description: Malformed body, or `invalid_scope`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` or `permission_escalation`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner, membership or role.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`cross_tenant_scope` or `last_owner`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
