{
  "type": "object",
  "description": "An API key as its Partner lists it; its secret is shown once, at creation.",
  "required": [
    "key_id",
    "name",
    "environment",
    "prefix",
    "scopes",
    "state",
    "created_by",
    "created_by_name",
    "created_at",
    "last_used_at",
    "expires_at",
    "revoked_at",
    "rotated_from",
    "unused"
  ],
  "properties": {
    "key_id": {
      "type": "string",
      "description": "The key.",
      "format": "uuid",
      "examples": [
        "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7c01"
      ]
    },
    "name": {
      "type": "string",
      "description": "What it is for.",
      "maxLength": 80,
      "examples": [
        "POS bridge"
      ]
    },
    "environment": {
      "$ref": "./ApiKeyEnvironment.yaml"
    },
    "prefix": {
      "type": "string",
      "description": "The first characters of the key, which tell it apart.",
      "examples": [
        "zg_test_4Fh2"
      ]
    },
    "scopes": {
      "type": "array",
      "items": {
        "$ref": "./ApiKeyScope.yaml"
      },
      "description": "What it may do."
    },
    "state": {
      "$ref": "./ApiKeyState.yaml"
    },
    "created_by": {
      "type": [
        "string",
        "null"
      ],
      "description": "Who created it (a user id).",
      "format": "uuid",
      "examples": [
        "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
      ]
    },
    "created_by_name": {
      "type": [
        "string",
        "null"
      ],
      "description": "Their name.",
      "examples": [
        "Ravi Kumar"
      ]
    },
    "created_at": {
      "type": "string",
      "description": "When it was created.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    },
    "last_used_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When it last answered a request; `null` until it has.",
      "format": "date-time",
      "examples": [
        null
      ]
    },
    "expires_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When a rotated key stops being accepted.",
      "format": "date-time",
      "examples": [
        null
      ]
    },
    "revoked_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When it was revoked.",
      "format": "date-time",
      "examples": [
        null
      ]
    },
    "rotated_from": {
      "type": [
        "string",
        "null"
      ],
      "description": "The key this one replaced by a rotation.",
      "format": "uuid",
      "examples": [
        null
      ]
    },
    "unused": {
      "type": "boolean",
      "description": "Whether it has not been used for 180 days; it is never revoked for that.",
      "examples": [
        false
      ]
    }
  },
  "examples": [
    {
      "key_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7c01",
      "name": "POS bridge",
      "environment": "sandbox",
      "prefix": "zg_test_4Fh2",
      "scopes": [
        "orders:read",
        "orders:write"
      ],
      "state": "active",
      "created_by": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10",
      "created_by_name": "Ravi Kumar",
      "created_at": "2026-11-02T10:15:00Z",
      "last_used_at": null,
      "expires_at": null,
      "revoked_at": null,
      "rotated_from": null,
      "unused": false
    }
  ]
}
