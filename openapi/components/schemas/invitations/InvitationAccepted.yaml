type: object
description: |
  The response of `POST /v1/invitations/{token}/accept`: the session of the
  person who accepted, signed in the same way as after a one-time code, and
  the membership the invitation turned into.
required:
  - token
  - membership
properties:
  token:
    $ref: ../auth/TokenResponse.yaml
    description: The session for the user who accepted; the refresh token is delivered as for the sign-in operations.
  membership:
    $ref: ../memberships/Membership.yaml
    description: The new membership in the partner that sent the invitation.
examples:
  - token:
      access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjAxOTJiNmY0LTliMGEtN2NkZS04ZjNhLTZkMmMxZTRiOWE1MCIsInR5cCI6IkpXVCJ9..cGxhY2Vob2xkZXItc2lnbmF0dXJl
      token_type: Bearer
      expires_in: 900
      refresh_token: null
      user:
        id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a21
        email: manager@example.com
        phone: null
        display_name: User 21
        created_at: 2026-10-14T08:20:00Z
    membership:
      id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a32
      partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
      user:
        id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a21
        email: manager@example.com
        phone: null
        display_name: User 21
        created_at: 2026-10-14T08:20:00Z
      role: manager
      created_at: 2026-10-14T08:20:00Z
