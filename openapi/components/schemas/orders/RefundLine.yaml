type: object
description: A line a refund gives back, with how many and what they cost the customer.
required:
  - line_id
  - quantity
  - amount
properties:
  line_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    description: The line.
  quantity:
    type: integer
    examples:
      - 1
    description: How many.
  amount:
    $ref: ../common/Money.yaml
    description: What they cost the customer.
examples:
  - line_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    quantity: 1
    amount:
      minor_units: 4000
      currency: INR
