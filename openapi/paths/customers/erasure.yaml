  "post": {
    "operationId": "eraseCustomer",
    "summary": "Erase my account",
    "description": "After a fresh code in this session (`step_up_required` otherwise) and the last four digits of the number: signs out everywhere, blanks the person's name, numbers, addresses and words, empties addresses, favourites, payment methods and devices, keeps orders, reviews and ledger entries anonymous, deletes prescription files at once, ends subscriptions and cancels future bookings under their rules; the customer stays counted in their cohort, and the number may register again. Refused while an order or a booking is in flight or a membership still serves a Partner (`erasure_blocked`, naming it). Announced as `customers.customer.erased`.",
