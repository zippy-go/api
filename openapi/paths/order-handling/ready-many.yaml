# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/ready. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000307
post:
  operationId: markOrdersReady
  summary: Mark several orders packed and ready
  description: "Marks orders ready together, such as a route's at packing: each one waiting under Scheduled or as new is accepted first, with its slot as its promise, then marked ready; each answers on its own. `order:manage` at the Location."
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The orders.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/OrdersReadyInput.yaml
  responses:
    "200":
      description: What happened to each.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/OrdersReadyResult.yaml
    "400":
      description: "`validation_failed`: no order, more than 50, or a malformed identifier."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:manage` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
