type: object
description: "Checkout at one store: only the questions placing would accept there, the customer's addresses with whether the store delivers to each, the ways to pay, the tip and cutlery where offered, and the basket priced with the answers saved so far."
required:
  - location_id
  - fulfilment
  - addresses
  - payment
  - tip
  - cutlery
  - if_unavailable
  - basket
properties:
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store.
  fulfilment:
    $ref: ./CheckoutFulfilment.yaml
    description: The ways the store offers.
  addresses:
    type: array
    items:
      $ref: ./CheckoutAddress.yaml
    description: The customer's saved addresses, the selected first; empty when none is saved.
  payment:
    $ref: ./CheckoutPayment.yaml
    description: The ways to pay.
  tip:
    $ref: ./CheckoutTip.yaml
    description: The tip.
  cutlery:
    $ref: ./CheckoutCutlery.yaml
    description: Cutlery.
  if_unavailable:
    type: array
    items:
      $ref: ./IfUnavailable.yaml
    description: The choices offered for an unavailable item.
  basket:
    $ref: ./Basket.yaml
    description: The basket, priced with the answers saved.
