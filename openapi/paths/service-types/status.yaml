# Path item for /v1/service-types/{service_type_id}/status. Referenced from openapi.yaml.
parameters:
  - name: service_type_id
    in: path
    required: true
    description: The service type
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
put:
  operationId: setServiceTypeStatus
  summary: Moves a service type along its lifecycle
  description: Moves a service type along its lifecycle; platform staff.
  tags:
    - Service types
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/StatusChange.yaml
  responses:
    '200':
      description: The service type after the change
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/ServiceType.yaml
    '400':
      description: Malformed body
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not platform staff, or `access_denied` without `location-type:write`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown service type
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`illegal_transition`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
