type: object
description: "A page of the customer's orders: the ones still moving first under \"Happening now\", then the rest newest first. An order never paid for is not listed."
required:
  - items
  - next_cursor
properties:
  items:
    type: array
    items:
      $ref: ./CustomerOrderSummary.yaml
    description: The orders.
  next_cursor:
    type:
      - string
      - "null"
    examples:
      - eyJ2IjoxfQ.c2ln
    description: The cursor of the next page; `null` on the last.
examples:
  - items:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
        number: AB0042
        status: paying
        status_text: Delivered at 19:05
        happening_now: false
        location_id: 01a13a48-9e00-7000-8000-000000000301
        store_name: Dev Kitchen Gachibowli
        fulfilment: delivery
        placed_at: 2026-10-16T13:00:00Z
        item_count: 2
        total:
          minor_units: 79800
          currency: INR
    next_cursor: eyJ2IjoxfQ.c2ln
