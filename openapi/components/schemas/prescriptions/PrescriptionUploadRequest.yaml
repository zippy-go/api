type: object
description: "A file to add to a basket line's prescription, the `PrescriptionUploadRequest` schema."
required:
  - file_name
  - content_type
  - size_bytes
properties:
  file_name:
    type: string
    minLength: 1
    maxLength: 200
    description: "The file's name as the customer has it; never kept beyond the upload."
    examples:
      - "prescription.jpg"
  content_type:
    type: string
    description: "A JPEG, PNG, WebP or PDF."
    examples:
      - "image/jpeg"
  size_bytes:
    type: integer
    format: int64
    minimum: 1
    maximum: 10485760
    description: "10 MB at most."
    examples:
      - 482113
examples:
  - {"file_name": "prescription.jpg", "content_type": "image/jpeg", "size_bytes": 482113}
