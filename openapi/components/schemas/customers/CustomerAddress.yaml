type: object
description: 'An address, the `CustomerAddress` schema: the postal part, the pin the customer confirmed, and what finds the door.'
required:
  - id
  - label
  - line1
  - city
  - country
  - lat
  - lng
  - building_type
  - selected
  - created_at
  - updated_at
  - version
properties:
  id:
    type: string
    format: uuid
    description: The address.
  label:
    $ref: ./AddressLabel.yaml
    description: Home, work or other.
  line1:
    type: string
    description: The address line.
    examples:
      - Road No 36
  city:
    type: string
    description: The city.
    examples:
      - Hyderabad
  country:
    type: string
    description: The country (alpha-2).
    examples:
      - IN
  lat:
    type: number
    description: Latitude of the pin.
    examples:
      - 17.4326
  lng:
    type: number
    description: Longitude of the pin.
    examples:
      - 78.4071
  building_type:
    $ref: ./BuildingType.yaml
    description: The kind of building, which decides the fields below.
  selected:
    type: boolean
    description: Whether it is the selected address, the one the storefront browses from.
  created_at:
    type: string
    format: date-time
    description: When it was added.
  updated_at:
    type: string
    format: date-time
    description: When it last changed.
  version:
    type: integer
    description: Raised by one on every change.
    examples:
      - 1
  block:
    type:
      - string
      - 'null'
    description: Block or tower.
    examples:
      - B
  building_name:
    type:
      - string
      - 'null'
    description: Building or society name.
    examples:
      - Lake View Residency
  flat_number:
    type:
      - string
      - 'null'
    description: Flat or door number.
    examples:
      - '402'
  floor:
    type:
      - string
      - 'null'
    description: Floor, as said.
    examples:
      - '4'
  instructions:
    type:
      - string
      - 'null'
    description: Notes for whoever delivers.
  label_name:
    type:
      - string
      - 'null'
    description: The name of an `other` place.
    examples:
      - Mum's place
  landmark:
    type:
      - string
      - 'null'
    description: A landmark that finds the gate.
    examples:
      - opposite the water tank
  line2:
    type:
      - string
      - 'null'
    description: A second line.
  locality:
    type:
      - string
      - 'null'
    description: The area or locality.
    examples:
      - Jubilee Hills
  postal_code:
    type:
      - string
      - 'null'
    description: The PIN code.
    examples:
      - '500033'
  receiver_name:
    type:
      - string
      - 'null'
    description: Who accepts a parcel, when somebody else does.
  receiver_phone:
    type:
      - string
      - 'null'
    description: Their number, E.164.
  state:
    type:
      - string
      - 'null'
    description: The state.
    examples:
      - Telangana
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a90
    label: home
    label_name: null
    line1: Road No 36
    line2: null
    locality: Jubilee Hills
    city: Hyderabad
    state: Telangana
    postal_code: '500033'
    country: IN
    lat: 17.4329
    lng: 78.4075
    building_type: apartment
    flat_number: '402'
    block: B
    building_name: Lake View Residency
    floor: '4'
    landmark: opposite the water tank
    instructions: null
    receiver_name: null
    receiver_phone: null
    selected: true
    created_at: 2026-10-15T09:00:00Z
    updated_at: 2026-10-15T09:00:00Z
    version: 1
