# Path item for /v1/platform/tickets/{ticket_id}/take. Referenced from openapi.yaml.
parameters:
  - name: ticket_id
    in: path
    required: true
    description: The ticket.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7001
post:
  operationId: takeTicket
  summary: Take a ticket
  description: The member takes an open ticket and holds it; taking one they hold answers it as it is (since 0.41.0). `ticket:manage`.
  tags:
    - Customers
  security:
    - Bearer: []
  responses:
    "200":
      description: The ticket.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/Ticket.yaml
    "400":
      description: "`validation_failed`; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `ticket:manage`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such ticket."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`ticket_taken`: another member holds it; `ticket_resolved`: it is resolved."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
