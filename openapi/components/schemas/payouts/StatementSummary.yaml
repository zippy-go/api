type: object
description: A Location's statement as lists show it.
required:
  - id
  - reference
  - payee_kind
  - partner_id
  - partner_name
  - location_id
  - location_name
  - week
  - starts_on
  - ends_on
  - state
  - standing
  - holds
  - total
  - payable
  - pays_on
  - paid_on
  - transfer_reference
  - invoice_number
  - unanswered_questions
  - locked_at
properties:
  id:
    type: string
    format: uuid
    description: The statement.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  reference:
    type: string
    description: Its reference.
    examples:
      - ZG-2026W43
  payee_kind:
    $ref: ./PayeeKind.yaml
    description: Always `location` here.
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  partner_name:
    type: string
    description: The Partner's name.
    examples:
      - ZippyGo Dev Partner
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  location_name:
    type: string
    description: The Location's name.
    examples:
      - Dev Kitchen Gachibowli
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week.
    examples:
      - 2026W43
  starts_on:
    type: string
    format: date
    description: Its Monday.
    examples:
      - 2026-10-19
  ends_on:
    type: string
    format: date
    description: Its Sunday.
    examples:
      - 2026-10-25
  state:
    $ref: ./StatementState.yaml
    description: Where it stands.
  standing:
    $ref: ./StatementStanding.yaml
    description: Where the money stands.
  holds:
    type: array
    items:
      $ref: ./PayoutHold.yaml
      description: A hold.
    description: What holds it.
  total:
    $ref: ../common/Money.yaml
    description: The week's total.
  payable:
    $ref: ../common/Money.yaml
    description: What is paid.
  pays_on:
    type: string
    format: date
    description: Its payday.
    examples:
      - 2026-10-30
  paid_on:
    type:
      - string
      - "null"
    format: date
    description: The day it was paid.
    examples:
      - null
  transfer_reference:
    type:
      - string
      - "null"
    description: The transfer's reference.
    examples:
      - null
  invoice_number:
    type:
      - string
      - "null"
    description: Its invoice's number; `null` for a week with no fee.
    examples:
      - INV-2026-00017
  unanswered_questions:
    type: integer
    description: Questions not answered yet.
    examples:
      - 0
  locked_at:
    type: string
    format: date-time
    description: When it was locked.
    examples:
      - 2026-10-27T00:15:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
    reference: ZG-2026W43
    payee_kind: location
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    partner_name: ZippyGo Dev Partner
    location_id: 01a13a48-9e00-7000-8000-000000000301
    location_name: Dev Kitchen Gachibowli
    week: 2026W43
    starts_on: 2026-10-19
    ends_on: 2026-10-25
    state: due
    standing:
      code: due
      sentence: Due on Friday 30 October
    holds: []
    total:
      minor_units: 42920
      currency: INR
    payable:
      minor_units: 42920
      currency: INR
    pays_on: 2026-10-30
    paid_on: null
    transfer_reference: null
    invoice_number: INV-2026-00017
    unanswered_questions: 0
    locked_at: 2026-10-27T00:15:00Z
