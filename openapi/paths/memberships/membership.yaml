# Path item for /v1/partners/{partner_id}/memberships/{membership_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: membership_id
    in: path
    required: true
    description: The membership, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a30
delete:
  operationId: removeMembership
  summary: Remove a member
  description: |
    Removes a member from the partner. Only owners may remove members,
    including themselves, but the last owner cannot be removed: the request
    answers `409` (`conflict`) and the partner keeps its owner. The removed
    user's access tokens carry the membership until they expire, at most
    15 minutes; the API stops honouring it at once.
  tags:
    - Memberships
  security:
    - Bearer: []
  responses:
    '204':
      description: The membership was removed.
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is not an owner of the partner (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner is not visible to the caller, or the membership does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The membership is the partner's last owner and cannot be removed (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
