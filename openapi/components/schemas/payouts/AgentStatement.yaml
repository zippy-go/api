type: object
description: "A platform fleet Agent's statement for one week, Monday to Sunday on the fleet's clock, locked the Tuesday after and paid the Friday to their checked UPI ID or bank account: task by task, with the tips in full and the cash kept on a line of its own. Reference `AG-{ISO week-based year}W{week}`."
required:
  - id
  - reference
  - agent_id
  - agent_name
  - partner_id
  - service_id
  - week
  - starts_on
  - ends_on
  - time_zone
  - currency
  - state
  - standing
  - holds
  - locked_at
  - locked_by
  - pays_on
  - paid_on
  - transfer_reference
  - destination
  - figures
  - tasks
  - adjustments
  - questions
  - unanswered_questions
  - history
  - documents
  - version
properties:
  id:
    type: string
    format: uuid
    description: The statement.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5201
  reference:
    type: string
    description: Its reference.
    examples:
      - AG-2026W43
  agent_id:
    type: string
    format: uuid
    description: The Agent membership.
    examples:
      - 01a13a48-9e00-7000-8000-000000000107
  agent_name:
    type: string
    description: The Agent's name.
    examples:
      - Ravi Kumar
  partner_id:
    type: string
    format: uuid
    description: The platform fleet.
    examples:
      - 01a13a48-9e00-7000-8000-000000000002
  service_id:
    type: string
    format: uuid
    description: The delivery service.
    examples:
      - 01a13a48-9e00-7000-8000-000000000202
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week.
    examples:
      - 2026W43
  starts_on:
    type: string
    format: date
    description: Its Monday.
    examples:
      - 2026-10-19
  ends_on:
    type: string
    format: date
    description: Its Sunday.
    examples:
      - 2026-10-25
  time_zone:
    type: string
    description: The fleet's clock.
    examples:
      - Asia/Kolkata
  currency:
    type: string
    description: The currency.
    examples:
      - INR
  state:
    $ref: ./StatementState.yaml
    description: Where it stands.
  standing:
    $ref: ./StatementStanding.yaml
    description: Where the money stands, in a sentence.
  holds:
    type: array
    items:
      $ref: ./PayoutHold.yaml
      description: A hold.
    description: What holds it while it is due.
  locked_at:
    type: string
    format: date-time
    description: When it was locked.
    examples:
      - 2026-10-27T00:15:00Z
  locked_by:
    $ref: ./StatementActor.yaml
    description: Who locked it.
  pays_on:
    type: string
    format: date
    description: Its payday.
    examples:
      - 2026-10-30
  paid_on:
    type:
      - string
      - "null"
    format: date
    description: The day it was paid.
    examples:
      - null
  transfer_reference:
    type:
      - string
      - "null"
    description: The transfer's reference, once paid.
    examples:
      - null
  destination:
    oneOf:
      - $ref: ./PayoutDestination.yaml
      - type: "null"
    description: Where it is paid; `null` when the Agent has given none.
  figures:
    $ref: ./AgentStatementFigures.yaml
    description: How it was worked out.
  tasks:
    type: array
    items:
      $ref: ./AgentStatementTask.yaml
      description: A task.
    description: Task by task, oldest first.
  adjustments:
    type: array
    items:
      $ref: ./PayoutAdjustment.yaml
      description: An adjustment.
    description: Adjustments settled into the week.
  questions:
    type: array
    items:
      $ref: ./PayoutQuestion.yaml
      description: A question.
    description: Questions asked about the week.
  unanswered_questions:
    type: integer
    description: Questions not answered yet.
    examples:
      - 0
  history:
    type: array
    items:
      $ref: ./StatementMove.yaml
      description: A move.
    description: Every move, oldest first.
  documents:
    type: array
    items:
      $ref: ./StatementDocument.yaml
      description: A document.
    description: Its PDF.
  version:
    type: integer
    description: The version, raised on every move.
    examples:
      - 1
