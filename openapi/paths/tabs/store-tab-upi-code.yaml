# Path item for /v1/partners/{partner_id}/locations/{location_id}/tabs/{tab_id}/bill/upi-code. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be the partner's in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: tab_id
    in: path
    required: true
    description: The tab, open at the Location in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
post:
  operationId: createStoreTabUpiCode
  summary: Print a dynamic UPI code
  description: "A dynamic UPI code for what the tab has left to pay, printed or shown at the table: paying it in a UPI app settles the tab. `order:manage` at the Location."
  tags:
    - Dine-in
  security:
    - Bearer: []
  responses:
    "201":
      description: The code.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/TabUpiCode.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:manage` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location or the tab."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`tab_bill_not_presented`, `tab_not_open`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
