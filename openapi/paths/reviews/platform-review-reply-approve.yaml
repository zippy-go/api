# Path item for /v1/platform/review-replies/{reply_id}/approve. Referenced from openapi.yaml.
parameters:
  - name: reply_id
    in: path
    required: true
    description: "The reply."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0002"
post:
  operationId: approveReviewReply
  summary: "Approve a reply"
  description: "Approves a waiting reply: it shows under the review on the store's page as the store's, and the reviewer is told once. Written to the audit log; publishes `reviews.reply.published`. Mission Control tokens only, with `review:manage`."
  tags:
    - Reviews
  security:
    - Bearer: []
  responses:
    "200":
      description: "The reply, approved."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/ModeratedReply.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such reply."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`reply_decided`: it was approved, rejected or withdrawn already."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
