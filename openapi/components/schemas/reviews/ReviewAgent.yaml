type: object
description: "An Agent, by name."
required:
  - agent_id
  - name
properties:
  agent_id:
    type: string
    format: uuid
    description: "The Agent membership."
  name:
    type: string
    examples:
      - "Ravi Kumar"
    description: "The Agent's name."
examples:
  - agent_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
    name: "Ravi Kumar"
