# Path item for /v1/partners/{partner_id}/services/{kind}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: kind
    in: path
    required: true
    description: The kind of service to create or replace.
    schema:
      $ref: ../../components/schemas/services/ServiceKind.yaml
    example: delivery
put:
  operationId: upsertService
  summary: Create or replace a service
  description: |
    Creates the partner's service of this kind, or replaces its status and
    configuration when it exists, and returns it with `200` in both cases.
    Owners and managers may put services; other members receive `403`
    (`forbidden`). Publishes `tenancy.service.updated`.
  tags:
    - Services
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The status and, optionally, the configuration of the service.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/services/ServiceUpsert.yaml
  responses:
    '200':
      description: The service as stored, whether it was created or replaced.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/Service.yaml
    '400':
      description: The path or the body failed validation (`validation_failed`), for example a `kind` that is not one of the known kinds or a missing `status`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is a member but neither owner nor manager (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
