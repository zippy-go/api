# Path item for /v1/platform/reviews/locations. Referenced from openapi.yaml.
get:
  operationId: listRatedLocations
  summary: "Read every store's rating"
  description: "Every store with when it was last reviewed, its share of thumbs up, its counts of each thumb, its type and Verticals and whether it takes reviews; searchable by name, filterable by Vertical, sorted by figure with unrated stores last. With `Accept: text/csv` the same rows as a spreadsheet, every page at once, with an empty percent for a store with none. Mission Control tokens only, with `review:read`."
  tags:
    - Reviews
  security:
    - Bearer: []
  parameters:
    - name: q
      in: query
      required: false
      description: "Words of the store's name, at most 100 characters."
      schema:
        type: string
        maxLength: 100
    - name: vertical_id
      in: query
      required: false
      description: "Only stores trading in this Vertical."
      schema:
        type: string
        format: uuid
    - name: sort
      in: query
      required: false
      description: "`rating` (lowest first), `-rating` (highest first, the default) or `last_reviewed` (most recent first); unrated stores last either way."
      schema:
        type: string
        enum:
          - rating
          - "-rating"
          - last_reviewed
        default: "-rating"
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 100; 50 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "A page of stores with their ratings."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/RatedLocationPage.yaml
        "text/csv":
          schema:
            type: string
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
