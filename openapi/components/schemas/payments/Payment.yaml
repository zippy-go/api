    captured:
      minor_units: 0
      currency: INR
    refunded:
      minor_units: 0
      currency: INR
    refundable:
      minor_units: 0
      currency: INR
    next_action: null
    failure: null
    attempts:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d11
        method: card
        flow: card
        status: authorized
        amount:
          minor_units: 32000
          currency: INR
        provider_reference: simpay_01
        upi_reference: null
        upi_handle: null
        card: *a1
        failure: null
        created_at: 2026-10-16T09:00:00Z
        expires_at: 2026-10-16T09:15:00Z
        completed_at: 2026-10-16T09:01:00Z
    refunds: []
    expires_at: 2026-10-16T09:15:00Z
    created_at: 2026-10-16T09:00:00Z
