# Path item for /v1/agent/memberships/{agent_id}/cash/deposits. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
post:
  operationId: depositAgentCash
  summary: "Deposit cash by UPI"
  description: "Starts a UPI payment of the cash the Agent holds, all of it unless an amount is given; the deposit reads paid from the provider's word, never from the app coming back. Once paid the cash in hand reads that much less, the ledger posts the deposit and the night's reconciliation matches it (`payments.cash.deposited`). Once per `Idempotency-Key` whatever the retries; one pending deposit at a time (`deposit_pending`). Agent app token of the membership's person."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: "How much."
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/CashDepositInput.yaml
  responses:
    "201":
      description: "The deposit started."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/CashDeposit.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    "400":
      description: "`validation_failed`: more than the cash in hand, or nothing to deposit."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`deposit_pending`: a deposit waits for its payment."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
