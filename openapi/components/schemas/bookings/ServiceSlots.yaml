type: object
description: A service's open slots on a day, or why there are none.
required:
  - location_id
  - item_id
  - date
  - duration_minutes
  - slots
  - reason
  - words
properties:
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000306
  item_id:
    type: string
    format: uuid
    description: The service.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000d001
  date:
    type: string
    format: date
    description: The day, at the Location.
    examples:
      - 2026-11-07
  duration_minutes:
    type: integer
    description: The duration counted, with the add-ons.
    examples:
      - 60
  slots:
    type: array
    items:
      $ref: ./ServiceSlot.yaml
    description: The slots, in order.
  reason:
    oneOf:
      - $ref: ./ServiceSlotsReason.yaml
      - type: "null"
    description: Why there are none.
  words:
    type:
      - string
      - "null"
    description: The reason in words.
    examples:
      - null
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000306
    item_id: 019a3d10-2b00-7d00-8a00-00000000d001
    date: 2026-11-07
    duration_minutes: 60
    slots:
      - starts_at: 2026-11-07T09:00:00+05:30
        ends_at: 2026-11-07T10:00:00+05:30
    reason: null
    words: null
