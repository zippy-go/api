type: object
description: "A line of a basket, priced by the platform as it will be charged: prices include tax and never exceed the MRP."
required:
  - id
  - item_id
  - variant_id
  - name
  - variant_label
  - food_mark
  - answers
  - quantity
  - note
  - unit_price
  - price
  - saving
  - mrp
  - tax_rate_percent
  - refusal
properties:
  id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    description: The line.
  item_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    description: The item.
  variant_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    description: The variant.
  name:
    type: string
    examples:
      - Hyderabadi Chicken Biryani
    description: The item's name, in English.
  variant_label:
    type:
      - string
      - "null"
    examples:
      - Full
    description: The variant's values, such as "Full"; `null` for an item with one variant.
  food_mark:
    oneOf:
      - $ref: ../catalog/FoodMark.yaml
      - type: "null"
    description: Veg or non-veg.
  answers:
    type: array
    items:
      $ref: ./BasketAnswer.yaml
    description: The answers to its questions.
  quantity:
    type: integer
    examples:
      - 2
    description: How many.
  note:
    type:
      - string
      - "null"
    examples:
      - Less oil
    description: The note for the store.
  unit_price:
    $ref: ../common/Money.yaml
    description: The price of one, its answers included, after the variant's own offer; tax included.
  price:
    $ref: ../common/Money.yaml
    description: "The line's price: the unit price times the quantity."
  saving:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: What the variant's offer saves on the line, when it has one.
  mrp:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: The maximum retail price of one, where the store's items carry one; the price never exceeds it.
  tax_rate_percent:
    type: number
    examples:
      - 5
    description: The GST rate the line's price includes.
  refusal:
    oneOf:
      - $ref: ./LineRefusal.yaml
      - type: "null"
    description: Why the line cannot be ordered now; `null` when it can.
  promotion:
    oneOf:
      - $ref: ../promotions/BasketLinePromotion.yaml
      - type: "null"
    description: The item offer the line is under, with what it takes off; `null` when none applies.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    name: Hyderabadi Chicken Biryani
    variant_label: Full
    food_mark: veg
    answers:
      - modifier_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
        question: Choose your raita
        item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
        name: Boondi raita
        quantity: 1
        unit_price:
          minor_units: 4000
          currency: INR
        food_mark: veg
        answers: []
    quantity: 2
    note: Less oil
    unit_price:
      minor_units: 34900
      currency: INR
    price:
      minor_units: 69800
      currency: INR
    saving:
      minor_units: 6000
      currency: INR
    mrp:
      minor_units: 39900
      currency: INR
    tax_rate_percent: 5
    refusal:
      code: item_unavailable
      message: Hyderabadi Biryani (Full) is sold out today.
    promotion: null
