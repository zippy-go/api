type: object
description: "A payer's receipt: their payment of a tab with the bill it paid."
required:
  - token
  - tab_id
  - number
  - store_name
  - table
  - paid_at
  - method
  - amount
  - tip
  - totals
  - claimable
properties:
  token:
    type: string
    minLength: 8
    description: The receipt's token.
    examples:
      - r_8f2k3m9q7x
  tab_id:
    type: string
    format: uuid
    description: The tab.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
  number:
    type: string
    description: The order's number.
    examples:
      - AB0042
  store_name:
    type: string
    description: The Location.
    examples:
      - Dev Kitchen Gachibowli
  table:
    type: string
    description: The table's name.
    examples:
      - "12"
  paid_at:
    type: string
    format: date-time
    description: When it was paid.
    examples:
      - 2026-11-06T16:12:00Z
  method:
    type: string
    enum:
      - upi
      - card
      - wallet
    description: How.
    examples:
      - upi
  amount:
    $ref: ../common/Money.yaml
    description: What it paid of the bill.
  tip:
    $ref: ../common/Money.yaml
    description: The tip.
  totals:
    $ref: ./TabTotals.yaml
    description: The bill it paid.
  claimable:
    type: boolean
    description: Whether a guest may keep it by signing in.
    examples:
      - true
examples:
  - token: r_8f2k3m9q7x
    tab_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
    number: AB0042
    store_name: Dev Kitchen Gachibowli
    table: "12"
    paid_at: 2026-11-06T16:12:00Z
    method: upi
    amount:
      minor_units: 28875
      currency: INR
    tip:
      minor_units: 0
      currency: INR
    totals:
      items:
        minor_units: 100000
        currency: INR
      discounts:
        minor_units: 0
        currency: INR
      service_charge:
        percent: 10
        amount:
          minor_units: 10000
          currency: INR
        included: true
      gst:
        minor_units: 5500
        currency: INR
      total:
        minor_units: 115500
        currency: INR
      paid:
        minor_units: 0
        currency: INR
      remaining:
        minor_units: 115500
        currency: INR
      tips:
        minor_units: 0
        currency: INR
    claimable: true
