# Path item for /v1/platform/orders/{order_id}/help/{help_id}/resolve. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  - name: help_id
    in: path
    required: true
    description: The help request.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b31
post:
  operationId: resolveOrderHelp
  summary: Resolve a help request
  description: Resolves a customer's help request with a sentence saying what was done, kept on the order and told to the customer; the request leaves the list of what needs attention. `order:manage`; written to the audit log.
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What was done.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/HelpResolution.yaml
  responses:
    "200":
      description: The request, resolved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/HelpRequest.yaml
    "400":
      description: "`validation_failed`: the sentence missing or too long."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the order or the request."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`conflict`: the request was resolved already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
