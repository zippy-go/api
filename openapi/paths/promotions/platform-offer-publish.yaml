# Path item for /v1/platform/offers/{offer_id}/publish. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
post:
  operationId: publishPlatformOffer
  summary: Publish the platform's draft
  description: "Publishes a draft of the platform: scheduled, or live at once. A campaign with a Partner share above nothing invites each Partner it reaches, in the notices of each Location, and applies at a Location only once accepted there; one the platform pays for in full applies everywhere it reaches until a Location declines it. No word is asked. `promotion:write`."
  tags:
    - Promotions
  security:
    - Bearer: []
  requestBody:
    required: false
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/OfferPublish.yaml
  responses:
    "200":
      description: The offer, scheduled or live.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/Offer.yaml
    "400":
      description: The terms fail validation as saved (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such offer of the platform (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_transition`: not a draft, or its end has passed."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
