# Path item for /v1/platform/approvals/{approval_id}. Referenced from openapi.yaml.
parameters:
  - name: approval_id
    in: path
    required: true
    description: The proposal.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
get:
  operationId: getApproval
  summary: Get a proposal
  description: One proposal; `staff:read` or `approval:decide`.
  tags:
    - Oversight
  security:
    - Bearer: []
  responses:
    '200':
      description: The proposal.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/Approval.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown proposal.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
