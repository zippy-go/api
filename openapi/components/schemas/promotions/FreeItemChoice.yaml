type: object
description: An item a free-item offer can give.
required:
  - variant_id
  - item_id
  - name
  - variant_label
  - price
  - available
properties:
  variant_id:
    type: string
    format: uuid
    description: The variant.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
  name:
    type: string
    description: Its name.
    examples:
      - Gulab Jamun
  variant_label:
    type:
      - string
      - "null"
    description: Its variant.
    examples:
      - null
  price:
    $ref: ../common/Money.yaml
    description: What it is worth.
  available:
    type: boolean
    description: Whether it can be had now.
    examples:
      - true
examples:
  - variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
    name: Gulab Jamun
    variant_label: null
    price:
      minor_units: 6000
      currency: INR
    available: true
