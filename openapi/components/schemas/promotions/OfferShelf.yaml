type: object
description: "A Vertical's offer shelf: the Locations with a live offer of its kind, open ones first; a shelf with none is left out. \"See all\" filters the list with `offer`."
required:
  - kind
  - title
  - stores
properties:
  kind:
    $ref: ./OfferShelfKind.yaml
    description: The kind.
  title:
    type: string
    description: Its title.
    examples:
      - Free delivery
  stores:
    type: array
    items:
      $ref: ./OfferShelfStore.yaml
    description: The Locations on it.
examples:
  - kind: free_delivery
    title: Free delivery
    stores:
      - location_id: 01a13a48-9e00-7000-8000-000000000301
        offer:
          offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
          line: Buy 1, get 1 free
          more: 1
          code: null
          shelf: deals
