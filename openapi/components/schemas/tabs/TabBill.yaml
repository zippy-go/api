type: object
description: "The bill: the tab frozen with its lines, GST, the optional service charge, what is paid and what remains. Every member reads the same bill."
required:
  - tab_id
  - presented_at
  - lines
  - totals
  - payments
  - methods
properties:
  tab_id:
    type: string
    format: uuid
    description: The tab.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
  presented_at:
    type: string
    format: date-time
    description: When it was asked for.
    examples:
      - 2026-11-06T16:10:00Z
  lines:
    type: array
    items:
      $ref: ./TabBillLine.yaml
    description: Its lines.
  totals:
    $ref: ./TabTotals.yaml
    description: What it comes to.
  payments:
    type: array
    items:
      $ref: ./TabPaymentSummary.yaml
    description: Its payments so far.
  methods:
    type: array
    items:
      type: string
      enum:
        - upi
        - card
        - wallet
    description: The ways a diner may pay it from their phone.
examples:
  - tab_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
    presented_at: 2026-11-06T16:10:00Z
    lines:
      - line_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0401
        name: Butter Chicken
        quantity: 1
        answers: []
        total:
          minor_units: 38000
          currency: INR
        paid: false
    totals:
      items:
        minor_units: 100000
        currency: INR
      discounts:
        minor_units: 0
        currency: INR
      service_charge:
        percent: 10
        amount:
          minor_units: 10000
          currency: INR
        included: true
      gst:
        minor_units: 5500
        currency: INR
      total:
        minor_units: 115500
        currency: INR
      paid:
        minor_units: 0
        currency: INR
      remaining:
        minor_units: 115500
        currency: INR
      tips:
        minor_units: 0
        currency: INR
    payments:
      - payment_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
        by: diner
        member_name: Asha
        method: upi
        amount:
          minor_units: 28875
          currency: INR
        tip:
          minor_units: 0
          currency: INR
        status: paid
        paid_at: 2026-11-06T16:12:00Z
        receipt_token: null
    methods:
      - upi
      - card
      - wallet
