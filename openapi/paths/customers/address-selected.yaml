# Path item for /v1/customer/addresses/{address_id}/selected. Referenced from openapi.yaml.
parameters:
  - name: address_id
    in: path
    required: true
    description: The address, which must be the customer's own.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a90
put:
  operationId: selectCustomerAddress
  summary: Select an address
  description: "Selects one of the customer's addresses: the one the storefront browses from."
  tags:
    - Customer account
  security:
    - Bearer: []
  responses:
    '200':
      description: The addresses, this one selected.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerAddressList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: "`not_found`: no such address of the customer's."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
