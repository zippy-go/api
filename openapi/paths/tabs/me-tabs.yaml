# Path item for /v1/me/tabs. Referenced from openapi.yaml.
get:
  operationId: listMyTabs
  summary: List my tabs
  description: "The signed-in customer's tabs, the newest first: every tab they were a member of, a guest's tabs claimed at sign-in included. The storefront and the apps show them beside the orders in My orders; a tab is read with `GET /v1/tabs/{tab_id}`."
  tags:
    - Dine-in
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts: the `next_cursor` of the page before."
      schema:
        type: string
  responses:
    "200":
      description: A page of tabs.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/CustomerTabPage.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
