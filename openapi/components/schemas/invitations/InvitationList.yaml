type: object
description: A list of invitations, the response of `GET /v1/partners/{partner_id}/invitations` and `GET /v1/platform/invitations`.
required:
  - items
properties:
  items:
    type: array
    description: The partner's invitations in every status, newest first. The list is not paginated.
    items:
      $ref: ./Invitation.yaml
examples:
  - items:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
        partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
        email: manager@example.com
        role: manager
        status: pending
        expires_at: 2026-10-21T08:15:00Z
        created_at: 2026-10-14T08:15:00Z
        role_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a73
        location_ids: []
        service_ids: []
        display_name: null
