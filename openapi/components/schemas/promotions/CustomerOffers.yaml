type: object
description: "The account's offers: those a customer holds (codes added, personal and referral codes, rewards), the city's first-order offer when it is for them, and the live offers for new customers that need no code."
required:
  - held
  - first_order
  - for_new_customers
properties:
  held:
    type: array
    items:
      $ref: ./CustomerOffer.yaml
    description: The offers they hold, ready first, ended ones for thirty days.
  first_order:
    oneOf:
      - $ref: ./CustomerOffer.yaml
      - type: "null"
    description: The city's first-order offer, when they qualify.
  for_new_customers:
    type: array
    items:
      $ref: ./CustomerOffer.yaml
    description: Live offers for new customers at Locations near them.
examples:
  - held:
      - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6002
        line: ₹150 off · over ₹399
        small_print: Food stores in Hyderabad · once per customer
        source: code
        code: FEAST150
        state: ready
        state_text: Ends 30 November
        where_text: At Food stores in Hyderabad
        locations: []
        starts_at: null
        ends_at: 2026-11-30T18:29:00Z
        added_at: 2026-11-06T12:50:00Z
        funded_text: null
    first_order: null
    for_new_customers: []
