type: object
description: One day of a subscription's calendar.
required:
  - date
  - state
  - label
  - locked
  - cutoff_at
  - items
  - amount
  - order_id
  - order_number
  - delivered_at
  - proof_url
properties:
  date:
    type: string
    format: date
    description: The day.
    examples:
      - 2026-11-06
  state:
    $ref: ./SubscriptionDayState.yaml
    description: What it is.
  label:
    type: string
    description: 'In words, as the calendar shows it: "Delivered at 06:40", "Skipped", "Dairy closed".'
    examples:
      - Delivered at 06:40
  locked:
    type: boolean
    description: "Whether its cutoff passed: changes go to the next delivery day."
    examples:
      - true
  cutoff_at:
    type: string
    format: date-time
    description: Its cutoff, the evening before.
    examples:
      - 2026-11-05T14:30:00Z
  items:
    type: array
    items:
      $ref: ./SubscriptionDayItem.yaml
    description: The day's items and quantities; empty on a day without a delivery.
  amount:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: What it costs or cost.
  order_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  order_number:
    type:
      - string
      - "null"
    description: Its order's number.
    examples:
      - AB0042
  delivered_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was delivered.
    examples:
      - 2026-11-06T01:10:00Z
  proof_url:
    type:
      - string
      - "null"
    description: The photo at the door, relative to the API host.
    examples:
      - /v1/customer/orders/0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01/proof-of-delivery
examples:
  - date: 2026-11-06
    state: delivered
    label: Delivered at 06:40
    locked: true
    cutoff_at: 2026-11-05T14:30:00Z
    items:
      - variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
        name: Toned milk 500 ml
        quantity: 2
    amount:
      minor_units: 6400
      currency: INR
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    order_number: AB0042
    delivered_at: 2026-11-06T01:10:00Z
    proof_url: /v1/customer/orders/0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01/proof-of-delivery
