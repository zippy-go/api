# Path item for /v1/platform/subscriptions/{subscription_id}. Referenced from openapi.yaml.
parameters:
  - name: subscription_id
    in: path
    required: true
    description: The subscription.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
get:
  operationId: getPlatformSubscription
  summary: Read a subscription
  description: A subscription with its customer and a month of its calendar. `subscription:read`.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  parameters:
    - name: month
      in: query
      required: false
      description: The month, YYYY-MM; the current one on the store's clock by default.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-11
  responses:
    "200":
      description: The subscription.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/PlatformSubscription.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or month."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `subscription:read` (`access_denied`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
