# Path item for /v1/platform/invoices. Referenced from openapi.yaml.
get:
  operationId: listPlatformInvoices
  summary: List every Partner's invoices
  description: Every Partner's monthly invoices, overdue first then newest. `payout:read`.
  tags:
    - Billing
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: Only this Partner's.
      schema:
        type: string
        format: uuid
    - name: state
      in: query
      required: false
      description: Only invoices in this state.
      schema:
        $ref: ../../components/schemas/configuration/InvoiceState.yaml
    - name: month
      in: query
      required: false
      description: The calendar month on the Partner's clock, `YYYY-MM`; this month by default.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-11
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts: the `next_cursor` of the page before."
      schema:
        type: string
  responses:
    "200":
      description: A page of invoices.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/InvoiceList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
