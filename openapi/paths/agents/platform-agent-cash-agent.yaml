# Path item for /v1/platform/agent-cash/{agent_id}. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
get:
  operationId: getPlatformAgentCash
  summary: "Get an Agent's cash"
  description: "One Agent's collections not yet deposited and its deposits, each saying whether the night's reconciliation matched it. `ledger:read`."
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: "The Agent's cash."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentCashDetail.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
