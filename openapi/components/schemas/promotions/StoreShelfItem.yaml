type: object
description: An item on a shelf (since 0.38.0), as the menu draws it; a tap opens its sheet.
required:
  - item_id
  - name
  - picture_url
  - from_price
  - promotion
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b1001
  name:
    type: string
    description: Its name.
    examples:
      - Chicken Biryani
  picture_url:
    type:
      - string
      - "null"
    description: Its first picture, a rendition relative to the API host.
    examples:
      - null
  from_price:
    $ref: ../common/Money.yaml
    description: The least it costs, before offers.
  promotion:
    oneOf:
      - $ref: ./MenuItemPromotion.yaml
      - type: "null"
    description: The offer open to everyone it is under, with its price after it, as the menu carries it.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b1001
    name: Chicken Biryani
    picture_url: null
    from_price:
      minor_units: 1250
      currency: USD
    promotion:
      offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
      tag: Buy 1, get 1 free
      price_after: null
      deal:
        quantity: 2
        text: Add 2 and 1 is free
        total:
          minor_units: 42900
          currency: INR
        total_before:
          minor_units: 85800
          currency: INR
