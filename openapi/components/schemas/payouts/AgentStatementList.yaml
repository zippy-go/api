type: object
description: "An Agent's money in the Agent app: the week so far, the next payment and where it stands, past statements with their PDFs, and where they are paid. A Partner's own Agent has no statements: their past weeks are reported to the Partner, who pays them."
required:
  - agent_id
  - partner_id
  - partner_name
  - paid_by
  - sentence
  - today
  - week_so_far
  - next_payment
  - statements
  - weeks
  - destination
properties:
  agent_id:
    type: string
    format: uuid
    description: The Agent membership.
    examples:
      - 01a13a48-9e00-7000-8000-000000000107
  partner_id:
    type: string
    format: uuid
    description: The Agent's Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000002
  partner_name:
    type: string
    description: The Partner's name.
    examples:
      - ZippyGo Fleet
  paid_by:
    $ref: ./AgentPaidBy.yaml
    description: Who pays the Agent.
  sentence:
    type: string
    description: How the Agent is paid, in words.
    examples:
      - Paid every Friday by ZippyGo to your checked UPI ID.
  today:
    type: string
    format: date
    description: The day payouts work to, on the fleet's clock.
    examples:
      - 2026-10-26
  week_so_far:
    $ref: ./AgentWeek.yaml
    description: The week in progress.
  next_payment:
    oneOf:
      - $ref: ./PayoutWeekSummary.yaml
      - type: "null"
    description: The next payment from the platform; `null` for a Partner's own Agent and before any work.
  statements:
    type: array
    items:
      $ref: ./AgentStatementSummary.yaml
      description: A statement.
    description: Six months of statements, newest first; empty for a Partner's own Agent.
  weeks:
    type: array
    items:
      $ref: ./AgentWeekSummary.yaml
      description: A week.
    description: A Partner's own Agent's past weeks, newest first, eight at most; empty for the platform fleet.
  destination:
    oneOf:
      - $ref: ./PayoutDestination.yaml
      - type: "null"
    description: Where the platform pays the Agent; `null` for a Partner's own Agent and before one is given.
examples:
