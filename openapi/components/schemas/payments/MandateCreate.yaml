type: object
description: "Asking for a subscription's mandate: its pending mandate with the provider's page, or, after one was declined, expired or revoked, a new one on the same terms."
required:
  - subscription_id
properties:
  subscription_id:
    type: string
    format: uuid
    description: The subscription, paid by UPI AutoPay.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
examples:
  - subscription_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
