type: object
description: "The request body of `POST /v1/auth/password/reset-request`: the account's email address and the console asking. The answer is the same whether or not the address signs in there."
required:
  - email
  - audience
properties:
  email:
    type: string
    description: The email address of the account.
    examples:
      - owner@example.com
  audience:
    $ref: ./Audience.yaml
    description: The console asking, `partner` or `platform`; the link works at that console only. The Agent app signs in with one-time codes and has no password link (`audience_not_allowed`).
examples:
  - email: owner@example.com
    audience: partner
