{
  "put": {
    "operationId": "addCustomerFavourite",
    "summary": "Keep a store",
    "description": "Keeps a live store as a favourite, idempotently; two hundred at most (`favourites_full`). Announced as `customers.favourite.added` the first time.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "location_id",
        "in": "path",
        "required": true,
        "description": "The store.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "01a13a48-9e00-7000-8000-000000000301"
      }
    ],
    "responses": {
      "200": {
        "description": "The favourite.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/Favourite.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: no live store, deleted or never.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`favourites_full`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  },
  "delete": {
    "operationId": "removeCustomerFavourite",
    "summary": "Let a store go",
    "description": "Lets a favourite go; letting go one not kept answers the same. Announced as `customers.favourite.removed`.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "location_id",
        "in": "path",
        "required": true,
        "description": "The store.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "01a13a48-9e00-7000-8000-000000000301"
      }
    ],
    "responses": {
      "204": {
        "description": "Let go."
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
