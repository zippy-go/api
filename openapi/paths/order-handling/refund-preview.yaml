# Path item for /v1/platform/orders/{order_id}/refunds/preview. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: previewOrderRefund
  summary: See what a refund would give back
  description: What a refund of these lines and fees would give back and where, and what is left to refund, so support confirms the split before submitting. Nothing moves. A line gives back what it cost the customer, only as many of it as earlier refunds left (a line left out at acceptance was never charged); a fee is given back whole, what is left of it; the refunds on an order together never exceed what was paid. The amount goes to the source first, up to what it was charged less what was refunded to it, the rest to the Wallet; a cash order's goes to the Wallet. `order:refund`.
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The lines, fees, reason, note and payer.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/RefundInput.yaml
  responses:
    "200":
      description: The split.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/RefundPreview.yaml
    "400":
      description: "`validation_failed`: a line that is not the order's or is named twice, a quantity out of range, a fee the order did not charge or named twice, nothing named, or the note missing."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`refund_exceeds_paid`: more than is left to refund, naming the most; `order_moved` for an order nothing was charged on."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
