# Path item for /v1/platform/finance/alerts/{alert_id}/resolve. Referenced from openapi.yaml.
post:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: resolveFinanceAlert
  summary: Resolve an alert
  description: Marks an alert resolved with a note saying what was done. `ledger:write`. Written to the audit log.
  parameters:
    - name: alert_id
      in: path
      required: true
      description: The alert.
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    description: What was done.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payments/FinanceAlertResolve.yaml
  responses:
    "200":
      description: The alert, resolved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/FinanceAlert.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `ledger:write` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such alert (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: The alert is resolved already (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
