type: object
description: "What a change did: the subscription after it, the first day it applies to and what to tell the customer, such as a change after the cutoff going to the day after."
required:
  - subscription
  - applies_from
  - message
properties:
  subscription:
    $ref: ./Subscription.yaml
    description: The subscription after the change.
  applies_from:
    type:
      - string
      - "null"
    format: date
    description: The first day the change applies to.
    examples:
      - 2026-11-08
  message:
    type: string
    description: What to tell the customer.
    examples:
      - "Tomorrow is already on its way: the skip applies to Sunday 8 November."
