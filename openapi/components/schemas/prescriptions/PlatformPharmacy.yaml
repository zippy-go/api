type: object
description: "A pharmacy Location as Mission Control sees it, the `PlatformPharmacy` schema."
required:
  - location_id
  - location_name
  - partner_id
  - partner_name
  - settings
properties:
  location_id:
    type: string
    format: uuid
    description: "The Location."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4ba001"
  location_name:
    type: string
    description: "Its name."
    examples:
      - "Gachibowli Pharmacy"
  partner_id:
    type: string
    format: uuid
    description: "Its Partner."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4bb001"
  partner_name:
    type: string
    description: "Its Partner's name."
    examples:
      - "Gachibowli Pharmacy"
  settings:
    $ref: ./PharmacySettings.yaml
examples:
  - {"location_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4ba001", "location_name": "Gachibowli Pharmacy", "partner_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4bb001", "partner_name": "Gachibowli Pharmacy", "settings": {"location_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4ba001", "takes_prescriptions": false, "why_not": "The drug licence expired on 2 November 2026.", "licence": {"number": "TS/HYD/2025/20B-1234", "expires_on": "2026-11-02", "verified_at": "2026-01-05T06:00:00Z", "verified_by": null}, "pharmacist": null, "updated_at": null}}
