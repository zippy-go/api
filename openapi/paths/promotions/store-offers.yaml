# Path item for /v1/storefront/stores/{location_id}/offers. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The Location.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: getStoreOffers
  summary: Read a store's offers
  description: "A store's advertised live offers with their lines and terms, open ones first, then those behind a code the owner shows, and the spend bar towards its basket offers; paused offers, offers outside their hours, used up, or behind a code nobody was shown never appear. Public and cached for a minute without a token. With a customer's token the answer is theirs: offers not for them left out, their stamp cards with their progress, and the offers they hold here. Read again on the `offers.changed` signal on `store-{location_id}-menu`, which names what changed and since when, never the offers."
  tags:
    - Promotions
  security:
    - Bearer: []
    - {}
  responses:
    "200":
      description: The offers.
      headers:
        Cache-Control:
          description: "`public, max-age=60` without a token; `private, no-store` with one."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/StoreOffers.yaml
    "401":
      description: An access token was sent and refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A token of another surface (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such live store (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
