type: object
description: One use of an offer on an order, with what it saved and how its cost is split.
required:
  - id
  - offer_id
  - order_id
  - order_number
  - location_id
  - location_name
  - customer_id
  - code
  - status
  - saving
  - partner_cost
  - platform_cost
  - reserved_at
  - settled_at
properties:
  id:
    type: string
    format: uuid
    description: The use.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6301
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  order_id:
    type: string
    format: uuid
    description: The order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB0042
  location_id:
    type: string
    format: uuid
    description: Where.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  location_name:
    type: string
    description: The Location's name.
    examples:
      - Dev Kitchen Gachibowli
  customer_id:
    type: string
    format: uuid
    description: The customer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a01
  code:
    type:
      - string
      - "null"
    description: The code it came through.
    examples:
      - FEAST150
  status:
    $ref: ./RedemptionStatus.yaml
    description: Reserved, confirmed or released.
  saving:
    $ref: ../common/Money.yaml
    description: What it took off.
  partner_cost:
    $ref: ../common/Money.yaml
    description: The Partner's share.
  platform_cost:
    $ref: ../common/Money.yaml
    description: The platform's share.
  reserved_at:
    type: string
    format: date-time
    description: When it was reserved.
    examples:
      - 2026-11-06T13:00:00Z
  settled_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was confirmed or released.
    examples:
      - 2026-11-06T13:40:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6301
    offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    order_number: AB0042
    location_id: 01a13a48-9e00-7000-8000-000000000301
    location_name: Dev Kitchen Gachibowli
    customer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a01
    code: FEAST150
    status: confirmed
    saving:
      minor_units: 15000
      currency: INR
    partner_cost:
      minor_units: 0
      currency: INR
    platform_cost:
      minor_units: 15000
      currency: INR
    reserved_at: 2026-11-06T13:00:00Z
    settled_at: 2026-11-06T13:40:00Z
