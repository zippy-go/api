        selection:
          0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc601: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc611
        price:
          minor_units: 24900
          currency: INR
        offer_price: null
        mrp: null
        available: true
        stock: in_stock
        quantity_left: null
        picture: null
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc202
        selection:
          0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc601: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc612
