# Path item for /v1/partners/{partner_id}/agents/{agent_id}/documents/{document_id}/review. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
  - name: document_id
    in: path
    required: true
    description: The document, one of the Agent's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
post:
  operationId: reviewAgentDocument
  summary: Approve or reject a document
  description: "Decides a document under review: approved, or rejected with a reason the Agent reads, who can then file it again. The Partner reviews its own services' documents and platform staff the platform fleet's; the Agent is told of each decision. Members need `agent:manage` for the service; Mission Control manages the platform fleet, and any Partner's Agents, with the same route and its platform permissions, every change written to the audit log."
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The decision.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentDocumentReview.yaml
  responses:
    "200":
      description: The document, decided.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDocument.yaml
    "400":
      description: "`validation_failed`: a rejection without a reason, or a reason over 500 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the document."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`illegal_transition`: the document is not under review."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
