# Path item for /v1/customer/location. Referenced from openapi.yaml.
get:
  operationId: getCustomerLocation
  summary: Where the customer browses from
  description: "Where the customer browses from: the selected address's pin placed as the storefront places any pin (with the caller's `cap`); explicitly empty without an address."
  tags:
    - Customer account
  security:
    - Bearer: []
  parameters:
    - name: cap
      in: query
      required: false
      description: The cap in metres, as for the storefront's resolution; the storefront asks with 25000.
      schema:
        type: integer
  responses:
    '200':
      description: The selected address placed, or `none` without an address.
      headers:
        Cache-Control:
          description: "Always `private, no-store`: the answer carries the customer's pin."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerLocation.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
