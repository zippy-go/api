type: object
description: "What a search inside one store found: whole menu items, opening in the same sheet as the menu's."
required:
  - query
  - location_id
  - version
  - items
  - modifiers
  - took_ms
properties:
  query:
    type: string
    description: What was typed.
    examples:
      - biryani
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  version:
    type: integer
    description: The version of the menu searched.
    examples:
      - 42
  items:
    type: array
    items:
      $ref: ./MenuItem.yaml
    description: The items found, best first.
  modifiers:
    type: object
    description: The questions those items ask, by id.
    additionalProperties:
      $ref: ./MenuModifier.yaml
  took_ms:
    type: number
    description: How long it took at the server, in milliseconds.
    examples:
      - 4.2
