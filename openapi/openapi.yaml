components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Server-to-server authentication with a partner-scoped API key sent
        in the `X-Api-Key` header. Keys are issued per partner and can be
        revoked at any time.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token issued by ZippyGo, sent as
        `Authorization: Bearer <token>`. Access tokens are JSON Web Tokens
        signed with EdDSA (Ed25519) and valid for 15 minutes. They are
        obtained from the sign-in operations under the `Auth` tag and
        renewed with `POST /v1/auth/refresh`; their claims are documented on
        that tag and the signing keys are published at
        `GET /.well-known/jwks.json`.
    DevApiKey:
      type: apiKey
      in: header
      name: X-Dev-Api-Key
      description: |
        A temporary development credential, sent in the `X-Dev-Api-Key`
        header. It is accepted only by `POST /v1/fleet/location-pings`, for
        devices that report positions before agents have credentials of
        their own; every other operation authenticates with `Bearer` access
        tokens. The replacement and the retirement of this scheme are
        announced in the changelog.

