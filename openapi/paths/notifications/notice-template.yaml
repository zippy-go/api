# Path item for /v1/platform/notice-templates/{template_id}. Referenced from openapi.yaml.
parameters:
  - name: template_id
    in: path
    required: true
    description: 'The template.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
get:
  operationId: getNoticeTemplate
  summary: Read a notice template
  description: |
    One template, with its version as the entity tag. `notice:send` or `notification:manage`.
  tags:
    - Notices
  security:
    - Bearer: []
  responses:
    '200':
      description: 'The template.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticeTemplate.yaml
    '400':
      description: '`validation_failed`: a malformed template id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not a Mission Control token (`forbidden`), or neither permission is held (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'No such template (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updateNoticeTemplate
  summary: Change a notice template
  description: |
    Changes a template's name, title, message or whether it is offered.
    Withdrawing (`offered` false) keeps its words, and it can be offered again;
    templates are never deleted. A notice already sent keeps its own words.
    `If-Match` guards against a stale screen. `notification:manage`.
  tags:
    - Notices
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: 'The members to change.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/notifications/NoticeTemplateUpdate.yaml
  responses:
    '200':
      description: 'The template as changed.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticeTemplate.yaml
    '400':
      description: '`validation_failed`: a blank or overlong member (`blank_text`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not a Mission Control token (`forbidden`), or `notification:manage` is not held (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'No such template (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`notice_template_name_taken`: another template has that name, whatever its case.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '412':
      description: '`precondition_failed`: the template changed since the `If-Match` version.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
