# Path item for /v1/partners/{partner_id}/locations/{location_id}/tables/{table_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be the partner's in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: table_id
    in: path
    required: true
    description: The table, of the Location in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0101
patch:
  operationId: updateDiningTable
  summary: Change a table
  description: Changes a table; absent members keep what is stored. Audited. `location:write` at the Location.
  tags: &a2
    - Dine-in
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The change.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/dining/DiningTableUpdate.yaml
  responses:
    "200":
      description: The table.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dining/DiningTable.yaml
    "400":
      description: "`validation_failed`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `location:write` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`table_name_taken`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
delete:
  operationId: deleteDiningTable
  summary: Remove a table
  description: Removes a table; its code stops opening tabs. A table with an open tab is refused (`table_occupied`). Audited. `location:write` at the Location.
  tags: *a2
  security:
    - Bearer: []
  responses:
    "204":
      description: Removed.
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `location:write` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`table_occupied`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
