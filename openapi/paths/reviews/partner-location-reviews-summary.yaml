# Path item for /v1/partners/{partner_id}/locations/{location_id}/reviews/summary. Referenced from openapi.yaml.
parameters:
  - name: partner_id
    in: path
    required: true
    description: "The Partner."
    schema:
      type: string
      format: uuid
    example: "01a13a48-9e00-7000-8000-000000000001"
  - name: location_id
    in: path
    required: true
    description: "The store (a Location)."
    schema:
      type: string
      format: uuid
    example: "01a13a48-9e00-7000-8000-000000000301"
get:
  operationId: getPartnerLocationReviewSummary
  summary: "Read a store's rating over a period"
  description: "The store's rating over all time, the last 7 days or the last 30, as the share of thumbs up with the positive and negative counts, and the share of its orders completed in the period that were rated, whenever the rating came: never above a hundred percent, and \"under 1%\" rather than 0% when some were. `review:read` at the Location."
  tags:
    - Reviews
  security:
    - Bearer: []
  parameters:
    - name: period
      in: query
      required: false
      description: "The period, all time by default."
      schema:
        $ref: ../../components/schemas/reviews/ReviewPeriod.yaml
  responses:
    "200":
      description: "The period's figures."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/ReviewSummary.yaml
    "400":
      description: "`validation_failed`: an unknown period."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `review:read` at the Location, or `not_enabled_for_partner`."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such Partner of the caller's, or no such store of it."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
