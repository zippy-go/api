type: object
description: Days of a Location not locked yet, or any range of its days up to a year, worked out as a payout would be. An estimate while it can still change.
required:
  - from
  - until
  - week
  - estimate
  - sentence
  - figures
  - rows
  - refunds
  - adjustments
  - days
properties:
  from:
    type: string
    format: date
    description: The first day.
    examples:
      - 2026-10-26
  until:
    type: string
    format: date
    description: The last day, included.
    examples:
      - 2026-11-01
  week:
    type:
      - string
      - "null"
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week, when the range is one week.
    examples:
      - 2026W44
  estimate:
    type: boolean
    description: "`true` while any of its days can still change."
  sentence:
    type: string
    description: What it is, in words.
    examples:
      - "So far this week: an estimate while it can still change."
  figures:
    $ref: ./StatementFigures.yaml
    description: How it works out; no carry and no invoice GST until the lock, so the fee's GST is the orders' own.
  rows:
    type: array
    items:
      $ref: ./StatementOrderRow.yaml
      description: An order's part.
    description: Its orders.
  refunds:
    type: array
    items:
      $ref: ./StatementRefund.yaml
      description: A refund.
    description: Its refunds.
  adjustments:
    type: array
    items:
      $ref: ./PayoutAdjustment.yaml
      description: An adjustment.
    description: Adjustments waiting for its lock.
  days:
    type: array
    items:
      $ref: ./StatementDay.yaml
      description: A day.
    description: Day by day.
  rewards:
    type: array
    items:
      $ref: ./StatementRewardRow.yaml
      description: A campaign.
    description: '"Rewards you paid for" in the days worked out, as a statement shows them.'
examples:
  - from: 2026-10-26
