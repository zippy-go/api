# Path item for /v1/platform/taxonomy/terms/{term_id}. Referenced from openapi.yaml.
parameters:
  - name: term_id
    in: path
    required: true
    description: The term.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd101
get:
  operationId: getTaxonomyTerm
  summary: Read a term
  description: |
    One term of the taxonomy, retired or not, with how many categories and items
    map to it. `catalog:oversee`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  responses:
    "200":
      description: 'The term.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyTerm.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `catalog:oversee` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such term (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updateTaxonomyTerm
  summary: Rename or move a term
  description: |
    Renames a term, gives it a new slug, moves it with the terms beneath it under
    another active term of its Vertical (never beneath itself, four levels deep at
    most), changes its rules or its place. The id stays, so every mapping holds and
    the new name shows wherever the term is read. A retired term is not changed.
    Honours `If-Match`. Published as `catalog.taxonomy.changed` and audited.
    `taxonomy:write`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: 'What changes.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/taxonomy/TaxonomyTermUpdate.yaml
  responses:
    "200":
      description: 'The term.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyTerm.yaml
    "400":
      description: '`validation_failed`, with `taxonomy_too_deep`, `taxonomy_cycle`, `taxonomy_term_retired`, `taxonomy_term_elsewhere` or `taxonomy_slug_taken` on the field.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `taxonomy:write` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such term (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "412":
      description: '`precondition_failed`: the term changed since the `If-Match` version.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
delete:
  operationId: deleteTaxonomyTerm
  summary: Delete a term
  description: |
    Deletes a term nothing maps to and nothing sits beneath. A term with mapped
    categories or items is refused with `taxonomy_term_in_use`, which offers to
    deprecate it with a replacement instead; one with terms beneath it with
    `taxonomy_term_has_children`. Published as `catalog.taxonomy.changed` and
    audited. `taxonomy:write`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  responses:
    "204":
      description: 'Deleted.'
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `taxonomy:write` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such term (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: '`taxonomy_term_in_use`: categories or items map to it; deprecate it with a replacement. `taxonomy_term_has_children`: terms sit beneath it.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
