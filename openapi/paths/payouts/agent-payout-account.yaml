# Path item for /v1/agent/memberships/{agent_id}/payout-account. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000107
get:
  operationId: getOwnAgentPayoutAccount
  summary: Read where the Agent is paid
  description: Where a platform fleet Agent is paid, the account number masked to its last four digits, and the one-rupee check's state and reason. Takes the membership holder's Agent app token.
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: Where the Agent is paid.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/AgentPayoutAccount.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller, or no account given yet."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putOwnAgentPayoutAccount
  summary: Say where the Agent is paid
  description: A UPI ID or a bank account for the platform to pay the Agent's weeks into. Every write is checked again by the payout provider's one-rupee transfer, comparing the name the bank returns with the Agent's name, and nothing is paid to it until that passes. A Partner's own Agent is paid by the Partner and is refused (`paid_by_partner`). Takes the membership holder's Agent app token.
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Where to be paid.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/AgentPayoutAccountUpdate.yaml
  responses:
    "200":
      description: The account, masked, its check `checking`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/AgentPayoutAccount.yaml
    "400":
      description: "`validation_failed`: `upi_id_invalid`, `ifsc_invalid`, an account number not nine to eighteen digits, or a field missing for the kind."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`paid_by_partner`: the Agent belongs to a Partner's own delivery service, which pays them."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
