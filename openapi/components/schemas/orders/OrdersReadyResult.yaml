type: object
description: What marking several orders ready did, order by order.
required:
  - orders
  - ready
  - refused
properties:
  orders:
    type: array
    items:
      $ref: ./OrderReadyOutcome.yaml
    description: Each order, in the order asked.
  ready:
    type: integer
    minimum: 0
    description: How many are ready now.
    examples:
      - 1
  refused:
    type: integer
    minimum: 0
    description: How many could not be marked.
    examples:
      - 0
examples:
  - orders:
      - order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
        number: AB0042
        ready: true
        status: ready
        code: null
        message: null
    ready: 1
    refused: 0
