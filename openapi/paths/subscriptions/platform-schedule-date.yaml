# Path item for /v1/platform/schedule/date. Referenced from openapi.yaml.
get:
  operationId: getScheduleDate
  summary: Read the schedule date
  description: The date the cutoffs, the route building, the release of scheduled orders and the start of planned trips read, the real time, whether it was moved and can be moved here, and every move. Any Mission Control token.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  responses:
    "200":
      description: The schedule date.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/ScheduleDate.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`).
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
put:
  operationId: moveScheduleDate
  summary: Move the schedule date forward
  description: Moves the schedule date forward, never back, on a developer's machine or in the sandbox only, so tonight's cutoff and tomorrow's routes can be seen without waiting for them; the cutoffs and the release of scheduled orders run at once. Everything else keeps the real time. Written to the audit log. `operations:manage`.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The new date.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/subscriptions/ScheduleDateMove.yaml
  responses:
    "200":
      description: The schedule date after the move.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/ScheduleDate.yaml
    "400":
      description: "`validation_failed`: `schedule_date_backwards`."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `operations:manage` (`access_denied`).
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`schedule_date_fixed`: anywhere but a developer's machine or the sandbox the date cannot move."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
