type: object
description: The store a basket is at, with what it is doing now.
required:
  - name
  - live
properties:
  name:
    type: string
    examples:
      - Dev Kitchen Gachibowli
    description: The store's name.
  live:
    $ref: ../catalog/StoreLive.yaml
    description: Open now, or why not and until when.
examples:
  - name: Dev Kitchen Gachibowli
    live:
      state: closed
      reason: closed
      until: 2026-10-16T05:30:00Z
