# Path item for /v1/currencies. Referenced from openapi.yaml.
get:
  operationId: listCurrencies
  summary: Every currency
  description: Every currency.
  tags:
    - Currencies
  security:
    - Bearer: []
  responses:
    '200':
      description: The currencies
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/CurrencyList.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`: a Mission Control token without `currency:read`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createCurrency
  summary: Adds a currency
  description: Adds a currency; platform staff.
  tags:
    - Currencies
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/CurrencyCreate.yaml
  responses:
    '201':
      description: The currency
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/Currency.yaml
    '400':
      description: Malformed body or invalid fields
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not platform staff, or `access_denied` without `currency:write`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The code exists
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
