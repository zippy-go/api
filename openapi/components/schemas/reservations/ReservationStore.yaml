type: object
description: The store a reservation is at.
required:
  - location_id
  - name
  - address
properties:
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  name:
    type: string
    description: The store's name.
    examples:
      - Dev Kitchen Gachibowli
  address:
    type: string
    description: The store's address in one line.
    examples:
      - Plot 7, Gachibowli, Hyderabad 500032
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000301
    name: Dev Kitchen Gachibowli
    address: Plot 7, Gachibowli, Hyderabad 500032
