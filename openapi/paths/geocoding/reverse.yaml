# Path item for /v1/geocoding/reverse. Referenced from openapi.yaml.
get:
  operationId: reverseGeocode
  summary: Words for a pin
  description: 'The words for a pin, to pre-fill an address form: never stored, by the platform or by a shared cache. An empty answer is normal, and a provider that fails answers empty too.'
  tags:
    - Geocoding
  security: []
  parameters:
    - name: lat
      in: query
      required: true
      description: Latitude in decimal degrees.
      schema:
        type: number
    - name: lng
      in: query
      required: true
      description: Longitude in decimal degrees.
      schema:
        type: number
  responses:
    '200':
      description: The suggestion, or none.
      headers:
        Cache-Control:
          description: 'Always `private, no-store`: a doorstep never sits in a shared cache.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/storefront/ReverseGeocode.yaml
    '400':
      description: '`validation_failed`: a missing or out-of-range pin.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
