type: object
description: "A choice to add to the basket: an item, its variant, the answers to its questions and how many. The same choice already in the basket raises that line's quantity and keeps its note unless a new one is given. Prices are never sent: the platform prices every line from the store's published menu."
required:
  - item_id
  - quantity
properties:
  item_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    description: The item.
  variant_id:
    type:
      - string
      - "null"
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    description: The variant; may be left out when the item has a single variant.
  quantity:
    type: integer
    minimum: 1
    maximum: 99
    examples:
      - 1
    description: How many, 1 to 99.
  answers:
    type: array
    items:
      $ref: ./BasketAnswerInput.yaml
    description: The answers to the item's questions.
  note:
    type:
      - string
      - "null"
    maxLength: 200
    examples:
      - Less oil
    description: A note for the store, at most 200 characters.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    quantity: 1
    answers:
      - modifier_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
        item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
        quantity: 1
        answers: []
    note: Less oil
