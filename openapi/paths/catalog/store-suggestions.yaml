# Path item for /v1/storefront/stores/{location_id}/search/suggestions. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The store (a Location).
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: suggestInStore
  summary: Suggest product names inside a store
  description: The store's product names that start like what is being typed, or nearly, one of each name; a suggestion equal to what was typed is not offered.
  tags:
    - Search
  security: []
  parameters:
    - name: q
      in: query
      required: false
      description: What was typed, at most 100 characters; fewer than two letters finds nothing.
      schema:
        type: string
        maxLength: 100
      example: biriyani
    - name: limit
      in: query
      required: false
      description: How many names. 1 to 20, 8 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 8
  responses:
    "200":
      description: The suggestions.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/SearchSuggestionList.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The store does not exist, is deleted, or is not live (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
