type: object
description: "How a sandbox key's orders and deliveries move by themselves: an order is accepted `accept_after_seconds` after it is placed unless the developer accepts or declines it first, its delivery is assigned to the sandbox's Agent `assign_after_seconds` after acceptance, collected `collect_after_seconds` after that, and delivered with a stock proof `deliver_after_seconds` after that. With `by_hand`, nothing moves by itself: the developer accepts through the API and steps each delivery. An order placed without a key moves at the defaults."
required:
  - key_id
  - accept_after_seconds
  - assign_after_seconds
  - collect_after_seconds
  - deliver_after_seconds
  - by_hand
  - updated_at
properties:
  key_id:
    type:
      - string
      - "null"
    format: uuid
    description: The sandbox key; `null` for the defaults.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b5c01
  accept_after_seconds:
    type: integer
    minimum: 1
    maximum: 3600
    description: Seconds from placing to accepting. 20 by default.
    examples:
      - 20
  assign_after_seconds:
    type: integer
    minimum: 1
    maximum: 3600
    description: Seconds from acceptance to a sandbox Agent assigned. 30 by default.
    examples:
      - 30
  collect_after_seconds:
    type: integer
    minimum: 1
    maximum: 3600
    description: Seconds from assignment to collected. 120 by default.
    examples:
      - 120
  deliver_after_seconds:
    type: integer
    minimum: 1
    maximum: 3600
    description: Seconds from collection to delivered. 300 by default.
    examples:
      - 300
  by_hand:
    type: boolean
    description: Whether only the developer moves orders and deliveries.
    examples:
      - false
  updated_at:
    type:
      - string
      - "null"
    format: date-time
    description: When the key last set it; `null` for the defaults.
    examples:
      - "2026-11-02T10:15:00Z"
examples:
  - key_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b5c01
    accept_after_seconds: 20
    assign_after_seconds: 30
    collect_after_seconds: 120
    deliver_after_seconds: 300
    by_hand: false
    updated_at: "2026-11-02T10:15:00Z"
