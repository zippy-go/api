# Path item for /v1/platform/offers/locations. Referenced from openapi.yaml.
get:
  operationId: listOfferLocations
  summary: List Locations with their offers
  description: Every Location but those closed for good, by name, with the live, scheduled and paused offers that reach it, worked out by the rule the engine prices with. `promotion:read`.
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: vertical_id
      in: query
      required: false
      description: Only Locations trading in this Vertical.
      schema:
        type: string
        format: uuid
    - name: running
      in: query
      required: false
      description: "`true` for Locations something runs at, `false` for those with nothing."
      schema:
        type: boolean
    - name: q
      in: query
      required: false
      description: Words of the Location's or its Partner's name.
      schema:
        type: string
        maxLength: 100
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of Locations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferLocationPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
