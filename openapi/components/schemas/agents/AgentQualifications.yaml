type: object
description: An Agent's qualifications.
required:
  - agent_id
  - partner_id
  - service_id
  - qualifications
properties:
  agent_id:
    type: string
    format: uuid
    description: The Agent membership.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a11
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  service_id:
    type: string
    format: uuid
    description: The service.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  qualifications:
    type: array
    items:
      $ref: ./AgentQualification.yaml
    description: The qualifications held, by name.
examples:
  - agent_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a11
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    service_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    qualifications:
      - name: Electrician
        key: electrician
        approved_at: 2026-11-05T10:00:00Z
        approved_by: Ravi Kumar
