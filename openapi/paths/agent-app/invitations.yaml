# Path item for /v1/agent/invitations. Referenced from openapi.yaml.
get:
  operationId: listOwnAgentInvitations
  summary: List invitations in progress
  description: "The invitations in progress for the signed-in person's verified mobile number and email. An invited number may ask the Agent app for a one-time code before it has an account: the account is made when the code is verified, as a staff invitation makes one, and a code for anybody else never makes an account. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: The invitations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentInvitationList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
