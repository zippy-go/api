type: object
description: The Location a booking is with.
required:
  - location_id
  - name
properties:
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000306
  name:
    type: string
    description: Its name.
    examples:
      - Madhapur Home Care
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000306
    name: Madhapur Home Care
