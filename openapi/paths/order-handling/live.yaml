# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/live. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: getLiveOrders
  summary: Read a store's live orders
  description: "The board: new orders (placed, waiting to be accepted) oldest first, each counting down the time left to accept it and reading late after five minutes; orders being prepared soonest due first, counting down to their promise; ready ones longest waiting first; deliveries on their way longest on their way first, staying until delivered or cancelled; those finished in the last 24 hours. Each order offers the one move it waits for. Whether the store takes orders now, and the oldest new order, which kitchen mode shows on the whole screen. The customer's mobile and address are shown only when the store delivers with its own agents. Members need `order:read` at the Location to read and `order:manage` to move an order; platform staff use the same routes with their platform permissions, every move written to the audit log. A Location of another Partner, and an order of another store, answer `404` before any permission is looked at."
  tags:
    - Order handling
  security:
    - Bearer: []
  responses:
    "200":
      description: The board.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/LiveOrders.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission at the Location) or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Location or the order."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
