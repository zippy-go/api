type: object
description: |
  An invitation to join a partner, or the platform, with a role, sent by
  email. The invited person accepts it with the token from the email
  through `POST /v1/invitations/{token}/accept`; the token itself is never
  returned by the API. The invitation is `pending` until it is accepted,
  revoked or past `expires_at`.
required:
  - id
  - partner_id
  - email
  - role
  - status
  - expires_at
  - created_at
  - location_ids
  - service_ids
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the invitation.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
  partner_id:
    type: string
    format: uuid
    description: The partner the invitation is for; the platform organisation for an invitation into the platform.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  email:
    type: string
    format: email
    description: The email address the invitation was sent to.
    examples:
      - manager@example.com
  role:
    $ref: ../memberships/MembershipRole.yaml
    description: The default role the membership will have once the invitation is accepted, or `custom` for a role the partner defined.
  status:
    $ref: ./InvitationStatus.yaml
    description: The state of the invitation.
  expires_at:
    type: string
    format: date-time
    description: When the invitation stops being acceptable, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-21T08:15:00Z
  created_at:
    type: string
    format: date-time
    description: When the invitation was created, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-14T08:15:00Z
  role_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The role to grant on acceptance; `null` for an invitation into the platform, whose roles are granted afterwards.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a73
  location_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Locations the role is limited to; empty for the whole partner.
  service_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Services the role is limited to; empty for the whole partner.
  display_name:
    type:
      - string
      - 'null'
    description: The name the invitee will be shown under, when one was given.
    examples:
      - User 21
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    email: manager@example.com
    role: manager
    status: pending
    expires_at: 2026-10-21T08:15:00Z
    created_at: 2026-10-14T08:15:00Z
    role_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a73
    location_ids: []
    service_ids: []
    display_name: User 21
