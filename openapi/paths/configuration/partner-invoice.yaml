# Path item for /v1/partners/{partner_id}/invoices/{invoice_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: invoice_id
    in: path
    required: true
    description: The invoice, of the Partner in the path.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000c901
get:
  operationId: getPartnerInvoice
  summary: Get an invoice
  description: A monthly invoice with its lines, GST apart, the month's order fees for reference, how it is paid and its credit notes. `billing:read`; platform staff with `partner:read`.
  tags:
    - Billing
  security:
    - Bearer: []
  responses:
    "200":
      description: The invoice.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/Invoice.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such invoice of the Partner (`not_found`).
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
