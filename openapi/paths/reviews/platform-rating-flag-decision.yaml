# Path item for /v1/platform/rating-flags/{flag_id}/decision. Referenced from openapi.yaml.
parameters:
  - name: flag_id
    in: path
    required: true
    description: "The flag."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0004"
post:
  operationId: decidePlatformRatingFlag
  summary: "Decide a flag"
  description: "Decides a flag: `exclude` stops the rating counting for the Agent with the reason kept (the order's review is unchanged), `keep` leaves it. Written to the audit log; publishes `reviews.flag.decided`. Mission Control tokens only, with `review:manage`."
  tags:
    - Reviews
  security:
    - Bearer: []
  requestBody:
    required: true
    description: "The decision."
    content:
      "application/json":
        schema:
          $ref: ../../components/schemas/reviews/RatingFlagDecision.yaml
  responses:
    "200":
      description: "The flag, decided."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/RatingFlagDetail.yaml
    "400":
      description: "`validation_failed`: an empty reason or one over 300 characters."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such flag."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`flag_decided`: it was decided already."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
