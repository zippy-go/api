  "get": {
    "operationId": "getDeveloperChecklist",
    "summary": "Read the way to going live",
    "description": "The checklist: a first call answered, a webhook endpoint verified, a test order delivered in the sandbox, and a production key. Members need `developer:read`.",
    "tags": [
      "Developer"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "responses": {
      "200": {
        "description": "The checklist.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/DeveloperChecklist.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `developer:read`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
