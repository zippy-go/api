# Path item for /v1/verticals/{vertical_id}/taxonomy. Referenced from openapi.yaml.
parameters:
  - name: vertical_id
    in: path
    required: true
    description: The Vertical.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: getVerticalTaxonomy
  summary: Read a Vertical's taxonomy
  description: |
    The shared taxonomy of one Vertical: every term of its tree, depth first, with
    the attributes each requires and how many categories and items map to it.
    Public, for every surface and integrator; Partners read it when they map. The
    entity tag is the tree's version, raised by every change. Deprecated and
    merged terms are left out unless `include_retired` asks for them.
  tags:
    - Taxonomy
  security: []
  parameters:
    - name: include_retired
      in: query
      required: false
      description: 'Also the deprecated and merged terms, each naming the term it gave way to.'
      schema:
        type: boolean
        default: false
    - $ref: ../../components/parameters/IfNoneMatchHeader.yaml
  responses:
    "304":
      description: 'Not modified: the tree is still at the version `If-None-Match` names.'
    "200":
      description: 'The tree.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyTree.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such Vertical (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
