type: object
description: "A store's reviews in the Partner console, newest first, twenty at a time."
required:
  - location_id
  - time_zone
  - taking_reviews
  - items
  - next_cursor
properties:
  location_id:
    type: string
    format: uuid
    description: "The store."
  time_zone:
    type: string
    examples:
      - Asia/Kolkata
    description: "The store's clock, for showing when each was written."
  taking_reviews:
    type: boolean
    description: "Whether customers are asked for reviews now; the reviews written before are listed either way."
  items:
    type: array
    items:
      $ref: ./PartnerReview.yaml
    description: "The reviews, newest first."
  next_cursor:
    type:
      - string
      - "null"
    examples:
      - eyJ2IjoxfQ.c2ln
    description: "The cursor of the next page; `null` on the last."
examples:
  - location_id: "01a13a48-9e00-7000-8000-000000000301"
    time_zone: Asia/Kolkata
    taking_reviews: true
    items:
      - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0001"
        location_id: "01a13a48-9e00-7000-8000-000000000301"
        first_name: Asha
        thumb: down
        tags:
          - code: cold_damaged
            label: Cold/damaged
        note: "The biryani arrived cold."
        photos:
          - asset_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005"
            url: "https://objects.zippygo.example/zippygo-private/reviews/0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005.jpg?signature=example"
        hidden: false
        fulfilment: delivered
        created_at: "2026-10-22T10:10:00Z"
        order:
          order_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
          number: AB0042
          lines:
            - name: "Hyderabadi Biryani"
              variant_label: Full
              quantity: 1
              left_out: false
            - name: "Boondi raita"
              variant_label: null
              quantity: 1
              left_out: true
          total:
            minor_units: 58000
            currency: INR
          refunded: false
        agent: null
        replies:
          - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0002"
            text: "Sorry, we have changed our packaging"
            status: approved
            written_at: "2026-10-22T10:30:00Z"
            written_by: "Dev owner"
            decided_at: "2026-10-22T11:00:00Z"
            reason: null
        reply_allowed: false
        reply_refusal: "A reply was published; a review takes one reply."
    next_cursor: null
