type: object
description: "An Agent's flag on a rating they find unfair, raised within 14 days and decided within 7: by the Partner for its own Agents, by Mission Control for the platform fleet's."
required:
  - id
  - status
  - reason
  - flagged_at
  - due_by
  - decided_at
  - decision_reason
properties:
  id:
    type: string
    format: uuid
    description: "The flag."
  status:
    $ref: ./RatingFlagStatus.yaml
    description: "Where it stands."
  reason:
    type: string
    examples:
      - "The store handed it over 40 minutes late."
    description: "The Agent's reason."
  flagged_at:
    type: string
    format: date-time
    description: "When it was raised."
  due_by:
    type: string
    format: date-time
    description: "When it should be decided by: seven days after it was raised."
  decided_at:
    type:
      - string
      - "null"
    format: date-time
    description: "When it was decided."
  decision_reason:
    type:
      - string
      - "null"
    examples:
      - "Late at the store, not the Agent"
    description: "The reason recorded with the decision."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0004"
    status: excluded
    reason: "The store handed it over 40 minutes late."
    flagged_at: "2026-10-22T12:00:00Z"
    due_by: "2026-10-29T12:00:00Z"
    decided_at: "2026-10-23T09:00:00Z"
    decision_reason: "Late at the store, not the Agent"
