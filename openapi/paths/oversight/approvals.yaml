# Path item for /v1/platform/approvals. Referenced from openapi.yaml.
get:
  operationId: listApprovals
  summary: List the four-eyes proposals
  description: The proposals, newest first; `staff:read` or `approval:decide`.
  tags:
    - Oversight
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: Only proposals in this state.
      schema:
        $ref: ../../components/schemas/oversight/ApprovalStatus.yaml
  responses:
    '200':
      description: The proposals.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/ApprovalList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: proposeApproval
  summary: Propose a four-eyes act
  description: |-
    Proposes a four-eyes act: granting or revoking a platform role, turning a platform member's two-step off, or disabling a platform member. `staff:write`. The parameters are checked and frozen now (a Partner's role is `cross_tenant_role`, a role holding more than the proposer holds `permission_escalation`, oneself `two_step_self` or `cannot_disable_self`). When no other platform member could decide it, the act runs at once and the proposal reads approved, flagged `sole_decider`.

    These four acts happen only through a proposal; there is no direct operation for them.
  tags:
    - Oversight
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The act, the platform membership it is about and its parameters.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/oversight/ApprovalCreate.yaml
  responses:
    '201':
      description: Proposed; or done at once when nobody else could decide.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/Approval.yaml
    '400':
      description: Malformed body, or a missing parameter for the action.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without `staff:write`; `permission_escalation`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown membership, role or grant.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`cross_tenant_role`, `two_step_self`, `cannot_disable_self`, `last_owner`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
