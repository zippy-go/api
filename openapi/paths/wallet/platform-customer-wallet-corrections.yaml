# Path item for /v1/platform/customers/{customer_id}/wallet/corrections. Referenced from openapi.yaml.
post:
  tags:
    - Wallet
  security:
    - Bearer: []
  operationId: correctCustomerWallet
  summary: Correct a customer's Wallet
  description: Corrects one balance up or down as a new entry, with a reason the customer reads and a note they never see; a correction down never takes more than is available in that balance (`correction_exceeds_available`, saying the most). The customer is told the amount of a correction up. `wallet:write`; requires `Idempotency-Key`. Written to the audit log.
  parameters:
    - name: customer_id
      in: path
      required: true
      description: The customer.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The balance, the amount, the reason and the note.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/wallet/WalletCorrectionRequest.yaml
  responses:
    "201":
      description: The correction's entry.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/wallet/WalletEntry.yaml
    "400":
      description: "`validation_failed`: `idempotency_key_missing`, a zero amount, a reason over 40 characters, or a malformed body."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `wallet:write` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such customer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`correction_exceeds_available`: more down than is available in the balance."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
