# Path item for /v1/partners/{partner_id}/locations/{location_id}/notices/seen. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: 'The Location, which must belong to the partner in the path.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
post:
  operationId: markLocationNoticesSeen
  summary: Mark notices seen
  description: |
    Records that the Location saw the notices named, or every notice of its
    inbox without `notice_ids`. Only the first sighting is kept: a notice seen
    already is not touched, and a request that changes nothing answers
    `marked: 0`. A notice of another Location is never touched. `notice:read`
    at the Location.
  tags:
    - Notices
  security:
    - Bearer: []
  requestBody:
    required: true
    description: 'The notices to mark, or none for all.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/notifications/NoticeSelection.yaml
  responses:
    '200':
      description: 'How many were marked now.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticesMarked.yaml
    '400':
      description: '`validation_failed`: a malformed notice id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `notice:read` at this Location (`access_denied`); platform staff read with `notice:send` and change nothing (`forbidden`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'Unknown partner or Location, or a Location of another partner (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
