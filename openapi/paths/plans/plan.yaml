parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartnerPlan
  summary: Get the partner's plan
  description: "The Partner's plan: what it includes, the Pro trial, a change waiting, and the plans on offer. Members and platform staff. Since step 10 each plan carries its price, modules and limits, the day a change to it takes effect and what an upgrade's rest of the month costs, and `price_change` names a price announced for the Partner's plan."
  tags:
    - Plans
  security:
    - Bearer: []
  responses:
    "200":
      description: The plan.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/plans/PartnerPlan.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Platform staff without `partner:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "503":
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putPartnerPlan
  summary: Change the partner's plan
  description: "Changes the Partner's plan. Since step 10 the owner (`plan:write`) moves it: an upgrade at once, the rest of the month prorated on the next invoice, a downgrade on the 1st of next month. Platform staff (`partner:write`) schedule a move with a reason at `effective_at`; a staff move at once answers 409 `approval_required` and is proposed at `POST /v1/platform/approvals` (`change_partner_plan`). At the moment a move takes effect every Service of a kind the new plan lacks is disabled, and the Partner is told by email. Choosing the plan the trial ends into needs `plan:write` (platform staff: `partner:write`)."
  tags:
    - Plans
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/plans/PartnerPlanUpdate.yaml
  responses:
    "200":
      description: The plan as changed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/plans/PartnerPlan.yaml
    "400":
      description: Malformed body, or a move without a reason.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `plan:write` (`access_denied`; platform staff need `partner:write`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`partner_archived`; `approval_required` for a staff move at once."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "503":
      description: A store or mail delivery is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
