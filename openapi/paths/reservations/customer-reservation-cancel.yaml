  responses:
    "200":
      description: The reservation, cancelled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reservations/CustomerReservation.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: not the customer's."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`reservation_not_cancellable`: less than two hours before, or the party was seated or marked a no-show."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
