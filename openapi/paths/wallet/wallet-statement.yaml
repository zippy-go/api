# Path item for /v1/customer/wallet/statements/{month}. Referenced from openapi.yaml.
get:
  tags:
    - Wallet
  security:
    - Bearer: []
  operationId: getWalletStatement
  summary: A month's statement
  description: "The Wallet over a calendar month in the market's clock (Asia/Kolkata): the opening and closing balances and every entry of the month with its kind, balance, order and reason, for the customer to download."
  parameters:
    - name: month
      in: path
      required: true
      description: The month, `YYYY-MM`.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
  responses:
    "200":
      description: The statement.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/wallet/WalletStatement.yaml
    "400":
      description: "`validation_failed`: not a month, or a month still to come."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
