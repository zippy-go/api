# Path item for /v1/agent/memberships/{agent_id}/tasks. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: listAgentTasks
  summary: List the Agent's tasks
  description: "The membership's tasks: by default those under way, the trip's next stop first; `status=finished` lists those that ended on the given day (today on the India calendar by default), newest first. The customer's number is carried only while a task is under way. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: "`open` (the default) or `finished`."
      schema:
        type: string
        enum:
          - open
          - finished
      example: open
    - name: date
      in: query
      required: false
      description: For `finished`, the day.
      schema:
        type: string
        format: date
      example: 2026-10-16
  responses:
    "200":
      description: The tasks.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentTaskList.yaml
    "400":
      description: "`validation_failed`: an unknown status or a malformed date."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
