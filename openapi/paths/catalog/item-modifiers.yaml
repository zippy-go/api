# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/items/{item_id}/modifiers. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: item_id
    in: path
    required: true
    description: The item, which must be one of the store's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
put:
  operationId: putCatalogItemModifiers
  summary: Set the questions an item asks
  description: "Replaces the questions the item asks, in its order, with the answers it prices or hides for itself, naming only answers each question offers. Because an answer is an item that may ask questions of its own, questions nest: a chain deeper than three is refused naming it, and an item reached again through its own questions is refused as a loop. `catalog:write`."
  tags:
    - Catalog
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The questions, in order.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/CatalogItemModifiers.yaml
  responses:
    "200":
      description: The item.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/CatalogItem.yaml
    "400":
      description: "The body failed validation (`validation_failed`): an override names an answer the question does not offer (`answer_not_offered`), or a question is unknown or repeated."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `catalog:write` at this Location (`access_denied`), or the partner is not entitled to it (`not_enabled_for_partner`). Platform staff read catalogues and change none in this version (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner is not visible to the caller, or the store or the record does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`modifier_cycle` (the item would ask itself), `modifier_too_deep` (a chain of more than three questions, named in the `detail`); or `service_required`: the Location is a branch, with no product-sales Service switched on, so it has no catalogue."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
