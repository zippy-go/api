# Path item for /v1/storefront/home. Referenced from openapi.yaml.
get:
  operationId: getStorefrontHome
  summary: Read the opening screen
  description: 'The opening screen in one request: where the visitor is placed, the rows the zone (or its city) configured with the campaign banners showing now, and every Vertical with its categories, a Vertical that does not trade in the zone flagged rather than left out. A remembered zone that no longer serves answers the default, and says so.'
  tags:
    - Storefront
  security: []
  parameters:
    - name: lat
      in: query
      required: false
      description: Latitude of the pin; half a coordinate counts as none.
      schema:
        type: number
    - name: lng
      in: query
      required: false
      description: Longitude of the pin.
      schema:
        type: number
    - name: cap
      in: query
      required: false
      description: How far, in metres, the nearest zone may be before the default answers instead; the storefront asks with 25000. Without it the nearest zone wins at any distance.
      schema:
        type: integer
    - name: zone_id
      in: query
      required: false
      description: A zone the visitor chose or the device remembers; used while it still serves.
      schema:
        type: string
        format: uuid
    - name: country
      in: query
      required: false
      description: The visitor's country (alpha-2), used when no pin is given.
      schema:
        type: string
  responses:
    '200':
      description: The opening screen in one answer.
      headers:
        Cache-Control:
          description: '`private, no-store` when the request carries a pin; `public, max-age=30` otherwise.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/storefront/StorefrontHome.yaml
    '400':
      description: '`validation_failed`: a pin out of range, a negative cap, or `malformed_identifier` on `zone_id`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
