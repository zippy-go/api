type: object
description: "A published version of a delivery service's pay rule: a base per pickup and per drop-off, an amount per kilometre of routed distance between stops, waiting pay per minute beyond the free minutes at a pickup, what a task called off after the Agent started towards it pays, and tips in full. A task keeps the version it was offered under."
required:
  - id
  - partner_id
  - service_id
  - version
  - pickup
  - drop_off
  - per_km
  - waiting_per_minute
  - waiting_free_minutes
  - call_off
  - note
  - published_at
  - published_by
properties:
  id:
    type: string
    format: uuid
    description: The version.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a90
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  service_id:
    type: string
    format: uuid
    description: The delivery service.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  version:
    type: integer
    format: int32
    description: The version, from 1.
    examples:
      - 1
  pickup:
    $ref: ../common/Money.yaml
    description: Per pickup.
  drop_off:
    $ref: ../common/Money.yaml
    description: Per drop-off.
  per_km:
    $ref: ../common/Money.yaml
    description: Per kilometre of routed distance between stops.
  waiting_per_minute:
    $ref: ../common/Money.yaml
    description: Per minute of waiting beyond the free minutes at a pickup.
  waiting_free_minutes:
    type: integer
    format: int32
    description: Minutes of waiting at a pickup that pay nothing.
    examples:
      - 10
  call_off:
    $ref: ../common/Money.yaml
    description: What a task called off after the Agent started towards it pays.
  note:
    type:
      - string
      - "null"
    description: What changed, for the Agents.
  published_at:
    type: string
    format: date-time
    description: When it was published.
    examples:
      - 2026-10-16T09:00:00Z
  published_by:
    type:
      - string
      - "null"
    format: uuid
    description: Who published it; `null` for the defaults.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a90
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    service_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    version: 1
    pickup:
      minor_units: 2500
      currency: INR
    drop_off:
      minor_units: 3000
      currency: INR
    per_km:
      minor_units: 600
      currency: INR
    waiting_per_minute:
      minor_units: 100
      currency: INR
    waiting_free_minutes: 10
    call_off:
      minor_units: 2000
      currency: INR
    note: null
    published_at: 2026-10-16T09:00:00Z
    published_by: null
