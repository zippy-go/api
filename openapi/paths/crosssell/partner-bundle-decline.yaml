# Path item for /v1/partners/{partner_id}/locations/{location_id}/bundles/{bundle_id}/decline. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000308
  - name: bundle_id
    in: path
    required: true
    description: The bundle.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8401
post:
  operationId: declinePartnerBundle
  summary: Decline a bundle for a store
  description: "Declines a bundle for this store: it is not shown, and orders already placed keep their offers. An answer is final for the bundle's life; answering the same again answers the same. Members need `promotion:write` at the store. Audited."
  tags:
    - Bundles
  security:
    - Bearer: []
  responses:
    "200":
      description: The bundle with the answer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/PartnerBundle.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without `promotion:write` at the store."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the partner, the store, or a bundle it is not a side of."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`conflict` when the store answered the other way already, or the bundle was stopped."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
