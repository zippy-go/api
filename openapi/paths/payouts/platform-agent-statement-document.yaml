# Path item for /v1/platform/agent-statements/{statement_id}/document. Referenced from openapi.yaml.
parameters:
  - name: statement_id
    in: path
    required: true
    description: The Agent's statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5201
get:
  operationId: getAgentStatementDocument
  summary: Draw an Agent's statement PDF
  description: Draws the statement's PDF when it is asked for. `payout:read`.
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: "The PDF, with `Content-Disposition: attachment`."
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: The PDF.
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such statement (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
