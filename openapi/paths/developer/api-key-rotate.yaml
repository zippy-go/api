{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    },
    {
      "name": "key_id",
      "in": "path",
      "required": true,
      "description": "The key.",
      "schema": {
        "type": "string",
        "format": "uuid"
      },
      "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7c01"
    }
  ],
  "post": {
    "operationId": "rotateApiKey",
    "summary": "Rotate an API key",
    "description": "Makes the key's successor with its name and scopes, shown this once, and keeps the old key working for the grace chosen (24 hours by default, up to 7 days), after which it is revoked by itself. Audited and announced as `developer.key.rotated`. Members need `developer:read` to read and `developer:manage` to change; owners and the Developer role hold both. A key cannot manage keys.",
    "tags": [
      "Developer"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "$ref": "../../components/parameters/IdempotencyKeyHeader.yaml"
      }
    ],
    "requestBody": {
      "required": false,
      "description": "The grace.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/developer/ApiKeyRotateInput.yaml"
          }
        }
      }
    },
    "responses": {
      "201": {
        "description": "The successor and its secret.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/ApiKeyCreated.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: a grace out of bounds.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `developer:manage`; `forbidden` for an API key.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner or the key.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`conflict`: the key is revoked or already replaced.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
