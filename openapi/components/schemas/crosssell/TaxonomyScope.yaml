type: object
description: A Vertical, or one term of it with every term beneath it.
required:
  - vertical_id
  - term_id
properties:
  vertical_id:
    type: string
    format: uuid
    description: The Vertical.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b02
  term_id:
    type:
      - string
      - "null"
    format: uuid
    description: A term of the Vertical and every term beneath it; `null` for the whole Vertical.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd200
examples:
  - vertical_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b02
    term_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd200
