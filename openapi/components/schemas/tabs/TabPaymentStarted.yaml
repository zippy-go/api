type: object
description: "A payment of a share started: paid at once from the Wallet, or waiting for the provider's page or the UPI app."
required:
  - payment_id
  - amount
  - tip
  - status
  - next_action
  - receipt_token
  - tab
properties:
  payment_id:
    type: string
    format: uuid
    description: The payment.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
  amount:
    $ref: ../common/Money.yaml
    description: What it pays of the bill.
  tip:
    $ref: ../common/Money.yaml
    description: The tip added.
  status:
    type: string
    enum:
      - paid
      - pending
    description: "`paid` or `pending`."
    examples:
      - pending
  next_action:
    oneOf:
      - $ref: ../orders/NextAction.yaml
      - type: "null"
    description: What the diner does next; `null` once paid.
  receipt_token:
    type:
      - string
      - "null"
    description: "The receipt's token once paid: its page at `/receipts/{token}`."
    examples:
      - null
  tab:
    $ref: ./Tab.yaml
    description: The tab after it.
examples:
  - payment_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
