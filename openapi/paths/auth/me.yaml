# Path item for /v1/me. Referenced from openapi.yaml.
get:
  operationId: getMe
  summary: Get the signed-in user
  description: |
    Returns the user the access token belongs to, their memberships with
    the role they hold in each partner, and their platform roles. Call it
    after signing in to decide which partner to work in. The response
    reflects the current state, whereas the token's `memberships` and
    `platform` claims are fixed when the token is issued and catch up at
    the next refresh.
  tags:
    - Auth
  security:
    - Bearer: []
  responses:
    '200':
      description: The signed-in user with their memberships and platform roles.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/Me.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
