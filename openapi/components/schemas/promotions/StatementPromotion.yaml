type: object
description: "A promotion that ran in a Location's week: its orders, what it took off for customers, and what the Partner and the platform paid; the Partner's share comes off sales before the fee."
required:
  - offer_id
  - name
  - line
  - owner
  - paid_by_text
  - orders
  - took_off
  - partner_paid
  - platform_paid
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  name:
    type: string
    description: Its name.
    examples:
      - Biryani BOGO
  line:
    type: string
    description: Its line.
    examples:
      - Buy 1, get 1 free
  owner:
    $ref: ./OfferOwner.yaml
    description: Whose it is.
  paid_by_text:
    type: string
    description: 'Who paid in words: "Paid by you", "Paid by ZippyGo", "You paid 50%".'
    examples:
      - Paid by you
  orders:
    type: integer
    description: Orders that used it.
    examples:
      - 1
  took_off:
    $ref: ../common/Money.yaml
    description: What it took off for customers.
  partner_paid:
    $ref: ../common/Money.yaml
    description: What the Partner paid.
  platform_paid:
    $ref: ../common/Money.yaml
    description: What the platform paid.
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    name: Biryani BOGO
    line: Buy 1, get 1 free
    owner: partner
    paid_by_text: Paid by you
    orders: 1
    took_off:
      minor_units: 42900
      currency: INR
    partner_paid:
      minor_units: 42900
      currency: INR
    platform_paid:
      minor_units: 0
      currency: INR
