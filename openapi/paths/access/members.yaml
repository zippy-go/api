# Path item for /v1/partners/{partner_id}/members. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listTeamMembers
  summary: List a partner's team with their grants
  description: The partner's members, each with every grant naming its scope and the permissions held there; `staff:read`. Filterable by status, role and Location.
  tags:
    - Access
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: Only enabled or disabled members.
      schema:
        $ref: ../../components/schemas/access/MembershipStatus.yaml
    - name: role_id
      in: query
      required: false
      description: Only members holding this role somewhere.
      schema:
        type: string
        format: uuid
    - name: location_id
      in: query
      required: false
      description: Only members holding a grant at this Location.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The members.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/TeamMemberList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without `staff:read`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown, or not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
