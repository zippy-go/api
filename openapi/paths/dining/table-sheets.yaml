# Path item for /v1/partners/{partner_id}/locations/{location_id}/tables/sheets. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be the partner's in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: getDiningTableSheets
  summary: Print the table sheets
  description: A PDF of A6 sheets, one per table or the one named by `table_id`, each with its table's name, its QR code and the code written out. `location:read` at the Location.
  tags:
    - Dine-in
  security:
    - Bearer: []
  parameters:
    - name: table_id
      in: query
      required: false
      description: One table only.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The sheets as `application/pdf`.
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks `location:read` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location or the table."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
