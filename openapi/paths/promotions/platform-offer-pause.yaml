# Path item for /v1/platform/offers/{offer_id}/pause. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
post:
  operationId: pausePlatformOffer
  summary: Pause an offer
  description: Pauses any live or scheduled offer, the platform's or a Partner's. A Partner's offer needs a reason of at most 200 characters, which the Partner reads under "Paused by ZippyGo"; only the platform resumes it, and a scheduled one held this way does not go live. Written to the audit log. `promotion:write`.
  tags:
    - Promotions
  security:
    - Bearer: []
  requestBody:
    required: false
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/OfferPauseInput.yaml
  responses:
    "200":
      description: The offer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/Offer.yaml
    "400":
      description: "`validation_failed`: a Partner's offer paused without a reason (`reason_required`), or one over 200 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such offer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_transition`: the offer is not live or scheduled."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
