type: object
description: An offer an order was placed with, as it was at placing.
required:
  - offer_id
  - line
  - kind
  - code
  - saving
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  line:
    type: string
    description: Its line.
    examples:
      - Buy 1, get 1 free
  kind:
    $ref: ./BasketOfferKind.yaml
    description: What it took off.
  code:
    type:
      - string
      - "null"
    description: The code it came through.
    examples:
      - null
  saving:
    $ref: ../common/Money.yaml
    description: What it took off.
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    line: Buy 1, get 1 free
    kind: item
    code: null
    saving:
      minor_units: 42900
      currency: INR
