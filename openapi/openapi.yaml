openapi: 3.1.0

info:
  title: ZippyGo API
  version: 0.6.0
  summary: On-demand delivery and hyperlocal commerce API.
  description: |
    The ZippyGo API covers catalog, ordering, subscriptions, delivery
    orchestration and fleet management for businesses that sell and deliver
    locally: partners (organisations or individuals) sell products and
    services, and agents execute the tasks that fulfil them. This document is
    the contract: every endpoint, schema and error shape is defined here
    before it is implemented.

    The API is versioned by URL prefix (`/v1`). Changes within a major version
    are additive only; see the versioning policy in the repository.

    Conventions every operation honours (the developer portal's Conventions
    page has the detail): errors are RFC 9457 problems whose `code` is
    catalogued and dereferenceable at `/problems/{code}`; identifiers are
    UUIDs; amounts are `Money` in minor units; instants are RFC 3339 in
    UTC; collections page with `limit` and `cursor` and filter through a
    declared grammar; writes may carry `Idempotency-Key`; versioned
    resources answer with `ETag` and honour `If-None-Match` and
    `If-Match`; every response carries `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset` and `X-Correlation-Id`; a
    deprecated major answers with `Deprecation` and `Sunset`.
  contact:
    name: ZippyGo API
    url: https://github.com/zippy-go/api
  license:
    name: MIT
    identifier: MIT

# Placeholder hosts. The `.example` top-level domain is reserved for
# documentation (RFC 2606) and will be replaced by the real sandbox and
# production hosts before the first release.
servers:
  - url: https://sandbox.api.zippygo.example
    description: Sandbox (placeholder host, test data only)
  - url: https://api.zippygo.example
    description: Production (placeholder host)

# Operations without their own `security` accept either scheme.
security:
  - ApiKey: []
  - Bearer: []

tags:
  - name: Platform
    description: Service health, the token signing keys and other platform-level utilities.
  - name: Auth
    description: |
      Signing in and sessions: one-time codes by email or phone, passwords,
      token refresh, sign-out and the signed-in user.

      The sign-in operations return a `TokenResponse`. Its access token is a
      JSON Web Token signed with EdDSA (Ed25519), valid for 15 minutes and
      verifiable with the keys from `GET /.well-known/jwks.json`; the key
      that signed it is named by `kid` in the token header. The claims:

      | Claim         | Meaning                                                                                        |
      | ------------- | ---------------------------------------------------------------------------------------------- |
      | `sub`         | The user id.                                                                                   |
      | `iss`         | The issuer: the base URL of the API host that issued the token.                                |
      | `aud`         | `zippygo`.                                                                                     |
      | `iat`, `exp`  | Issued-at and expiry as Unix timestamps; `exp` is at most 15 minutes after `iat`.              |
      | `jti`         | The token id, unique per token.                                                                |
      | `sid`         | The session id. A session ends on sign-out, on reuse of a refresh token or when it expires.    |
      | `memberships` | The user's memberships as a compact list of `{ "p": "<partner_id>", "r": "<role>" }`.          |
      | `platform`    | The user's platform roles, a list of strings; empty for everyone outside the platform realm.   |

      The refresh token is delivered in an `httpOnly` cookie named
      `zg_refresh`, scoped to `/v1/auth`, to browsers, and in the body of the
      `TokenResponse` to native clients that send `X-Client-Type: native`
      when signing in. Refresh tokens rotate on every use; reusing one
      revokes the session.
  - name: Partners
    description: Partners, the supply-side tenants (organisations or individuals). Their locations, members, invitations and services have tags of their own.
  - name: Locations
    description: A partner's physical places, such as stores, restaurants, dark stores, warehouses and service bases.
  - name: Memberships
    description: The users who work in a partner and the role each of them holds.
  - name: Invitations
    description: Inviting users into a partner by email, and accepting an invitation.
  - name: Services
    description: The kinds of service a partner runs (product sales, field service, delivery), with their status and configuration.
  - name: Audit
    description: The append-only audit log of privileged acts, readable by the platform realm and, for their own records, by a partner's members.
  - name: Campaign slots
    description: "Promotional slots placed on the opening screen of a service area and everything beneath it."
  - name: Countries
    description: "Countries: the markets ZippyGo trades in, with their switches for orders and sign-in, holiday calendars, and the country layer of service policy and schedules."
  - name: Currencies
    description: "The currencies the platform operates in, with the display conventions of each."
  - name: Partner policy
    description: "The Partner and Location layers of service policy and schedules, the explain of the effective policy and whether a Location trades at an instant."
  - name: Service areas
    description: "The geography tree with its fences: resolving a pin to a service area, dividing and merging fenced areas, the Verticals an area offers, its campaign slots, its display grid and its policy and schedule layers."
  - name: Service types
    description: "What a Partner's field service does: workflows, durations, radii and the typed fields of the closed catalogue."
  - name: Settings
    description: "The closed, bounded set of platform settings, each with its default, bounds and the sentence saying what it does."
  - name: Store types
    description: "What a Location that sells is: the vocabulary of stores, their typed fields from the closed catalogue and what their items may carry."
  - name: Verticals
    description: "The categories of trade customers browse, with their categories, images and the service areas they reach."
  - name: Catalog
    description: Products, modifiers, availability and pricing.
  - name: Orders
    description: Commercial purchases placed by customers.
  - name: Deliveries
    description: Fulfilment of orders from pickup to dropoff, including tasks and trips.
  - name: Fleet
    description: Providers, agents, vehicles and capacity.
  - name: Live
    description: Server-sent event streams that push agent positions, statuses and events as they happen.
  - name: Events
    description: The events the platform publishes, as a list to poll and as a stream.
  - name: Subscriptions
    description: Plans and schedules that generate recurring orders.
  - name: Webhooks
    description: Webhook endpoints and event delivery.

