# Path item for /v1/agent/offers/{offer_id}/decline. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer, which must be the calling Agent's; another's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd501
post:
  operationId: declineAgentOffer
  summary: Decline an offer
  description: Declines an open offer, with a reason if the Agent gives one. The delivery goes to the next Agent at once and is not offered to this Agent again for 10 minutes. Declines are counted in the Agent's numbers, never punished. An Agent app token (audience `agent`), for the calling person's own Agent memberships; locally and in the sandbox the simulator's service token too, for Agents without a user, naming the Agent in `agent_id`.
  tags:
    - Deliveries
  security:
    - Bearer: []
  requestBody:
    required: false
    description: The reason, if any.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/dispatch/OfferDecline.yaml
  responses:
    "200":
      description: The offer, declined.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/AgentOffer.yaml
    "400":
      description: "`validation_failed`: a reason longer than 200 characters; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such offer of the caller."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_closed`: the offer expired, was withdrawn, taken or answered already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
