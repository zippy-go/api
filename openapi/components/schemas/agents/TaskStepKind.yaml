type: string
description: "A step of a task's workflow, and what the Agent app records: `navigate` (starts towards the stop), `arrive` (within the stop's geofence, or with an override and its reason), `scan` (the order label's number), `photo`, `signature`, `code` (the customer's 4-digit code), `cash` (the amount collected), `notes`, and the two that end a task, `complete` and `fail`."
enum:
  - navigate
  - arrive
  - scan
  - photo
  - signature
  - code
  - cash
  - notes
  - complete
  - fail
examples:
  - arrive
