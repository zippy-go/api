# Path item for /v1/partners/{partner_id}/reward-campaigns/{campaign_id}/publish. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: campaign_id
    in: path
    required: true
    description: The reward campaign.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000006002
post:
  operationId: publishPartnerRewardCampaign
  summary: Publish a reward campaign
  description: "Publishes a draft: live at once, or scheduled until its start. Asks for the Partner's word, exactly \"My business pays for this campaign's rewards, as shown.\" in `confirmation`, and is refused without it (`funding_not_confirmed`). Publishes `engagement.campaign.published` and `engagement.campaign.started` when it goes live. `engagement:write` at the campaign's Locations, which managers hold by default."
  tags:
    - Rewards
  security:
    - Bearer: []
  requestBody:
    required: false
    description: A reason, and the Partner's word to publish.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/engagement/RewardCampaignMove.yaml
  responses:
    "200":
      description: The campaign, moved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardCampaign.yaml
    "400":
      description: "`validation_failed`: `funding_not_confirmed` without the Partner's word, or a malformed body."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `engagement:write` at the Partner or the Location, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such campaign."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`reward_campaign_move_refused`: its state does not allow the move (`campaign_state`), or a Partner resumes what the platform paused (`paused_by_platform`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
