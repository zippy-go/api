type: object
description: A move of the Wallet the statement lists.
required:
  - at
  - kind
  - amount
  - description
properties:
  at:
    type: string
    format: date-time
    description: When.
    examples:
      - 2026-11-03T10:00:00Z
  kind:
    type: string
    description: "`top_up` or `credit_back`."
    examples:
      - top_up
  amount:
    $ref: ../common/Money.yaml
    description: How much.
  description:
    type: string
    description: In words.
    examples:
      - Top-up by UPI
examples:
  - at: 2026-11-03T10:00:00Z
    kind: top_up
    amount:
      minor_units: 50000
      currency: INR
    description: Top-up by UPI
