# Path item for /v1/customer/recommendations. Referenced from openapi.yaml.
get:
  operationId: listCustomerRecommendations
  summary: What goes with the customer's order, and what is due again
  description: |
    With `order_id`, "Nearby, goes with your order" for one of the customer's
    orders once its store accepted it: items of another Partner within the city's
    distance of that store, in a category the city pairs with what the order
    holds, ranked by relevance, then the store's rating, then distance. Without
    it, for the home screen: those of the customer's latest order accepted in the
    last 12 hours, and a reorder prompt for each category the customer orders at a
    steady interval whose time came. Nothing when the customer turned
    recommendations off, or the city turned complements off. The other Partner
    learns nothing of the customer until the customer orders there. Each answer
    publishes `crosssell.recommendation.shown`.
  tags:
    - Recommendations
  security:
    - Bearer: []
  parameters:
    - name: order_id
      in: query
      required: false
      description: 'One of the customer''s orders.'
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: 'The recommendations.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/RecommendationList.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such order of the customer''s (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
