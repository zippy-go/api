type: object
description: "An Agent's portable record: tasks, ratings, documents and earnings, for them to take elsewhere, the `AgentRecord` schema."
required:
  - agent_id
  - display_name
  - partner_name
  - service_name
  - status
  - joined_at
  - ended_at
  - tasks_completed
  - tasks
  - rating
  - ratings
  - documents
  - earnings
  - earned
properties:
  agent_id:
    type: string
    format: uuid
    description: "The Agent membership."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
  display_name:
    type: string
    description: "The name it worked under."
    examples:
      - "Agent 07"
  partner_name:
    type: string
    description: "The Partner."
    examples:
      - "ZippyGo Fleet"
  service_name:
    type: string
    description: "The delivery service."
    examples:
      - "Fleet deliveries"
  status:
    type: string
    description: "The membership's status now."
    examples:
      - "offboarded"
  joined_at:
    type:
      - string
      - "null"
    format: date-time
    description: "When it joined."
    examples:
      - "2026-01-05T09:00:00Z"
  ended_at:
    type:
      - string
      - "null"
    format: date-time
    description: "When it ended, once offboarded."
    examples:
      - null
  tasks_completed:
    type: integer
    minimum: 0
    description: "Tasks completed in all."
    examples:
      - 1830
  tasks:
    type: array
    items:
      $ref: ./AgentRecordTask.yaml
    description: "Its last 500 tasks, newest first."
  rating:
    type:
      - number
      - "null"
    description: "The share of thumbs up over its rated deliveries, as a percentage."
    examples:
      - 97.5
  ratings:
    type: integer
    minimum: 0
    description: "How many deliveries were rated."
    examples:
      - 410
  documents:
    type: array
    items:
      $ref: ./AgentRecordDocument.yaml
    description: "Its documents' reviews."
  earnings:
    type: array
    items:
      $ref: ./AgentRecordMonth.yaml
    description: "Its earnings by month, newest first."
  earned:
    $ref: ../common/Money.yaml
    description: "Everything it earned."
examples:
  - {"agent_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10", "display_name": "Agent 07", "partner_name": "ZippyGo Fleet", "service_name": "Fleet deliveries", "status": "offboarded", "joined_at": "2026-01-05T09:00:00Z", "ended_at": "2026-11-04T09:30:00Z", "tasks_completed": 1830, "tasks": [], "rating": 97.5, "ratings": 410, "documents": [], "earnings": [], "earned": {"minor_units": 9850000, "currency": "INR"}}
