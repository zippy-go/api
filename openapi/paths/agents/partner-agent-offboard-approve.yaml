# Path item for /v1/partners/{partner_id}/agents/{agent_id}/offboard/approve. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
post:
  operationId: approveAgentOffboarding
  summary: "Approve an Agent's offboarding"
  description: "A second member with `agent:manage` for the service approves the offboarding another member proposed: the membership ends, recorded with both. The proposer cannot approve their own (`second_member_required`). Mission Control does the same for the platform fleet."
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: "The Agent offboarded."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`second_member_required`: the proposer's own proposal; or `offboarding_not_pending`: nothing waits."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
