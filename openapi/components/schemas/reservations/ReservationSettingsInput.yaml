type: object
description: A Location's reservations as staff set them.
required:
  - enabled
  - first_slot
  - last_slot
  - max_party
  - days_ahead
properties:
  enabled:
    type: boolean
    description: Whether it takes reservations.
    examples:
      - true
  first_slot:
    type: string
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    description: The first slot's time on the Location's clock.
    examples:
      - 19:00
  last_slot:
    type: string
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    description: The last slot's time, at or after the first.
    examples:
      - 22:30
  max_party:
    type: integer
    minimum: 1
    maximum: 50
    description: The largest party, 1 to 50.
    examples:
      - 8
  days_ahead:
    type: integer
    minimum: 1
    maximum: 90
    description: How many days ahead a reservation may be made, 1 to 90.
    examples:
      - 30
  parties_per_slot:
    type:
      - integer
      - "null"
    minimum: 1
    description: How many parties a slot takes; `null` or left out for no limit.
    examples:
      - null
examples:
  - enabled: true
    first_slot: 19:00
    last_slot: 22:30
    max_party: 8
    days_ahead: 30
    parties_per_slot: null
