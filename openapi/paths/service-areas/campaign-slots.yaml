# Path item for /v1/service-areas/{service_area_id}/campaign-slots. Referenced from openapi.yaml.
parameters:
  - name: service_area_id
    in: path
    required: true
    description: The area
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
get:
  operationId: listCampaignSlots
  summary: The area's campaign slots, or with `effective` every slot that applies there
  description: The area's campaign slots, or with `effective` every slot that applies there.
  tags:
    - Service areas
  security:
    - Bearer: []
  parameters:
    - name: effective
      in: query
      required: false
      description: Every slot that applies here, the ancestors' included
      schema:
        type: boolean
    - name: at
      in: query
      required: false
      description: Only the slots showing at this instant (RFC 3339)
      schema:
        type: string
  responses:
    '200':
      description: The slots, oldest first
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/CampaignSlotList.yaml
    '400':
      description: Malformed identifier or query
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
