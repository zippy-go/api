# Path item for /v1/customer/offers. Referenced from openapi.yaml.
get:
  operationId: getCustomerOffers
  summary: Read the account's offers
  description: "The offers a customer holds: codes they added, ready or starting later with the Locations they are for, personal and referral codes, rewards, and ended ones for thirty days; the city's first-order offer when they qualify; and the live offers for new customers that need no code, each with where it runs. Customer tokens only."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: service_area_id
      in: query
      required: false
      description: The zone or city the customer is in, for the first-order offer and the offers near them; the selected address's by default.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The offers.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/CustomerOffers.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A token of another surface (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
