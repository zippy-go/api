# Path item for /v1/agent/offers/{offer_id}. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer, which must be the calling Agent's; another's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd501
get:
  operationId: getAgentOffer
  summary: Read an offer
  description: One offer of the calling Agent, as the list shows it. An Agent app token (audience `agent`), for the calling person's own Agent memberships; locally and in the sandbox the simulator's service token too, for Agents without a user, naming the Agent in `agent_id`.
  tags:
    - Deliveries
  security:
    - Bearer: []
  responses:
    "200":
      description: The offer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/AgentOffer.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such offer of the caller."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
