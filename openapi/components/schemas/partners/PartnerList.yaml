type: object
description: A page of partners, the response of `GET /v1/partners`.
required:
  - items
  - next_cursor
properties:
  items:
    type: array
    description: The partners on this page, newest first.
    items:
      $ref: ./Partner.yaml
  next_cursor:
    type:
      - string
      - 'null'
    description: An opaque cursor to pass as `cursor` for the next page, or `null` when this is the last page.
    examples:
      - MDE5MmI2ZjQtOWIwYS03Y2RlLThmM2EtNmQyYzFlNGI5YTAy
  facets:
    type: array
    description: Facet counts, present when `facets` was asked for.
    items:
      $ref: ../common/Facet.yaml
examples:
  - items:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
        kind: organisation
        name: Example Partner
        legal_name: Example Partner Ltd
        status: active
        contact_email: contact@example.com
        contact_phone: null
        created_at: 2026-10-14T08:05:00Z
        updated_at: 2026-10-14T09:00:00Z
        version: 2
        created_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
        updated_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a21
        country: IN
        gst_unregistered: false
        contacts:
          - purpose: operations
            name: Example Person
            role: Store manager
            email: person@example.com
            phone: '+15555550102'
            consent:
              email: true
              sms: true
              whatsapp: false
    next_cursor: null
