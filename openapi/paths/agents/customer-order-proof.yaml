# Path item for /v1/customer/orders/{order_id}/proof-of-delivery. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order the delivery fulfils.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: getCustomerOrderProof
  summary: Read the proof of the customer's own order
  description: "The proof kept on the drop of the customer's own order once it is delivered: when, the Agent's first name and the photo, through ten-minute links, every reading recorded. Takes a customer token."
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The proof.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ProofOfDelivery.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: not a customer token."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no delivered drop for an order of the caller (another customer's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
