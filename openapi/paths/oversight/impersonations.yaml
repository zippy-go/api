# Path item for /v1/platform/impersonation/sessions. Referenced from openapi.yaml.
get:
  operationId: listImpersonations
  summary: List the impersonation log
  description: 'The impersonation log: every session, newest first; `impersonate` or `audit:read`.'
  tags:
    - Oversight
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: Only this Partner's.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The sessions.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/ImpersonationSessionList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: startImpersonation
  summary: Start viewing a partner's console
  description: "Starts viewing a Partner's console as the owner who consented: the member who asked, `impersonate`, while the consent lasts (`consent_required` otherwise). Sixty minutes at most; the owner is told when it starts and ends."
  tags:
    - Oversight
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The approved consent to view under.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/oversight/ImpersonationSessionCreate.yaml
  responses:
    '201':
      description: Started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/ImpersonationAccess.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without `impersonate`; `consent_required`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown consent.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
