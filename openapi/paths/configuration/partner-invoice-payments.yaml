# Path item for /v1/partners/{partner_id}/invoices/{invoice_id}/payments. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: invoice_id
    in: path
    required: true
    description: The invoice, of the Partner in the path.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000c901
post:
  operationId: payPartnerInvoice
  summary: Pay an invoice
  description: Starts paying an invoice by UPI or card on the payment page; it reads paid from the provider's word. Once per `Idempotency-Key`. An invoice paid, credited or already deducted answers `invoice_not_payable`. The Partner's owners (`plan:write`).
  tags:
    - Billing
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: How it is paid.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/configuration/InvoicePaymentRequest.yaml
  responses:
    "201":
      description: The payment started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/InvoicePaymentStarted.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such invoice of the Partner (`not_found`).
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`invoice_not_payable`: paid, credited, or settled by deduction already."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
