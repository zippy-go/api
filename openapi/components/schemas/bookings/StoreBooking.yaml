type: object
description: "A booking as its Location and Mission Control see it, the `StoreBooking` schema: the customer's booking with the customer's first name and number for the day, the Agent proposed, the job's task, and whether it was missed."
required:
  - id
  - number
  - order_id
  - state
  - location
  - service
  - starts_at
  - ends_at
  - add_ons
  - address
  - instructions
  - agent
  - policy
  - estimate
  - extras
  - legs
  - bill
  - proof
  - payment
  - can
  - times
  - decline_reason
  - cancel_reason
  - dispute
  - running_late
  - created_at
  - version
  - customer_first_name
  - contact_phone
  - proposed_agent
  - task_id
  - service_id
  - missed
properties:
  id:
    type: string
    format: uuid
    description: The booking.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000b001
  number:
    type: string
    description: Its number, the order's.
    examples:
      - ZG-261107-0042
  order_id:
    type: string
    format: uuid
    description: The order of fulfilment on site it is.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000c001
  state:
    $ref: ./BookingState.yaml
    description: Where it stands.
  location:
    $ref: ./BookingLocation.yaml
    description: The Location.
  service:
    $ref: ./BookingService.yaml
    description: The service booked.
  starts_at:
    type: string
    format: date-time
    description: The slot's start; for pickup and return, the pickup's.
    examples:
      - 2026-11-07T10:00:00+05:30
  ends_at:
    type: string
    format: date-time
    description: When the job is expected to end.
    examples:
      - 2026-11-07T11:00:00+05:30
  add_ons:
    type: array
    items:
      $ref: ./BookingAddOn.yaml
    description: The add-ons booked.
  address:
    $ref: ./BookingAddress.yaml
    description: Where.
  instructions:
    type:
      - string
      - "null"
    description: The customer's access instructions.
    examples:
      - Gate code 4421
  agent:
    oneOf:
      - $ref: ./BookingAgent.yaml
      - type: "null"
    description: The Agent once confirmed.
  policy:
    $ref: ./BookingPolicy.yaml
    description: The policy as it was when booked.
  estimate:
    oneOf:
      - $ref: ./BookingEstimate.yaml
      - type: "null"
    description: The estimate, for a service priced from or after a pickup.
  extras:
    type: array
    items:
      $ref: ./BookingExtra.yaml
    description: Extras proposed.
  legs:
    type: array
    items:
      $ref: ./BookingLeg.yaml
    description: The legs of a pickup and return service.
  bill:
    $ref: ./BookingBill.yaml
    description: The bill.
  proof:
    oneOf:
      - $ref: ./BookingProof.yaml
      - type: "null"
    description: The photo and signature, once completed.
  payment:
    oneOf:
      - $ref: ../orders/NextAction.yaml
      - type: "null"
    description: What the customer does next to pay, while a payment waits.
  can:
    $ref: ./BookingActions.yaml
    description: What the customer may do now.
  times:
    $ref: ./BookingTimes.yaml
    description: When it moved.
  decline_reason:
    oneOf:
      - $ref: ./BookingDeclineReason.yaml
      - type: "null"
    description: Why it was declined.
  cancel_reason:
    type:
      - string
      - "null"
    description: Why it was cancelled.
    examples:
      - null
  dispute:
    type:
      - string
      - "null"
    description: The customer's words when they would not sign.
    examples:
      - null
  running_late:
    type: boolean
    description: "No Agent arrived thirty minutes after the slot's end: the customer may cancel with everything refunded."
    examples:
      - false
  created_at:
    type: string
    format: date-time
    description: When it was booked.
    examples:
      - 2026-11-05T19:38:00+05:30
  version:
    type: integer
    description: Raised by every change.
    examples:
      - 4
  customer_first_name:
    type:
      - string
      - "null"
    description: The customer's first name.
    examples:
      - Asha
  contact_phone:
    type:
      - string
      - "null"
    description: The number to reach the customer on the day.
    examples:
      - "+919000000001"
  proposed_agent:
    oneOf:
      - $ref: ./BookingAgent.yaml
      - type: "null"
    description: The Agent whose time made the slot.
  task_id:
    type:
      - string
      - "null"
    format: uuid
    description: The job's task in the workforce, once asked.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000a101
  service_id:
    type: string
    format: uuid
    description: The field Service.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000a401
  missed:
    type: boolean
    description: No Agent arrived thirty minutes after the slot's end.
    examples:
      - false
