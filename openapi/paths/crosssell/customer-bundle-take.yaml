# Path item for /v1/customer/bundles/{bundle_id}/take. Referenced from openapi.yaml.
parameters:
  - name: bundle_id
    in: path
    required: true
    description: The bundle.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8401
post:
  operationId: takeBundle
  summary: Take a bundle
  description: "Takes a live bundle: both sides' offers become the customer's, once each, and the second side's item is added to the customer's basket at its store (a category side leaves the choice to the customer). Each basket then prices its share through the promotions engine, and the two orders share a trip when they qualify. Taking it again answers the same."
  tags:
    - Bundles
  security:
    - Bearer: []
  responses:
    "200":
      description: The bundle taken.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/BundleTaken.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden` for a token that is not a customer's."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`bundle_not_live` when it is not live any more."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
