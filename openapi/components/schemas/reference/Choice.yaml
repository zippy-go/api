type: object
description: A named choice of a setting.
required:
  - value
  - label
properties:
  label:
    type: string
    description: What it means.
    examples:
      - Keeps the drawer open
  value:
    type: integer
    format: int64
    description: The stored value.
    examples:
      - 1
examples:
  - label: Keeps the drawer open
    value: 1
