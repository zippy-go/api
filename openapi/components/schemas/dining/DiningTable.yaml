type: object
description: A table of a Location with its seats, its area, how it is served and the code printed on its sheet. Regenerating the code makes every sheet printed before it inactive.
required:
  - table_id
  - location_id
  - name
  - seats
  - area
  - service
  - code
  - link
  - code_regenerated_at
  - version
  - created_at
properties:
  table_id:
    type: string
    format: uuid
    description: The table.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0101
  location_id:
    type: string
    format: uuid
    description: Its Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  name:
    type: string
    minLength: 1
    maxLength: 20
    description: Its name as staff and diners read it.
    examples:
      - "12"
  seats:
    type: integer
    minimum: 1
    maximum: 40
    description: How many it seats.
    examples:
      - 4
  area:
    type:
      - string
      - "null"
    maxLength: 40
    description: The area it stands in, such as Terrace.
    examples:
      - Terrace
  service:
    $ref: ./DineInService.yaml
    description: How it is served; the Location's setting unless set here.
  code:
    type: string
    pattern: ^[A-Z0-9]{8}$
    description: The code printed on its sheet, read by a scan; the link carries it.
    examples:
      - T7Q2M9XK
  link:
    type: string
    format: uri
    description: "The link the sheet's QR code carries: the storefront's table page, which the Customer app opens as its own."
    examples:
      - https://zippygo.local/t/T7Q2M9XK
  code_regenerated_at:
    type:
      - string
      - "null"
    format: date-time
    description: When its code was last regenerated; sheets printed before it no longer open a tab.
    examples:
      - null
  version:
    type: integer
    minimum: 1
    description: Raised by every change.
    examples:
      - 1
  created_at:
    type: string
    format: date-time
    description: When it was added.
    examples:
      - 2026-11-06T10:00:00Z
examples:
  - table_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0101
    location_id: 01a13a48-9e00-7000-8000-000000000301
    name: "12"
    seats: 4
    area: Terrace
    service: order
    code: T7Q2M9XK
    link: https://zippygo.local/t/T7Q2M9XK
    code_regenerated_at: null
    version: 1
    created_at: 2026-11-06T10:00:00Z
