# Path item for /v1/partners/{partner_id}/agents/{agent_id}/documents/{document_id}/files/{asset_id}/link. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
  - name: document_id
    in: path
    required: true
    description: The document, one of the Agent's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
  - name: asset_id
    in: path
    required: true
    description: One of the document's files.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9f01
get:
  operationId: linkAgentDocumentFile
  summary: Read an Agent's document file
  description: A ten-minute signed link to one of a document's files, minted now; every reading is recorded with the reader. Members need `agent:manage` for the service; Mission Control needs platform `agent:read`.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The link.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/assets/SignedLink.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent, the document or the file."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
