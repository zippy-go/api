type: object
description: A booking in a list.
required:
  - id
  - number
  - state
  - service_name
  - location
  - starts_at
  - ends_at
  - agent_first_name
  - total
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: The booking.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000b001
  number:
    type: string
    description: Its number.
    examples:
      - ZG-261107-0042
  state:
    $ref: ./BookingState.yaml
    description: Where it stands.
  service_name:
    type: string
    description: The service.
    examples:
      - AC service, split unit
  location:
    $ref: ./BookingLocation.yaml
    description: The Location.
  starts_at:
    type: string
    format: date-time
    description: The slot's start.
    examples:
      - 2026-11-07T10:00:00+05:30
  ends_at:
    type: string
    format: date-time
    description: When the job is expected to end.
    examples:
      - 2026-11-07T11:00:00+05:30
  agent_first_name:
    type:
      - string
      - "null"
    description: The Agent, once confirmed.
    examples:
      - Kiran
  total:
    $ref: ../common/Money.yaml
    description: The bill so far.
  created_at:
    type: string
    format: date-time
    description: When it was booked.
    examples:
      - 2026-11-05T19:38:00+05:30
examples:
  - id: 019a3d10-2b00-7d00-8a00-00000000b001
    number: ZG-261107-0042
    state: confirmed
    service_name: AC service, split unit
    location:
      location_id: 01a13a48-9e00-7000-8000-000000000306
      name: Madhapur Home Care
    starts_at: 2026-11-07T10:00:00+05:30
    ends_at: 2026-11-07T11:00:00+05:30
    agent_first_name: Kiran
    total:
      minor_units: 49900
      currency: INR
    created_at: 2026-11-05T19:38:00+05:30
