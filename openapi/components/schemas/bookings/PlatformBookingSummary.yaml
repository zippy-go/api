type: object
description: A booking in Mission Control's list.
required:
  - id
  - number
  - state
  - partner_id
  - location
  - service_name
  - starts_at
  - agent_first_name
  - not_answered
  - running_late
  - disputed
  - total
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: The booking.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000b001
  number:
    type: string
    description: Its number.
    examples:
      - ZG-261107-0042
  state:
    $ref: ./BookingState.yaml
    description: Where it stands.
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000007
  location:
    $ref: ./BookingLocation.yaml
    description: The Location.
  service_name:
    type: string
    description: The service.
    examples:
      - AC service, split unit
  starts_at:
    type: string
    format: date-time
    description: The slot's start.
    examples:
      - 2026-11-07T10:00:00+05:30
  agent_first_name:
    type:
      - string
      - "null"
    description: Its Agent.
    examples:
      - null
  not_answered:
    type: boolean
    description: Declined because the Location did not answer in time.
    examples:
      - false
  running_late:
    type: boolean
    description: No Agent arrived thirty minutes after the slot's end.
    examples:
      - false
  disputed:
    type: boolean
    description: The customer would not sign.
    examples:
      - false
  total:
    $ref: ../common/Money.yaml
    description: The bill so far.
  created_at:
    type: string
    format: date-time
    description: When it was booked.
    examples:
      - 2026-11-05T19:38:00+05:30
examples:
  - id: 019a3d10-2b00-7d00-8a00-00000000b001
    number: ZG-261107-0042
    state: confirmed
    partner_id: 01a13a48-9e00-7000-8000-000000000007
    location:
      location_id: 01a13a48-9e00-7000-8000-000000000306
      name: Madhapur Home Care
    service_name: AC service, split unit
    starts_at: 2026-11-07T10:00:00+05:30
    agent_first_name: null
    not_answered: false
    running_late: false
    disputed: false
    total:
      minor_units: 49900
      currency: INR
    created_at: 2026-11-05T19:38:00+05:30
