# Path item for /v1/auth/password/reset. Referenced from openapi.yaml.
post:
  operationId: resetPassword
  summary: Set a password through a link
  description: Sets a new password through a link, at the console it was asked from. Every session of the user ends; two-step sign-in still applies to the next sign-in. A refused password leaves the link unused.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    description: The token from the link, the console and the new password.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordReset.yaml
  responses:
    '204':
      description: Password set; sign in with it.
    '400':
      description: '`validation_failed` with `password_weak` on `/new_password`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '410':
      description: '`link_invalid`: expired, used, replaced, or asked at the other console.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
