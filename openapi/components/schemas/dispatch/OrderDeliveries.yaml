type: object
description: "An order's deliveries, newest first, and whether one can be asked for: an order accepted while its store named no Provider says so here, and becomes askable once one is configured."
required:
  - order_id
  - items
  - provider_configured
  - askable
  - note
properties:
  order_id:
    type: string
    format: uuid
    description: The order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  items:
    type: array
    items:
      $ref: ./DeliverySummary.yaml
    description: Its deliveries, newest first.
  provider_configured:
    type: boolean
    description: Whether the store names a Provider that can carry it now.
    examples:
      - true
  askable:
    type: boolean
    description: "Whether a delivery may be asked for now: the order is a delivery, accepted or ready, with no delivery under way, and a Provider is configured."
    examples:
      - false
  note:
    type:
      - string
      - "null"
    description: What the order page should say about it, in words.
    examples:
      - null
examples:
  - order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    items:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
        order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
        order_number: AB0042
        attempt: 1
        location_id: 01a13a48-9e00-7000-8000-000000000301
        location_name: Dev Kitchen Gachibowli
        partner_id: 01a13a48-9e00-7000-8000-000000000001
        state: assigned
        group: assigned
        provider:
          kind: platform_fleet
          partner_id: 01a13a48-9e00-7000-8000-000000000002
          service_id: 01a13a48-9e00-7000-8000-000000000202
          name: ZippyGo Fleet
        courier:
          agent_id: 01a13a48-9e00-7000-8000-000000000107
          first_name: Ravi
          phone: null
          provider_kind: platform_fleet
          named_at: 2026-10-16T13:12:30Z
        pickup_at: 2026-10-16T13:25:00Z
        drop_at: 2026-10-16T13:45:00Z
        release_at: null
        released: true
        expected_at: 2026-10-16T13:44:00Z
        late: false
        waiting_since: null
        raised: false
        need: null
        asks: 1
