# Path item for /v1/partners/{partner_id}/offers. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listPartnerOffers
  summary: List a Partner's offers
  description: "The Partner's own offers business-wide, newest first, with the counts of each group: Live now (live and paused), Scheduled, Drafts, Past promotions and Archived. The platform's campaigns on its Locations are listed apart (`GET /v1/partners/{partner_id}/campaigns`). `promotion:read` at a Location of the Partner; an offer on several Locations is listed when the member may read one of them."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: group
      in: query
      required: false
      description: "`live` (live and paused), `scheduled`, `draft`, `past` (ended and cancelled) or `archived`; every offer not archived when left out."
      schema:
        type: string
        enum:
          - live
          - scheduled
          - draft
          - past
          - archived
    - name: location_id
      in: query
      required: false
      description: Only offers running at this Location.
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of offers with the counts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Partner console or Mission Control token (`forbidden`), the member lacks the permission at the Location (`access_denied`), or the Partner's plan does not include promotions (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Partner, or the caller is not its member (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createPartnerOffer
  summary: Make an offer as a draft
  description: "Saves a draft offer on the Partner's own Locations, paid for by the Partner in full: one mechanic with its terms, what it is on, whom it is for, where and when, its conditions and limits. The answer is the draft read back with the line and small print the platform wrote, its overlaps and what it names, which the review shows. Terms that contradict the mechanic or each other are refused, naming the term. An offer that names items, gives an item free or is a bundle runs at one Location. `promotion:write` at each Location it names; another Partner's Location is not found."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/OfferInput.yaml
  responses:
    "201":
      description: The draft.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/Offer.yaml
    "400":
      description: "`validation_failed`, naming the term: `percent_out_of_range`, `multibuy_gives_too_many`, `tiers_not_rising`, `tiers_with_minimum`, `free_delivery_pickup_only`, `stamp_card_code`, `stamp_card_orders`, `n_for_price_count`, `bundle_sets`, `items_missing`, `one_location_only`, `window_invalid`, `windows_too_many`, `ends_before_start`, `aim_missing`; a name over 80 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Partner console or Mission Control token (`forbidden`), the member lacks the permission at the Location (`access_denied`), or the Partner's plan does not include promotions (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Partner, or a Location or item that is not the Partner's (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
