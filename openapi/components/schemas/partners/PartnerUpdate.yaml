type: object
description: |
  The request body of `PATCH /v1/partners/{partner_id}`. Only the members
  present are changed; `null` clears a member that may be `null` in the
  resource. Changing the profile and the legal identity needs
  `partner:profile:write` (platform staff `partner:write`); `status`,
  `kind` and `gst_unregistered` may only be changed by the platform
  realm.
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
    description: The new name the partner operates under.
    examples:
      - Example Partner
  legal_name:
    type:
      - string
      - 'null'
    maxLength: 200
    description: The new registered legal name, or `null` to clear it.
    examples:
      - Example Partner Ltd
  contact_email:
    type:
      - string
      - 'null'
    format: email
    description: The new contact email address, or `null` to clear it.
    examples:
      - contact@example.com
  contact_phone:
    type:
      - string
      - 'null'
    pattern: ^\+[1-9][0-9]{1,14}$
    description: The new contact phone number in E.164 format, or `null` to clear it.
    examples:
      - '+15555550101'
  status:
    $ref: ./PartnerStatus.yaml
    description: The new status. Platform realm only; any other caller receives `403` (`forbidden`).
  reason:
    type: string
    minLength: 1
    maxLength: 1000
    description: Why the status is changed, kept in the audit log with the entry for the change. Sent with `status`.
    examples:
      - Documents verified
  contacts:
    type:
      - array
      - 'null'
    items:
      $ref: ./Contact.yaml
    description: The contacts, replaced as a whole.
  description:
    type:
      - string
      - 'null'
    description: New description, or `null` to clear.
  gst_unregistered:
    type:
      - boolean
      - 'null'
    description: '`true` records the organisation as not registered for GST, so no GST registration is asked of it; platform realm only, with a `reason`.'
  gstin:
    type:
      - string
      - 'null'
    description: New GSTIN, or `null` to clear.
  kind:
    oneOf:
      - $ref: ./PartnerKind.yaml
      - type: 'null'
    description: New kind; platform realm only, with a `reason`. Locations, members, documents and settings are kept.
  pan:
    type:
      - string
      - 'null'
    description: New PAN, or `null` to clear.
  registered_address:
    oneOf:
      - $ref: ../common/Address.yaml
      - type: 'null'
    description: New registered address, or `null` to clear.
  registration_number:
    type:
      - string
      - 'null'
    description: New registration number, or `null` to clear.
examples:
  - name: Example Partner
    contact_phone: '+15555550101'
