# Path item for /v1/platform/reward-campaigns/{campaign_id}/grants. Referenced from openapi.yaml.
parameters:
  - name: campaign_id
    in: path
    required: true
    description: The reward campaign.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000006002
get:
  operationId: listRewardCampaignGrants
  summary: List a campaign's grants
  description: "The campaign's grants, newest first, with the budget they draw on: granted, deferred, held, refused and clawed back. Mission Control tokens only, with `engagement:read`."
  tags:
    - Rewards
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: Only grants in this state.
      schema:
        $ref: ../../components/schemas/engagement/RewardGrantStatus.yaml
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: Where the page starts.
      schema:
        type: string
  responses:
    "200":
      description: A page of grants with the budget.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardGrantPage.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` (the member lacks `engagement:read`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such campaign."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
