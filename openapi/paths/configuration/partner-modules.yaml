# Path item for /v1/partners/{partner_id}/modules. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartnerModules
  summary: Get the Partner's modules
  description: "The Partner's edition: its plan and every module of the catalogue with its state, why and who switched it on. The Partner console and the Partner app show a module's pages only while it is `enabled`, and read this again within a minute of `modules.changed` on the Partner's channel. Any member of the Partner; platform staff with `partner:read`."
  tags:
    - Configuration
  security:
    - Bearer: []
  responses:
    "200":
      description: The modules.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/PartnerModules.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner is not one the caller belongs to, or does not exist (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
