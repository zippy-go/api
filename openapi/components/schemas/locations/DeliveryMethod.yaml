type: object
description: Delivery as a store offers it, the `DeliveryMethod` schema.
required:
  - carrier
properties:
  carrier:
    $ref: ./Carrier.yaml
    description: Who carries the deliveries.
  zone:
    type:
      - array
      - 'null'
    items:
      type: array
      items:
        type: number
        format: double
    description: A delivery zone drawn as one ring of `[longitude, latitude]` points where a radius is the wrong shape; the resolved coverage radius applies without one. Switching delivery off discards it.
examples:
  - carrier: platform_fleet
    zone: null
