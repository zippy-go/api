type: object
description: "A Location's reservations: whether it takes them, the slots it opens every 30 minutes on its own clock from the first to the last, the largest party, how many days ahead and how many parties a slot takes. A Location never set takes none."
required:
  - location_id
  - enabled
  - first_slot
  - last_slot
  - max_party
  - days_ahead
  - parties_per_slot
  - time_zone
  - version
properties:
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  enabled:
    type: boolean
    description: Whether it takes reservations.
    examples:
      - true
  first_slot:
    type: string
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    description: The first slot's time on the Location's clock.
    examples:
      - 19:00
  last_slot:
    type: string
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    description: The last slot's time, at or after the first.
    examples:
      - 22:30
  max_party:
    type: integer
    minimum: 1
    maximum: 50
    description: The largest party, 1 to 50.
    examples:
      - 8
  days_ahead:
    type: integer
    minimum: 1
    maximum: 90
    description: How many days ahead a reservation may be made, 1 to 90.
    examples:
      - 30
  parties_per_slot:
    type:
      - integer
      - "null"
    minimum: 1
    description: How many parties a slot takes; `null` for no limit, staff fitting them in.
    examples:
      - null
  time_zone:
    type: string
    description: The Location's clock.
    examples:
      - Asia/Kolkata
  version:
    type: integer
    minimum: 1
    description: Raised by every change; the entity tag.
    examples:
      - 3
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000301
    enabled: true
    first_slot: 19:00
    last_slot: 22:30
    max_party: 8
    days_ahead: 30
    parties_per_slot: null
    time_zone: Asia/Kolkata
    version: 3
