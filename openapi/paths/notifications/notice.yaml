# Path item for /v1/platform/notices/{notice_id}. Referenced from openapi.yaml.
parameters:
  - name: notice_id
    in: path
    required: true
    description: 'The notice.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
get:
  operationId: getNotice
  summary: Read a notice as sent
  description: |
    A notice with every Location it reached and, for each, when it was stored, first seen and cleared, or not yet seen. `notice:send`.
  tags:
    - Notices
  security:
    - Bearer: []
  responses:
    '200':
      description: 'The notice and its Locations.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticeDetail.yaml
    '400':
      description: '`validation_failed`: a malformed notice id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not a Mission Control token (`forbidden`), or `notice:send` is not held (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'No such notice (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
