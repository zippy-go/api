type: object
description: A quantity of one of the plan's items.
required:
  - variant_id
  - quantity
properties:
  variant_id:
    type: string
    format: uuid
    description: The variant, one of the plan's.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
  quantity:
    type: integer
    minimum: 0
    maximum: 20
    description: How many, within the plan's range; 0 on a day leaves it out.
    examples:
      - 2
examples:
  - variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
    quantity: 2
