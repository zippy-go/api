type: object
description: A page of the Locations an offer reaches today, with how many in all.
required:
  - items
  - next_cursor
  - total
  - applies
properties:
  items:
    type: array
    items:
      $ref: ./OfferReachLocation.yaml
    description: The Locations on this page.
  next_cursor:
    type:
      - string
      - "null"
    description: An opaque cursor for the next page, or `null` on the last.
    examples:
      - null
  total:
    type: integer
    description: How many it reaches.
    examples:
      - 2
  applies:
    type: integer
    description: "How many it applies at: included or accepted."
    examples:
      - 1
examples:
  - items:
      - location_id: 01a13a48-9e00-7000-8000-000000000301
        name: Dev Kitchen Gachibowli
        partner_id: 01a13a48-9e00-7000-8000-000000000001
        partner_name: ZippyGo Dev Partner
        status: accepted
    next_cursor: null
    total: 2
    applies: 1
