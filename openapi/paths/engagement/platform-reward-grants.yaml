# Path item for /v1/platform/reward-grants. Referenced from openapi.yaml.
get:
  operationId: listPlatformRewardGrants
  summary: List rewards granted and held
  description: Grants across every campaign, newest first; with `status=held`, the rewards held for review oldest first, each with the signals that held it, such as "3 accounts on one device". Mission Control tokens only, with `engagement:read`.
  tags:
    - Rewards
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: Only grants in this state.
      schema:
        $ref: ../../components/schemas/engagement/RewardGrantStatus.yaml
    - name: campaign_id
      in: query
      required: false
      description: Only this campaign's.
      schema:
        type: string
        format: uuid
    - name: customer_id
      in: query
      required: false
      description: Only this customer's.
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: Where the page starts.
      schema:
        type: string
  responses:
    "200":
      description: A page of grants.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardGrantPage.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` (the member lacks `engagement:read`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
