# Path item for /v1/partners/{partner_id}/locations/{location_id}/kitchen/tickets/{ticket_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: ticket_id
    in: path
    required: true
    description: The ticket, of the Location in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8001
get:
  operationId: getKitchenTicket
  summary: Read a ticket
  description: One ticket of the Location as it stands, bumped or withdrawn ones included, with every mark made on it and what became of each. `order:read` at the Location.
  tags:
    - Kitchen
  security:
    - Bearer: []
  responses:
    "200":
      description: The ticket.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/kitchen/KitchenTicket.yaml
    "400":
      description: "`validation_failed`: a malformed identifier."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:read` at the Location), `not_enabled_for_partner`, or `forbidden` for a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such Partner, Location or ticket for the caller."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
