# Path item for /v1/partners/{partner_id}/locations/{location_id}/reservations/{reservation_id}/seat. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, one of the Partner's.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: reservation_id
    in: path
    required: true
    description: The reservation.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d1101
post:
  operationId: seatReservation
  summary: Seat a party
  description: "Seats a booked party at a table: `reservations.reservation.seated` names the table, and ordering binds the table's open tab, or the next opened there within an hour, to the reservation with the party's name. Seating at the same table again answers the same. Members need `reservation:manage` at the Location. Audited."
  tags:
    - Reservations
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The table.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reservations/ReservationSeatInput.yaml
  responses:
    "200":
      description: The reservation, seated.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reservations/LocationReservation.yaml
    "400":
      description: "`validation_failed`; `malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without `reservation:manage` at the Location."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Partner, the Location, the reservation, or a table that is not the Location's."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`conflict`: cancelled, marked a no-show, or seated at another table."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
