type: object
description: The Agents numbers over a range of at most 92 days, month to date unless chosen, with everyone's totals and how many are online; searchable by name or mobile number and filterable by team.
required:
  - from
  - until
  - time_zone
  - current_to
  - totals
  - items
  - next_cursor
properties:
  from:
    type: string
    format: date
    description: The first day.
    examples:
      - 2026-10-01
  until:
    type: string
    format: date
    description: The last day, included.
    examples:
      - 2026-10-22
  time_zone:
    type: string
    description: The clock the days are read on.
    examples:
      - Asia/Kolkata
  current_to:
    type: string
    format: date-time
    description: The moment the warehouse's data is current to.
    examples:
      - 2026-10-22T08:00:00Z
  totals:
    $ref: ./AgentNumbersTotals.yaml
    description: Everyone's totals.
  items:
    type: array
    items:
      $ref: ./AgentNumbers.yaml
      description: An Agent.
    description: The Agents on this page, the most deliveries first.
  next_cursor:
    type:
      - string
      - "null"
    description: An opaque cursor for the next page, or `null` on the last.
    examples:
      - null
examples:
  - from: 2026-10-01
    until: 2026-10-22
    time_zone: Asia/Kolkata
    current_to: 2026-10-22T08:00:00Z
    totals:
      agents: 20
      online: 8
      deliveries: 41
      average_minutes_to_door: 26.1
      average_km: 3.8
      minutes_on_duty: 3600
      deliveries_per_hour: 0.68
      offers_made: 60
      offers_accepted_share: 0.7
      on_time_share: 0.9
      failed_drops: 1
      geofence_overrides: 2
      tips:
        minor_units: 31000
        currency: INR
      earnings:
        minor_units: 250000
        currency: INR
    items:
      - agent_id: 01a13a48-9e00-7000-8000-000000000107
        name: Ravi Kumar
        partner_id: 01a13a48-9e00-7000-8000-000000000002
        partner_name: ZippyGo Fleet
        service_id: 01a13a48-9e00-7000-8000-000000000202
        service_name: ZippyGo Fleet delivery
        team_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5601
        team_name: Hyderabad
        status: active
        online: true
        deliveries: 2
        average_minutes_to_door: 24.5
        average_km: 3.4
        minutes_on_duty: 180
        deliveries_per_hour: 0.67
        rating:
          thumbs_up: 4
          count: 5
          share: 0.8
        offers_made: 3
        offers_accepted_share: 0.67
        on_time_share: 1
        failed_drops: 0
        geofence_overrides: 0
        tips:
          minor_units: 2000
          currency: INR
        earnings:
          minor_units: 12320
          currency: INR
    next_cursor: null
