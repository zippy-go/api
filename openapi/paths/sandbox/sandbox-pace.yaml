# Path item for /v1/sandbox/pace. Referenced from openapi.yaml.
get:
  operationId: getSandboxPace
  summary: Read the key's pace
  description: "How the calling sandbox key's orders and deliveries move by themselves; the defaults until the key sets its own. A sandbox key only."
  tags: &a2
    - Sandbox
  security: &a3
    - ApiKey: []
  responses:
    "200":
      description: The pace.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/sandbox/SandboxPace.yaml
    "401":
      description: "No sandbox key was sent, or it was refused (`unauthenticated`)."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`sandbox_key_required`: a production key, or a token; the sandbox's operations take a sandbox key (`zg_test_`) only."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
put:
  operationId: setSandboxPace
  summary: Set the key's pace
  description: "Replaces the calling sandbox key's pace; what is already on its way keeps the moments it was given, and each next move takes the new pace. A sandbox key only."
  tags: *a2
  security: *a3
  requestBody:
    required: true
    description: The pace.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/sandbox/SandboxPaceInput.yaml
  responses:
    "200":
      description: The pace, set.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/sandbox/SandboxPace.yaml
    "400":
      description: "`validation_failed`: a number of seconds out of range."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: "No sandbox key was sent, or it was refused (`unauthenticated`)."
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`sandbox_key_required`: a production key, or a token; the sandbox's operations take a sandbox key (`zg_test_`) only."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
