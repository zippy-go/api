# Path item for /v1/platform/bundles/{bundle_id}/stop. Referenced from openapi.yaml.
parameters:
  - name: bundle_id
    in: path
    required: true
    description: The bundle.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8401
post:
  operationId: stopPlatformBundle
  summary: Stop a bundle
  description: "Stops a bundle, a draft too: it leaves every page and its offers end; orders already placed keep them. Doing it again answers the same. Needs the platform's `promotion:write`. Audited."
  tags:
    - Bundles
  security:
    - Bearer: []
  responses:
    "200":
      description: The bundle.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/Bundle.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without the platform's `promotion:write`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
