{
  "type": "object",
  "description": "Where a Location appears on the storefront, each placement with the rule that placed it.",
  "required": [
    "location_id",
    "placements",
    "rules_url",
    "computed_at"
  ],
  "properties": {
    "location_id": {
      "type": "string",
      "description": "The store.",
      "format": "uuid",
      "examples": [
        "01a13a48-9e00-7000-8000-000000000301"
      ]
    },
    "placements": {
      "type": "array",
      "items": {
        "$ref": "./ListingPlacement.yaml"
      },
      "description": "Its placements, one per listing."
    },
    "rules_url": {
      "type": "string",
      "description": "The published ranking rules.",
      "examples": [
        "http://localhost:3010/ranking"
      ]
    },
    "computed_at": {
      "type": "string",
      "description": "When it was read.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    }
  },
  "examples": [
    {
      "location_id": "01a13a48-9e00-7000-8000-000000000301",
      "placements": [
        {
          "listing": "vertical",
          "vertical": "food",
          "zone_id": "01a13a48-9e00-7000-8000-000000000101",
          "zone_name": "Gachibowli",
          "position": 2,
          "of": 14,
          "rule": "open_now_then_nearest",
          "rule_words": "Open stores first, then those opening later, then those offline; within each, nearest first, then by name.",
          "figures": {
            "state": "open",
            "distance_metres": 1200,
            "rating": 92,
            "ratings": 120,
            "offers": 1
          },
          "sponsored": false
        }
      ],
      "rules_url": "http://localhost:3010/ranking",
      "computed_at": "2026-11-02T10:15:00Z"
    }
  ]
}
