type: object
description: A change of a table; absent members keep what is stored.
properties:
  name:
    type: string
    minLength: 1
    maxLength: 20
    description: A new name, unique at the Location.
    examples:
      - 12A
  seats:
    type: integer
    minimum: 1
    maximum: 40
    description: How many it seats.
    examples:
      - 6
  area:
    type:
      - string
      - "null"
    maxLength: 40
    description: The area; `null` clears it.
    examples:
      - Terrace
  service:
    oneOf:
      - $ref: ./DineInService.yaml
      - type: "null"
    description: How it is served; `null` follows the Location again.
examples:
  - name: 12A
    seats: 6
    area: Terrace
    service: null
