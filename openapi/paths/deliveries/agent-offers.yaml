# Path item for /v1/agent/offers. Referenced from openapi.yaml.
get:
  operationId: listAgentOffers
  summary: List the Agent's offers
  description: "The calling Agent's offers: the open ones first, soonest to expire first, each with the stops by area, the planned times, the distance, the pay with its breakdown and rule, cash to collect and what is carried; then those answered or closed in the last hour. A new offer is announced as `offer.changed` on the Agent's task channel (`private-agent-{agent_id}-tasks`) and pushed to the Agent's devices. An Agent app token (audience `agent`), for the calling person's own Agent memberships; locally and in the sandbox the simulator's service token too, for Agents without a user, naming the Agent in `agent_id`."
  tags:
    - Deliveries
  security:
    - Bearer: []
  parameters:
    - name: agent_id
      in: query
      required: false
      description: The Agent membership to list; required with the simulator's service token, optional otherwise (every membership of the caller).
      schema:
        type: string
        format: uuid
      example: 01a13a48-9e00-7000-8000-000000000107
  responses:
    "200":
      description: The offers.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/AgentOfferList.yaml
    "400":
      description: "`malformed_identifier` for an `agent_id` that is not a UUID."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: not an Agent app token, or the service token of another job, or outside local and the sandbox."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: an `agent_id` that is not one of the caller's memberships, or not an Agent without a user for the simulator."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
