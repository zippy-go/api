# Path item for /v1/customer/offers/codes. Referenced from openapi.yaml.
post:
  operationId: addCustomerOfferCode
  summary: Add a code to the account
  description: "Adds a code to the customer's offers, matched in any case with spaces and punctuation ignored: its offer joins their offers until it ends, one that has not started held and shown with its start. A single-use code belongs to the first customer who adds it. A code that cannot be added is answered in words. After ten codes not recognised in ten minutes the customer is asked to wait until a time, and the eleventh is not checked. Customer tokens only."
  tags:
    - Promotions
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/CodeEntry.yaml
  responses:
    "201":
      description: The offer the code opened.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/CodeAdded.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A token of another surface (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "422":
      description: "The code cannot be added, in words: `code_not_recognised` \"We don't recognise that code\", `code_ended` \"That code has ended\", `code_for_new_customers` \"That code is for new customers\", `code_already_used` \"That code has already been used\", `code_already_added` \"You've already added that code\", `code_not_for_account` \"That code can't be used on this account\"."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "429":
      description: "`code_guesses`: ten codes not recognised in ten minutes; `Retry-After` and the sentence say until when."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
