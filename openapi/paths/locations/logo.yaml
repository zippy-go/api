# Path item for /v1/partners/{partner_id}/locations/{location_id}/logo. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The location, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
put:
  operationId: putLocationLogo
  summary: Set or clear a location's tile
  description: "Applies the Location's tile as soon as it is stored, or removes it with `null`: a confirmed `location_logo` asset, square. `location:write` at the Location."
  tags:
    - Locations
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/partners/PictureUpdate.yaml
  responses:
    '200':
      description: The Location with its tile.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/Location.yaml
    '400':
      description: Malformed body, or a picture that is not square.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `location:write` at this Location (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or location.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`asset_not_usable`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
