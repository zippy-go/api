type: object
description: "A card or UPI ID the customer saved, as checkout offers it to pay with: placing names it in `saved_method_id`."
required:
  - id
  - label
  - is_default
  - usable
properties:
  id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c41
    description: The saved method, as `GET /v1/customer/payment-methods` lists it.
  label:
    type: string
    examples:
      - Visa •••• 4242
    description: "How it reads: a card's brand and last four, or a UPI ID's handle."
  is_default:
    type: boolean
    examples:
      - true
    description: Checkout chooses it first.
  usable:
    type: boolean
    examples:
      - true
    description: "Whether it can pay now: a card past its month cannot."
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c41
    label: Visa •••• 4242
    is_default: true
    usable: true
