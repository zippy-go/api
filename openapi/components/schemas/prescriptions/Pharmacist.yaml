type: object
description: "The registered pharmacist named on a pharmacy Location, the `Pharmacist` schema."
required:
  - membership_id
  - name
  - registration_number
  - council
properties:
  membership_id:
    type: string
    format: uuid
    description: "Their membership of the Partner."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4be001"
  name:
    type: string
    description: "Their name."
    examples:
      - "Lakshmi Reddy"
  registration_number:
    type: string
    description: "Their registration number, as typed; not checked against a council's register."
    examples:
      - "TSPC/2019/04521"
  council:
    type: string
    description: "The state pharmacy council they are registered with."
    examples:
      - "Telangana State Pharmacy Council"
examples:
  - {"membership_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4be001", "name": "Lakshmi Reddy", "registration_number": "TSPC/2019/04521", "council": "Telangana State Pharmacy Council"}
