# Path item for /v1/platform/statements/{statement_id}/archive. Referenced from openapi.yaml.
parameters:
  - name: statement_id
    in: path
    required: true
    description: The statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
post:
  operationId: archiveStatement
  summary: Archive a Location's statement
  description: Archives a due or unpaid statement. Written into its history and the audit log. `payout:manage`.
  tags:
    - Payouts
  security:
    - Bearer: []
  requestBody:
    required: false
    description: Why, optionally.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/StatementArchiveInput.yaml
  responses:
    "200":
      description: The statement after the move.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/Statement.yaml
    "400":
      description: "`validation_failed`: a reason over 200 characters, or `idempotency_key_missing`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:manage` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such statement (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`statement_move_refused`: the move is not allowed from the statement's state, or nothing is there to pay, or its destination is not checked; the detail says why in words."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
