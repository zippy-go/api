# Path item for /v1/partners/{partner_id}/payout-account. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPayoutAccount
  summary: Get the payout account
  description: "The payout account, every number masked to its last four digits, with its one-rupee check's state and reason (since contract 0.19.0); members and platform staff."
  tags:
    - Payout accounts
  security:
    - Bearer: []
  responses:
    '200':
      description: The account, masked.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/PayoutAccount.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Platform staff without `partner:read` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner, or no account stated yet.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putPayoutAccount
  summary: State the payout account
  description: "States or changes the payout account: it is unverified again after every write, and the masked number sent back unchanged keeps the account. Since contract 0.19.0 every write is checked by the payout provider: it sends ₹1.00, which stays with the holder, and compares the name the bank returns with the Partner's legal name; a match verifies the account, so a statement held for the check is due at once; a different name or a failed transfer fails the check with the reason (\"The account is not in your legal name\"), the Partner is told and its statements stay held. A change of an existing account holds payouts for at least 48 hours whatever verifies it (`payouts_held_until`, the statements' `account_changed` hold), while a first account is not a change and waits for its check alone. `partner:profile:write`, or platform staff with `partner:write`."
  tags:
    - Payout accounts
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/PayoutAccountUpdate.yaml
  responses:
    '200':
      description: The account as saved, masked and unverified, its check `checking`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/PayoutAccount.yaml
    '400':
      description: Malformed body or invalid fields (`ifsc_invalid`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `partner:profile:write` (`access_denied`; platform staff need `partner:write`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
