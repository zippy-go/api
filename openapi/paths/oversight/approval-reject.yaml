# Path item for /v1/platform/approvals/{approval_id}/reject. Referenced from openapi.yaml.
parameters:
  - name: approval_id
    in: path
    required: true
    description: The proposal.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
post:
  operationId: rejectApproval
  summary: Reject a proposal
  description: Rejects a proposal; `approval:decide`.
  tags:
    - Oversight
  security:
    - Bearer: []
  requestBody:
    required: false
    description: Optionally, why.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/oversight/ApprovalDecision.yaml
  responses:
    '200':
      description: Rejected.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/Approval.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown proposal.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`approval_decided`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '410':
      description: '`approval_expired`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
