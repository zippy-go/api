type: object
description: |
  A public key in JSON Web Key format (RFC 7517), as published by
  `GET /.well-known/jwks.json`. ZippyGo signs access tokens with Ed25519,
  so every key is an octet key pair (`OKP`) on the `Ed25519` curve used
  with the `EdDSA` algorithm (RFC 8037).
required:
  - kty
  - crv
  - kid
  - x
  - use
  - alg
properties:
  kty:
    type: string
    const: OKP
    description: The key type, always `OKP` (octet key pair).
    examples:
      - OKP
  crv:
    type: string
    const: Ed25519
    description: The curve, always `Ed25519`.
    examples:
      - Ed25519
  kid:
    type: string
    minLength: 1
    description: The key identifier. The header of every access token names the key that signed it in `kid`.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a50
  x:
    type: string
    minLength: 43
    maxLength: 43
    description: The 32-byte public key, base64url encoded without padding.
    examples:
      - 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
  use:
    type: string
    const: sig
    description: The intended use, always `sig` (signature verification).
    examples:
      - sig
  alg:
    type: string
    const: EdDSA
    description: The algorithm the key is used with, always `EdDSA`.
    examples:
      - EdDSA
examples:
  - kty: OKP
    crv: Ed25519
    kid: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a50
    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
    use: sig
    alg: EdDSA
