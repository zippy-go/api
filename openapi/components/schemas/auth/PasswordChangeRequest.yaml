type: object
description: |
  The request body of `POST /v1/auth/password`. The new password must be at
  least 12 characters long; a shorter one is rejected with
  `validation_failed` and the detail code `password_weak`.
required:
  - new_password
properties:
  current_password:
    type:
      - string
      - 'null'
    description: The current password. Send `null`, or omit the field, when the user has no password yet, as after signing up with a one-time code; when a password is set it must match.
    examples:
      - previous-passphrase-2025
  new_password:
    type: string
    minLength: 12
    description: The new password, at least 12 characters.
    examples:
      - example-passphrase-2026
examples:
  - current_password: null
    new_password: example-passphrase-2026
