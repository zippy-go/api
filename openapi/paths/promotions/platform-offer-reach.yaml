# Path item for /v1/platform/offers/{offer_id}/reach. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
get:
  operationId: listOfferReach
  summary: List the Locations an offer reaches
  description: The Locations the offer reaches today, worked out by the rule it is priced with, each with its answer to a campaign, and how many in all. `promotion:read`.
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of Locations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferReachPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such offer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
