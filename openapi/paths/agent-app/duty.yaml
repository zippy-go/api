# Path item for /v1/agent/memberships/{agent_id}/duty. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: getAgentDuty
  summary: Read the Agent's duty
  description: Whether the Agent is on duty, in which zone and since when, and whether they may go on duty now with the reasons in words when not. A stretch closed for silence since the app last opened is told once. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one.
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: The duty.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDuty.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: setAgentDuty
  summary: Go on duty or off duty
  description: The duty switch. Going on duty opens a stretch in the zone chosen; it is refused, with the reason in words, when the membership is not active, when a required document has expired, or when the person is on duty in another membership. Going off duty closes the stretch; it is refused while a delivery is under way. A location report alone never changes duty, and a stretch nothing is heard on for 30 minutes is closed at the last report. Switching to what already is answers the duty unchanged. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one.
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: On or off, and the zone.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentDutyUpdate.yaml
  responses:
    "200":
      description: The duty after the switch.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDuty.yaml
    "400":
      description: "`validation_failed`: no zone to go on duty in, or a zone that is not a serving zone."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`duty_refused` with the blockers in `errors` (`duty_not_active`, `duty_document_expired`, `duty_elsewhere`, and since 0.27.0 `duty_no_shift`), or `tasks_under_way` going off duty with a delivery under way."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
