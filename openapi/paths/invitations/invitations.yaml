# Path item for /v1/partners/{partner_id}/invitations. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
post:
  operationId: createInvitation
  summary: Invite a user
  description: |
    Creates an invitation to join the partner with a role, at the whole
    partner or at the Locations and Services named, and sends an email to
    the address with a link that accepts it. Inviting needs `staff:write`,
    and nobody hands out a role holding more than they hold: such a role
    answers `403` (`permission_escalation`). The owner role covers the whole
    partner (`invalid_scope` with places); a place of another partner
    answers `409` (`cross_tenant_scope`). An address that already belongs
    to a member, or that has a pending invitation for this partner, answers
    `409` (`conflict`). Publishes `identity.invitation.sent`.
  tags:
    - Invitations
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The email address to invite and the role to grant.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/invitations/InvitationCreate.yaml
  responses:
    '201':
      description: The invitation was created and the email is being sent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invitations/Invitation.yaml
    '400':
      description: The body failed validation (`validation_failed`), for example an `email` that is not an email address, no role, or `custom` as `role`; or the scope has the wrong shape for the role (`invalid_scope`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `staff:write` (`access_denied`), or the role holds a permission the caller does not hold (`permission_escalation`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The email address already belongs to a member of the partner, or a pending invitation for it exists (`conflict`); or a Location or Service of another partner was named (`cross_tenant_scope`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
get:
  operationId: listInvitations
  summary: List invitations
  description: |
    Returns the partner's invitations in every status, newest first.
    Reading them needs `staff:read`, because invitations carry email
    addresses; other members receive `403` (`access_denied`).
    The list is not paginated.
  tags:
    - Invitations
  security:
    - Bearer: []
  responses:
    '200':
      description: The partner's invitations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invitations/InvitationList.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `staff:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
