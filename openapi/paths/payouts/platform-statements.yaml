# Path item for /v1/platform/statements. Referenced from openapi.yaml.
get:
  operationId: listStatements
  summary: List Locations' statements
  description: "Every Location's statements, newest week first: narrowed by state, week, Partner, Location, those held, and those with unanswered questions. `payout:read`."
  tags:
    - Payouts
  security:
    - Bearer: []
  parameters:
    - name: state
      in: query
      required: false
      description: Only statements in this state.
      schema:
        $ref: ../../components/schemas/payouts/StatementState.yaml
    - name: week
      in: query
      required: false
      description: Only this week, `YYYYWww`.
      schema:
        type: string
        pattern: ^[0-9]{4}W[0-9]{2}$
    - $ref: ../../components/parameters/PartnerIdQuery.yaml
    - name: location_id
      in: query
      required: false
      description: Only this Location's.
      schema:
        type: string
        format: uuid
    - name: held
      in: query
      required: false
      description: "`true` for due statements something holds."
      schema:
        type: boolean
    - name: unanswered
      in: query
      required: false
      description: "`true` for statements with unanswered questions."
      schema:
        type: boolean
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of statements.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/StatementPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
