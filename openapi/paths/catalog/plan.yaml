# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/plans/{plan_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000307
  - name: plan_id
    in: path
    required: true
    description: The plan, of the store in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7001
get:
  operationId: getSubscriptionPlan
  summary: Read a plan
  description: One plan of the store. `catalog:read` at the Location.
  tags:
    - Catalog
  security:
    - Bearer: []
  responses:
    "200":
      description: The plan.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/SubscriptionPlan.yaml
    "400":
      description: "`validation_failed`: a malformed identifier."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `catalog:read` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location or the plan."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
patch:
  operationId: updateSubscriptionPlan
  summary: Change a plan
  description: Changes a plan. A changed price of an item is announced to every subscriber at once (`subscriptions.price.announced`) and applies to them from seven days after; deliveries until then, and those already generated, keep the price they had. Written to the audit log. `catalog:write` at the Location.
  tags:
    - Catalog
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What changes.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/SubscriptionPlanUpdate.yaml
  responses:
    "200":
      description: The plan after the change.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/SubscriptionPlan.yaml
    "400":
      description: "`validation_failed`: a member out of range."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `catalog:write` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location or the plan."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`plan_withdrawn`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
delete:
  operationId: deleteSubscriptionPlan
  summary: Delete a plan
  description: Deletes a plan nobody ever subscribed to; one with subscriptions is withdrawn instead (`plan_has_subscriptions`). `catalog:write` at the Location.
  tags:
    - Catalog
  security:
    - Bearer: []
  responses:
    "204":
      description: Deleted.
    "400":
      description: "`validation_failed`: a malformed identifier."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `catalog:write` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location or the plan."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`plan_has_subscriptions`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
