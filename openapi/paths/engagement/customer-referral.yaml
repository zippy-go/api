# Path item for /v1/customer/referral. Referenced from openapi.yaml.
get:
  operationId: getCustomerReferral
  summary: Read the customer's referral code
  description: The customer's referral code with a message to share, what a friend gets, what the customer earns, at most 20 times a month, and their referrals so far. The code lives in promotions' registry, where a friend adds it. Customer tokens only.
  tags:
    - Rewards
  security:
    - Bearer: []
  responses:
    "200":
      description: Their referral code.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/CustomerReferral.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the user has no customer profile."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
