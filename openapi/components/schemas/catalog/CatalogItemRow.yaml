type: object
description: "An item as a row of the catalogue's list and tree: what a member sees and changes without opening it."
required:
  - id
  - name
  - status
  - listed
  - food_mark
  - picture
  - from_price
  - price_varies
  - single_variant_id
  - offer_price
  - variant_count
  - stock
  - sellable
  - category_ids
  - modifiers
  - answer_of
  - brand_id
  - has_picture
  - updated_at
  - version
  - course
  - station_ids
properties:
  id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
  name:
    $ref: ./LocalizedText.yaml
    description: Its name.
  status:
    $ref: ./CatalogItemStatus.yaml
    description: On sale or off sale.
  listed:
    type: boolean
    description: On the menu in its own right.
  food_mark:
    oneOf:
      - $ref: ./FoodMark.yaml
      - type: "null"
    description: Its mark.
  picture:
    oneOf:
      - $ref: ./CataloguePicture.yaml
      - type: "null"
    description: Its card picture.
  from_price:
    $ref: ../common/Money.yaml
    description: The least an enabled variant costs, before offers.
  price_varies:
    type: boolean
    description: Its variants cost different amounts, so the price reads "from" and opens the item.
  single_variant_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its one variant, when it has one, so its price is changed where it is read.
    examples:
      - null
  offer_price:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: The one variant's offer price.
  variant_count:
    type: integer
    description: How many variants it has.
    examples:
      - 2
  stock:
    $ref: ./ItemStockSummary.yaml
    description: Its stock across its enabled variants.
  sellable:
    type: boolean
    description: A customer can order it now.
  category_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The categories it sits on.
  modifiers:
    type: array
    items:
      type: string
      format: uuid
    description: The questions it asks, in order.
  answer_of:
    type: array
    items:
      type: string
      format: uuid
    description: The questions offering it.
  brand_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its brand.
    examples:
      - null
  has_picture:
    type: boolean
    description: It has a picture.
  updated_at:
    type: string
    format: date-time
    description: When it last changed.
    examples:
      - 2026-10-15T09:00:00Z
  version:
    type: integer
    description: Its version.
    examples:
      - 3
  course:
    $ref: ./ItemCourse.yaml
    description: The course it is served in on the kitchen display; `none` when not set.
  station_ids:
    type: array
    items:
      type: string
      format: uuid
    maxItems: 12
    description: The kitchen stations it shows at, of its Location; empty for every station.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    name:
      en: Hyderabadi Biryani
      te: హైదరాబాదీ బిర్యానీ
    status: active
    listed: true
    food_mark: non_veg
    picture:
      asset_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc501
      thumb: /v1/assets/0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc501/renditions/thumb
      card: /v1/assets/0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc501/renditions/card
      hero: /v1/assets/0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc501/renditions/hero
    from_price:
      minor_units: 24900
      currency: INR
    price_varies: true
    single_variant_id: null
    offer_price: null
    variant_count: 2
    stock: in_stock
    sellable: true
    category_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc001
    modifiers:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
    answer_of: []
    brand_id: null
    has_picture: true
    updated_at: 2026-10-15T09:00:00Z
    version: 3
    course: mains
    station_ids: []
