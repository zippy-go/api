# Path item for /v1/agent/tasks/{task_id}/proof. Referenced from openapi.yaml.
parameters:
  - name: task_id
    in: path
    required: true
    description: "The task: one stop of a trip, held by the Agent."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
get:
  operationId: getOwnTaskProof
  summary: Read a task's proof
  description: The proof recorded on one of the Agent's drops, with links to its files. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one.
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: The proof.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ProofOfDelivery.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such task of the caller's memberships."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
