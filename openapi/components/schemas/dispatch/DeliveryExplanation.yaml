type: object
description: "Why a delivery went to whom: the strategy, how many Agents were considered and how many could take it, who was chosen and why, their time to the store at the time, the pay and its rule, every fallback, and for a choice by hand who made it and when. The Partner and Mission Control read all of it; the Agent reads the pay; the customer none."
required:
  - strategy
  - mode
  - by_hand
  - considered
  - eligible
  - chosen
  - why
  - pay
  - fallbacks
  - candidates
properties:
  strategy:
    oneOf:
      - $ref: ./DispatchStrategy.yaml
      - type: "null"
    description: The strategy that chose; `null` for a choice by hand or before any choice.
  mode:
    oneOf:
      - $ref: ./DispatchMode.yaml
      - type: "null"
    description: Offered or given directly.
  by_hand:
    oneOf:
      - $ref: ./HandChoice.yaml
      - type: "null"
    description: Who chose by hand, when one did.
  considered:
    type: integer
    description: How many Agents were considered.
    examples:
      - 4
    minimum: 0
  eligible:
    type: integer
    description: How many of them could take it.
    examples:
      - 3
    minimum: 0
  chosen:
    oneOf:
      - $ref: ./ExplainedCandidate.yaml
      - type: "null"
    description: The Agent chosen, when one was.
  why:
    type:
      - string
      - "null"
    description: Why the chosen one was chosen, in words.
    examples:
      - "Nearest by road: 3 minutes from the store."
  pay:
    oneOf:
      - $ref: ./DeliveryPay.yaml
      - type: "null"
    description: The pay of the chosen Agent, with its rule.
  fallbacks:
    type: array
    items:
      $ref: ./DeliveryFallback.yaml
    description: Every move to another Provider, oldest first.
  candidates:
    type: array
    items:
      $ref: ./ExplainedCandidate.yaml
    description: The Agents considered last, eligible ones in the order offered, then the others with why not.
examples:
  - strategy: nearest_available
    mode: offers
    by_hand: null
    considered: 4
    eligible: 3
    chosen: &a1
      agent_id: 01a13a48-9e00-7000-8000-000000000107
      first_name: Ravi
      rank: 1
      eta_seconds: 180
      distance_metres: 900
      eligible: true
      reason: null
    why: "Nearest by road: 3 minutes from the store."
    pay:
      rule_version: 1
      total:
        minor_units: 4920
        currency: INR
      lines:
        - label: Pickup
          amount:
            minor_units: 0
            currency: INR
        - label: Drop
          amount:
            minor_units: 3000
            currency: INR
        - label: 3.2 km at ₹6.00 a km
          amount:
            minor_units: 1920
            currency: INR
    fallbacks: []
    candidates:
      - *a1
