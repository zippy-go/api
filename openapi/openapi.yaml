components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Server-to-server authentication with a partner-scoped API key sent
        in the `X-Api-Key` header. Keys are issued per partner and can be
        revoked at any time.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token issued by ZippyGo, sent as
        `Authorization: Bearer <token>`. Access tokens are JSON Web Tokens
        typed `at+jwt`, signed with EdDSA (Ed25519), valid for 15 minutes
        and issued for one surface, their `aud`. People obtain them from the
        sign-in operations under the `Auth` tag and renew them with
        `POST /v1/auth/refresh`; background jobs mint service tokens (`aud`
        `service`, at most an hour) at `POST /v1/auth/service-tokens`, which
        every operation for people refuses. Their claims are documented on
        the `Auth` tag and the signing keys are published at
        `GET /.well-known/jwks.json`.

