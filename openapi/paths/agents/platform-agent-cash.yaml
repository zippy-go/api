# Path item for /v1/platform/agent-cash. Referenced from openapi.yaml.
get:
  operationId: listPlatformAgentCash
  summary: "List Agents' cash"
  description: "Mission Control's Finance › Agent cash: every Agent holding cash or depositing it, those holding most first, with what each deposited in 30 days and the deposits the night's reconciliation has not matched. `ledger:read`."
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: "One Partner's Agents."
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: "1 to 100."
      schema:
        type: integer
    - name: cursor
      in: query
      required: false
      description: "The next page."
      schema:
        type: string
  responses:
    "200":
      description: "The Agents."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentCashList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
