type: object
description: "A store's scheduled orders not yet sent to it, by slot: a page of the orders soonest slot first, and how many wait in each slot of the days asked."
required:
  - location_id
  - items
  - slots
  - next_cursor
properties:
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 01a13a48-9e00-7000-8000-000000000307
  items:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: The orders, soonest slot first, then in the order they were placed.
  slots:
    type: array
    items:
      $ref: ./ScheduledSlotCount.yaml
    description: How many wait in each slot, soonest first.
  next_cursor:
    type:
      - string
      - "null"
    description: The cursor of the next page; `null` on the last.
    examples:
      - null
