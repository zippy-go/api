# Path item for /v1/platform/operations/outbox/replay. Referenced from openapi.yaml.
post:
  operationId: replayOutbox
  summary: "Replay outbox rows"
  description: "Resets the rows named, or every failed row whose event occurred in a period, to pending: each is published again with its own event id, so a consumer that already took it does nothing twice. Written to the audit log. `operations:manage`."
  tags:
    - Operations
  security:
    - Bearer: []
  requestBody:
    required: true
    description: "What to replay."
    content:
      "application/json":
        schema:
          $ref: ../../components/schemas/operations/OutboxReplayInput.yaml
  responses:
    "200":
      description: "What was reset."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/operations/OutboxReplay.yaml
    "400":
      description: "`validation_failed`: neither rows nor a period, more than 100 rows, or a period that ends before it starts."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `operations:manage`, or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
