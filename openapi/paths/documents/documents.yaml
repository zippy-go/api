# Path item for /v1/partners/{partner_id}/documents. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listPartnerDocuments
  summary: List the partner's documents
  description: The documents on file, newest first, with every kind the Partner must have and where each stands; members and platform staff.
  tags:
    - Partner documents
  security:
    - Bearer: []
  responses:
    '200':
      description: The documents and the requirements.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/documents/PartnerDocumentList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Platform staff without `partner:read` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createPartnerDocument
  summary: File a document
  description: "Files a compliance document, pending review: the file is uploaded first under the `partner_document` purpose (private storage) and confirmed. `partner:profile:write`, or platform staff with `partner:write` on the Partner's behalf."
  tags:
    - Partner documents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/documents/PartnerDocumentCreate.yaml
  responses:
    '201':
      description: The document, pending review.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/documents/PartnerDocument.yaml
    '400':
      description: Malformed body, or an expiry before the issue date.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `partner:profile:write` (`access_denied`; platform staff need `partner:write`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`asset_not_usable`: not a stored document of this Partner; `partner_archived`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
