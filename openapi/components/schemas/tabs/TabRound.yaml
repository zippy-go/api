type: object
description: "A round: lines sent together by one member."
required:
  - round_id
  - number
  - member_id
  - member_name
  - sent_at
  - recalled
  - recallable
  - paid_first
  - lines
properties:
  round_id:
    type: string
    format: uuid
    description: The round.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0301
  number:
    type: integer
    minimum: 1
    description: Its number on the tab, from 1.
    examples:
      - 1
  member_id:
    type: string
    format: uuid
    description: Who sent it.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0501
  member_name:
    type: string
    description: Their name.
    examples:
      - Asha
  sent_at:
    type: string
    format: date-time
    description: When it was sent.
    examples:
      - 2026-11-06T14:31:00Z
  recalled:
    type: boolean
    description: Whether it was recalled.
    examples:
      - false
  recallable:
    type: boolean
    description: "Whether it may still be recalled: nothing of it fired yet."
    examples:
      - true
  paid_first:
    type: boolean
    description: Whether it was paid before it reached the kitchen, under pay-first.
    examples:
      - false
  lines:
    type: array
    items:
      $ref: ./TabLine.yaml
    description: Its lines.
examples:
  - round_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0301
    number: 1
    member_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0501
    member_name: Asha
    sent_at: 2026-11-06T14:31:00Z
    recalled: false
    recallable: true
    paid_first: false
    lines:
      - line_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0401
        round_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0301
        item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0601
        variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0602
        name: Paneer Tikka
        variant_label: null
        food_mark: veg
        quantity: 1
        unit_price:
          minor_units: 32000
          currency: INR
        answers: []
        total:
          minor_units: 32000
          currency: INR
        state: fired
        member_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0501
        member_name: Asha
        note: null
        reason: null
