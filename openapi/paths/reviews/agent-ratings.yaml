# Path item for /v1/agent/memberships/{agent_id}/ratings. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
get:
  operationId: listAgentRatings
  summary: "Read the Agent's ratings"
  description: "The Agent's own rating over the last 90 days and each rating newest first with its thumb and tags, never the customer's name, note or photos; whether each counts and whether it may still be flagged. Takes an Agent app token (audience `agent`) of the person holding the membership."
  tags:
    - "Agent app"
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 100; 50 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "The Agent's ratings."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/AgentRatings.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
