# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/items/{item_id}/stock. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: item_id
    in: path
    required: true
    description: The item, which must be one of the store's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
put:
  operationId: putCatalogItemStock
  summary: Switch an item on or off sale for now
  description: "The switch meaning a customer can order this now, for every variant at once: `in_stock`, `sold_out_today` (back in stock by itself at 00:00 in the store's clock) or `out_of_stock` (until switched back). Customers see it within about a second. Putting an `inactive` item back on sale is `PATCH` with `status`, which needs `catalog:write`. `catalog:stock` or `catalog:write`."
  tags:
    - Catalog
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The stock.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/CatalogStockUpdate.yaml
  responses:
    "200":
      description: The item.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/CatalogItem.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `catalog:stock` at this Location (`access_denied`), or the partner is not entitled to it (`not_enabled_for_partner`). Platform staff read catalogues and change none in this version (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner is not visible to the caller, or the store or the record does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_required`: the Location is a branch, with no product-sales Service switched on, so it has no catalogue."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
