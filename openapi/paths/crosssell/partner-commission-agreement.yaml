# Path item for /v1/partners/{partner_id}/commission-agreements/{agreement_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agreement_id
    in: path
    required: true
    description: The agreement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8201
delete:
  operationId: withdrawCommissionAgreement
  summary: Withdraw a commission agreement
  description: Stops showing the quest on the Location's page; quests started there before still earn their commission. Withdrawing again answers the same. `engagement:write` at the Location.
  tags:
    - Recommendations
  security:
    - Bearer: []
  responses:
    "200":
      description: The agreement, withdrawn.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/CommissionAgreement.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `engagement:write` at the Location."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: not an agreement the Partner made."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
