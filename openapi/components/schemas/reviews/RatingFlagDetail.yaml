type: object
description: "A flag in a decision queue: the Agent, the rating it is about and where it stands."
required:
  - id
  - status
  - reason
  - flagged_at
  - due_by
  - overdue
  - decided_at
  - decided_by
  - decision_reason
  - agent
  - partner_id
  - rating
properties:
  id:
    type: string
    format: uuid
    description: "The flag."
  status:
    $ref: ./RatingFlagStatus.yaml
    description: "Where it stands."
  reason:
    type: string
    examples:
      - "The store handed it over 40 minutes late."
    description: "The Agent's reason."
  flagged_at:
    type: string
    format: date-time
    description: "When it was raised."
  due_by:
    type: string
    format: date-time
    description: "When it should be decided by."
  overdue:
    type: boolean
    description: "Whether it is open past its seven days."
  decided_at:
    type:
      - string
      - "null"
    format: date-time
    description: "When it was decided."
  decided_by:
    type:
      - string
      - "null"
    examples:
      - "Platform admin"
    description: "Who decided it."
  decision_reason:
    type:
      - string
      - "null"
    examples:
      - "Late at the store, not the Agent"
    description: "The reason recorded with the decision."
  agent:
    $ref: ./ReviewAgent.yaml
    description: "The Agent who raised it."
  partner_id:
    type: string
    format: uuid
    description: "The Agent's Partner."
  rating:
    $ref: ./StaffAgentRating.yaml
    description: "The rating it is about."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0004"
    status: open
    reason: "The store handed it over 40 minutes late."
    flagged_at: "2026-10-22T12:00:00Z"
    due_by: "2026-10-29T12:00:00Z"
    overdue: false
    decided_at: null
    decided_by: null
    decision_reason: null
    agent:
      agent_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10"
      name: "Ravi Kumar"
    partner_id: "01a13a48-9e00-7000-8000-000000000002"
    rating:
      id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0003"
      source: delivery_rating
      thumb: down
      tags:
        - code: late
          label: Late
      at: "2026-10-22T10:11:00Z"
      order_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
      order_number: AB0042
      location_id: "01a13a48-9e00-7000-8000-000000000301"
      store_name: "Dev Kitchen Gachibowli"
      counts: false
      not_counted_reason: excluded
      flag:
        id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0004"
        status: excluded
        reason: "The store handed it over 40 minutes late."
        flagged_at: "2026-10-22T12:00:00Z"
        due_by: "2026-10-29T12:00:00Z"
        decided_at: "2026-10-23T09:00:00Z"
        decision_reason: "Late at the store, not the Agent"
