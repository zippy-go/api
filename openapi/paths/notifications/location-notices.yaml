# Path item for /v1/partners/{partner_id}/locations/{location_id}/notices. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: 'The Location, which must belong to the partner in the path.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: listLocationNotices
  summary: Read a Location's inbox
  description: |
    The notices sent to the Location in the last seven days that it has not
    cleared, shared by everybody who signs in to it, with how many are unread
    and how many this page does not show. Newest first by default; the console
    presents the unread ones oldest first (`seen=false&order=oldest`), so
    acknowledging one reveals the next. `notice:read` at the Location; another
    partner's Location is `404`.
  tags:
    - Notices
  security:
    - Bearer: []
  parameters:
    - name: seen
      in: query
      required: false
      description: 'Only the notices seen (`true`) or unread (`false`).'
      schema:
        type: boolean
    - name: order
      in: query
      required: false
      description: '`newest` first (the default) or `oldest` first.'
      schema:
        type: string
        enum:
          - newest
          - oldest
        default: newest
    - name: limit
      in: query
      required: false
      description: 'The maximum number of notices to return per page.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: 'The `next_cursor` of the previous page. Omit it for the first page.'
      schema:
        type: string
        minLength: 1
  responses:
    '200':
      description: 'A page of the inbox.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticeInbox.yaml
    '400':
      description: 'A parameter was refused (`validation_failed`), such as `cursor_invalid`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `notice:read` at this Location (`access_denied`); platform staff read with `notice:send` and change nothing (`forbidden`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'Unknown partner or Location, or a Location of another partner (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
