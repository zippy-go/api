type: object
description: A Service a plan change would stop, the `PlanImpactService` schema.
required:
  - id
  - kind
  - name
  - location_ids
properties:
  id:
    type: string
    format: uuid
    description: The Service.
  kind:
    $ref: ../services/ServiceKind.yaml
    description: Its kind.
  name:
    type: string
    description: Its name.
  location_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Locations where it would stop.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a46
    kind: delivery
    name: Delivery
    location_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
