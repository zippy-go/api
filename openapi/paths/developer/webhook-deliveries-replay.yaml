{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    }
  ],
  "post": {
    "operationId": "replayWebhookDeliveries",
    "summary": "Replay failed webhook deliveries",
    "description": "Sends every failed delivery of a period again, each with its original event id, in order per aggregate. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "requestBody": {
      "required": true,
      "description": "The period.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/developer/WebhookReplayInput.yaml"
          }
        }
      }
    },
    "responses": {
      "202": {
        "description": "How many were sent again.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookReplayed.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: a period over 30 days or ending before it starts.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
