type: object
description: An order as Mission Control's board lists it, with what needs attention.
required:
  - id
  - number
  - status
  - version
  - location_id
  - partner_id
  - store_name
  - customer_first_name
  - fulfilment
  - placed_at
  - total
  - waits_for
  - timer
  - attention
properties:
  id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    description: The order.
  number:
    type: string
    examples:
      - AB0042
    description: Its number.
  status:
    $ref: ./OrderStatus.yaml
    description: Its status.
  version:
    type: integer
    examples:
      - 3
    description: Its version.
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store; the store's routes open it.
  partner_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
    description: The store's Partner.
  store_name:
    type: string
    examples:
      - Dev Kitchen Gachibowli
    description: The store's name as it was.
  customer_first_name:
    type: string
    examples:
      - Asha
    description: The customer's first name.
  fulfilment:
    $ref: ./OrderFulfilment.yaml
    description: Delivery or pickup.
  placed_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:00:00Z
    description: When it was placed.
  total:
    $ref: ../common/Money.yaml
    description: Its total.
  waits_for:
    oneOf:
      - $ref: ./OrderMove.yaml
      - type: "null"
    description: The move it waits for.
  timer:
    oneOf:
      - $ref: ./OrderTimer.yaml
      - type: "null"
    description: What it counts towards.
  attention:
    type: array
    items:
      $ref: ./AttentionReason.yaml
    description: What needs attention; empty when nothing does.
  slot:
    oneOf:
      - $ref: ./OrderSlot.yaml
      - type: "null"
    description: "The slot it is placed into: for a delivery the window it arrives in, for a pickup the window it is ready in; `null` for an order for now. The slot is its promise. Since 0.24.0."
  scheduled:
    type: boolean
    examples:
      - false
    description: Whether it waits under Scheduled, not yet sent to its store. Since 0.24.0.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    number: AB0042
    status: paying
    version: 3
    location_id: 01a13a48-9e00-7000-8000-000000000301
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    store_name: Dev Kitchen Gachibowli
    customer_first_name: Asha
    fulfilment: delivery
    placed_at: 2026-10-16T13:00:00Z
    total:
      minor_units: 79800
      currency: INR
    waits_for: accept
    timer:
      kind: accept
      at: 2026-10-16T13:30:00Z
      late: false
    attention:
      - not_answered
