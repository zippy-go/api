# Path item for /v1/customer/consent. Referenced from openapi.yaml.
put:
  operationId: setCustomerConsent
  summary: Set the customer's marketing consent
  description: 'Writes marketing consent as a whole: every channel named (`consent_channel_missing` names each one left out), the moment of agreement kept while any channel is on and cleared when every one is off. Codes and order messages send whatever it says.'
  tags:
    - Customer account
  security:
    - Bearer: []
  requestBody:
    required: true
    description: "Every channel's consent: email, push, SMS and WhatsApp."
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/MarketingConsentUpdate.yaml
  responses:
    '200':
      description: The consent as written.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/MarketingConsent.yaml
    '400':
      description: '`validation_failed` with `consent_channel_missing` on each channel left out.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
