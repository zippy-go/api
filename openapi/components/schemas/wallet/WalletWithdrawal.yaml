type: object
description: "A withdrawal made: the entries it wrote and the refunds sent to the sources, newest paid money first."
required:
  - amount
  - entries
  - refunds
properties:
  amount:
    $ref: ../common/Money.yaml
    description: The whole withdrawal.
  entries:
    type: array
    items:
      $ref: ../wallet/WalletEntry.yaml
      description: An entry.
    description: The withdrawal entries, one per source.
  refunds:
    type: array
    items:
      $ref: ../payments/PaymentRefund.yaml
      description: A refund.
    description: The refunds sent back to the sources.
examples:
  - amount:
      minor_units: 70000
      currency: INR
