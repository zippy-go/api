# Path item for /v1/partners/{partner_id}/documents/{document_id}/review. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: document_id
    in: path
    required: true
    description: The document, which must be on file with the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a50
post:
  operationId: reviewPartnerDocument
  summary: Approve or reject a document
  description: 'Reviews a document: approves it, or rejects it with a note the Partner reads and its contacts are told; an approval is withdrawn by a rejection. Platform staff only, a separate authority from writing the Partner.'
  tags:
    - Partner documents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/documents/PartnerDocumentReview.yaml
  responses:
    '200':
      description: The document as reviewed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/documents/PartnerDocument.yaml
    '400':
      description: Malformed body, or a rejection without a note.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: Not platform staff.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`illegal_transition`: a rejected document is replaced, not reviewed again.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store or mail delivery is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
