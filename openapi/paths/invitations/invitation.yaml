# Path item for /v1/partners/{partner_id}/invitations/{invitation_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: invitation_id
    in: path
    required: true
    description: The invitation, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
delete:
  operationId: revokeInvitation
  summary: Revoke an invitation
  description: |
    Revokes a pending invitation, so that its link no longer works, and
    keeps it in the list with the status `revoked`. Owners and managers may
    revoke. An invitation that is not `pending` any more answers `409`
    (`conflict`).
  tags:
    - Invitations
  security:
    - Bearer: []
  responses:
    '204':
      description: The invitation was revoked.
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is a member but neither owner nor manager (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner is not visible to the caller, or the invitation does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The invitation was already accepted, revoked or has expired (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
