# Path item for /v1/storefront/stores/{location_id}/menu. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The store (a Location).
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: getStoreMenu
  summary: Read a store's published menu
  description: "The store's published menu: one document rebuilt within about a second of every change to its catalogue, stamped with a version that only rises and answered with that version as its entity tag (`\"v<version>\"`). Every reader gets the same snapshot, loaded once per version however many ask together. A client told of version N on the store's channel (`store-{location_id}-menu`, signal `menu.published`) reads it naming `version=N` and is never answered with an older one; `If-None-Match` with the tag it holds answers `304`. A category carries its first `page_size` items; `GET .../menu/categories/{category_id}` pages the rest."
  tags:
    - Store pages
  security: []
  parameters:
    - name: version
      in: query
      required: false
      description: The menu version the client was told of; the answer is that version or a later one, never an older one.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
    - $ref: ../../components/parameters/IfNoneMatchHeader.yaml
    - name: mode
      in: query
      required: false
      description: "The menu's mode: `delivery` (default) or `dine_in`, which prices every variant at its dine-in price, as tabs charge. Since 0.29.0."
      schema:
        type: string
        enum:
          - delivery
          - dine_in
        default: delivery
  responses:
    "200":
      description: The published menu, with its version as the `ETag`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/MenuDocument.yaml
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
    "304":
      description: "`If-None-Match` named the version that would be answered; nothing is transferred."
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The store does not exist, is deleted or is not live (`not_found`), or it has published no menu yet (`menu_not_published`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
