# Path item for /v1/platform/ledger/accounts. Referenced from openapi.yaml.
get:
  tags:
    - Ledger
  security:
    - Bearer: []
  operationId: listLedgerAccounts
  summary: The ledger's accounts
  description: "Every account with its debits, credits and balance, by code: the platform's accounts and every Partner's and customer's. `ledger:read`."
  parameters:
    - name: kind
      in: query
      required: false
      description: Only accounts of this kind.
      schema:
        $ref: ../../components/schemas/ledger/LedgerAccountKind.yaml
    - $ref: ../../components/parameters/PartnerIdQuery.yaml
    - name: customer_id
      in: query
      required: false
      description: Only this customer's accounts.
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of accounts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ledger/LedgerAccountPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `ledger:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
