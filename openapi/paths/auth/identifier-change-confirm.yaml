# Path item for /v1/auth/identifier-change/confirm. Referenced from openapi.yaml.
post:
  operationId: confirmIdentifierChange
  summary: Confirm the new sign-in address
  description: 'Confirms the change with the code sent to the new address: it signs in from now, the old address is told, and every other session ends while this one continues. A new address another account holds is refused, but only once its code passed.'
  tags:
    - Auth
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The code sent to the new address.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/CodeConfirmRequest.yaml
  responses:
    '200':
      description: Changed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/User.yaml
    '400':
      description: '`validation_failed` with `code_invalid` on `/code`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`identifier_taken`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: '`too_many_attempts`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
