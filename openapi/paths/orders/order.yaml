# Path item for /v1/customer/orders/{order_id}. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: getCustomerOrder
  summary: Read an order's page
  description: "The order as its customer reads it, live: one status in plain words on the store's clock, the steps it went through, the promise still open, where it goes or where to collect it, what was sold with every answer and mark, the receipt (lines, refunds, how it was paid), whether it can still be cancelled and the help it offers. `ETag` is the order's version (`If-None-Match` answers `304`). Read it again on `order.changed` on the order's channel, every 30 seconds without live updates and every 5 seconds while paying. Another customer's order is `404`."
  tags:
    - Orders
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfNoneMatchHeader.yaml
  responses:
    "200":
      description: The order.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/CustomerOrder.yaml
    "304":
      description: The version named is current.
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such order of this customer."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
