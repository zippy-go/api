type: object
description: One group of the orders report.
required:
  - key
  - label
  - figures
properties:
  key:
    type: string
    description: "What the group is: a store's id, a status, a way of ordering, a vertical's code, a city's id or a day."
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  label:
    type: string
    description: The group in words.
    examples:
      - Dev Kitchen Gachibowli
  figures:
    $ref: ./OrdersReportFigures.yaml
    description: Its figures.
examples:
  - key: 01a13a48-9e00-7000-8000-000000000301
    label: Dev Kitchen Gachibowli
    figures:
      placed: 21
      completed: 18
      declined: 1
      cancelled: 2
      expired: 0
      in_progress: 0
      ways:
        delivery: 16
        pickup: 2
        dine_in: 0
        scheduled: 0
        subscription: 0
      money:
        - currency: INR
          orders: 18
          sales:
            minor_units: 1234500
            currency: INR
          average_order_value:
            minor_units: 68583
            currency: INR
          refunds:
            minor_units: 12000
            currency: INR
