# Path item for /v1/platform/orders/{order_id}/cancel. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: cancelPlatformOrder
  summary: Cancel any order before it is final
  description: Cancels an order at any status before it is final, with a reason, a note and who pays (the reason's usual payer unless named). Before acceptance every hold is released and a payment taken at checkout refunded; after it everything paid is refunded, each part where it came from, which needs `order:refund` as well as `order:manage`. A customer's open request to cancel is resolved with it. Written to the audit log with the operator, the reason and the note.
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The reason, the note and who pays.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/PlatformCancellation.yaml
  responses:
    "200":
      description: The order, cancelled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/StoreOrder.yaml
    "400":
      description: "`validation_failed`: the note missing or too long."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`order_moved`: the order is final already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
