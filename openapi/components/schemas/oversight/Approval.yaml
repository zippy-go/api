type: object
description: "A four-eyes proposal: an act that a different platform member holding `approval:decide` must approve before it runs, shown with what it changes before and after. An act on a platform membership expires undecided after seventy-two hours, an act of step 10 after seven days; a proposal is voided when what it names changes first."
required:
  - id
  - action
  - membership_id
  - parameters
  - proposed_by
  - proposed_at
  - expires_at
  - status
  - sole_decider
  - subject
  - partner_id
  - before
  - after
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the proposal.
  action:
    $ref: ./ApprovalAction.yaml
    description: The act proposed.
  membership_id:
    type: string
    format: uuid
    description: The platform membership the act is about; for an act of step 10, which is about a Partner, a price, a rule, a setting, a flag, a statement or a Wallet, the proposer's own.
  parameters:
    description: "The act's parameters, frozen when proposed: `role_id` for a grant, `grant_id` for a revocation, nothing else for the other acts."
  proposed_by:
    type: string
    format: uuid
    description: The platform member who proposed it.
  proposed_at:
    type: string
    format: date-time
    description: When it was proposed, as an RFC 3339 timestamp in UTC.
  expires_at:
    type: string
    format: date-time
    description: When it expires undecided, seventy-two hours after it was proposed.
  status:
    $ref: ./ApprovalStatus.yaml
    description: Where the proposal stands.
  sole_decider:
    type: boolean
    description: "`true` when it ran at once because no other platform member could decide it; the audit log says so."
  decided_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was decided; `null` while pending.
  decided_by:
    type:
      - string
      - "null"
    format: uuid
    description: The platform member who decided it; `null` while pending.
  decision_reason:
    type:
      - string
      - "null"
    description: Why, as the decider said.
  reason:
    type:
      - string
      - "null"
    description: Why, as the proposer said.
  subject:
    oneOf:
      - $ref: ./ApprovalSubject.yaml
      - type: "null"
    description: What an act of step 10 is about; `null` for an act on a membership.
  partner_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Partner the act is about, when it is about one.
  before:
    type:
      - object
      - "null"
    description: What the act changes, as it stands when proposed; `null` for an act on a membership.
    additionalProperties: true
  after:
    type:
      - object
      - "null"
    description: What it will be once approved.
    additionalProperties: true
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
    action: grant_platform_role
    membership_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a33
    parameters:
      role_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a74
    proposed_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a21
    proposed_at: 2026-10-15T09:00:00Z
    expires_at: 2026-10-18T09:00:00Z
    status: pending
    sole_decider: false
    decided_at: null
    decided_by: null
    decision_reason: null
    reason: Joins the finance team on Monday
    subject: null
    partner_id: null
    before: null
    after: null
