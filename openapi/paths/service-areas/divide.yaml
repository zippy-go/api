# Path item for /v1/service-areas/{service_area_id}/divide. Referenced from openapi.yaml.
parameters:
  - name: service_area_id
    in: path
    required: true
    description: The fenced area to divide
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
post:
  operationId: divideServiceArea
  summary: Divides a fenced area into fenced children, re-pointing its Locations
  description: Divides a fenced area into fenced children, re-pointing its Locations; platform staff. Refused with `locations_stranded` unless forced with a reason.
  tags:
    - Service areas
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/DivisionRequest.yaml
  responses:
    '200':
      description: The committed plan
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/DivisionPlan.yaml
    '400':
      description: Malformed body, invalid children, or forcing without a reason
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: Not platform staff
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`locations_stranded`, or the area has no fence'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
