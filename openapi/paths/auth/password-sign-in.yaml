# Path item for /v1/auth/password/sign-in. Referenced from openapi.yaml.
post:
  operationId: signInWithPassword
  summary: Sign in with a password
  description: |
    Exchanges an email address and a password for a session. On success the
    response is a `TokenResponse`, delivered the same way as for
    `POST /v1/auth/otp/verify`: the refresh token goes to the `zg_refresh`
    cookie for browsers and into the body for native clients (see the
    `Auth` tag).

    A user gets a password by setting one with `POST /v1/auth/password`
    after signing in with a one-time code, or by choosing one when accepting
    an invitation. An unknown email address, a wrong password or a user
    without a password all answer `401` (`unauthenticated`), without saying
    which it was.
  tags:
    - Auth
  security: []
  parameters:
    - $ref: ../../components/parameters/ClientTypeHeader.yaml
  requestBody:
    required: true
    description: The email address and the password.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordSignInRequest.yaml
  responses:
    '200':
      description: The credentials were accepted and a session was created.
      headers:
        Set-Cookie:
          description: >-
            For browsers (no `X-Client-Type: native` header), the refresh token as `zg_refresh=<token>; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`. Absent for native clients.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/TokenResponse.yaml
    '400':
      description: The body failed validation (`validation_failed`), for example an `email` that is not an email address.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: The email address or the password is wrong, or the user has no password (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when sign-in attempts are rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
