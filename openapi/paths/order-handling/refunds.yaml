# Path item for /v1/platform/orders/{order_id}/refunds. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: refundOrder
  summary: Refund lines and fees
  description: "Refunds lines, with quantities, and fees of an accepted, ready, on-its-way, undelivered, completed or cancelled order, with a reason, a required note and who pays. A line gives back what it cost the customer, only as many of it as earlier refunds left (a line left out at acceptance was never charged); a fee is given back whole, what is left of it; the refunds on an order together never exceed what was paid. The amount goes to the source first, up to what it was charged less what was refunded to it, the rest to the Wallet; a cash order's goes to the Wallet. `order:refund`. Each refund is its own record on the order with its lines, fees, split, reason, note, payer and the operator, and is written to the audit log. It needs a fresh step-up (`step_up_required` otherwise; a sign-in within ten minutes counts) and `Idempotency-Key`: the same key makes one refund. The refusal asking for the step-up is not remembered under the key: prove it and repeat the request as it was."
  tags:
    - Order handling
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The lines, fees, reason, note and payer.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/RefundInput.yaml
  responses:
    "201":
      description: The refund.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/OrderRefund.yaml
    "400":
      description: "`validation_failed`: as for the preview, or `Idempotency-Key` missing (`idempotency_key_missing`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`refund_exceeds_paid`, `order_moved`, or `idempotency_key_reuse`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
