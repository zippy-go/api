# Path item for /v1/agent/memberships/{agent_id}/shifts. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: listAgentShifts
  summary: List the shifts of the Agent's service
  description: "The shifts of the membership's service not ended, soonest first: those with room and those the Agent has; `mine=true` lists only the Agent's. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - name: mine
      in: query
      required: false
      description: Only the Agent's own.
      schema:
        type: boolean
      example: false
    - name: from
      in: query
      required: false
      description: Shifts ending after this; now by default.
      schema:
        type: string
        format: date-time
      example: 2026-11-07T00:00:00Z
    - name: to
      in: query
      required: false
      description: Shifts starting before this.
      schema:
        type: string
        format: date-time
      example: 2026-11-14T00:00:00Z
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 50
    - name: cursor
      in: query
      required: false
      description: Where the page starts, from `next_cursor`.
      schema:
        type: string
      example: eyJrIjoiMjAyNi0xMS0wN1QwMzozMDowMFoifQ
  responses:
    "200":
      description: The shifts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentShiftPage.yaml
    "400":
      description: "`validation_failed`: a filter is malformed."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller's, or no such shift of its service."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
