openapi: 3.1.0

info:
  title: ZippyGo API
  version: 0.2.0
  summary: On-demand delivery and hyperlocal commerce API.
  description: |
    The ZippyGo API covers catalog, ordering, subscriptions, delivery
    orchestration and fleet management for businesses that sell and deliver
    locally: partners (organisations or individuals) sell products and
    services, and agents execute the tasks that fulfil them. This document is
    the contract: every endpoint, schema and error shape is defined here
    before it is implemented.

    The API is versioned by URL prefix (`/v1`). Changes within a major version
    are additive only; see the versioning policy in the repository.
  contact:
    name: ZippyGo API
    url: https://github.com/zippy-go/api
  license:
    name: MIT
    identifier: MIT

# Placeholder hosts. The `.example` top-level domain is reserved for
# documentation (RFC 2606) and will be replaced by the real sandbox and
# production hosts before the first release.
servers:
  - url: https://sandbox.api.zippygo.example
    description: Sandbox (placeholder host, test data only)
  - url: https://api.zippygo.example
    description: Production (placeholder host)

# Operations without their own `security` accept either scheme.
security:
  - ApiKey: []
  - Bearer: []

tags:
  - name: Platform
    description: Service health and platform-level utilities.
  - name: Partners
    description: Partners, the supply-side tenants (organisations or individuals), with their locations and members.
  - name: Catalog
    description: Products, modifiers, availability and pricing.
  - name: Orders
    description: Commercial purchases placed by customers.
  - name: Deliveries
    description: Fulfilment of orders from pickup to dropoff, including tasks and trips.
  - name: Fleet
    description: Providers, agents, vehicles and capacity.
  - name: Live
    description: Server-sent event streams that push agent positions, statuses and events as they happen.
  - name: Events
    description: The events the platform publishes, as a list to poll and as a stream.
  - name: Subscriptions
    description: Plans and schedules that generate recurring orders.
  - name: Webhooks
    description: Webhook endpoints and event delivery.

paths:
  /v1/health:
    $ref: ./paths/platform/health.yaml
  /v1/health/details:
    $ref: ./paths/platform/health-details.yaml
  /v1/fleet/agents:
    $ref: ./paths/fleet/agents.yaml
  /v1/fleet/location-pings:
    $ref: ./paths/fleet/location-pings.yaml
  /v1/events:
    $ref: ./paths/events/events.yaml
  /v1/live/agents:
    $ref: ./paths/live/agents.yaml
  /v1/live/events:
    $ref: ./paths/live/events.yaml

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Server-to-server authentication with a partner-scoped API key sent
        in the `X-Api-Key` header. Keys are issued per partner and can be
        revoked at any time.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User authentication with a JSON Web Token issued by the ZippyGo
        identity service, sent as `Authorization: Bearer <token>`.
    DevApiKey:
      type: apiKey
      in: header
      name: X-Dev-Api-Key
      description: |
        A temporary development credential for Step 0 of the platform, sent
        in the `X-Dev-Api-Key` header. It is accepted only by the operations
        that declare it. The identity module replaces it in Step 1; the
        replacement and the retirement of this scheme are announced in the
        changelog.

  parameters:
    PartnerIdQuery:
      $ref: ./components/parameters/PartnerIdQuery.yaml

  schemas:
    # Common
    HealthResponse:
      $ref: ./components/schemas/common/HealthResponse.yaml
    Money:
      $ref: ./components/schemas/common/Money.yaml
    Problem:
      $ref: ./components/schemas/common/Problem.yaml
    # Platform
    CheckStatus:
      $ref: ./components/schemas/platform/CheckStatus.yaml
    DependencyCheck:
      $ref: ./components/schemas/platform/DependencyCheck.yaml
    OutboxCheck:
      $ref: ./components/schemas/platform/OutboxCheck.yaml
    HealthChecks:
      $ref: ./components/schemas/platform/HealthChecks.yaml
    HealthDetails:
      $ref: ./components/schemas/platform/HealthDetails.yaml
    # Fleet
    AgentStatus:
      $ref: ./components/schemas/fleet/AgentStatus.yaml
    ServiceKind:
      $ref: ./components/schemas/fleet/ServiceKind.yaml
    AgentPosition:
      $ref: ./components/schemas/fleet/AgentPosition.yaml
    Agent:
      $ref: ./components/schemas/fleet/Agent.yaml
    AgentList:
      $ref: ./components/schemas/fleet/AgentList.yaml
    LocationPing:
      $ref: ./components/schemas/fleet/LocationPing.yaml
    LocationPingBatch:
      $ref: ./components/schemas/fleet/LocationPingBatch.yaml
    LocationPingsAccepted:
      $ref: ./components/schemas/fleet/LocationPingsAccepted.yaml
    # Events
    Event:
      $ref: ./components/schemas/events/Event.yaml
    EventList:
      $ref: ./components/schemas/events/EventList.yaml
    # Live
    ServerSentEventStream:
      $ref: ./components/schemas/live/ServerSentEventStream.yaml
    AgentSnapshot:
      $ref: ./components/schemas/live/AgentSnapshot.yaml
    AgentPositionUpdate:
      $ref: ./components/schemas/live/AgentPositionUpdate.yaml
    AgentStatusUpdate:
      $ref: ./components/schemas/live/AgentStatusUpdate.yaml
