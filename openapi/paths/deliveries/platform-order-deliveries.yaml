# Path item for /v1/platform/orders/{order_id}/deliveries. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: listPlatformOrderDeliveries
  summary: List any order's deliveries
  description: As the partner's own route, for any order. Mission Control tokens holding platform `dispatch:read`.
  tags: &a1
    - Deliveries
  security: &a2
    - Bearer: []
  responses:
    "200":
      description: The order's deliveries.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/OrderDeliveries.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX: &a3
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default: &a4
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: askPlatformOrderDelivery
  summary: Ask for a delivery for any order that has none
  description: As the partner's own route, for any order. Mission Control tokens holding platform `dispatch:manage`; every act is written to the audit log.
  tags: *a1
  security: *a2
  responses:
    "201":
      description: The delivery.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/DeliveryDetail.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`not_for_delivery` for a pickup order; `order_moved` unless the order is accepted or ready; `delivery_open` while a delivery of it is under way; `no_provider` while the store names no Provider."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX: *a3
    default: *a4
