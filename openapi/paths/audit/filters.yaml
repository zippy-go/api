# Path item for GET /v1/audit-log/filters. Referenced from openapi.yaml.
get:
  operationId: getAuditFilters
  summary: Get the audit log filter declaration
  description: Returns the fields the audit log can be filtered, sorted and faceted by, with the type and operators of each.
  tags:
    - Audit
  security:
    - Bearer: []
  responses:
    '200':
      description: The declaration.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/FilterSchema.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
