type: object
description: "A store's shelf on its page (since 0.38.0), after its offers: what can be ordered now, ten at most, under its headline; a shelf with nothing to show is left out."
required:
  - offer_id
  - kind
  - headline
  - items
properties:
  offer_id:
    type: string
    format: uuid
    description: The shelf.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d7001
  kind:
    $ref: ./DisplayShelfKind.yaml
    description: Top sellers, new additions or a spotlight.
  headline:
    type: string
    description: Its headline.
    examples:
      - Top sellers
  items:
    type: array
    items:
      $ref: ./StoreShelfItem.yaml
    description: Its items, ten at most.
    maxItems: 10
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d7001
    kind: top_sellers
    headline: Top sellers
    items:
      - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b1001
        name: Chicken Biryani
        picture_url: null
        from_price:
          minor_units: 1250
          currency: USD
        promotion:
          offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
          tag: Buy 1, get 1 free
          price_after: null
          deal:
            quantity: 2
            text: Add 2 and 1 is free
            total:
              minor_units: 42900
              currency: INR
            total_before:
              minor_units: 85800
              currency: INR
