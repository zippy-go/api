type: object
description: "One line of a pharmacy's dispensing register, without the files, the `DispensingRecord` schema."
required:
  - id
  - order_number
  - drug_name
  - schedule
  - quantity
  - patient_name
  - prescriber_name
  - prescriber_registration
  - prescribed_on
  - pharmacist_name
  - pharmacist_registration
  - dispensed_at
properties:
  id:
    type: string
    format: uuid
    description: "The record."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd001"
  order_number:
    type: string
    description: "The order's number."
    examples:
      - "GPH-0412"
  drug_name:
    type: string
    description: "The drug, its strength and form, as sold."
    examples:
      - "Amoxicillin 500 mg capsules"
  schedule:
    $ref: ./PrescriptionSchedule.yaml
  quantity:
    type: integer
    minimum: 1
    description: "The quantity dispensed."
    examples:
      - 10
  patient_name:
    type:
      - string
      - "null"
    description: "The patient's name as the prescription wrote it; it stays after the customer's erasure."
    examples:
      - "Asha Rao"
  prescriber_name:
    type:
      - string
      - "null"
    description: "The prescriber's name where given."
    examples:
      - "Dr. K. Prasad"
  prescriber_registration:
    type:
      - string
      - "null"
    description: "Their registration number where given."
    examples:
      - "TSMC/45123"
  prescribed_on:
    type:
      - string
      - "null"
    format: date
    description: "The prescription's date where given."
    examples:
      - "2026-10-28"
  pharmacist_name:
    type: string
    description: "The pharmacist who verified."
    examples:
      - "Lakshmi Reddy"
  pharmacist_registration:
    type: string
    description: "Their registration number."
    examples:
      - "TSPC/2019/04521"
  dispensed_at:
    type: string
    format: date-time
    description: "When it was dispensed: the order delivered or collected."
    examples:
      - "2026-11-03T07:40:00Z"
examples:
  - {"id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd001", "order_number": "GPH-0412", "drug_name": "Amoxicillin 500 mg capsules", "schedule": "H", "quantity": 10, "patient_name": "Asha Rao", "prescriber_name": "Dr. K. Prasad", "prescriber_registration": "TSMC/45123", "prescribed_on": "2026-10-28", "pharmacist_name": "Lakshmi Reddy", "pharmacist_registration": "TSPC/2019/04521", "dispensed_at": "2026-11-03T07:40:00Z"}
