type: object
description: "One rating as the Agent reads it: the thumb and its tags, never the customer's name, note or photos."
required:
  - id
  - source
  - thumb
  - tags
  - at
  - order_number
  - counts
  - flaggable
  - flag
properties:
  id:
    type: string
    format: uuid
    description: "The rating: a delivery rating's id, or the order review's."
  source:
    $ref: ./AgentRatingSource.yaml
    description: "Where it came from."
  thumb:
    $ref: ./ReviewThumb.yaml
    description: "Up or down."
  tags:
    type: array
    items:
      $ref: ./ReviewTagOption.yaml
    description: "Its tags."
  at:
    type: string
    format: date-time
    description: "When it was given."
  order_number:
    type: string
    examples:
      - AB0042
    description: "The order's number."
  counts:
    type: boolean
    description: "Whether it counts in the rating now: within 90 days and not excluded."
  flaggable:
    type: boolean
    description: "Whether the Agent may flag it now: within 14 days and not flagged."
  flag:
    oneOf:
      - $ref: ./RatingFlag.yaml
      - type: "null"
    description: "The Agent's flag on it."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0003"
    source: delivery_rating
    thumb: down
    tags:
      - code: late
        label: Late
    at: "2026-10-22T10:11:00Z"
    order_number: AB0042
    counts: false
    flaggable: false
    flag:
      id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0004"
      status: excluded
      reason: "The store handed it over 40 minutes late."
      flagged_at: "2026-10-22T12:00:00Z"
      due_by: "2026-10-29T12:00:00Z"
      decided_at: "2026-10-23T09:00:00Z"
      decision_reason: "Late at the store, not the Agent"
