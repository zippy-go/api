type: object
description: "Who a delivery may be given to by hand: the teams and the Agents of the delivery services the reader may choose from."
required:
  - delivery_id
  - teams
  - items
properties:
  delivery_id:
    type: string
    format: uuid
    description: The delivery.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
  teams:
    type: array
    items:
      $ref: ./DispatchTeam.yaml
    description: The teams.
  items:
    type: array
    items:
      $ref: ./DeliveryCandidate.yaml
    description: "The Agents: those who can take it first, online before offline, nearest first; then those who cannot, with why."
examples:
  - delivery_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
    teams:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd601
        name: Everyone
        default: true
    items: []
