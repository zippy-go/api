type: object
description: An Agent's last known position and how old it is.
required:
  - lat
  - lng
  - recorded_at
  - age_seconds
properties:
  lat:
    type: number
    description: Latitude (WGS 84).
    examples:
      - 17.4432
    minimum: -90
    maximum: 90
  lng:
    type: number
    description: Longitude (WGS 84).
    examples:
      - 78.3519
    minimum: -180
    maximum: 180
  recorded_at:
    type: string
    format: date-time
    description: When the device recorded it.
    examples:
      - 2026-10-16T13:09:55Z
  age_seconds:
    type: integer
    description: How old it is, in seconds.
    examples:
      - 5
    minimum: 0
examples:
  - lat: 17.4432
    lng: 78.3519
    recorded_at: 2026-10-16T13:09:55Z
    age_seconds: 5
