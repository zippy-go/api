type: object
description: "One line of a round: a variant of an item of the store's dine-in menu."
required:
  - item_id
  - variant_id
  - quantity
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0601
  variant_id:
    type: string
    format: uuid
    description: The variant.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0602
  quantity:
    type: integer
    minimum: 1
    maximum: 50
    description: How many.
    examples:
      - 1
  answers:
    type: array
    items:
      $ref: ../orders/BasketAnswerInput.yaml
    description: The answers to the item's questions, three deep, as a basket takes them; each priced answer is charged on the line.
  note:
    type:
      - string
      - "null"
    maxLength: 140
    description: A note for the kitchen.
    examples:
      - null
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0601
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0602
    quantity: 1
    answers: []
    note: null
