# Path item for /v1/agent/memberships/{agent_id}/record-exports. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
post:
  operationId: exportAgentRecord
  summary: "Export the Agent's portable record"
  description: "The Agent's record of tasks, ratings, documents and earnings as a file to save, for the person to take to other work; also for a membership offboarded. Once per `Idempotency-Key` whatever the retries. Agent app token of the membership's person."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  responses:
    "201":
      description: "The export."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentRecordExport.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
