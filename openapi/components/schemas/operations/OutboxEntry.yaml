type: object
description: "An outbox row not published yet: its event, its attempts, when it is tried next and its last error."
required:
  - id
  - type
  - version
  - occurred_at
  - partner_id
  - correlation_id
  - status
  - attempts
  - next_attempt_at
  - last_error
  - age_seconds
properties:
  id:
    type: string
    format: uuid
    description: "The event id; a replay publishes it again with the same id."
  type:
    type: string
    examples:
      - ordering.order.placed
    description: "The event type."
  version:
    type: integer
    minimum: 1
    examples:
      - 1
    description: "Its payload version."
  occurred_at:
    type: string
    format: date-time
    description: "When it happened."
  partner_id:
    type:
      - string
      - "null"
    format: uuid
    description: "The Partner it belongs to."
  correlation_id:
    type:
      - string
      - "null"
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c99"
    description: "Its correlation id."
  status:
    $ref: ./OutboxRowStatus.yaml
    description: "Pending or failed."
  attempts:
    type: integer
    minimum: 0
    examples:
      - 10
    description: "Attempts so far."
  next_attempt_at:
    type:
      - string
      - "null"
    format: date-time
    description: "When it is tried next; `null` when failed or due now."
  last_error:
    type:
      - string
      - "null"
    examples:
      - "publish to Valkey: connection refused"
    description: "Its last error."
  age_seconds:
    type: integer
    minimum: 0
    examples:
      - 7200
    description: "How old it is."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c000c"
    type: ordering.order.placed
    version: 1
    occurred_at: "2026-10-22T10:00:00Z"
    partner_id: "01a13a48-9e00-7000-8000-000000000001"
    correlation_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c99"
    status: failed
    attempts: 10
    next_attempt_at: null
    last_error: "publish to Valkey: connection refused"
    age_seconds: 7200
