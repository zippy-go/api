type: object
description: "The customer's own review of an order, as they wrote it, with the store's reply once published."
required:
  - id
  - thumb
  - tags
  - note
  - photos
  - created_at
  - reply
properties:
  id:
    type: string
    format: uuid
    description: "The review."
  thumb:
    $ref: ./ReviewThumb.yaml
    description: "Up or down."
  tags:
    type: array
    items:
      $ref: ./ReviewTagOption.yaml
    description: "The tags chosen."
  note:
    type:
      - string
      - "null"
    examples:
      - "The biryani arrived cold."
    description: "The note, at most 500 characters."
  photos:
    type: array
    items:
      $ref: ./ReviewPhoto.yaml
    description: "The photos, at most three."
  created_at:
    type: string
    format: date-time
    description: "When it was written."
  reply:
    oneOf:
      - $ref: ./PublishedReply.yaml
      - type: "null"
    description: "The store's reply once the platform approved it."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0001"
    thumb: down
    tags:
      - code: cold_damaged
        label: Cold/damaged
    note: "The biryani arrived cold."
    photos:
      - asset_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005"
        url: "https://objects.zippygo.example/zippygo-private/reviews/0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005.jpg?signature=example"
    created_at: "2026-10-22T10:10:00Z"
    reply:
      text: "Sorry, we have changed our packaging"
      store_name: "Dev Kitchen Gachibowli"
      published_at: "2026-10-22T11:00:00Z"
