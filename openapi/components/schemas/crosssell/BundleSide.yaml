type: object
description: "One side of a bundle: an item or a category of one store, with the share of the saving its order carries and the store's answer."
required:
  - location_id
  - location_name
  - partner_id
  - item_id
  - category_id
  - name
  - share
  - answer
  - answered_at
  - offer_id
properties:
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  location_name:
    type: string
    description: The store's name.
    examples:
      - Dev Kitchen Gachibowli
  partner_id:
    type: string
    format: uuid
    description: The store's Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  item_id:
    type:
      - string
      - "null"
    format: uuid
    description: The item, for an item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c11
  category_id:
    type:
      - string
      - "null"
    format: uuid
    description: The category, for a category.
    examples:
      - null
  name:
    type: string
    description: The item or category in words.
    examples:
      - Hyderabadi Biryani
  share:
    $ref: ../common/Money.yaml
    description: The share of the saving this side's order carries.
  answer:
    $ref: ./BundleAnswer.yaml
    description: The store's answer.
  answered_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it answered.
    examples:
      - 2026-11-02T10:00:00Z
  offer_id:
    type:
      - string
      - "null"
    format: uuid
    description: The offer the promotions engine prices this side's order with, once published.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8501
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000301
    location_name: Dev Kitchen Gachibowli
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c11
    category_id: null
    name: Hyderabadi Biryani
    share:
      minor_units: 3000
      currency: INR
    answer: accepted
    answered_at: 2026-11-02T10:00:00Z
    offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8501
