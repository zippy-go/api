type: object
description: A line reorder could not copy into the basket, and why.
required:
  - item_id
  - name
  - reason
properties:
  item_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    description: The item.
  name:
    type: string
    examples:
      - Mango lassi
    description: Its name on the old order.
  reason:
    type: string
    examples:
      - Mango lassi is no longer on the menu.
    description: Why, in a sentence.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    name: Mango lassi
    reason: Mango lassi is no longer on the menu.
