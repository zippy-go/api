type: object
description: |-
  Request body of `POST /v1/service-areas/{service_area_id}/divide`, the `DivisionRequest`
  schema.
required:
  - children
properties:
  children:
    type: array
    items:
      $ref: ./DivisionChild.yaml
    description: The areas to create beneath.
  force:
    type: boolean
    description: Go ahead although Locations would be stranded, deactivating them; needs a reason.
  reason:
    type:
      - string
      - 'null'
    description: Why, kept in the audit log.
examples:
  - children:
      - kind: region
        name: Gachibowli
        ring: []
        slug: gachibowli
    force: true
    reason: example
