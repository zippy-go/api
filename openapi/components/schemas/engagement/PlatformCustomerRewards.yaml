type: object
description: "A customer's Rewards tab in Mission Control: what the customer sees, every grant, their referrals, the signals on them and whether they are excluded."
required:
  - customer_id
  - rewards
  - grants
  - referrals
  - signals
  - excluded
  - blocked
  - actions
properties:
  customer_id:
    type: string
    format: uuid
    description: The customer.
    examples:
      - 01a13a48-9e00-7000-8000-000000000701
  rewards:
    $ref: ./CustomerRewards.yaml
    description: What the customer sees.
  grants:
    type: array
    items:
      $ref: ./RewardGrant.yaml
    description: Their latest 50 grants, newest first.
  referrals:
    type: array
    items:
      $ref: ./Referral.yaml
    description: Their referrals, as referrer or friend.
  signals:
    type: array
    items:
      $ref: ./RewardSignal.yaml
    description: The signals on them now.
  excluded:
    oneOf:
      - $ref: ./RewardExclusion.yaml
      - type: "null"
    description: Their exclusion; `null` when they earn.
  blocked:
    type: boolean
    description: Whether support blocked the account, so it earns nothing while blocked.
  actions:
    $ref: ./PlatformCustomerRewardActions.yaml
    description: What the caller may do.
