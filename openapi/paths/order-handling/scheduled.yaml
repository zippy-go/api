# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/scheduled. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000307
get:
  operationId: listScheduledOrders
  summary: List a store's scheduled orders
  description: "The board's Scheduled tab: orders placed for a slot, and the orders subscriptions generated at the cutoff, from the moment they are placed until they are sent to the store at its lead time (the preparation time plus 15 minutes before the slot), soonest slot first, with how many wait in each slot. The store may accept one earlier with the accept of the board. `order:read` at the Location."
  tags:
    - Order handling
  security:
    - Bearer: []
  parameters:
    - name: date
      in: query
      required: false
      description: One day on the store's clock; every day ahead by default.
      schema:
        type: string
        format: date
      example: 2026-11-06
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts: the `next_cursor` of the page before."
      schema:
        type: string
  responses:
    "200":
      description: The scheduled orders.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/ScheduledOrderPage.yaml
    "400":
      description: "`validation_failed`: a malformed identifier (`malformed_identifier`), a limit out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:read` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Location."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
