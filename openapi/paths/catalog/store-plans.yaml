# Path item for /v1/storefront/stores/{location_id}/plans. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: "The store: a live store with a published menu."
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000307
get:
  operationId: listStorePlans
  summary: List a store's plans
  description: "The Subscribe section of a store's page: its live plans with their terms, the earliest start, \"from\" a delivery's least price, and whether the store reaches the customer's address (the one named by `address_id`, else the customer's selected one; a visitor names a pin with `lat` and `lng`). Subscribe is offered only where it does. Anybody may read it; a customer token adds the reach of their addresses."
  tags:
    - Store pages
  security:
    - Bearer: []
    - {}
  parameters:
    - name: address_id
      in: query
      required: false
      description: One of the customer's saved addresses to check the reach of.
      schema:
        type: string
        format: uuid
    - name: lat
      in: query
      required: false
      description: A pin's latitude, with `lng`, for a visitor.
      schema:
        type: number
        minimum: -90
        maximum: 90
    - name: lng
      in: query
      required: false
      description: A pin's longitude, with `lat`.
      schema:
        type: number
        minimum: -180
        maximum: 180
  responses:
    "200":
      description: The plans.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/StorefrontPlanList.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or coordinate."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the store, or the address is not the customer's."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
