# Path item for /v1/partners/{partner_id}/logo. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
put:
  operationId: putPartnerLogo
  summary: Set or clear the partner's logo
  description: "Applies the Partner's logo as soon as it is stored, or removes it with `null`: a confirmed `partner_logo` asset, square. `partner:profile:write`, or platform staff with `partner:write`."
  tags:
    - Partners
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/partners/PictureUpdate.yaml
  responses:
    '200':
      description: The partner with its logo.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/Partner.yaml
    '400':
      description: Malformed body, or a picture that is not square.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `partner:profile:write` (`access_denied`; platform staff need `partner:write`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`asset_not_usable`: not a stored logo of this Partner (a document is never a logo).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
