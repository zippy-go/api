type: object
description: Marketing consent per channel, the `MarketingConsent` schema. Transactional messages (codes, order updates) send whatever it says.
required:
  - email
  - push
  - sms
  - whatsapp
properties:
  email:
    type: boolean
    description: Offers by email.
  push:
    type: boolean
    description: Offers by push notification.
  sms:
    type: boolean
    description: Offers by SMS.
  whatsapp:
    type: boolean
    description: Offers on WhatsApp.
  agreed_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When the set was last agreed; `null` while every channel is off.
examples:
  - email: true
    push: true
    sms: false
    whatsapp: false
    agreed_at: 2026-10-15T09:00:00Z
