# Path item for /v1/agent/memberships. Referenced from openapi.yaml.
get:
  operationId: listOwnAgentMemberships
  summary: List the Agent's memberships
  description: Every Agent membership of the signed-in person that is not offboarded, each with its service, its status and why, the documents still needed, duty and whether the Agent may go on duty, cash in hand and the pay rule version in force, the working one first. A duty stretch the platform closed for silence since the app last opened is told here once. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one.
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: The memberships.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentMembershipList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
