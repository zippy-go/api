# Path item for GET /v1/audit-log/{entry_id}. Referenced from openapi.yaml.
# PUT, PATCH and DELETE on this path exist only to be refused: they answer
# 405 (method_not_allowed) and log the attempt, so they are not operations
# of the contract.
parameters:
  - name: entry_id
    in: path
    required: true
    description: The entry. An id that is not a UUID answers `400` (`validation_failed`, `malformed_identifier`).
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
get:
  operationId: getAuditEntry
  summary: Get an audit entry
  description: Returns one entry. Platform staff read any entry; a partner member reads one about their partner's records by naming the partner in `partner_id`.
  tags:
    - Audit
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: The partner the entry belongs to; required for partner members.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The entry.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/audit/AuditEntry.yaml
    '400':
      description: The id is not a UUID (`validation_failed`, `malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: A partner member asked without naming a partner (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The entry does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
