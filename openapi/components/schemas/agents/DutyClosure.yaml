type: object
description: A duty stretch the platform closed because nothing was heard from the app for 30 minutes, told the next time the app opens.
required:
  - stretch_id
  - ended_at
  - zone
properties:
  stretch_id:
    type: string
    format: uuid
    description: The stretch.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a95
  ended_at:
    type: string
    format: date-time
    description: "When it was closed: at the last report."
    examples:
      - 2026-10-16T22:10:00Z
  zone:
    oneOf:
      - $ref: ./ZoneRef.yaml
      - type: "null"
    description: The zone it was in.
examples:
  - stretch_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a95
    ended_at: 2026-10-16T22:10:00Z
    zone:
      id: 01a13a48-9e00-7000-8000-00000000a011
      name: Gachibowli
