# Path item for /v1/customer/orders/{order_id}/reorder. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: reorderCustomerOrder
  summary: Copy an order into a fresh basket
  description: Copies the order's lines into the store's basket at today's prices, replacing what the basket held, and answers the basket ready for checkout with every line it could not copy and why (an item no longer on the menu, an answer no longer offered).
  tags:
    - Orders
  security:
    - Bearer: []
  responses:
    "200":
      description: The basket and what was not copied.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/Reorder.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the order, or its store has no menu any more."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
