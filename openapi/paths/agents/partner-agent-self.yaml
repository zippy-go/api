# Path item for /v1/partners/{partner_id}/agents/self. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
post:
  operationId: joinOwnDeliveryService
  summary: Join the Partner's own delivery service
  description: The owner of an individual Partner, a one-person service, takes an Agent membership in their own delivery service without an invitation; it is pending its documents. Takes a Partner console token of the owner.
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The service and the kind.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentSelfJoin.yaml
  responses:
    "201":
      description: The membership, pending.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "400":
      description: "`validation_failed`: a malformed service id."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: the Partner is not an individual Partner, or the caller is not its owner."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based`, `kind_not_allowed`, or `agent_already_member` when the owner holds one already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
