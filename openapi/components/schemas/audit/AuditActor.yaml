type: object
description: >-
  Who performed an audited act. A signed-in person, with the membership
  they acted under and their name frozen at the time, or the system for
  timers and provider notices.
required:
  - kind
  - user_id
  - membership_id
  - partner_id
  - label
properties:
  kind:
    type: string
    enum:
      - user
      - system
    description: A person or the system.
    examples:
      - user
  user_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The user, for a person.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  membership_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The membership acted under, when known.
    examples:
      - null
  partner_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The partner the membership is in; the platform organisation for platform staff.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  label:
    type:
      - string
      - 'null'
    maxLength: 200
    description: The actor's name as it was at the time, when known.
    examples:
      - Platform admin
examples:
  - kind: user
    user_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    membership_id: null
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    label: null
