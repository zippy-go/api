type: object
description: A page of item rows.
required:
  - items
  - next_cursor
properties:
  items:
    type: array
    items:
      $ref: ./CatalogItemRow.yaml
    description: The rows on this page.
  next_cursor:
    type:
      - string
      - "null"
    description: An opaque cursor to pass as `cursor` for the next page, or `null` on the last page.
    examples:
      - null
  facets:
    type: array
    items:
      $ref: ../common/Facet.yaml
    description: Facet counts, present when `facets` was asked for.
