type: object
description: One requirement and where it stands, the `DocumentRequirement` schema.
required:
  - kind
  - state
  - expiring
  - trading
  - covers
properties:
  kind:
    $ref: ./DocumentKind.yaml
    description: The kind required.
  state:
    $ref: ./RequirementState.yaml
    description: Where it stands.
  expiring:
    type: boolean
    description: '`true` within thirty days of the expiry of a satisfied requirement.'
  trading:
    $ref: ./TradingEffect.yaml
    description: What it does to trading.
  covers:
    $ref: ./RequirementCoverage.yaml
    description: Which Locations it covers.
  document_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The document that decides it, when one is on file.
  expires_on:
    type:
      - string
      - 'null'
    description: The deciding document's last valid day.
    examples:
      - 2026-11-14
  review_note:
    type:
      - string
      - 'null'
    description: The reviewer's note of a rejection.
  stops_on:
    type:
      - string
      - 'null'
    description: The first day the covered Locations do not trade, in a grace period or once stopped.
    examples:
      - 2026-11-30
examples:
  - kind: pan
    state: missing
    document_id: null
    expires_on: null
    expiring: false
    review_note: null
    trading: stopped
    stops_on: null
    covers: all_locations
