type: object
description: A team of a delivery service's Agents with the area dispatch offers its deliveries in. Every service has one default team holding every Agent, whose area is the zones the service delivers in, else the zones of its Locations; teams beyond the default come later.
required:
  - id
  - partner_id
  - service_id
  - name
  - default
  - kinds
  - zones
  - area_source
  - agent_count
properties:
  id:
    type: string
    format: uuid
    description: The team.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  service_id:
    type: string
    format: uuid
    description: The delivery service.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  name:
    type: string
    description: Its name.
    examples:
      - Everyone
  default:
    type: boolean
    description: Whether it is the default team.
    examples:
      - true
  kinds:
    type: array
    items:
      $ref: ./AgentKind.yaml
    description: The kinds it is limited to; empty for every kind.
    examples:
      - []
  zones:
    type: array
    items:
      $ref: ./ZoneRef.yaml
    description: Its area.
    examples:
      - - id: 01a13a48-9e00-7000-8000-00000000a011
          name: Gachibowli
  area_source:
    $ref: ./TeamAreaSource.yaml
    description: Where the area comes from.
  agent_count:
    type: integer
    format: int32
    description: Agents in it, offboarded ones left out.
    examples:
      - 3
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a80
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    service_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    name: Everyone
    default: true
    kinds: []
    zones:
      - id: 01a13a48-9e00-7000-8000-00000000a011
        name: Gachibowli
    area_source: location_zones
    agent_count: 3
