{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    },
    {
      "name": "key_id",
      "in": "path",
      "required": true,
      "description": "The key.",
      "schema": {
        "type": "string",
        "format": "uuid"
      },
      "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7c01"
    }
  ],
  "get": {
    "operationId": "getApiKeyUsage",
    "summary": "Read an API key's use",
    "description": "When the key was last used and the deprecated operations it called in the last 30 days, with their sunsets. Members need `developer:read` to read and `developer:manage` to change; owners and the Developer role hold both. A key cannot manage keys.",
    "tags": [
      "Developer"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "responses": {
      "200": {
        "description": "Its use.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/ApiKeyUsage.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `developer:read`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner or the key.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
