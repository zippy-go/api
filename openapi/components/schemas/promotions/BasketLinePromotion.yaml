type: object
description: "The item offer a line is under, from the engine: its tag, how many of the line it gives free, what it takes off and the line's price after it."
required:
  - offer_id
  - tag
  - free_quantity
  - saving
  - price_after
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  tag:
    type: string
    description: The tag.
    examples:
      - Buy 1, get 1 free
  free_quantity:
    type: integer
    description: How many of the line go free.
    examples:
      - 1
    minimum: 0
  saving:
    $ref: ../common/Money.yaml
    description: What it takes off the line.
  price_after:
    $ref: ../common/Money.yaml
    description: The line's price after it.
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    tag: Buy 1, get 1 free
    free_quantity: 1
    saving:
      minor_units: 42900
      currency: INR
    price_after:
      minor_units: 42900
      currency: INR
