# Path item for /v1/partners/{partner_id}/locations/{location_id}/tables/{table_id}/tabs. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be the partner's in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: table_id
    in: path
    required: true
    description: The table, of the Location in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0101
post:
  operationId: openStoreTab
  summary: Open a tab on a table
  description: "Staff open a tab on a free table, with the lines they key in or none: the way a pay-only table runs. `order:manage` at the Location."
  tags:
    - Dine-in
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The party's name and the lines.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tabs/TabStaffOpen.yaml
  responses:
    "201":
      description: The tab.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/StoreTab.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:manage` at the Location), `not_enabled_for_partner`, or `forbidden`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`table_occupied`, `lines_refused`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
