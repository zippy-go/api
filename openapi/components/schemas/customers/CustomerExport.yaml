{
  "type": "object",
  "description": "An export of everything the platform holds about a customer: a JSON file and a readable PDF summary, offered to a signed-in session of that customer for seven days.",
  "required": [
    "export_id",
    "state",
    "requested_at",
    "requested_by",
    "ready_at",
    "expires_at",
    "sections"
  ],
  "properties": {
    "export_id": {
      "type": "string",
      "description": "The export.",
      "format": "uuid",
      "examples": [
        "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9f01"
      ]
    },
    "state": {
      "$ref": "./CustomerExportState.yaml"
    },
    "requested_at": {
      "type": "string",
      "description": "When it was asked for.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    },
    "requested_by": {
      "type": "string",
      "description": "`customer`, or `support` on the customer's behalf.",
      "enum": [
        "customer",
        "support"
      ],
      "examples": [
        "customer"
      ]
    },
    "ready_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When it was ready.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    },
    "expires_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When its download ends.",
      "format": "date-time",
      "examples": [
        "2026-11-10T10:15:00Z"
      ]
    },
    "sections": {
      "type": "array",
      "items": {
        "type": "string",
        "description": "A section of the file.",
        "examples": [
          "orders"
        ]
      },
      "description": "What it holds: profile, consent, addresses, favourites, orders, subscriptions, bookings, wallet, reviews, sessions, audit and the rest each module answers."
    }
  },
  "examples": [
    {
      "export_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9f01",
      "state": "ready",
      "requested_at": "2026-11-02T10:15:00Z",
      "requested_by": "customer",
      "ready_at": "2026-11-02T10:15:00Z",
      "expires_at": "2026-11-10T10:15:00Z",
      "sections": [
        "profile",
        "consent",
        "addresses",
        "favourites",
        "orders",
        "subscriptions",
        "bookings",
        "wallet",
        "reviews",
        "sessions",
        "audit"
      ]
    }
  ]
}
