# Path item for /v1/platform/taxonomy/terms/{term_id}/deprecate. Referenced from openapi.yaml.
parameters:
  - name: term_id
    in: path
    required: true
    description: The term.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd101
post:
  operationId: deprecateTaxonomyTerm
  summary: Deprecate a term in favour of another
  description: |
    Retires a term: every category and item mapped to it is mapped to the
    replacement, an active term of the same Vertical that is neither the term nor
    beneath it; the terms beneath it move under the replacement; and it can no
    longer be chosen. Published as `catalog.taxonomy.changed` with the mappings
    moved, and audited. `taxonomy:write`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  requestBody:
    required: true
    description: 'The replacement.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/taxonomy/TaxonomyTermDeprecation.yaml
  responses:
    "200":
      description: 'The term, deprecated.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyTerm.yaml
    "400":
      description: '`validation_failed`, with `taxonomy_term_retired`, `taxonomy_term_elsewhere`, `taxonomy_cycle` or `taxonomy_too_deep` on `/replacement_id`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `taxonomy:write` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such term or replacement (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: '`conflict`: the term is already retired.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
