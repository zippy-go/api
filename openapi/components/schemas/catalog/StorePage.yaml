type: object
description: "What the storefront draws for one store, open or shut: its card facts, what a card has no room for, what it is doing now and the reference to its published menu."
required:
  - location_id
  - partner_id
  - partner
  - name
  - description
  - logo
  - banner
  - address
  - lat
  - lng
  - phone
  - time_zone
  - currency
  - vertical_ids
  - tags
  - highlights
  - fulfilment
  - preparation_minutes
  - new
  - distance_metres
  - live
  - hours
  - term
  - catalogue_type
  - menu
  - categories
properties:
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  partner_id:
    type: string
    format: uuid
    description: Its partner.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  partner:
    $ref: ./StorePagePartner.yaml
    description: Its Partner's name and logo, to link to the Partner's own storefront.
  name:
    type: string
    description: Its name.
    examples:
      - Dev Kitchen Gachibowli
  description:
    type:
      - string
      - "null"
    description: What it says about itself.
    examples:
      - null
  logo:
    oneOf:
      - $ref: ./CataloguePicture.yaml
      - type: "null"
    description: Its tile.
  banner:
    oneOf:
      - $ref: ./CataloguePicture.yaml
      - type: "null"
    description: Its banner.
  address:
    $ref: ../common/Address.yaml
    description: Where it is.
  lat:
    type: number
    description: Latitude, for the map.
    examples:
      - 17.4401
  lng:
    type: number
    description: Longitude, for the map.
    examples:
      - 78.3489
  phone:
    type:
      - string
      - "null"
    description: How to ring it, E.164.
    examples:
      - null
  time_zone:
    type: string
    description: Its clock.
    examples:
      - Asia/Kolkata
  currency:
    type: string
    description: The currency of its prices.
    examples:
      - INR
  vertical_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Verticals it trades in.
  tags:
    type: array
    items:
      type: string
    description: Its search tags.
  highlights:
    type: array
    items:
      $ref: ../locations/Highlight.yaml
    description: The marks drawn on its card.
  fulfilment:
    $ref: ./StoreFulfilment.yaml
    description: How it fulfils.
  preparation_minutes:
    type: integer
    description: The preparation it quotes now, in minutes.
    examples:
      - 20
  new:
    type: boolean
    description: In its first thirty days.
  distance_metres:
    type:
      - integer
      - "null"
    description: The straight-line distance from the pin sent, rounded to 50 m under a kilometre and to 100 m above; `null` without one.
    examples:
      - 1200
  live:
    $ref: ./StoreLive.yaml
    description: What it is doing now.
  hours:
    type: array
    items:
      $ref: ./StoreHoursDay.yaml
    description: Its week from today, in its clock.
  term:
    $ref: ../reference/CatalogueTerm.yaml
    description: What it calls its catalogue.
  catalogue_type:
    $ref: ../services/CatalogueType.yaml
    description: Its catalogue type.
  menu:
    oneOf:
      - $ref: ./StoreMenuRef.yaml
      - type: "null"
    description: Its published menu; `null` when it has published nothing yet, which the page says where the menu will be.
  categories:
    type: array
    items:
      $ref: ./StoreCategoryTab.yaml
    description: The strip of its categories, from the published menu.
  rating:
    oneOf:
      - $ref: ../reviews/LocationRating.yaml
      - type: "null"
    description: "The store's rating, the share of thumbs up with how many reviews (\"72% (18)\"); `null` with no reviews or when it takes none, rather than 0%. Since 0.19.0."
examples:
  - location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    partner:
      id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
      name: ZippyGo Dev Partner
      logo: null
    name: Dev Kitchen Gachibowli
