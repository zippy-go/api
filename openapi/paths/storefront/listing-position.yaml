{
  "get": {
    "operationId": "getListingPosition",
    "summary": "Read where a store appears",
    "description": "Where the Location appears on the storefront, read from each zone's centre now: each listing with its position, the published rule that placed it and the figures the rule read, a sponsored placement saying so. Members need `location:read` at the Location.",
    "tags": [
      "Storefront"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "$ref": "../../components/parameters/PartnerIdPath.yaml"
      },
      {
        "name": "location_id",
        "in": "path",
        "required": true,
        "description": "The store.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "01a13a48-9e00-7000-8000-000000000301"
      }
    ],
    "responses": {
      "200": {
        "description": "The placements.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/storefront/ListingPosition.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
