type: object
description: Request body of `POST .../catalog/modifiers`. The least must be satisfiable by the answers offered and no more than the most (`modifier_rule_unsatisfiable`).
required:
  - name
properties:
  name:
    $ref: ./LocalizedText.yaml
    description: Its name.
  hint:
    oneOf:
      - $ref: ./LocalizedText.yaml
      - type: "null"
    description: A hint under it.
  min:
    type: integer
    description: The least answers it asks for; 0 when absent.
    minimum: 0
    maximum: 100
    examples:
      - 0
  max:
    type: integer
    description: The most it takes, 0 for no ceiling; 0 when absent.
    minimum: 0
    maximum: 100
    examples:
      - 1
  required:
    type: boolean
    description: It asks for at least one answer; `false` when absent.
  repeats:
    type: boolean
    description: An answer may be chosen more than once; `false` when absent.
  status:
    $ref: ./CatalogItemStatus.yaml
    description: Asked or not; `active` when absent.
  answers:
    type: array
    items:
      $ref: ./ModifierAnswerInput.yaml
    description: Its answers, in order.
    maxItems: 100
examples:
  - name:
      en: Choose your raita
    max: 1
    answers:
      - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
