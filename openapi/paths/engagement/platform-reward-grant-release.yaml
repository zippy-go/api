# Path item for /v1/platform/reward-grants/{grant_id}/release. Referenced from openapi.yaml.
parameters:
  - name: grant_id
    in: path
    required: true
    description: The grant.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e6001
post:
  operationId: releaseRewardGrant
  summary: Release a held reward
  description: "Releases a reward held for review: it is granted now, from its campaign's budget, and the customer is told. In the audit log; publishes `engagement.reward.released` and `engagement.reward.granted`. Mission Control tokens only, with `engagement:manage`."
  tags:
    - Rewards
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Why.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/engagement/RewardGrantDecision.yaml
  responses:
    "200":
      description: The grant, granted.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardGrant.yaml
    "400":
      description: "`validation_failed`: an empty reason or one over 300 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` (the member lacks `engagement:manage`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such grant."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`reward_grant_decided`: it is not held, released or refused already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
