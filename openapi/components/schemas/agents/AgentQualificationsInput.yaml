type: object
description: "The qualifications an Agent holds, in full: each named is approved, each left out withdrawn. Names compare without case or extra spaces."
required:
  - qualifications
properties:
  qualifications:
    type: array
    maxItems: 20
    items:
      type: string
      minLength: 2
      maxLength: 60
    description: At most 20 names, each 2 to 60 characters.
    examples:
      - - AC technician
        - Electrician
examples:
  - qualifications:
      - AC technician
      - Electrician
