type: object
description: A batch of single-use codes, downloadable as a spreadsheet named after it.
required:
  - id
  - offer_id
  - label
  - count
  - created_at
  - codes_url
properties:
  id:
    type: string
    format: uuid
    description: The batch.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6201
  offer_id:
    type: string
    format: uuid
    description: Its offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  label:
    type: string
    description: Its label, or its size.
    examples:
      - College fest flyers
  count:
    type: integer
    description: How many codes.
    examples:
      - 500
  created_at:
    type: string
    format: date-time
    description: When it was made.
    examples:
      - 2026-11-02T07:00:00Z
  codes_url:
    type: string
    description: "Its codes, relative to the API host; `Accept: text/csv` downloads them."
    examples:
      - /v1/platform/code-batches/0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6201/codes
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6201
    offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    label: College fest flyers
    count: 500
    created_at: 2026-11-02T07:00:00Z
    codes_url: /v1/platform/code-batches/0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6201/codes
