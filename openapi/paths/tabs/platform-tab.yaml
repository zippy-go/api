# Path item for /v1/platform/tabs/{tab_id}. Referenced from openapi.yaml.
parameters:
  - name: tab_id
    in: path
    required: true
    description: The tab, any Partner's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
get:
  operationId: getPlatformTab
  summary: Read a tab
  description: Any tab with its members, rounds, lines' states, bill, payments and history, for Mission Control's tab page. `order:read`.
  tags:
    - Dine-in
  security:
    - Bearer: []
  responses:
    "200":
      description: The tab.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/StoreTab.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `order:read` (`access_denied`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
