# Path item for /v1/platform/orders/{order_id}/prescriptions. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: "The order."
    schema:
      type: string
      format: uuid
get:
  operationId: getPlatformOrderPrescriptions
  summary: "Get an order's prescriptions in Mission Control"
  description: "The order's prescription lines, their verification and every reading of their files. Without `order:prescription`, the lines say only that a prescription is attached and how many files, with no ids. `order:read`."
  tags:
    - Prescriptions
  security:
    - Bearer: []
  responses:
    "200":
      description: "The prescription lines."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/prescriptions/OrderPrescriptions.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
