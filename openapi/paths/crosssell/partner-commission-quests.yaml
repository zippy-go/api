# Path item for /v1/partners/{partner_id}/commission-quests. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listCommissionQuests
  summary: List the quests the Partner may show
  description: Other Partners' live and scheduled quests carrying a referral commission that this Partner may agree to show on its Locations' pages (since 0.41.0), the newest first, each with the funding Partner, the commission, its dates and this Partner's agreement where it made one. A quest of a Partner sharing its legal entity is left out. `engagement:read`.
  tags:
    - Recommendations
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: cursor
      in: query
      required: false
      description: Where the page starts, the `next_cursor` of the page before.
      schema:
        type: string
  responses:
    "200":
      description: A page of quests.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/CommissionQuestPage.yaml
    "400":
      description: "`validation_failed`; `invalid_cursor`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `engagement:read`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: not a Partner the caller belongs to."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
