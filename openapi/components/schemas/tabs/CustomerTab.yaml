type: object
description: A tab in a signed-in customer's history, beside their orders in My orders.
required:
  - tab_id
  - number
  - location_id
  - store_name
  - table
  - state
  - total
  - you_paid
  - opened_at
  - closed_at
properties:
  tab_id:
    type: string
    format: uuid
    description: The tab, read with `GET /v1/tabs/{tab_id}`.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
  number:
    type: string
    description: Its number.
    examples:
      - AB0042
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  store_name:
    type: string
    description: Its name.
    examples:
      - Dev Kitchen Gachibowli
  table:
    type: string
    description: The table.
    examples:
      - "12"
  state:
    $ref: ./TabState.yaml
    description: Where it is.
  total:
    $ref: ../common/Money.yaml
    description: What it came to.
  you_paid:
    $ref: ../common/Money.yaml
    description: What the customer paid of it, tips included.
  opened_at:
    type: string
    format: date-time
    description: When it opened.
    examples:
      - 2026-11-06T14:31:00Z
  closed_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it ended.
    examples:
      - 2026-11-06T16:12:00Z
examples:
  - tab_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
    number: AB0042
    location_id: 01a13a48-9e00-7000-8000-000000000301
    store_name: Dev Kitchen Gachibowli
    table: "12"
    state: settled
    total:
      minor_units: 115500
      currency: INR
    you_paid:
      minor_units: 33875
      currency: INR
    opened_at: 2026-11-06T14:31:00Z
    closed_at: 2026-11-06T16:12:00Z
