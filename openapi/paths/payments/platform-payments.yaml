# Path item for /v1/platform/payments. Referenced from openapi.yaml.
get:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: listPlatformPayments
  summary: Every payment
  description: Mission Control's payments, newest first, narrowed by order, customer, Partner, status, method and purpose. `order:read`.
  parameters:
    - name: order_id
      in: query
      required: false
      description: Only this order's payments.
      schema:
        type: string
        format: uuid
    - name: customer_id
      in: query
      required: false
      description: Only this customer's payments.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/PartnerIdQuery.yaml
    - name: status
      in: query
      required: false
      description: Only payments in this status.
      schema:
        $ref: ../../components/schemas/payments/PaymentStatus.yaml
    - name: method
      in: query
      required: false
      description: Only payments by this method.
      schema:
        $ref: ../../components/schemas/payments/PaymentMethodKind.yaml
    - name: purpose
      in: query
      required: false
      description: Only payments of this purpose.
      schema:
        $ref: ../../components/schemas/payments/PaymentPurpose.yaml
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of payments.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/PaymentPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `order:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
