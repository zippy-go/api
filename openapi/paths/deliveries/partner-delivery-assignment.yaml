# Path item for /v1/partners/{partner_id}/deliveries/{delivery_id}/assignment. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: delivery_id
    in: path
    required: true
    description: The delivery, which must be one of the partner's stores'; another's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
post:
  operationId: givePartnerDelivery
  summary: Give a delivery to a team or an Agent
  description: "Gives an uncollected delivery to a team, for dispatch to choose within it, or to one of its Agents, of the partner's own delivery service; a delivery the platform fleet has comes back to the partner's own Agents, the fleet's offers withdrawn. The Agent lands it as the service is set: an offer the Agent accepts, or a direct assignment. An offline Agent may be chosen: the delivery is given with a warning in its log. The explanation names who chose and when, and the act is recorded on the delivery and in the audit log. Refused before a Provider has the delivery and after collection, and for an Agent who cannot take it, in words. Members need `dispatch:manage` in the partner; platform staff use the same routes with platform `dispatch:manage`, every act written to the audit log."
  tags:
    - Deliveries
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The team or the Agent, and an optional note.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/dispatch/DeliveryAssignmentInput.yaml
  responses:
    "200":
      description: The delivery.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/DeliveryDetail.yaml
    "400":
      description: "`validation_failed`: neither a team nor an Agent, or a note over 500 characters; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage`, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the partner, the delivery, the team or the Agent (an Agent of another partner answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`assignment_refused` naming why in words, with `errors[].code` one of `agent_over_limit`, `agent_kind_not_allowed`, `agent_suspended`, `agent_not_active`, `agent_cash_ceiling`, `agent_not_in_service`; `delivery_not_with_provider` before a Provider has it (ask for it first); `delivery_collected` once the Agent has the order (talk to them); `delivery_ended` once it is delivered, failed or called off."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
