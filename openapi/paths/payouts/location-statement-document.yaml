# Path item for /v1/partners/{partner_id}/locations/{location_id}/statements/{statement_id}/documents/{document}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the Partner's; a sister Location's statement answers `404`.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: statement_id
    in: path
    required: true
    description: The statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  - name: document
    in: path
    required: true
    description: "`statement` (PDF), `invoice` (PDF; `404` for a week with no fee) or `orders` (the order list, CSV)."
    schema:
      $ref: ../../components/schemas/payouts/StatementDocumentKind.yaml
    example: statement
get:
  operationId: getLocationStatementDocument
  summary: Draw a statement's document
  description: Draws the statement PDF, the invoice PDF or the order list (CSV) from the locked week when it is asked for; nothing is stored, and the link never expires. The order list's rows add up to the statement. A sister Location's statement answers `404`. `payout:read` at the Location.
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: "The document, with `Content-Disposition: attachment`."
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: The PDF.
        text/csv:
          schema:
            type: string
            description: The spreadsheet, one row per order, whose rows add up to the statement.
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A member without `payout:read` at the Location (`access_denied`), or a Partner whose envelope lacks it (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner, the Location or the statement does not exist or is not the caller's, or the week had no fee and so no invoice (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
