# Path item for /v1/platform/agent-documents. Referenced from openapi.yaml.
get:
  operationId: listAllAgentDocuments
  summary: List documents waiting for review across Partners
  description: "The documents of every Partner's Agents in a status, under review by default, oldest first: Mission Control reviews the platform fleet's through the Partner routes. Needs platform `agent:read`."
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: Only documents in this status; `under_review` by default.
      schema:
        $ref: ../../components/schemas/agents/AgentDocumentStatus.yaml
    - name: partner_id
      in: query
      required: false
      description: Only this Partner's.
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    - name: limit
      in: query
      required: false
      description: At most this many, 1 to 200; 50 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
      example: 50
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
  responses:
    "200":
      description: The documents.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDocumentPage.yaml
    "400":
      description: "`validation_failed`: a malformed filter, or `cursor_invalid`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` naming the platform permission."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
