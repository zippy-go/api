type: object
description: "A UPI AutoPay mandate paying a subscription: approved by the customer on the provider's page for at most 1.5 times a delivery's price rounded up to the next ₹100, never above the provider's ₹15,000.00; paused, resumed and cancelled with its subscription; revoked in the customer's UPI app. Each debit lands in the Wallet before its day is held."
required:
  - id
  - subscription_id
  - state
  - limit
  - frequency
  - starts_on
  - ends_on
  - upi_id
  - provider
  - approval
  - text
  - ended_reason
  - created_at
  - confirmed_at
  - ended_at
properties:
  id:
    type: string
    format: uuid
    description: The mandate.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7601
  subscription_id:
    type:
      - string
      - "null"
    format: uuid
    description: The subscription it pays.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
  state:
    $ref: ./MandateState.yaml
    description: Where it stands.
  limit:
    $ref: ../common/Money.yaml
    description: The most one debit may take.
  frequency:
    type: string
    description: "How often it debits: the subscription's `daily`, `weekdays`, `alternate_days`, `weekly` or `custom`."
    examples:
      - weekdays
  starts_on:
    type: string
    format: date
    description: Its first day.
    examples:
      - 2026-11-07
  ends_on:
    type:
      - string
      - "null"
    format: date
    description: Its last day; `null` until cancelled.
    examples:
      - null
  upi_id:
    type:
      - string
      - "null"
    description: The UPI ID it debits, masked; `null` until approved.
    examples:
      - as•••@okaxis
  provider:
    type: string
    description: The provider that holds it.
    examples:
      - simulated
  approval:
    oneOf:
      - $ref: ./MandateApproval.yaml
      - type: "null"
    description: The provider's page while it is pending; `null` otherwise.
  text:
    type: string
    description: Where it stands, in words.
    examples:
      - Approved for up to ₹100.00 a delivery, weekdays, until you cancel
  ended_reason:
    oneOf:
      - $ref: ./MandateEndReason.yaml
      - type: "null"
    description: Why it ended; `null` while it stands.
  created_at:
    type: string
    format: date-time
    description: When it was asked for.
    examples:
      - 2026-11-05T16:30:00Z
  confirmed_at:
    type:
      - string
      - "null"
    format: date-time
    description: When the customer approved it.
    examples:
      - 2026-11-05T16:31:10Z
  ended_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was cancelled or revoked.
    examples:
      - null
  debits:
    type: array
    items:
      $ref: ./MandateDebit.yaml
    description: "Its debits, the latest delivery day first: every one on a single mandate, the last fourteen in a list."
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7601
    subscription_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
    state: confirmed
    limit:
      minor_units: 10000
      currency: INR
    frequency: weekdays
    starts_on: 2026-11-07
    ends_on: null
    upi_id: as•••@okaxis
    provider: simulated
    approval: null
    text: Approved for up to ₹100.00 a delivery, weekdays, until you cancel
    ended_reason: null
    created_at: 2026-11-05T16:30:00Z
    confirmed_at: 2026-11-05T16:31:10Z
    ended_at: null
    debits:
      - date: 2026-11-06
        amount:
          minor_units: 6400
          currency: INR
        state: debited
        attempts: 1
        reason: null
        notified_at: 2026-11-04T02:30:00Z
        debited_at: 2026-11-05T03:30:00Z
        text: ₹64.00 for Fri 6 Nov, taken on Thu 5 Nov at 09:00 into your Wallet
