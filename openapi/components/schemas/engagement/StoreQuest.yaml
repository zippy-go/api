type: object
description: A quest a store's page shows (since 0.38.0) because the store agreed to show another Partner's quest; said "Partner offer" where it is shown.
required:
  - campaign_id
  - name
  - line
  - label
properties:
  campaign_id:
    type: string
    format: uuid
    description: The quest; Start it with `location_id` this store.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8001
  name:
    type: string
    description: Its name.
    examples:
      - Your first order from Charminar Bakes Gachibowli
  line:
    type: string
    description: What it asks and gives, in words.
    examples:
      - "Order from Charminar Bakes Gachibowli: ₹50.00 of credit"
  label:
    type: string
    description: How it is labelled.
    examples:
      - Partner offer
examples:
  - campaign_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8001
    name: Your first order from Charminar Bakes Gachibowli
    line: "Order from Charminar Bakes Gachibowli: ₹50.00 of credit"
    label: Partner offer
