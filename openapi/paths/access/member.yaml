delete:
  operationId: removeTeamMember
  summary: Remove a team member
  description: Removes a member, revoking every grant into the access history; `staff:write`. The user, their profile and their other memberships remain; the last enabled owner stays (`last_owner`).
  tags:
    - Access
  security:
    - Bearer: []
  responses:
    '204':
      description: Removed.
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without `staff:write`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or membership.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`last_owner`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
