# Path item for /v1/customer/subscriptions/{subscription_id}. Referenced from openapi.yaml.
parameters:
  - name: subscription_id
    in: path
    required: true
    description: The subscription, the customer's own.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
get:
  operationId: getCustomerSubscription
  summary: Read a subscription
  description: The subscription with its items, schedule, window, dates, address, way to pay, vacations and what the customer may do now. A pending one checks the Wallet again and starts when it now covers the first delivery.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  responses:
    "200":
      description: The subscription.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/Subscription.yaml
    "400":
      description: "`validation_failed`: a malformed identifier."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription is not the customer's."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
patch:
  operationId: updateSubscription
  summary: Change a subscription
  description: Moves the subscription to another saved address the store reaches, from the next cutoff (`address_outside_area` otherwise, and nothing changes); changes the substitution policy; or sets or clears its end date. The answer says from which day the change applies.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What changes.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/subscriptions/SubscriptionUpdate.yaml
  responses:
    "200":
      description: The subscription after the change.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/SubscriptionChange.yaml
    "400":
      description: "`validation_failed`: a malformed member, or an end before the minimum term (`end_out_of_range`)."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription, or the address is not the customer's."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`address_outside_area`, or `subscription_ended` for one cancelled or ended."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
