# Path item for /v1/customer/orders/{order_id}/help. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: requestOrderHelp
  summary: Ask for help with an order
  description: "Tells the platform what went wrong with an order, with a note of at most 1,000 characters: offering only what makes sense now (what arrived once it has, `cancel_order` while there is still something to stop). The request reaches Mission Control at once and shows on the order as needing somebody until support resolves it; the customer is told what was done."
  tags:
    - Orders
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What went wrong.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/HelpRequestInput.yaml
  responses:
    "201":
      description: The request, received.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/HelpRequest.yaml
    "400":
      description: "`validation_failed`: `other` without a note, or a note over 1,000 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`help_not_offered`: that help does not make sense for the order now, saying why."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
