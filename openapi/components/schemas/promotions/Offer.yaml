      names:
        - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
          kind: item
          name: Hyderabadi Biryani
    audience: everyone
    aim:
      location_ids:
        - 01a13a48-9e00-7000-8000-000000000301
