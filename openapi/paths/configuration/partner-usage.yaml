# Path item for /v1/partners/{partner_id}/usage. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartnerUsage
  summary: Get a month's usage
  description: "What the Partner's modules produced in a calendar month on its clock, each unit counted once per event: orders by kind, subscription occurrences, bookings, tabs, active Agents, API calls, webhook deliveries and messages, with what each will cost under the fee rule in force, and the month's invoice so far. `billing:read`; platform staff with `partner:read`."
  tags:
    - Billing
  security:
    - Bearer: []
  parameters:
    - name: month
      in: query
      required: false
      description: The calendar month on the Partner's clock, `YYYY-MM`; this month by default.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-11
  responses:
    "200":
      description: The month's usage.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/PartnerUsage.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner is not one the caller belongs to, or does not exist (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
