type: object
description: "A store's live orders: new ones oldest first, those being prepared soonest due first, ready ones longest waiting first, deliveries on their way longest on their way first (they stay until delivered or cancelled), and those finished in the last 24 hours. Kitchen mode shows `next_new_order_id` on the whole screen until it is answered. Read it again on `order.changed`, and every 30 seconds without live updates."
required:
  - location_id
  - at
  - taking
  - counts
  - new
  - preparing
  - ready
  - on_its_way
  - recent
  - next_new_order_id
properties:
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store.
  at:
    type: string
    format: date-time
    examples:
      - 2026-10-16T13:05:00Z
    description: The instant the answer is for.
  taking:
    $ref: ./OrderTaking.yaml
    description: Whether it takes new orders now.
  counts:
    $ref: ./LiveOrderCounts.yaml
    description: How many in each group.
  new:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: Placed, oldest first.
  preparing:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: Accepted, soonest due first.
  ready:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: Ready, longest waiting first.
  on_its_way:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: Deliveries handed over and on their way (and any not delivered), longest on their way first, until delivered or cancelled. Delivered by hand from the board until dispatch arrives in step 4.
  recent:
    type: array
    items:
      $ref: ./StoreOrder.yaml
    description: Finished in the last 24 hours, newest first.
  next_new_order_id:
    type:
      - string
      - "null"
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    description: "The oldest new order: the one kitchen mode shows."
