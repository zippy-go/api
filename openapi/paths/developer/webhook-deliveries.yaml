  "get": {
    "operationId": "listWebhookDeliveries",
    "summary": "List webhook deliveries",
    "description": "The delivery log of the last 30 days, the latest first, by endpoint, event type, outcome and period. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "parameters": [
      {
        "name": "endpoint_id",
        "in": "query",
        "required": false,
        "description": "Only this endpoint's.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      {
        "name": "event_type",
        "in": "query",
        "required": false,
        "description": "Only this event type.",
        "schema": {
          "type": "string"
        }
      },
      {
        "name": "outcome",
        "in": "query",
        "required": false,
        "description": "Only this outcome.",
        "schema": {
          "$ref": "../../components/schemas/developer/WebhookDeliveryOutcome.yaml"
        }
      },
      {
        "name": "from",
        "in": "query",
        "required": false,
        "description": "Made from.",
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      {
        "name": "to",
        "in": "query",
        "required": false,
        "description": "Made until.",
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "How many, 1 to 100; 50 by default.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50
        }
      },
      {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Where the page starts: the `next_cursor` of the page before.",
        "schema": {
          "type": "string"
        }
      }
    ],
    "responses": {
      "200": {
        "description": "A page of deliveries.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookDeliveryPage.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: a filter out of range or a cursor this caller was not given.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
