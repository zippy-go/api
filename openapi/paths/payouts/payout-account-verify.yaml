# Path item for /v1/partners/{partner_id}/payout-account/verify. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
post:
  operationId: verifyPayoutAccount
  summary: Verify the payout account
  description: "Marks the payout account verified by hand, for the day the payout provider is not there; platform staff with the approval permission (`partner:approve`). Since contract 0.19.0 it takes an optional reason, written to the audit log with the check; a statement held for the check is due at once, while the hold after a change of an existing account still runs its 48 hours (`account_changed`)."
  requestBody:
    required: false
    description: The reason, optionally.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/PayoutAccountVerification.yaml
  tags:
    - Payout accounts
  security:
    - Bearer: []
  responses:
    '200':
      description: The account, verified.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/PayoutAccount.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: Not platform staff.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner, or no account stated.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
