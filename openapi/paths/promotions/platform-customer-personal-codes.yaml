# Path item for /v1/platform/customers/{customer_id}/personal-codes. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: The customer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a01
post:
  operationId: givePersonalCode
  summary: Give a customer a personal code
  description: "Gives a customer a single-use personal code for one of the platform's offers, a thank-you from support: its offer is in their offers without their typing anything. Written to the audit log. `promotion:write` and `customer:read`."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/PersonalCodeInput.yaml
  responses:
    "201":
      description: The code.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferCode.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such customer, or no such offer of the platform (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`code_in_use`, or `offer_transition`: the offer ended or was cancelled."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
