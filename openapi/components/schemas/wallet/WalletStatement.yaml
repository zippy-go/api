type: object
description: "A calendar month of the Wallet in the market's clock: the opening and closing balances and every entry of the month, oldest first."
required:
  - month
  - currency
  - opening
  - closing
  - entries
properties:
  month:
    type: string
    description: The month, `YYYY-MM`.
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    examples:
      - 2026-09
  currency:
    type: string
    description: The Wallet's currency.
    pattern: ^[A-Z]{3}$
    examples:
      - INR
  opening:
    $ref: ../wallet/WalletBalances.yaml
    description: The balances when the month began.
  closing:
    $ref: ../wallet/WalletBalances.yaml
    description: The balances when it ended, or now for the month under way.
  entries:
    type: array
    items:
      $ref: ../wallet/WalletEntry.yaml
      description: An entry.
    description: Every entry of the month, oldest first.
examples:
  - month: 2026-09
    currency: INR
    opening:
      paid:
        minor_units: 0
        currency: INR
      promotional:
        minor_units: 0
        currency: INR
    closing:
      paid:
        minor_units: 0
        currency: INR
      promotional:
        minor_units: 5000
        currency: INR
    entries:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
        kind: credit
        balance: promotional
        amount:
          minor_units: 5000
          currency: INR
        held:
          minor_units: 0
          currency: INR
        balance_after:
          minor_units: 5000
          currency: INR
        held_after:
          minor_units: 0
          currency: INR
        reason: Late delivery
        note: null
        order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
        payment_id: null
        refund_id: null
        payer:
          kind: platform
          partner_id: null
        by_user_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b20
        created_at: 2026-10-16T09:00:00Z
