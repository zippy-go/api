# Path item for /v1/partners/{partner_id}/deliveries/{delivery_id}/ask. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: delivery_id
    in: path
    required: true
    description: The delivery, which must be one of the partner's stores'; another's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
post:
  operationId: askPartnerDeliveryAgain
  summary: Ask a Provider for a delivery again
  description: Asks for a delivery needing somebody again, from the first Provider of the store's chain as it stands now, with a new key; whatever the earlier ask made is let go and the log keeps both. An order accepted while its store named no Provider becomes askable here once one is configured. Members need `dispatch:manage` in the partner; platform staff use the same routes with platform `dispatch:manage`, every act written to the audit log.
  tags:
    - Deliveries
  security:
    - Bearer: []
  responses:
    "200":
      description: The delivery, asked again.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/DeliveryDetail.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage`, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the partner or the delivery."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`nothing_to_ask` while a Provider has the delivery and nothing is wrong with it; `delivery_collected` once collected; `delivery_ended` once it ended; `no_provider` while the store names no Provider that can carry it."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
