type: object
description: Where a field Service takes bookings around a Location, the `FieldArea` schema.
properties:
  polygon:
    type:
      - array
      - 'null'
    items:
      type: array
      items:
        type: number
        format: double
    description: A drawn polygon, one ring of `[longitude, latitude]` points, in place of the radius.
  radius_km:
    type:
      - integer
      - 'null'
    description: A radius around the Location, in kilometres, up to 25; 10 by default.
    minimum: 0
    examples:
      - 10
  whole_zone:
    type: boolean
    description: The Location's whole zone, in place of either.
examples:
  - radius_km: 10
    polygon: null
    whole_zone: false
