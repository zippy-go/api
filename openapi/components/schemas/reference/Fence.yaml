type: object
description: |-
  A fence: one or more polygons, each as its outer ring of `[longitude, latitude]` points,
  the `Fence` schema.
required:
  - rings
properties:
  rings:
    type: array
    items:
      type: array
      items:
        type: array
        items:
          type: number
          format: double
    description: The polygons' outer rings; each ring is closed (first point repeated last).
    examples:
      - &a1
        - - - 78.42
            - 17.39
          - - 78.47
            - 17.39
          - - 78.47
            - 17.44
          - - 78.42
            - 17.44
          - - 78.42
            - 17.39
examples:
  - rings: *a1
