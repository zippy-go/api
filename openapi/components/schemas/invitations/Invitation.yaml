type: object
description: |
  An invitation to join a partner with a given role, sent by email. The
  invited person accepts it with the token from the email through
  `POST /v1/invitations/{token}/accept`; the token itself is never returned
  by the API. The invitation is `pending` until it is accepted, revoked or
  past `expires_at`.
required:
  - id
  - partner_id
  - email
  - role
  - status
  - expires_at
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the invitation.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
  partner_id:
    type: string
    format: uuid
    description: The partner the invitation is for.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  email:
    type: string
    format: email
    description: The email address the invitation was sent to.
    examples:
      - manager@example.com
  role:
    $ref: ../memberships/MembershipRole.yaml
    description: The role the membership will have once the invitation is accepted.
  status:
    $ref: ./InvitationStatus.yaml
    description: The state of the invitation.
  expires_at:
    type: string
    format: date-time
    description: When the invitation stops being acceptable, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-21T08:15:00Z
  created_at:
    type: string
    format: date-time
    description: When the invitation was created, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-14T08:15:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a31
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    email: manager@example.com
    role: manager
    status: pending
    expires_at: 2026-10-21T08:15:00Z
    created_at: 2026-10-14T08:15:00Z
