# Path item for /v1/auth/refresh. Referenced from openapi.yaml.
post:
  operationId: refreshSession
  summary: Refresh the session
  description: |
    Issues a new access token for the current session and rotates the
    refresh token. Where the refresh token travels depends on the client:

    - Browsers received it at sign-in in an `httpOnly` cookie named
      `zg_refresh`, scoped to the path `/v1/auth`. They send no body, or an
      empty object, and the response sets a new cookie; `refresh_token` in
      the body stays `null`.
    - Native clients sent `X-Client-Type: native` when signing in and
      received `refresh_token` in the body. They send it back here in
      `refresh_token` and receive the new one in the body.

    Every refresh token can be used once. Presenting a token that was
    already used revokes the whole session, as a defence against a stolen
    token, and the user has to sign in again. A missing, unknown, expired
    or revoked token answers `401` (`unauthenticated`).
  tags:
    - Auth
  security: []
  requestBody:
    required: false
    description: The refresh token, for native clients only. Browsers send no body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/RefreshRequest.yaml
  responses:
    '200':
      description: A new access token and a new refresh token were issued; the previous refresh token is no longer valid.
      headers:
        Set-Cookie:
          description: For browsers, the new refresh token as `zg_refresh=<token>; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`. Absent for native clients.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/TokenResponse.yaml
    '401':
      description: No refresh token was sent, or it is unknown, expired, already used or revoked (`unauthenticated`). Sign in again.
      headers:
        Set-Cookie:
          description: For browsers, clears the `zg_refresh` cookie when the token it carried was rejected.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `400` (`validation_failed`) for a malformed body or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
