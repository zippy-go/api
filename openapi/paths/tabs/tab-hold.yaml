# Path item for /v1/tabs/{tab_id}/hold. Referenced from openapi.yaml.
parameters:
  - name: tab_id
    in: path
    required: true
    description: The tab, of which the caller is a member.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
post:
  operationId: holdTabCard
  summary: Hold a card for a tab
  description: Where the Location asks for a card hold, holds its amount on a card through payments before the tab's first round reaches the kitchen, which waits for it; the hold is let go when the tab is paid and charged up to what is owed when a manager closes it unpaid. Answers `pending` with the provider's page, then `paid` once held. A card that cannot be held is charged and given back at once, and the tab turns to paying each round first by UPI (`pay_first`).
  tags:
    - Dine-in
  security:
    - Bearer: []
    - {}
  parameters:
    - name: X-Visitor-Token
      in: header
      required: false
      description: A guest's visitor token (`POST /v1/visitor-tokens`), in place of a customer's bearer token.
      schema:
        type: string
  requestBody:
    required: true
    description: The card.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tabs/TabHoldInput.yaml
  responses:
    "201":
      description: The hold started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/TabPaymentStarted.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the tab, or the caller is not one of its members."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`tab_not_open`, or the Location asks for no hold (`card_hold_off`)."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
