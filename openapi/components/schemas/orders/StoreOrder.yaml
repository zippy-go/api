type: object
description: "An order as its store runs it: the one move it waits for and its timer, the customer as the store may see them, every line with its answers under the part they belong to and its mark, what to collect for cash, and its history."
required:
  - id
  - number
  - status
  - version
  - location_id
  - partner_id
  - fulfilment
  - carrier
  - customer
  - placed_at
  - accept_by
  - accepted_at
  - preparation_minutes
  - ready_by
  - due_by
  - ready_at
  - completed_at
  - waits_for
  - timer
  - if_unavailable
  - lines
  - item_count
  - total
  - charged
  - to_collect
  - payment_method
  - cutlery
  - history
  - refunds
  - ended
  - cancellable
properties:
  id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    description: The order.
  number:
    type: string
    examples:
      - AB0042
    description: Its number.
  status:
    $ref: ./OrderStatus.yaml
    description: Its status.
  version:
    type: integer
    examples:
      - 3
    description: Raised on every change; the entity tag.
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store.
  partner_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
    description: Its Partner.
  fulfilment:
    $ref: ./OrderFulfilment.yaml
    description: Delivery or pickup.
  carrier:
    oneOf:
      - $ref: ../locations/Carrier.yaml
      - type: "null"
    description: Who carries a delivery.
  customer:
    $ref: ./OrderCustomer.yaml
    description: The customer, as the store may see them.
  placed_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:00:00Z
    description: When it was placed.
  accept_by:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:30:00Z
    description: When it is declined as not answered unless accepted.
  accepted_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:02:00Z
    description: When it was accepted.
  preparation_minutes:
    type:
      - integer
      - "null"
    examples:
      - 20
    description: The preparation time it was accepted with.
  ready_by:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:22:00Z
    description: When it was promised ready.
  due_by:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:52:00Z
    description: When it was promised at the door or the counter.
  ready_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:20:00Z
    description: When it was marked ready.
  completed_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:45:00Z
    description: When it was collected or delivered.
  waits_for:
    oneOf:
      - $ref: ./OrderMove.yaml
      - type: "null"
    description: The one move it waits for; `null` once it waits for none of the store's.
  timer:
    oneOf:
      - $ref: ./OrderTimer.yaml
      - type: "null"
    description: What it counts towards.
  if_unavailable:
    $ref: ./IfUnavailable.yaml
    description: What the customer asked for an unavailable item.
  lines:
    type: array
    items:
      $ref: ./OrderLine.yaml
    description: Every line.
  item_count:
    type: integer
    examples:
      - 2
    description: How many items.
  total:
    $ref: ../common/Money.yaml
    description: The total as ordered.
  charged:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: What is kept after lines left out; `null` until accepted.
  to_collect:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: For cash, what the agent or the counter collects.
  payment_method:
    oneOf:
      - $ref: ./PaymentMethod.yaml
      - type: "null"
    description: How the rest was paid.
  cutlery:
    type: boolean
    examples:
      - false
    description: Whether cutlery is wanted.
  history:
    type: array
    items:
      $ref: ./OrderHistoryEntry.yaml
    description: Every move, oldest first.
  refunds:
    type: array
    items:
      $ref: ./OrderRefund.yaml
    description: The refunds charged to the Partner.
  ended:
    oneOf:
      - $ref: ./OrderEnd.yaml
      - type: "null"
    description: How it ended, with the note.
  cancellable:
    type: boolean
    examples:
      - false
    description: Whether the store may cancel it now (accepted or ready).
  courier:
    oneOf:
      - $ref: ./StoreCourier.yaml
      - type: "null"
    description: "Who carries a delivery and a way to call them, once the Agent's app has it; `null` before and for a pickup."
  expected_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:44:00Z
    description: "When it is expected at the door now, as the customer was last told."
  delivery_id:
    type:
      - string
      - "null"
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
    description: "The delivery under way, or the last one; read it from the dispatch routes. `null` for a pickup and before acceptance."
  carried_by_provider:
    type: boolean
    examples:
      - true
    description: "Whether a Provider carries the delivery: the store then hands nothing over and delivers nothing by hand, the Agent's steps move the order; `false` for an order no Provider carries, which the store moves by hand."
  proof:
    oneOf:
      - $ref: ./OrderProof.yaml
      - type: "null"
    description: "The proof of delivery, once delivered."
examples:
