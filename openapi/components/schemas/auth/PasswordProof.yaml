type: object
description: 'The request body of the operations that ask for the password again before they act: replacing the recovery codes and turning two-step sign-in off.'
required:
  - password
properties:
  password:
    type: string
    description: The account's current password. A wrong one is refused and counts in the sign-in throttle.
examples:
  - password: example-passphrase-2026
