# Path item for /v1/auth/password. Referenced from openapi.yaml.
post:
  operationId: changePassword
  summary: Set or change the password
  description: |
    Sets the signed-in user's password, so that they can also sign in with
    `POST /v1/auth/password/sign-in`. A user who signed up with a one-time
    code has no password yet and sends `current_password` as `null` or
    omits it; a user who already has a password must send it, and a wrong
    one answers `403` (`forbidden`).

    The new password must be at least 12 characters long. Otherwise the
    response is `400` (`validation_failed`) with an `errors` entry that
    points at `/new_password` and carries the code `password_weak`.
  tags:
    - Auth
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The current password, when one is set, and the new one.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordChangeRequest.yaml
  responses:
    '204':
      description: The password was set.
    '400':
      description: The body failed validation (`validation_failed`). A `new_password` that does not meet the policy is reported with the code `password_weak` on the `errors` entry that points at it.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The user has a password and `current_password` is missing or does not match it (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
