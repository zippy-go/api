# Path item for /v1/partners/{partner_id}/locations/{location_id}/holidays/{date}/closure. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The location, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: date
    in: path
    required: true
    description: The holiday's date, as an RFC 3339 full date.
    schema:
      type: string
      format: date
    example: 2027-01-26
post:
  operationId: closeLocationForHoliday
  summary: Close a location for a holiday
  description: "Marks a public holiday closed at the Location in one act: a closed-all-day closure named after the holiday, added to the Location's own schedule. A holiday already covered says so. Owners and managers."
  tags:
    - Locations
  security:
    - Bearer: []
  responses:
    '200':
      description: The Location's schedule layer as saved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/ScheduleLayer.yaml
    '400':
      description: Not an upcoming public holiday of the Location's country.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The role does not change Locations.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or location.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: Already closed that day.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
