# Path item for /v1/platform/modules. Referenced from openapi.yaml.
get:
  operationId: listPlatformModules
  summary: List the modules
  description: The catalogue of modules with the Service each needs, the lowest plan that includes it and its add-on price. `setting:read`.
  tags:
    - Configuration
  security:
    - Bearer: []
  responses:
    "200":
      description: The catalogue.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/ModuleCatalogue.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
