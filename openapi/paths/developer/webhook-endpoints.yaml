{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    }
  ],
  "get": {
    "operationId": "listWebhookEndpoints",
    "summary": "List the Partner's webhook endpoints",
    "description": "Both environments' endpoints with where each stands. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "responses": {
      "200": {
        "description": "The endpoints.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookEndpointList.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage` for a key without it.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  },
  "post": {
    "operationId": "registerWebhookEndpoint",
    "summary": "Register a webhook endpoint",
    "description": "An HTTPS endpoint (or `localhost` on a developer's machine) for the event types it names, with a signing secret shown this once. A `platform.ping` is sent at once; the endpoint receives nothing else until it answers a ping with a 2xx. At most 10 per environment. Announced as `developer.endpoint.registered`. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "parameters": [
      {
        "$ref": "../../components/parameters/IdempotencyKeyHeader.yaml"
      }
    ],
    "requestBody": {
      "required": true,
      "description": "The endpoint.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/developer/WebhookEndpointInput.yaml"
          }
        }
      }
    },
    "responses": {
      "201": {
        "description": "The endpoint and its secret.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookEndpointCreated.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: an address that is not HTTPS (`webhook_url_not_https`), or an unknown event type.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`webhook_endpoint_limit` at 10 in the environment.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
