# Path item for /v1/platform/bookings. Referenced from openapi.yaml.
get:
  operationId: listPlatformBookings
  summary: List bookings across Partners
  description: "Bookings across Partners: those declined as not answered, running late and disputed first, then the latest. Mission Control with `order:read`."
  tags:
    - Bookings
  security:
    - Bearer: []
  parameters:
    - name: state
      in: query
      required: false
      description: Only bookings in this state.
      schema:
        $ref: ../../components/schemas/bookings/BookingState.yaml
    - name: location_id
      in: query
      required: false
      description: Only this Location's.
      schema:
        type: string
        format: uuid
    - name: flagged
      in: query
      required: false
      description: Only those not answered, running late or disputed.
      schema:
        type: boolean
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts: the `next_cursor` of the page before."
      schema:
        type: string
  responses:
    "200":
      description: The bookings.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/bookings/PlatformBookingList.yaml
    "400":
      description: "`validation_failed`, or `cursor_invalid`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied`: the staff member lacks `order:read`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
