# Path item for /v1/platform/ledger/entries. Referenced from openapi.yaml.
get:
  tags:
    - Ledger
  security:
    - Bearer: []
  operationId: listLedgerEntries
  summary: The journal
  description: "Journal entries newest first, each with its postings, debits equal to credits: narrowed by account, order, payment, customer, Partner, kind and period. `ledger:read`."
  parameters:
    - name: account_id
      in: query
      required: false
      description: Only entries posting to this account.
      schema:
        type: string
        format: uuid
    - name: order_id
      in: query
      required: false
      description: Only this order's entries.
      schema:
        type: string
        format: uuid
    - name: payment_id
      in: query
      required: false
      description: Only this payment's entries.
      schema:
        type: string
        format: uuid
    - name: customer_id
      in: query
      required: false
      description: Only this customer's entries.
      schema:
        type: string
        format: uuid
    - $ref: ../../components/parameters/PartnerIdQuery.yaml
    - name: kind
      in: query
      required: false
      description: Only entries of this kind.
      schema:
        $ref: ../../components/schemas/ledger/LedgerEntryKind.yaml
    - name: from
      in: query
      required: false
      description: Only entries posted at or after this instant.
      schema:
        type: string
        format: date-time
    - name: until
      in: query
      required: false
      description: Only entries posted before this instant.
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of entries.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ledger/LedgerEntryPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `ledger:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
