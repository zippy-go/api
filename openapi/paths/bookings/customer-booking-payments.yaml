# Path item for /v1/customer/bookings/{booking_id}/payments. Referenced from openapi.yaml.
parameters:
  - name: booking_id
    in: path
    required: true
    description: The booking.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000b001
post:
  operationId: payBookingRemainder
  summary: Pay what remains
  description: "Pays what remains after the job, the approved estimate and extras less what was paid, by UPI, card or the Wallet: the provider's page while it waits. One payment per `Idempotency-Key`."
  tags:
    - Bookings
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: How to pay.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/bookings/BookingPaymentRequest.yaml
  responses:
    "201":
      description: The payment started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/bookings/BookingPaymentStarted.yaml
    "400":
      description: "`validation_failed`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such booking of the customer."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`booking_moved`; `nothing_to_pay`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
