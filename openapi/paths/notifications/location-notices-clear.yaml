# Path item for /v1/partners/{partner_id}/locations/{location_id}/notices/clear. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: 'The Location, which must belong to the partner in the path.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
post:
  operationId: clearLocationNotices
  summary: Clear notices from the inbox
  description: |
    Clears the notices named, or the whole inbox with `all`, for everybody at
    the Location; they leave the inbox at once. A request naming another
    Location's notices clears nothing and answers `cleared: 0`. Mission Control
    keeps the record of when each Location cleared a notice. `notice:read` at
    the Location.
  tags:
    - Notices
  security:
    - Bearer: []
  requestBody:
    required: true
    description: 'The notices to clear, or all.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/notifications/NoticeClear.yaml
  responses:
    '200':
      description: 'How many were cleared.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticesCleared.yaml
    '400':
      description: '`validation_failed`: neither `notice_ids` nor `all` (`selection_required`), or a malformed id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `notice:read` at this Location (`access_denied`); platform staff read with `notice:send` and change nothing (`forbidden`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'Unknown partner or Location, or a Location of another partner (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
