{
  "get": {
    "operationId": "listCustomerExports",
    "summary": "List my exports",
    "description": "The customer's exports, the newest first, each preparing, ready for seven days, failed or expired.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
