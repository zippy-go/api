type: object
description: A page of an offer's uses, newest first, with its budget.
required:
  - items
  - next_cursor
  - budget
properties:
  items:
    type: array
    items:
      $ref: ./OfferRedemption.yaml
    description: The uses on this page.
  next_cursor:
    type:
      - string
      - "null"
    description: An opaque cursor for the next page, or `null` on the last.
    examples:
      - null
  budget:
    $ref: ./OfferBudget.yaml
    description: The budget and uses.
