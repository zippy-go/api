# Path item for /v1/tabs/{tab_id}/rounds. Referenced from openapi.yaml.
parameters:
  - name: tab_id
    in: path
    required: true
    description: The tab, of which the caller is a member.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
post:
  operationId: sendTabRound
  summary: Send a round
  description: "Sends a round put together on the phone, whole: it reaches the kitchen at once, or under pay-first once paid (`POST .../payments` with its `round_id`). Sending again with one `Idempotency-Key` answers the round the first sent. `409`: `tab_not_open` once the bill is presented (staff reopen it), `lines_refused`."
  tags:
    - Dine-in
  security:
    - Bearer: []
    - {}
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
    - name: X-Visitor-Token
      in: header
      required: false
      description: A guest's visitor token (`POST /v1/visitor-tokens`), in place of a customer's bearer token.
      schema:
        type: string
  requestBody:
    required: true
    description: The round.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tabs/TabRoundInput.yaml
  responses:
    "201":
      description: The tab with the round.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/Tab.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the tab, or the caller is not one of its members."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`tab_not_open` or `lines_refused`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
