# Path item for /v1/platform/tickets. Referenced from openapi.yaml.
get:
  operationId: listTickets
  summary: List the ticket queue
  description: "The support queue (since 0.41.0): every help request a ticket, Gold customers' first, then Silver's, then Members', each the oldest first, by state; open by default. The tier is engagement's when the queue is read. `ticket:manage`."
  tags:
    - Customers
  security:
    - Bearer: []
  parameters:
    - name: state
      in: query
      required: false
      description: "`open`, `taken` or `resolved`; `open` by default."
      schema:
        type: string
        enum:
          - open
          - taken
          - resolved
    - name: limit
      in: query
      required: false
      description: 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    - name: cursor
      in: query
      required: false
      description: Where the page starts, the `next_cursor` of the page before.
      schema:
        type: string
  responses:
    "200":
      description: A page of tickets.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/TicketPage.yaml
    "400":
      description: "`validation_failed`; `invalid_cursor`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `ticket:manage`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
