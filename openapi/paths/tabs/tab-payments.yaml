# Path item for /v1/tabs/{tab_id}/payments. Referenced from openapi.yaml.
parameters:
  - name: tab_id
    in: path
    required: true
    description: The tab, of which the caller is a member.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0201
post:
  operationId: payTab
  summary: Pay a share
  description: "Pays a share of the bill from a diner's phone: what remains, an equal part, the lines named with their share of GST and the service charge, or a sum, with a tip for the restaurant that is never taxed. Each payment is captured at once with its own receipt; the tab is settled by the payment that leaves nothing remaining, and the floor shows it paid within seconds. Under pay-first, `round_id` pays a round before it reaches the kitchen. `409`: `tab_payment_over` saying what remains, `tab_bill_not_presented`, `tab_not_open`."
  tags:
    - Dine-in
  security:
    - Bearer: []
    - {}
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
    - name: X-Visitor-Token
      in: header
      required: false
      description: A guest's visitor token (`POST /v1/visitor-tokens`), in place of a customer's bearer token.
      schema:
        type: string
  requestBody:
    required: true
    description: The share, the way to pay and the tip.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/tabs/TabPaymentInput.yaml
  responses:
    "201":
      description: The payment started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/TabPaymentStarted.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the tab, or the caller is not one of its members."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`tab_payment_over`, `tab_bill_not_presented`, `tab_not_open`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
