type: object
description: >-
  The request body of `POST /v1/auth/otp/request`: where to send a one-time code, and the surface the code signs in to.
required:
  - channel
  - identifier
  - audience
properties:
  channel:
    $ref: ./OtpChannel.yaml
    description: The channel to deliver the code through.
  identifier:
    type: string
    minLength: 3
    maxLength: 254
    description: The email address when `channel` is `email`, or the phone number in E.164 format (a `+`, the country code and the number, no spaces) when `channel` is `phone`.
    examples:
      - owner@example.com
  audience:
    $ref: ./Audience.yaml
    description: >-
      The surface the code signs in to, required (`validation_failed` with `audience_required` on `/audience`): `partner` (the Partner console) or `agent` (the Agent app). Mission Control is never offered a code (`audience_not_allowed`).
examples:
  - channel: email
    identifier: owner@example.com
    audience: partner
