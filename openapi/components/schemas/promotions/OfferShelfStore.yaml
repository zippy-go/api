type: object
description: A Location on a shelf, leading with the offer that put it there.
required:
  - location_id
  - offer
properties:
  location_id:
    type: string
    format: uuid
    description: The Location, one of the list's cards.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  offer:
    $ref: ./StoreOfferBadge.yaml
    description: The offer that put it on the shelf.
examples:
  - location_id: 01a13a48-9e00-7000-8000-000000000301
    offer:
      offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
      line: Buy 1, get 1 free
      more: 1
      code: null
      shelf: deals
