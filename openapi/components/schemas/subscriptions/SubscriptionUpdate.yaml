type: object
description: A change of a subscription; absent members keep what is stored. A new address applies from the next cutoff and must be one the store reaches.
properties:
  address_id:
    type: string
    format: uuid
    description: One of the customer's saved addresses.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a81
  substitution:
    $ref: ./SubstitutionPolicy.yaml
    description: What the store does with an item it cannot supply.
  ends_on:
    type:
      - string
      - "null"
    format: date
    description: The last day; `null` makes it open-ended.
    examples:
      - 2026-11-30
examples:
  - address_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a81
