# Path item for /v1/platform/modules/{module}. Referenced from openapi.yaml.
parameters:
  - name: module
    in: path
    required: true
    description: The module.
    schema:
      $ref: ../../components/schemas/configuration/ModuleCode.yaml
    example: subscriptions
put:
  operationId: putPlatformModule
  summary: Offer or withdraw a module
  description: Offers a module, or withdraws it from every Partner at once; audited. `configuration:write`.
  tags:
    - Configuration
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Offered or withdrawn, and why.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/configuration/ModuleDefinitionUpdate.yaml
  responses:
    "200":
      description: The module as it now stands.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/ModuleDefinition.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
