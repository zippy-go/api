# Path item for /v1/partners/{partner_id}/services/{service_id}/pay-rules. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: service_id
    in: path
    required: true
    description: The delivery service, one of the Partner's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
get:
  operationId: listPayRules
  summary: List a service's pay rule versions
  description: "Every published version of the service's pay rule, newest first. A service that never published one runs the defaults as version 1: ₹25 per pickup, ₹30 per drop-off, ₹6 per km of routed distance, ₹1 per minute of waiting beyond 10 minutes at a pickup, ₹20 for a task called off after the Agent started towards it, tips in full. Members need `agent:read` for the service; Mission Control uses the same route with its platform permissions."
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The versions.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PayRuleList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: publishPayRule
  summary: Publish a pay rule version
  description: Publishes a new version of the pay rule to the service's Agents, in force for offers made after it; a task keeps the version it was offered under. Members need `agent:manage` for the service; Mission Control manages the platform fleet, and any Partner's Agents, with the same route and its platform permissions, every change written to the audit log.
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The new version.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/PayRulePublish.yaml
  responses:
    "201":
      description: The version published.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PayRule.yaml
    "400":
      description: "`validation_failed`: a negative amount, one in another currency, or free minutes outside 0 to 60."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
