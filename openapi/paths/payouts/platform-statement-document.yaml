# Path item for /v1/platform/statements/{statement_id}/documents/{document}. Referenced from openapi.yaml.
parameters:
  - name: statement_id
    in: path
    required: true
    description: The statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  - name: document
    in: path
    required: true
    description: "`statement` (PDF), `invoice` (PDF; `404` for a week with no fee) or `orders` (the order list, CSV)."
    schema:
      $ref: ../../components/schemas/payouts/StatementDocumentKind.yaml
    example: statement
get:
  operationId: getStatementDocument
  summary: Draw a statement's document
  description: Draws the statement PDF, the invoice PDF or the order list (CSV) of a Location's locked week. `payout:read`.
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: "The document, with `Content-Disposition: attachment`."
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: The PDF.
        text/csv:
          schema:
            type: string
            description: The spreadsheet, one row per order, whose rows add up to the statement.
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such statement, or the week had no fee and so no invoice (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
