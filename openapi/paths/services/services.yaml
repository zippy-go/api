# Path item for /v1/partners/{partner_id}/services. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listServices
  summary: List services
  description: |
    Returns the registry of the partner: its services, oldest first, in any
    status, each with the locations it is switched on at, whether it trades
    and what stops it; every kind as enabled, awaiting documents, disabled,
    available, or not in the plan with the plan that includes it; and the
    plan. Any member of the partner and the platform realm may read it. The
    list is not paginated.
  tags:
    - Services
  security:
    - Bearer: []
  responses:
    '200':
      description: The partner's services.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/ServiceList.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createService
  summary: Register a service
  description: 'Registers a Service: several of one kind are allowed. Enabled unless `enabled` is `false`; a kind the plan lacks is refused naming the plan that has it; a kind needing documents not yet approved (product sales of a food catalogue type needs the FSSAI licence) lands in `awaiting_documents`, configurable and not trading. Switched on everywhere unless `location_ids` names some. Send `Idempotency-Key` to make a repeated creation answer the first. Owners and managers; platform staff with a reason.'
  tags:
    - Services
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/services/ServiceCreate.yaml
  responses:
    '201':
      description: The Service as registered.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/Service.yaml
    '400':
      description: Malformed body, a configuration of the wrong shape, a Location not the Partner's, or platform staff without a reason.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Neither owner nor manager, or `not_in_plan`: the plan does not include the kind.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`partner_archived`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
