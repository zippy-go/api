# Path item for /v1/customer/subscriptions/{subscription_id}/cancel. Referenced from openapi.yaml.
parameters:
  - name: subscription_id
    in: path
    required: true
    description: The subscription, the customer's own.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
post:
  operationId: cancelSubscription
  summary: Cancel a subscription
  description: Cancels at any time, before the minimum term too. Before the cutoff nothing is generated for tomorrow; after it tomorrow's order stands, and the answer offers to cancel that order too, which the customer may until the store accepts it (`POST /v1/customer/orders/{order_id}/cancel`). The balance stays in the Wallet; a mandate is cancelled with it. The store sees it.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Why, optionally.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/subscriptions/SubscriptionCancelInput.yaml
  responses:
    "200":
      description: The cancelled subscription; `applies_from` is the first day without a delivery, and the message names an order that stands.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/SubscriptionChange.yaml
    "400":
      description: "`validation_failed`: a malformed member."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription is not the customer's."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`subscription_ended`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
