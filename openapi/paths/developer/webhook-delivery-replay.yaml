{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    },
    {
      "name": "delivery_id",
      "in": "path",
      "required": true,
      "description": "The delivery.",
      "schema": {
        "type": "string",
        "format": "uuid"
      },
      "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7d01"
    }
  ],
  "post": {
    "operationId": "replayWebhookDelivery",
    "summary": "Replay a webhook delivery",
    "description": "Sends the delivery again at once, with its original event id. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "responses": {
      "202": {
        "description": "Sent again.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookDelivery.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
