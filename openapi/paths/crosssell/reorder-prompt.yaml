# Path item for /v1/customer/reorder-prompts/{term_id}. Referenced from openapi.yaml.
parameters:
  - name: term_id
    in: path
    required: true
    description: The category of the prompt, its `term_id`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
delete:
  operationId: stopCustomerReorderPrompts
  summary: "Not for this: stop a category's reorder prompts"
  description: |
    "Not for this": the customer is no longer prompted to reorder from this
    category, by push or on the home screen. The other categories' prompts carry
    on.
  tags:
    - Recommendations
  security:
    - Bearer: []
  responses:
    "204":
      description: 'Stopped, or stopped already.'
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such term (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
