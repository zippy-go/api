# Path item for /v1/customer/mandates/{mandate_id}. Referenced from openapi.yaml.
parameters:
  - name: mandate_id
    in: path
    required: true
    description: The mandate.
    schema:
      type: string
      format: uuid
get:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: getCustomerMandate
  summary: One of the customer's mandates
  description: A mandate with every debit, the latest delivery day first, and, while it is pending, the provider's page to approve it on. Another customer's mandate is not found. Customer tokens only.
  responses:
    "200":
      description: The mandate.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/Mandate.yaml
    "400":
      description: A malformed identifier (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such mandate of the customer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
