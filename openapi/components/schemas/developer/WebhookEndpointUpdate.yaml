{
  "type": "object",
  "description": "What changes on an endpoint; what is left out stays.",
  "required": [],
  "properties": {
    "url": {
      "type": "string",
      "description": "A new address; it must be verified again.",
      "format": "uri",
      "examples": [
        "https://pos.example.com/zippygo/v2"
      ]
    },
    "event_types": {
      "type": "array",
      "items": {
        "type": "string",
        "description": "An event type.",
        "examples": [
          "ordering.order.placed"
        ]
      },
      "description": "What it subscribes to.",
      "minItems": 1
    },
    "description": {
      "type": [
        "string",
        "null"
      ],
      "description": "What it is for.",
      "examples": [
        "POS bridge"
      ]
    }
  },
  "examples": [
    {
      "event_types": [
        "ordering.order.placed",
        "ordering.order.delivered"
      ]
    }
  ]
}
