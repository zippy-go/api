type: object
description: "A Location's pharmacy set by its Partner; a changed licence waits for Mission Control's verification again, the `PharmacySettingsUpdate` schema."
required:
  - licence_number
  - licence_expires_on
properties:
  licence_number:
    type: string
    description: "The licence number."
    examples:
      - "TS/HYD/2025/20B-1234"
  licence_expires_on:
    type: string
    format: date
    description: "The last day it is valid."
    examples:
      - "2028-03-31"
  pharmacist_membership_id:
    type:
      - string
      - "null"
    format: uuid
    description: "The member who is the registered pharmacist; `null` names nobody."
    examples:
      - "0192b6f4-9b0a-7cde-8f3a-6d2c1e4be001"
  pharmacist_registration_number:
    type:
      - string
      - "null"
    description: "Their registration number."
    examples:
      - "TSPC/2019/04521"
  pharmacist_council:
    type:
      - string
      - "null"
    description: "Their state pharmacy council."
    examples:
      - "Telangana State Pharmacy Council"
examples:
  - {"licence_number": "TS/HYD/2025/20B-1234", "licence_expires_on": "2028-03-31", "pharmacist_membership_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4be001", "pharmacist_registration_number": "TSPC/2019/04521", "pharmacist_council": "Telangana State Pharmacy Council"}
