type: object
description: "A dynamic UPI code for what a tab has left to pay, a payment of the tab through payments: paying it in a UPI app settles the tab."
required:
  - payment_id
  - amount
  - upi_uri
  - qr_svg
  - expires_at
properties:
  payment_id:
    type: string
    format: uuid
    description: The tab's payment it starts.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
  amount:
    $ref: ../common/Money.yaml
    description: What it asks.
  upi_uri:
    type: string
    description: "The link the code carries: the provider's UPI link; with the simulated provider, its page."
    examples:
      - https://sandbox.zippygo.local/sim/provider/pay/simpay_3kq8zp2r
  qr_svg:
    type: string
    description: The code itself, an SVG to print or show.
    examples:
      - <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="240" height="240"></svg>
  expires_at:
    type: string
    format: date-time
    description: When it stops working.
    examples:
      - 2026-11-06T16:30:00Z
examples:
  - payment_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
    amount:
      minor_units: 84000
      currency: INR
    upi_uri: https://sandbox.zippygo.local/sim/provider/pay/simpay_3kq8zp2r
    qr_svg: <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="240" height="240"></svg>
    expires_at: 2026-11-06T16:30:00Z
