# Path item for /v1/customer/rewards/points/conversions. Referenced from openapi.yaml.
post:
  operationId: convertPoints
  summary: Convert points into credit
  description: "Converts points into promotional Wallet credit at 100 points for ₹10.00, in whole hundreds, at least 500, the oldest points first; the credit never expires and moves the points' liability in the ledger into the Wallet. Honours `Idempotency-Key`: a retry converts once."
  tags:
    - Rewards
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: How many points.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/engagement/PointsConversionInput.yaml
  responses:
    "201":
      description: The conversion.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/PointsConversion.yaml
    "400":
      description: "`validation_failed`, with `points_below_minimum` under 500 or `points_not_whole_hundreds`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`points_insufficient`: more than they hold; `idempotency_key_reuse`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
