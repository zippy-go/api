# Path item for /v1/agent/invitations/{invitation_id}/accept. Referenced from openapi.yaml.
parameters:
  - name: invitation_id
    in: path
    required: true
    description: The invitation, as `GET /v1/agent/invitations` lists it.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
post:
  operationId: acceptAgentInvitation
  summary: Accept an invitation
  description: "Accepts an invitation in progress for the person's verified number or email: the membership becomes pending, and lists the documents still needed. Accepting again answers the same membership. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  responses:
    "200":
      description: The membership, pending.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentMembership.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no invitation in progress for the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`agent_already_member`: the person already holds a membership in the service."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "410":
      description: "`invitation_invalid`: the invitation lapsed or was withdrawn; ask the Partner to send it again."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
