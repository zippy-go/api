# Path item for /v1/platform/bundles/{bundle_id}. Referenced from openapi.yaml.
parameters:
  - name: bundle_id
    in: path
    required: true
    description: The bundle.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8401
get:
  operationId: getPlatformBundle
  summary: Read a bundle
  description: A bundle with both sides, their answers and offers. Answers `ETag`. Needs the platform's `promotion:read`.
  tags:
    - Bundles
  security:
    - Bearer: []
  responses:
    "200":
      description: The bundle.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/Bundle.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without the platform's `promotion:read`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
patch:
  operationId: updatePlatformBundle
  summary: Change a bundle
  description: "Changes a bundle: a draft anything, a published or live bundle only its name and end. Honours `If-Match`. Needs the platform's `promotion:write`. Audited."
  tags:
    - Bundles
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The members to change.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/crosssell/BundleUpdate.yaml
  responses:
    "200":
      description: The bundle.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/Bundle.yaml
    "400":
      description: "`validation_failed`, with `bundle_too_far` or `bundle_same_partner`; `malformed_identifier`."
      content:
        application/problem+json:
          schema: *a1
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without the platform's `promotion:write`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`conflict` for a change a published bundle does not take, or a stopped bundle."
      content:
        application/problem+json:
          schema: *a1
    "412":
      description: "`precondition_failed` when `If-Match` names an older version."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
