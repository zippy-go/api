# Path item for /v1/partners/{partner_id}/locations/{location_id}/kitchen/changes. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: listKitchenChanges
  summary: Read what changed in the kitchen
  description: Every ticket of the Location changed after the cursor, as it stands now, bumped and withdrawn ones included so a display takes them off, up to `limit` with `more` when others wait. A display reads it within seconds of `ticket.changed` on `private-location-{location_id}-kitchen`, every 30 seconds regardless, and the moment it is back online. `order:read` at the Location.
  tags:
    - Kitchen
  security:
    - Bearer: []
  parameters:
    - name: after
      in: query
      required: false
      description: "The cursor of the last read: of `listKitchenTickets`, of this operation, or of the marks' results."
      schema:
        type: string
    - name: station_id
      in: query
      required: false
      description: "One of the Location's stations: each ticket with its lines at that station only, and only the tickets with one; an item given to no station shows at every station."
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8101
    - name: display_id
      in: query
      required: false
      description: "The display reading, an id it keeps: it is counted as seen, and a ticket made while every display of the Location was away lands marked late to arrive."
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8401
    - name: limit
      in: query
      required: false
      description: How many tickets, 1 to 100; 100 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
  responses:
    "200":
      description: The changes.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/kitchen/KitchenChanges.yaml
    "400":
      description: "`validation_failed`: a malformed identifier, a limit out of range, a cursor this caller was not given (`cursor_invalid`), or a station that is not the Location's (`station_unknown`)."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:read` at the Location), `not_enabled_for_partner`, or `forbidden` for a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such Partner or Location for the caller."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
