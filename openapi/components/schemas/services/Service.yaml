type: object
description: |
  A service a partner runs: a line of business of one kind (product sales,
  field service or delivery), with its name, status and configuration, the
  locations it is switched on at, and whether it trades there now with what
  stops it. A partner may run several services of one kind. Registered with
  `POST /v1/partners/{partner_id}/services` and changed with `PATCH`; the
  step 1 `PUT /v1/partners/{partner_id}/services/{kind}` keeps working on the
  partner's first service of the kind.
required:
  - id
  - partner_id
  - kind
  - status
  - config
  - created_at
  - updated_at
  - name
  - everywhere
  - location_ids
  - awaiting
  - trading
  - blockers
  - version
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the service.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  partner_id:
    type: string
    format: uuid
    description: The partner that runs the service.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  kind:
    $ref: ./ServiceKind.yaml
    description: The kind of service.
  status:
    $ref: ./ServiceStatus.yaml
    description: Whether the service is in operation.
  config:
    type: object
    additionalProperties: true
    description: Settings specific to the kind of service, as last put. The keys of each kind are documented when that kind's features are released; an empty object when nothing is configured.
    examples:
      - {}
  created_at:
    type: string
    format: date-time
    description: When the service was first put, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-14T08:30:00Z
  updated_at:
    type: string
    format: date-time
    description: When the service was last put, as an RFC 3339 timestamp in UTC; equal to `created_at` until the first change.
    examples:
      - 2026-10-14T08:30:00Z
  name:
    type: string
    description: Its name, defaulting to its kind.
    examples:
      - Delivery
  everywhere:
    type: boolean
    description: '`true` when it is switched on at every Location of the Partner, present and future.'
  location_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Locations it is switched on at (every open Location when `everywhere`).
  awaiting:
    type: array
    items:
      $ref: ../documents/DocumentKind.yaml
    description: The documents it waits for, while `awaiting_documents`.
  trading:
    type: boolean
    description: '`true` when it trades somewhere now: enabled, in the plan, the Partner active, switched on at a Location, and with agents for an agent-based kind.'
  blockers:
    type: array
    items:
      $ref: ../partners/Blocker.yaml
    description: 'What stops it trading, each with its code: `service_disabled`, `document_missing`, `document_pending`, `document_rejected`, `document_expired`, `not_in_plan`, `partner_not_active`, `switched_on_nowhere`, `no_agents`.'
  version:
    type: integer
    description: The version, raised by one on every change.
    examples:
      - 1
  agents:
    type:
      - integer
      - 'null'
    description: The agents holding a membership in it, for delivery and field Services; `null` for product sales or when the fleet cannot say.
    minimum: 0
    examples:
      - 4
  created_by:
    type:
      - string
      - 'null'
    format: uuid
    description: Who registered it; `null` for the step 1 rows and the seed.
  pricing_version:
    type:
      - integer
      - 'null'
    description: The current pricing version, for a delivery Service that has one.
    examples:
      - 3
  status_reason:
    type:
      - string
      - 'null'
    description: Why it is in its status, when platform staff or a plan change set it.
    examples:
      - Not in the Starter plan
  updated_by:
    type:
      - string
      - 'null'
    format: uuid
    description: Who last changed it.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    kind: product_sales
    name: Product sales
    status: awaiting_documents
    status_reason: null
    config:
      catalogue_type: food
    everywhere: true
    location_ids: &a1
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
    awaiting:
      - fssai_licence
    trading: false
    blockers:
      - code: document_missing
        message: The FSSAI licence is not on file.
        pointer: /documents/fssai_licence
    agents: null
    pricing_version: null
    version: 1
    created_at: 2026-10-14T08:30:00Z
    updated_at: 2026-10-14T08:30:00Z
    created_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    updated_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a46
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    kind: delivery
    name: Delivery
    status: enabled
    status_reason: null
    config:
      vehicle_types:
        - kind: two_wheeler
          max_weight_kg: 12
          max_volume_litres: 40
      coverage_radius_km: 8
      open_to_partners: true
    everywhere: false
    location_ids: *a1
    awaiting: []
    trading: true
    blockers: []
    agents: 4
    pricing_version: 3
    version: 1
    created_at: 2026-10-14T08:30:00Z
    updated_at: 2026-10-14T08:30:00Z
    created_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    updated_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
