# Path item for /v1/auth/two-step/recovery-codes. Referenced from openapi.yaml.
post:
  operationId: replaceRecoveryCodes
  summary: Replace the recovery codes
  description: Replaces the recovery codes with ten new ones, only after the password again.
  tags:
    - Auth
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The password again.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordProof.yaml
  responses:
    '200':
      description: The new codes; the old ones no longer work.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/RecoveryCodes.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: the password is wrong (it counts in the throttle).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`conflict`: two-step sign-in is off.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: '`too_many_requests`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
