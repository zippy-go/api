# Path item for /v1/auth/password/sign-in. Referenced from openapi.yaml.
post:
  operationId: signInWithPassword
  summary: Sign in with a password
  description: |
    Exchanges an email address and a password for a session on one surface,
    named in `audience` (`partner`, `platform` or `agent`), with the refresh
    token delivered as `delivery` says, as for `POST /v1/auth/otp/verify`. A
    client that names no audience keeps the step 1 behaviour: it signs in to
    Mission Control when the account holds platform access and to the
    Partner console otherwise.

    An unknown email address, a wrong password, a user without a password, a
    disabled account and a surface the account may not enter all answer
    `401` (`authentication_failed`), in about the same time, without saying
    which it was. The Agent app is entered by agents only, people who hold
    an agent membership in a Service. Five failures in fifteen minutes for
    one identifier on one surface, or from one client, lock it for the rest
    of the window (`429`, `too_many_requests`, with `Retry-After`).

    When the account has two-step sign-in on, a right password answers `202`
    with a `TwoStepChallenge`; complete the sign-in at
    `POST /v1/auth/two-step/verify`. Platform staff without a second factor
    receive a Mission Control session that reaches the two-step set-up only
    (`two_step_setup_required` is `true`).

    A user gets a password by setting one with `POST /v1/auth/password`, by
    choosing one when accepting an invitation, or through a password link
    (`POST /v1/auth/password/reset-request`).
  tags:
    - Auth
  security: []
  parameters:
    - $ref: ../../components/parameters/ClientTypeHeader.yaml
  requestBody:
    required: true
    description: The email address, the password, the surface and the delivery.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordSignInRequest.yaml
  responses:
    '200':
      description: The credentials were accepted and a session was created.
      headers:
        Set-Cookie:
          description: >-
            With cookie delivery, the refresh token in the cookie of the surface signed in to: `zg_refresh_partner`, `zg_refresh_platform` or `zg_refresh_agent` (`zg_refresh` for a client that named no audience and sent no `X-Client-Type: native`), as `<name>=<token>; Path=/v1/auth; Max-Age=<seconds>; HttpOnly; Secure; SameSite=Strict`. Absent with body delivery.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/TokenResponse.yaml
    '202':
      description: The credential was right and the account has two-step sign-in on. No session exists yet; send an authenticator or recovery code with the `challenge_id` to `POST /v1/auth/two-step/verify`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/TwoStepChallenge.yaml
    '400':
      description: The body failed validation (`validation_failed`), for example an `email` that is not an email address, `delivery_required` on `/delivery` when an audience is named without a delivery, or `audience_not_allowed` on `/audience`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: The sign-in did not succeed (`authentication_failed`); the answer is the same whatever the reason.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: The sign-in throttle holds the identifier on this surface, or the client (`too_many_requests`).
      headers:
        Retry-After:
          description: The number of seconds until the throttle lets the identifier or the client try again.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
