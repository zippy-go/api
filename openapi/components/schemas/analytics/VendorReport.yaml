{
  "type": "object",
  "description": "One report to one vendor, by the name the analytics spec gives it, flat, money in major units, never a name, a number, an email, an address, a precise coordinate, free words or anything of a prescription; the advertising vendor knows the customer only as a hash.",
  "required": [
    "report_id",
    "vendor",
    "event",
    "source_event_id",
    "state",
    "parameters",
    "customer_hash",
    "reason",
    "attempts",
    "queued_at",
    "sent_at"
  ],
  "properties": {
    "report_id": {
      "type": "string",
      "description": "The report.",
      "format": "uuid",
      "examples": [
        "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01"
      ]
    },
    "vendor": {
      "$ref": "./AnalyticsVendorCode.yaml"
    },
    "event": {
      "type": "string",
      "description": "Its name: `order_placed`, `promo_applied`, `order_accepted`, `order_picked_up`, `order_on_the_way`, `order_delivered`, `order_picked_up_customer`, `partner_delivery`, `order_refunded`, `review_submitted` or `cart_abandoned`.",
      "examples": [
        "promo_applied"
      ]
    },
    "source_event_id": {
      "type": "string",
      "description": "The warehouse event it was made from; one report per event, vendor and name.",
      "format": "uuid",
      "examples": [
        "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01"
      ]
    },
    "state": {
      "$ref": "./VendorReportState.yaml"
    },
    "parameters": {
      "type": "object",
      "description": "What the vendor was told, flat.",
      "additionalProperties": true,
      "examples": [
        {
          "order_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b5e01",
          "value": 1249.0,
          "currency": "INR",
          "discount": 125.0,
          "environment": "local"
        }
      ]
    },
    "customer_hash": {
      "type": [
        "string",
        "null"
      ],
      "description": "The customer as a SHA-256 hash of their id, for the advertising vendor only.",
      "examples": [
        null
      ]
    },
    "reason": {
      "type": [
        "string",
        "null"
      ],
      "description": "Why it was skipped or failed.",
      "examples": [
        null
      ]
    },
    "attempts": {
      "type": "integer",
      "description": "How many times it was tried.",
      "minimum": 0,
      "examples": [
        1
      ]
    },
    "queued_at": {
      "type": "string",
      "description": "When it was queued.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    },
    "sent_at": {
      "type": [
        "string",
        "null"
      ],
      "description": "When it went, or the stand-in kept it.",
      "format": "date-time",
      "examples": [
        "2026-11-02T10:15:00Z"
      ]
    }
  },
  "examples": [
    {
      "report_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01",
      "vendor": "google_analytics",
      "event": "promo_applied",
      "source_event_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01",
      "state": "sent",
      "parameters": {
        "order_id": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b5e01",
        "value": 1249.0,
        "currency": "INR",
        "discount": 125.0,
        "environment": "local"
      },
      "customer_hash": null,
      "reason": null,
      "attempts": 1,
      "queued_at": "2026-11-02T10:15:00Z",
      "sent_at": "2026-11-02T10:15:00Z"
    }
  ]
}
