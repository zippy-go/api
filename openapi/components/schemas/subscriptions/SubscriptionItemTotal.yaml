type: object
description: How many of one item a day needs.
required:
  - variant_id
  - name
  - variant_label
  - quantity
properties:
  variant_id:
    type: string
    format: uuid
    description: The variant.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
  name:
    type: string
    description: The item.
    examples:
      - Toned milk
  variant_label:
    type:
      - string
      - "null"
    description: The variant.
    examples:
      - 500 ml
  quantity:
    type: integer
    minimum: 0
    description: How many.
    examples:
      - 148
examples:
  - variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
    name: Toned milk
    variant_label: 500 ml
    quantity: 148
