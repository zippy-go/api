# Path item for /v1/platform/offers/{offer_id}/code-batches. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
get:
  operationId: listCodeBatches
  summary: List an offer's batches
  description: The batches of single-use codes made for one of the platform's offers, newest first. `promotion:read`.
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of batches.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/CodeBatchPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such offer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createCodeBatch
  summary: Make a batch of single-use codes
  description: Makes 1 to 10,000 distinct single-use codes of 10 characters with no look-alikes (no 0, O, 1, I or L) for one of the platform's offers, labelled; each belongs to the first customer who adds it. `promotion:write`.
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/CodeBatchInput.yaml
  responses:
    "201":
      description: The batch.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/CodeBatch.yaml
    "400":
      description: "`validation_failed`: a count outside 1 to 10,000, or a stamp card."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such offer of the platform (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_transition`: the offer ended or was cancelled."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
