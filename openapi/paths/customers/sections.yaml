# Path item for /v1/customer/sections. Referenced from openapi.yaml.
get:
  operationId: listCustomerAccountSections
  summary: List the account's sections
  description: The account's sections in order, each saying whether it works today and, if not, which step of the delivery plan brings it; with the summary that answers without a click.
  tags:
    - Customer account
  security:
    - Bearer: []
  responses:
    '200':
      description: The sections in order and the summary.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/AccountSectionList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: '`not_found`: the user has no customer profile.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
