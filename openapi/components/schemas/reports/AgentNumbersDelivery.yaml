type: object
description: A delivery an Agent made, with when they took, collected and delivered it.
required:
  - delivery_id
  - order_id
  - order_number
  - location_id
  - taken_at
  - collected_at
  - delivered_at
  - minutes_to_door
  - km
  - on_time
properties:
  delivery_id:
    type: string
    format: uuid
    description: The delivery.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
  order_id:
    type: string
    format: uuid
    description: Its order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB0042
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  taken_at:
    type: string
    format: date-time
    description: When the Agent took it.
    examples:
      - 2026-10-22T13:12:00Z
  collected_at:
    type:
      - string
      - "null"
    format: date-time
    description: When they collected it.
    examples:
      - 2026-10-22T13:25:00Z
  delivered_at:
    type:
      - string
      - "null"
    format: date-time
    description: When they delivered it.
    examples:
      - 2026-10-22T13:40:00Z
  minutes_to_door:
    type:
      - number
      - "null"
    description: Minutes from taking it to the door.
    examples:
      - 28
  km:
    type:
      - number
      - "null"
    description: Kilometres, measured.
    examples:
      - 3.6
  on_time:
    type:
      - boolean
      - "null"
    description: Whether it was at the door by the promise; `null` when no promise was known.
examples:
  - delivery_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    order_number: AB0042
    location_id: 01a13a48-9e00-7000-8000-000000000301
    taken_at: 2026-10-22T13:12:00Z
    collected_at: 2026-10-22T13:25:00Z
    delivered_at: 2026-10-22T13:40:00Z
    minutes_to_door: 28
    km: 3.6
    on_time: true
