type: object
description: A notice in a Location's inbox, shared by everybody who signs in to the Location.
required:
  - notice_id
  - title
  - message
  - sent_at
  - expires_at
  - first_seen_at
properties:
  notice_id:
    type: string
    format: uuid
    description: The notice.
  title:
    type: string
    description: Its title.
  message:
    type: string
    description: Its message.
  sent_at:
    type: string
    format: date-time
    description: When it was sent.
  expires_at:
    type: string
    format: date-time
    description: When it leaves the inbox by itself, seven days after sending.
  first_seen_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When somebody at the Location first saw it; `null` while it is unread.
examples:
  - notice_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
    title: Agents are running late
    message: Heavy rain in the city. Agents are taking longer to reach stores; please keep orders warm.
    sent_at: 2026-10-16T12:00:00Z
    expires_at: 2026-10-23T12:00:00Z
    first_seen_at: null
