type: object
description: Suggested names, one of each name, best first.
required:
  - query
  - items
  - took_ms
properties:
  query:
    type: string
    description: What was typed.
    examples:
      - biry
  items:
    type: array
    items:
      $ref: ./SearchSuggestion.yaml
    description: The suggestions.
  took_ms:
    type: number
    description: How long it took at the server, in milliseconds.
    examples:
      - 3.1
examples:
  - query: biry
    items:
      - kind: product
        name: Hyderabadi Biryani
        location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
        item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    took_ms: 3.1
