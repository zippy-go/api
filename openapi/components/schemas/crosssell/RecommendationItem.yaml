type: object
description: A recommended item as its store's published menu has it.
required:
  - item_id
  - name
  - price
  - picture
  - food_mark
  - available
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
  name:
    $ref: ../catalog/LocalizedText.yaml
    description: Its name.
  price:
    $ref: ../common/Money.yaml
    description: What it costs, its lowest option's price.
  picture:
    oneOf:
      - $ref: ../catalog/CataloguePicture.yaml
      - type: "null"
    description: Its first picture.
  food_mark:
    oneOf:
      - $ref: ../catalog/FoodMark.yaml
      - type: "null"
    description: Its vegetarian mark, where it carries one.
  available:
    type: boolean
    description: Whether it can be ordered now.
    examples:
      - true
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
    name:
      en: Eggless Black Forest Cake
    price:
      minor_units: 45000
      currency: INR
    picture: null
    food_mark: veg
    available: true
