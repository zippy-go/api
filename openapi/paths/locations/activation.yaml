# Path item for /v1/partners/{partner_id}/locations/{location_id}/activation. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The location, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: getLocationActivation
  summary: Read what going live needs
  description: 'What going live needs for the Location: its status and every blocker (its Partner not active; for a store, no fulfilment, closed all week, no Vertical), the checklist the consoles show before an attempt. Members and platform staff.'
  tags:
    - Locations
  security:
    - Bearer: []
  responses:
    '200':
      description: The status and the blockers.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/LocationActivation.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or location.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
