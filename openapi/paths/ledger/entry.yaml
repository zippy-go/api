# Path item for /v1/platform/ledger/entries/{entry_id}. Referenced from openapi.yaml.
get:
  tags:
    - Ledger
  security:
    - Bearer: []
  operationId: getLedgerEntry
  summary: One journal entry
  description: A journal entry with its postings and the event it was posted from. `ledger:read`.
  parameters:
    - name: entry_id
      in: path
      required: true
      description: The entry.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The entry.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ledger/LedgerEntry.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `ledger:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such entry (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
