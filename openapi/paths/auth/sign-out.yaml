# Path item for /v1/auth/sign-out. Referenced from openapi.yaml.
post:
  operationId: signOut
  summary: Sign out
  description: |
    Ends the current session, or with `everywhere` every session of the
    user on every surface, and clears the refresh cookie. The answer is `204`
    whether or not the session still existed, so signing out never fails for
    a client.

    The session is the one the bearer access token belongs to (its `sid`
    claim) or, when the access token has expired, the one the refresh cookie
    (named by `audience`) or the body's `refresh_token` belongs to. Its
    refresh token can no longer be used; a Mission Control access token is
    refused from the next request, other access tokens stay valid until their
    `exp`, at most 15 minutes, and clients discard them. Only the cookie of
    the surface named by `audience`, or the bearer token's, is cleared. A
    view-as (impersonation) token signs nobody out: `403` (`forbidden`); the
    platform member ends the view-as session at
    `POST /v1/platform/impersonation/sessions/{impersonation_id}/end`.
  tags:
    - Auth
  security:
    - {}
    - Bearer: []
  requestBody:
    required: false
    description: Optional. `everywhere` to end every session; the surface or the refresh token when the access token has expired.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/SignOutRequest.yaml
  responses:
    '204':
      description: The session (or every session) ended, or there was nothing to end.
      headers:
        Set-Cookie:
          description: Clears the refresh cookie of the surface (`<name>=; Path=/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict`).
          schema:
            type: string
    '400':
      description: The body is not a readable `SignOutRequest` (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: A view-as (impersonation) token, which signs nobody out (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
