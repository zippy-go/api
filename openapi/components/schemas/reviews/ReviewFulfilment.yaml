type: string
description: "How the order reached the customer: `delivered`, `delivered_by_own_agent` (by one of the store's own Agents; customers read it as delivered), `collected`, or, since 0.28.0, `dine_in` for a settled tab (the tab's id is its order id), or, since 0.29.0, `on_site` for a completed booking (its order of fulfilment on site)."
enum:
  - delivered
  - delivered_by_own_agent
  - collected
  - dine_in
  - on_site
examples:
  - delivered
