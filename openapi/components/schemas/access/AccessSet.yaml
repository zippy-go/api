type: object
description: "The request body of `PUT /v1/partners/{partner_id}/members/{membership_id}/access`: the member's whole access as one role, at the whole partner when no Location or Service is named, or at each one named. The difference from the current grants is applied as grants and revocations."
required:
  - role_id
properties:
  role_id:
    type: string
    format: uuid
    description: The role, a role of the partner held by who acts.
  location_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Locations the role applies at; none named, and no Service, means the whole partner.
  service_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Services the role applies at.
examples:
  - role_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
    location_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
    service_ids: []
