# Path item for /v1/platform/agents/{agent_id}/payout-account/verify. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000107
post:
  operationId: verifyAgentPayoutAccount
  summary: Check where an Agent is paid, by hand
  description: Marks an Agent's payout account checked by hand with a reason, for the day the payout provider is not there; written to the audit log. A statement held for it is due without the hold at once. `partner:approve`.
  tags:
    - Payouts
  security:
    - Bearer: []
  requestBody:
    required: false
    description: The reason.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/PayoutAccountVerification.yaml
  responses:
    "200":
      description: The account, checked.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/AgentPayoutAccount.yaml
    "400":
      description: "`validation_failed`: a reason over 500 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `partner:approve` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Agent, or no account given yet (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
