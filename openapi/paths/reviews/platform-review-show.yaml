# Path item for /v1/platform/reviews/{review_id}/show. Referenced from openapi.yaml.
parameters:
  - name: review_id
    in: path
    required: true
    description: "The review."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0001"
post:
  operationId: showReview
  summary: "Show a review's note and photos again"
  description: "Shows a hidden review's note and photos again, without a reason. Written to the audit log; publishes `reviews.review.shown`. Showing a shown review changes nothing. Mission Control tokens only, with `review:manage`."
  tags:
    - Reviews
  security:
    - Bearer: []
  responses:
    "200":
      description: "The review, shown."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/PlatformReview.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such review."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
