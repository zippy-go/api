type: object
description: "An Agent's trip: its stops in order, pickups and drops of one or several deliveries, the next stop first, and its pay under the service's rule. The app does not care which mode made it: a planned route, a drop added on demand or one delivery."
required:
  - id
  - agent_id
  - partner_id
  - service_id
  - route_id
  - status
  - window_starts_at
  - window_ends_at
  - stops
  - deliveries
  - pay
  - next_task_id
  - created_at
  - finished_at
properties:
  id:
    type: string
    format: uuid
    description: The trip.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8201
  agent_id:
    type: string
    format: uuid
    description: The Agent.
    examples:
      - 01a13a48-9e00-7000-8000-000000000107
  partner_id:
    type: string
    format: uuid
    description: The delivery service's Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000002
  service_id:
    type: string
    format: uuid
    description: The delivery service.
    examples:
      - 01a13a48-9e00-7000-8000-000000000402
  route_id:
    type:
      - string
      - "null"
    format: uuid
    description: The planned route it carries; `null` on demand.
    examples:
      - null
  status:
    type: string
    enum:
      - active
      - finished
    description: Active while a stop is open.
    examples:
      - active
  window_starts_at:
    type:
      - string
      - "null"
    format: date-time
    description: A route's window; `null` on demand.
    examples:
      - null
  window_ends_at:
    type:
      - string
      - "null"
    format: date-time
    description: The window's end.
    examples:
      - null
  stops:
    type: array
    items:
      $ref: ./AgentTripStop.yaml
    description: Every stop in order.
  deliveries:
    type: integer
    minimum: 1
    description: The deliveries it carries.
    examples:
      - 2
  pay:
    $ref: ./PayQuote.yaml
    description: "What the trip pays under the rule it was given with: each stop and the distance."
  next_task_id:
    type:
      - string
      - "null"
    format: uuid
    description: The next open stop; `null` once every stop ended.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8301
  created_at:
    type: string
    format: date-time
    description: When the Agent was given it.
    examples:
      - 2026-10-16T13:10:45Z
  finished_at:
    type:
      - string
      - "null"
    format: date-time
    description: When its last stop ended.
    examples:
      - null
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8201
    agent_id: 01a13a48-9e00-7000-8000-000000000107
    partner_id: 01a13a48-9e00-7000-8000-000000000002
    service_id: 01a13a48-9e00-7000-8000-000000000402
    route_id: null
    status: active
    window_starts_at: null
    window_ends_at: null
    stops:
      - task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8301
        sequence: 1
        kind: pickup
        status: accepted
        order_number: AB0042
        name: Gachibowli Dairy
        address: Plot 12, Financial District Road, Gachibowli
        lat: 17.4401
        lng: 78.3489
        planned_at: 2026-11-06T00:35:00Z
        ready: true
    deliveries: 2
    pay:
      rule_version: 3
      lines:
        - kind: distance
          label: 3.2 km at ₹6.00 per km
          amount:
            minor_units: 1920
            currency: INR
      total:
        minor_units: 7420
        currency: INR
    next_task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8301
    created_at: 2026-10-16T13:10:45Z
    finished_at: null
