type: object
description: "A payment of a tab: from a diner's phone or recorded at the counter."
required:
  - payment_id
  - by
  - member_name
  - method
  - amount
  - tip
  - status
  - paid_at
properties:
  payment_id:
    type: string
    format: uuid
    description: The payment.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
  by:
    type: string
    enum:
      - diner
      - counter
    description: "`diner` or `counter`."
    examples:
      - diner
  member_name:
    type:
      - string
      - "null"
    description: The diner who paid; `null` at the counter.
    examples:
      - Asha
  method:
    type: string
    enum:
      - upi
      - card
      - wallet
      - cash
    description: "`upi`, `card`, `wallet` or, at the counter, `cash`."
    examples:
      - upi
  amount:
    $ref: ../common/Money.yaml
    description: What it paid of the bill.
  tip:
    $ref: ../common/Money.yaml
    description: The tip added to it.
  status:
    type: string
    enum:
      - pending
      - paid
      - failed
    description: "`pending` until the provider confirms it, then `paid`, or `failed`."
    examples:
      - paid
  paid_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was confirmed.
    examples:
      - 2026-11-06T16:12:00Z
  receipt_token:
    type:
      - string
      - "null"
    description: "The receipt's token, for the caller's own payment once paid: its page at `/receipts/{token}`."
    examples:
      - null
examples:
  - payment_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0701
    by: diner
    member_name: Asha
    method: upi
    amount:
      minor_units: 28875
      currency: INR
    tip:
      minor_units: 0
      currency: INR
    status: paid
    paid_at: 2026-11-06T16:12:00Z
    receipt_token: null
