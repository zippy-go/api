parameters:
  - name: alpha2
    in: path
    required: true
    description: The ISO 3166-1 alpha-2 code
    schema:
      type: string
    example: IN
get:
  operationId: getCountryPolicy
  summary: The country's service policy layer, its latest version
  description: The country's service policy layer, its latest version.
  tags:
    - Countries
  security:
    - Bearer: []
  responses:
    "200":
      description: The layer; version 0 when never set
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/PolicyLayer.yaml
    "401":
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`: a Mission Control token without `city:read`"
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: Unknown country
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "503":
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putCountryPolicy
  summary: Saves a new version of the country's service policy layer
  description: "Saves a new version of the country's service policy layer; platform staff. A change of its `fee_rule` waits for a second person: it is proposed (`set_fee_rule`) and answers 202 with the proposal, the rest of the layer unchanged."
  tags:
    - Countries
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/ServicePolicy.yaml
  responses:
    "200":
      description: The layer as saved
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/PolicyLayer.yaml
    "202":
      description: "A fee rule waits for a different platform member holding `approval:decide`: the proposal, which expires after 7 days. Nothing changes until it is approved."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/Approval.yaml
    "400":
      description: Malformed body or invalid fields
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not platform staff, or `access_denied` without `city:write`
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: Unknown country
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "503":
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
