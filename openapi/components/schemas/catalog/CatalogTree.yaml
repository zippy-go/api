type: object
description: "A store's catalogue as one tree: categories in order with their first items, every question those items ask with its answers, and the row of every item reachable, so a client opens an item onto its questions, a question onto its answers and an answer onto the questions it asks in turn, three deep, never back into an item above it."
required:
  - location_id
  - revision
  - menu_version
  - categories
  - modifiers
  - items
properties:
  location_id:
    type: string
    format: uuid
    description: The store.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  revision:
    type: integer
    description: The catalogue's revision.
    examples:
      - 57
  menu_version:
    type:
      - integer
      - "null"
    description: The published menu's version; `null` before the first.
    examples:
      - 42
  categories:
    type: array
    items:
      $ref: ./TreeCategory.yaml
    description: The categories in the store's order, sub-categories after their parent.
  modifiers:
    type: object
    description: The questions, by id.
    additionalProperties:
      $ref: ./TreeModifier.yaml
  items:
    type: object
    description: "The item rows, by id: every item on a loaded page of a category and every answer reachable from them."
    additionalProperties:
      $ref: ./CatalogItemRow.yaml
