type: object
description: |
  The request body of `POST /v1/partners`. The partner starts with the
  status `pending`. Without `owner` the caller becomes the partner's first
  owner; Mission Control onboards a partner for somebody else by naming
  the `owner`, and may withhold permissions from the partner's
  entitlements from the start.
required:
  - kind
  - name
properties:
  kind:
    $ref: ./PartnerKind.yaml
    description: Whether the partner is an organisation or an individual; it cannot be changed later.
  name:
    type: string
    minLength: 1
    maxLength: 200
    description: The name the partner operates under.
    examples:
      - Example Partner
  legal_name:
    type:
      - string
      - 'null'
    maxLength: 200
    description: The registered legal name. Omit it, or send `null`, when there is none to give.
    examples:
      - Example Partner Ltd
  contact_email:
    type:
      - string
      - 'null'
    format: email
    description: The email address the platform may reach the partner at. Omit it, or send `null`, to leave it unset.
    examples:
      - contact@example.com
  contact_phone:
    type:
      - string
      - 'null'
    pattern: ^\+[1-9][0-9]{1,14}$
    description: The phone number the platform may reach the partner at, in E.164 format. Omit it, or send `null`, to leave it unset.
    examples:
      - '+15555550101'
  contacts:
    type: array
    items:
      $ref: ./Contact.yaml
    description: The people to reach, with their consent per channel.
  description:
    type:
      - string
      - 'null'
    description: What the Partner does, in its own words.
  gstin:
    type:
      - string
      - 'null'
    description: The GSTIN, for an organisation registered for GST; it embeds the PAN.
  owner:
    oneOf:
      - $ref: ./PartnerOwner.yaml
      - type: 'null'
    description: >-
      The administrator, for Mission Control's onboarding on the Partner's behalf (platform staff holding `partner:write` and `staff:write`, and required of them): an existing user is attached as the Partner's owner and told, a new person is invited by email. Omitted from the Partner console, where the caller becomes the owner.
  pan:
    type:
      - string
      - 'null'
    description: The Permanent Account Number.
  registered_address:
    oneOf:
      - $ref: ../common/Address.yaml
      - type: 'null'
    description: The registered address, in India.
  registration_number:
    type:
      - string
      - 'null'
    description: The company or LLP registration number, for an organisation that has one.
  withheld_permissions:
    type: array
    items:
      type: string
    description: Permissions to withhold from the partner's entitlements, for platform staff onboarding a partner; never `partner:access` (`partner_cannot_sign_in`).
    examples:
      - - promotion:write
examples:
  - kind: organisation
    name: Example Partner
    legal_name: Example Partner Ltd
    contact_email: contact@example.com
    pan: AAACB1234C
