# Path item for /v1/auth/refresh. Referenced from openapi.yaml.
post:
  operationId: refreshSession
  summary: Refresh the session
  description: |
    Issues a new access token for the current session, on the session's
    surface, and rotates the refresh token. The session keeps the delivery it
    was created with, whatever the request carries:

    - Cookie delivery: the refresh token is in the surface's `httpOnly`
      cookie (`zg_refresh_partner`, `zg_refresh_platform`,
      `zg_refresh_agent` or `zg_refresh_customer`), scoped to `/v1/auth`. Send `{ "audience": "<surface>" }`
      so the right cookie is read; the response sets the new one and
      `refresh_token` stays `null`.
    - Body delivery: send the refresh token in `refresh_token` and receive the
      new one in the body.

    Every refresh token can be used once. The token spent by the latest
    rotation is forgiven for fifteen seconds and answers with the same
    successor, so two tabs refreshing at once do not sign the user out; an
    older token revokes the whole session, as a defence against a stolen
    token, and the user has to sign in again. A missing, unknown or spent
    token, and a session that ended (signed out, revoked, idle or past its
    absolute lifetime, or on a surface the user may no longer enter), answer
    `401` (`unauthenticated`). A request with neither a refresh token nor a
    surface answers `400` (`validation_failed` with `audience_required` on
    `/audience`). A customer session meets the market's sign-in gate here:
    while the number's country does not admit sign-in the refresh answers
    `409` (`sign_in_closed`) and the session waits, unrevoked, for the
    market to open again.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    description: The refresh token for body delivery, or the surface whose cookie carries it.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/RefreshRequest.yaml
  responses:
    '200':
      description: A new access token and a new refresh token were issued; the previous refresh token is no longer valid.
      headers:
        Set-Cookie:
          description: With cookie delivery, the new refresh token in the surface's cookie, `Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`. Absent with body delivery.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/TokenResponse.yaml
    '400':
      description: Neither a refresh token nor the surface whose cookie carries one was sent (`validation_failed` with `audience_required` on `/audience`), or the body is not a readable `RefreshRequest`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No refresh token was sent, or it is unknown or spent, or the session ended (`unauthenticated`). Sign in again.
      headers:
        Set-Cookie:
          description: With cookie delivery, clears the cookie whose token was refused.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: A customer session whose market does not admit sign-in now (`sign_in_closed`); the session is kept.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `400` (`validation_failed`) for a malformed body or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
