# Path item for /v1/platform/operations/alerts. Referenced from openapi.yaml.
get:
  operationId: listAlerts
  summary: "Read the alerts"
  description: "Open alerts first, then the recent ones newest first, each with its source, severity, what fired it, when, whether anybody acknowledged it and its runbook. On a developer's machine and in `dev` alerts are recorded and shown, never sent. Mission Control tokens only."
  tags:
    - Operations
  security:
    - Bearer: []
  parameters:
    - name: status
      in: query
      required: false
      description: "`open` (open and acknowledged ones) or `all`; `all` by default."
      schema:
        type: string
        enum:
          - open
          - all
        default: all
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 100; 50 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "A page of alerts."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/operations/AlertList.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: not a Mission Control token."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
