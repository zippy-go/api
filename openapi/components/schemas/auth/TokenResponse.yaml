type: object
description: |
  A session, as returned by the sign-in operations, by
  `POST /v1/auth/two-step/verify` and by `POST /v1/auth/refresh`: the
  access token to send as `Authorization: Bearer <access_token>`, how long
  it is valid, the surface it is for, the refresh token when the client
  chose body delivery, and the signed-in user. With cookie delivery the
  refresh token is set in the surface's `httpOnly` cookie instead and
  `refresh_token` is `null`. A session is bound to one surface for good:
  its tokens are refused by every other surface.
required:
  - access_token
  - token_type
  - expires_in
  - refresh_token
  - user
  - audience
  - two_step_setup_required
properties:
  access_token:
    type: string
    minLength: 1
    description: A JSON Web Token typed `at+jwt` and signed with EdDSA (Ed25519), valid for `expires_in` seconds. Its claims are documented on the `Auth` tag; verify it with the keys from `GET /.well-known/jwks.json`.
    examples:
      - eyJhbGciOiJFZERTQSIsImtpZCI6IjAxOTJiNmY0LTliMGEtN2NkZS04ZjNhLTZkMmMxZTRiOWE1MCIsInR5cCI6ImF0K2p3dCJ9..cGxhY2Vob2xkZXItc2lnbmF0dXJl
  token_type:
    type: string
    const: Bearer
    description: Always `Bearer`; the token is sent in the `Authorization` header as RFC 6750 describes.
    examples:
      - Bearer
  expires_in:
    type: integer
    minimum: 1
    description: The number of seconds the access token is valid for from the moment it was issued; 900 (15 minutes) at present. The refresh token's lifetime is never stated.
    examples:
      - 900
  refresh_token:
    type:
      - string
      - 'null'
    description: >-
      The refresh token for `POST /v1/auth/refresh`, present only when the client signed in with `delivery: body` (or, without an audience, sent `X-Client-Type: native`). `null` with cookie delivery, whose refresh token is in the surface's cookie.
    examples:
      - c2FtcGxlLXJlZnJlc2gtdG9rZW4
  user:
    $ref: ./User.yaml
    description: The user the session belongs to.
  audience:
    $ref: ./Audience.yaml
    description: The surface the session is for, the `aud` claim of its access tokens.
  two_step_setup_required:
    type: boolean
    description: >-
      `true` when the session reaches the two-step set-up only: platform staff without a second factor set one up (`POST /v1/auth/two-step/setup` and `/confirm`) before Mission Control opens; every other operation answers `403` (`two_step_setup_required`) until then. `false` otherwise.
    examples:
      - false
examples:
  - access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjAxOTJiNmY0LTliMGEtN2NkZS04ZjNhLTZkMmMxZTRiOWE1MCIsInR5cCI6ImF0K2p3dCJ9..cGxhY2Vob2xkZXItc2lnbmF0dXJl
    token_type: Bearer
    expires_in: 900
    refresh_token: null
    user:
      id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
      email: owner@example.com
      phone: null
      display_name: User 20
      created_at: 2026-10-14T08:00:00Z
    audience: partner
    two_step_setup_required: false
