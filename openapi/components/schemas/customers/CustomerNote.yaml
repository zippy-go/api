type: object
description: "A support note on an account: signed with the operator and the moment, never edited or removed, never shown to the customer."
required:
  - id
  - text
  - written_by
  - written_at
  - day
properties:
  id:
    type: string
    format: uuid
    description: "The note."
  text:
    type: string
    examples:
      - "Promised a call back about the cold biryani on order AB0042."
    description: "The note, at most 2,000 characters."
  written_by:
    $ref: ./CustomerNoteAuthor.yaml
    description: "Who wrote it."
  written_at:
    type: string
    format: date-time
    description: When.
  day:
    type: string
    format: date
    description: "The day it was written on the market's clock, for grouping."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0007"
    text: "Promised a call back about the cold biryani on order AB0042."
    written_by:
      user_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c000d"
      name: "Platform admin"
    written_at: "2026-10-22T12:00:00Z"
    day: "2026-10-22"
