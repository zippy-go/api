# Path item for /v1/auth/two-step/disable. Referenced from openapi.yaml.
post:
  operationId: disableTwoStep
  summary: Turn two-step sign-in off
  description: Turns the user's own two-step sign-in off, only after the password again.
  tags:
    - Auth
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The password again.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordProof.yaml
  responses:
    '204':
      description: Two-step sign-in is off.
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: the password is wrong (it counts in the throttle).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`conflict`: two-step sign-in is off already.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: '`too_many_requests`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
