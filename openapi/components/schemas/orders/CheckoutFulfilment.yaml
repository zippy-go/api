type: object
description: "The ways the store offers: delivery, with who carries it, pickup, scheduled orders into a slot, and whether the basket may go now."
required:
  - delivery
  - pickup
  - carrier
  - scheduled
properties:
  delivery:
    type: boolean
    examples:
      - true
    description: Whether it delivers.
  pickup:
    type: boolean
    examples:
      - true
    description: Whether it offers pickup.
  carrier:
    oneOf:
      - $ref: ../locations/Carrier.yaml
      - type: "null"
    description: Who carries its deliveries.
  scheduled:
    type: boolean
    examples:
      - true
    description: "Whether it takes scheduled orders: checkout then offers `slots`."
  now:
    type: boolean
    examples:
      - true
    description: "Whether the basket may be placed for now: the store open and no pre-order-only item in it. Since 0.24.0."
examples:
  - delivery: true
    pickup: true
    carrier: platform_fleet
    scheduled: false
