# Path item for /v1/customer/payment-methods/{method_id}/default. Referenced from openapi.yaml.
put:
  tags:
    - Payments
  security:
    - Bearer: []
  operationId: setDefaultPaymentMethod
  summary: Make a saved method the default
  description: Makes the saved method the one offered first at checkout.
  parameters:
    - name: method_id
      in: path
      required: true
      description: The saved method.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The saved method, now the default.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payments/SavedPaymentMethod.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such saved method of the customer (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
