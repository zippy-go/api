# Path item for /v1/platform/invoices/{invoice_id}/credit-notes. Referenced from openapi.yaml.
parameters:
  - name: invoice_id
    in: path
    required: true
    description: The invoice.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000c901
post:
  operationId: createInvoiceCreditNote
  summary: Issue a credit note
  description: "Credits an invoice, which never changes once issued: at most what it still carries, numbered in the invoices' sequence, with GST at the invoice's rate (`configuration.invoice.credited`). Once per `Idempotency-Key`. `payout:manage`."
  tags:
    - Billing
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: What it credits and why.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/configuration/InvoiceCreditNoteCreate.yaml
  responses:
    "201":
      description: The credit note.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/InvoiceCreditNote.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: No such invoice (`not_found`).
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
