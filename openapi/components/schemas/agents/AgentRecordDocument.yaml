type: object
description: "A document in an Agent's portable record, without the file, the `AgentRecordDocument` schema."
required:
  - kind
  - status
  - expires_on
properties:
  kind:
    type: string
    description: "What it is."
    examples:
      - "driving_licence"
  status:
    type: string
    description: "Its review."
    examples:
      - "approved"
  expires_on:
    type:
      - string
      - "null"
    format: date
    description: "Its expiry."
    examples:
      - "2030-04-30"
examples:
  - {"kind": "driving_licence", "status": "approved", "expires_on": "2030-04-30"}
