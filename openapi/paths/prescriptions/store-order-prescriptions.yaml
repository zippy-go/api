# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/{order_id}/prescriptions. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: "The Location."
    schema:
      type: string
      format: uuid
  - name: order_id
    in: path
    required: true
    description: "The order."
    schema:
      type: string
      format: uuid
get:
  operationId: getStoreOrderPrescriptions
  summary: "Get an order's prescriptions"
  description: "The order's prescription lines with how many files each carries, their ids to open one by one, and the verification; nothing of what the files say. `order:read` at the Location."
  tags:
    - Prescriptions
  security:
    - Bearer: []
  responses:
    "200":
      description: "The prescription lines."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/prescriptions/OrderPrescriptions.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
