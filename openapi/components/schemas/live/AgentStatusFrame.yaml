type: object
description: Data of an `agent.status` frame, the `AgentStatusFrame` schema.
required:
  - channel
  - agent_id
  - status
properties:
  agent_id:
    type: string
    format: uuid
    description: The agent whose status changed.
  channel:
    type: string
    description: The channel.
    examples:
      - private-agents
  last_seen_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When it was last heard from.
  status:
    $ref: ../fleet/AgentStatus.yaml
    description: Its new status.
  current_task:
    oneOf:
      - $ref: ../agents/AgentTaskBrief.yaml
      - type: 'null'
    description: The task under way when the agent is busy, with the stop it is heading to; `null` or absent otherwise.
  service_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The service the agent works in; absent when unknown.
    examples:
      - 01a13a48-9e00-7000-8000-000000000202
  service_name:
    type:
      - string
      - 'null'
    description: The service's name; absent when unknown.
    examples:
      - ZippyGo Fleet
examples:
  - agent_id: 01a13a48-9e00-7000-8000-00000000a014
    channel: private-agents
    last_seen_at: 2026-10-15T09:00:00Z
    status: online
