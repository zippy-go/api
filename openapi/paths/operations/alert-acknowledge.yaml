# Path item for /v1/platform/operations/alerts/{alert_id}/acknowledge. Referenced from openapi.yaml.
parameters:
  - name: alert_id
    in: path
    required: true
    description: "The alert."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0008"
post:
  operationId: acknowledgeAlert
  summary: "Acknowledge an alert"
  description: "Acknowledges an open alert by name: it stops repeating while it stays open, and closes by itself once what fired it clears. Written to the audit log; publishes `operations.alert.acknowledged`. Acknowledging an acknowledged alert changes nothing. `operations:manage`."
  tags:
    - Operations
  security:
    - Bearer: []
  responses:
    "200":
      description: "The alert, acknowledged."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/operations/Alert.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `operations:manage`, or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such alert."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`illegal_transition`: the alert is closed."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
