# Path item for /v1/platform/message-templates/{template_id}/preview. Referenced from openapi.yaml.
parameters:
  - name: template_id
    in: path
    required: true
    description: The template.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000ba01
post:
  operationId: previewMessageTemplate
  summary: Preview a message template
  description: Renders the template with the event's sample data, or the values given; nothing is sent. `setting:read`.
  tags:
    - Configuration
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Values for its placeholders, or none for the sample data.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/configuration/MessageTemplatePreviewRequest.yaml
  responses:
    "200":
      description: The words.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/MessageTemplatePreview.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: No such template (`not_found`).
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
