type: object
description: The request body of `POST /v1/fleet/location-pings`. One batch carries between 1 and 500 pings, for one agent or several.
required:
  - pings
properties:
  pings:
    type: array
    minItems: 1
    maxItems: 500
    description: The pings to apply. Order within the batch does not matter; pings are applied per agent in `recorded_at` order.
    items:
      $ref: ./LocationPing.yaml
examples:
  - pings:
      - agent_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
        lat: 12.9716
        lng: 77.5946
        heading_deg: 270.5
        speed_mps: 4.2
        recorded_at: 2026-10-14T08:00:00Z
