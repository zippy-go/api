# Path item for /v1/platform/commissions. Referenced from openapi.yaml.
get:
  operationId: listCommissions
  summary: List referral commissions
  description: Every referral commission between Partners, newest first, recorded or taken back; `partner_id` narrows them to those a Partner paid or received. `engagement:read`.
  tags:
    - Recommendations
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: A Partner, paying or paid.
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: Where the page starts.
      schema:
        type: string
  responses:
    "200":
      description: A page of commissions.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/CommissionPage.yaml
    "400":
      description: "`validation_failed`; `invalid_cursor`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `engagement:read`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
