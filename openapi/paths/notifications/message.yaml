# Path item for /v1/platform/messages/{message_id}. Referenced from openapi.yaml.
parameters:
  - name: message_id
    in: path
    required: true
    description: 'The message.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
get:
  operationId: getMessage
  summary: Read one message of the delivery log
  description: |
    One message with its composed words while they are kept, every device a push went to and the provider's answer. `notification:read`.
  tags:
    - Notifications
  security:
    - Bearer: []
  responses:
    '200':
      description: 'The message.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/DeliveryLogEntry.yaml
    '400':
      description: '`validation_failed`: a malformed message id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not a Mission Control token (`forbidden`), or `notification:read` is not held (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'No such message (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
