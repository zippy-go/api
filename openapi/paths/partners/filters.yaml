# Path item for GET /v1/partners/filters. Referenced from openapi.yaml.
get:
  operationId: getPartnerFilters
  summary: Get the partner filter declaration
  description: |
    Returns the fields partners can be filtered, sorted and faceted by, with
    the type and operators of each and the values of the enumerations, so a
    console builds its filter bar from the declaration rather than from a
    release. Platform realm only.
  tags:
    - Partners
  security:
    - Bearer: []
  responses:
    '200':
      description: The declaration.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/FilterSchema.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is not in the platform realm (`forbidden`), or lacks `partner:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
