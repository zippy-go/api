# Path item for /v1/partners. Referenced from openapi.yaml.
post:
  operationId: createPartner
  summary: Create a partner
  description: |
    Creates a partner together with its roles (the maintained `OWNER` and
    the default roles) and its first owner, in one request. From the
    Partner console the caller becomes the owner: a membership holding the
    `OWNER` role is created with it. Platform staff onboarding a partner
    name the `owner` instead (an existing user is attached and told, a new
    person is invited by email) and may withhold permissions from the
    partner's entitlements; that needs `partner:write` and `staff:write`.
    The partner starts with the status `pending` and the platform realm
    activates it.

    The caller's access token does not carry the new membership until it is
    refreshed; `GET /v1/me` reflects it at once. Publishes the events
    `tenancy.partner.created` and `tenancy.membership.created`. An
    `Idempotency-Key` is honoured: a retry with the same key and body
    returns the partner already created.

    Mission Control onboards a partner on its behalf by naming its
    administrator in `owner`, who is invited by email as owner; platform
    staff must name one, and a failure anywhere, the email included, leaves
    no partner behind. Somebody who is not platform staff naming an `owner`
    receives `403` (`forbidden`). The legal identity (`pan`, `gstin`,
    `registration_number`, `registered_address`) and the `contacts` may be
    given at creation; a GSTIN or PAN that fails its check is refused with
    the field codes `gstin_invalid` and `pan_invalid`.
  tags:
    - Partners
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The kind, the name and the optional details of the partner.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/partners/PartnerCreate.yaml
  responses:
    '201':
      description: The partner was created and the caller is its owner.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/Partner.yaml
    '400':
      description: The body failed validation (`validation_failed`), for example a missing `name`, a malformed `contact_email` or a missing owner field, or a withheld permission the catalogue does not have (`unknown_permission`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: An `owner` or `withheld_permissions` sent by somebody who is not platform staff (`forbidden`), or platform staff without `partner:write` and `staff:write` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The entitlements would withhold `partner:access` (`partner_cannot_sign_in`) or a permission outside the partner pool (`permission_not_grantable`); nothing was created.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
get:
  operationId: listPartners
  summary: List partners
  description: |
    Returns partners in pages, newest first, for the platform realm (the
    operations side of ZippyGo). Any other caller receives `403`
    (`forbidden`); a user finds the partners they belong to under
    `GET /v1/me`.

    Filter with `q`, which matches `name` and `legal_name`, with `status`
    and `kind`, or with the full grammar in `filter` whose fields
    `GET /v1/partners/filters` declares. Sort with up to three declared
    keys (`-created_at` by default, the id as the tiebreaker) and ask for
    facet counts with `facets`. Page with `limit` and `cursor`: pass the
    `next_cursor` of a page to get the next one, until it is `null`; a
    cursor from another query or another caller is refused with
    `cursor_invalid`.
  tags:
    - Partners
  security:
    - Bearer: []
  parameters:
    - name: q
      in: query
      required: false
      description: Only include partners whose `name` or `legal_name` contains this text, case-insensitively.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    - name: status
      in: query
      required: false
      description: Only include partners with this status.
      schema:
        $ref: ../../components/schemas/partners/PartnerStatus.yaml
    - name: kind
      in: query
      required: false
      description: Only include partners of this kind.
      schema:
        $ref: ../../components/schemas/partners/PartnerKind.yaml
    - name: filter
      in: query
      required: false
      description: A filter tree as JSON, URL-encoded; the fields and operators are those of `GET /v1/partners/filters`.
      schema:
        type: string
    - name: sort
      in: query
      required: false
      description: Sort keys, comma separated, `-` for descending; `-created_at` by default.
      schema:
        type: string
    - name: facets
      in: query
      required: false
      description: Enumeration fields to count alongside the page, comma separated (`status`, `kind`).
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: The maximum number of partners to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page. Omit it for the first page.
      schema:
        type: string
        minLength: 1
  responses:
    '200':
      description: A page of partners.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/PartnerList.yaml
    '400':
      description: A parameter failed validation (`validation_failed`), for example a `limit` out of range or a `cursor` that is not one this operation issued.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is not in the platform realm (`forbidden`), or lacks `partner:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
