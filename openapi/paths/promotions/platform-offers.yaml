# Path item for /v1/platform/offers. Referenced from openapi.yaml.
get:
  operationId: listPlatformOffers
  summary: List every offer
  description: Every offer, Partners' and the platform's, newest first, with the counts of all, live, scheduled, paused, drafts and past; archived ones out of sight until asked for. Searchable by name, line, owner and Location. `promotion:read`.
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: owner
      in: query
      required: false
      description: "`partner` or `platform`."
      schema:
        type: string
        enum:
          - partner
          - platform
    - name: group
      in: query
      required: false
      description: "`live`, `scheduled`, `paused`, `draft`, `past` or `archived`."
      schema:
        type: string
        enum:
          - live
          - scheduled
          - paused
          - draft
          - past
          - archived
    - name: kind
      in: query
      required: false
      description: "`partner_offer`, `campaign` or `store_promotion`."
      schema:
        type: string
        enum:
          - partner_offer
          - campaign
          - store_promotion
    - name: mechanic
      in: query
      required: false
      description: One mechanic.
      schema:
        type: string
    - name: partner_id
      in: query
      required: false
      description: One Partner's offers.
      schema:
        type: string
        format: uuid
    - name: q
      in: query
      required: false
      description: Words of the name, the line, the owner or a Location.
      schema:
        type: string
        maxLength: 100
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of offers with the counts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: createPlatformOffer
  summary: Make a campaign or a store promotion as a draft
  description: "Saves a draft owned by the platform: a campaign aimed at Locations, Partners, Verticals, cities or zones, Location types or everywhere, on everything they sell, with the Partners' share of its cost; or a store promotion aimed at exactly one Location, which may name its items, categories and brands and be a bundle or a free item, its share 100% unless set. A first-order or referral campaign is one per city. Nothing reaches the server before Review, which saves the draft and reads it back. `promotion:write`."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/promotions/OfferInput.yaml
  responses:
    "201":
      description: The draft.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/Offer.yaml
    "400":
      description: "`validation_failed`, naming the term, as a Partner's offer, and `campaign_on_everything` for a campaign across Locations naming items, `share_out_of_range`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks the permission (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: A Location, Partner, Vertical, service area or item that does not exist (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_purpose_taken`: the city already has a running offer of that purpose."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
