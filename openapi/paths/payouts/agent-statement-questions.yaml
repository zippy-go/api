# Path item for /v1/agent/memberships/{agent_id}/statements/{statement_id}/questions. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000107
  - name: statement_id
    in: path
    required: true
    description: The Agent's statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5201
post:
  operationId: askAboutOwnAgentStatement
  summary: Ask about a week
  description: A question about a locked week, as a Location asks, in up to 2,000 characters; Mission Control answers it once and the Agent is told. Takes the membership holder's Agent app token.
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The question.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/PayoutQuestionInput.yaml
  responses:
    "201":
      description: The question, unanswered.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/PayoutQuestion.yaml
    "400":
      description: "`validation_failed`: an empty question or one over 2,000 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same), or no such statement of it."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
