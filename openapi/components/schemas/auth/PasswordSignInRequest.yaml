type: object
description: The request body of `POST /v1/auth/password/sign-in`.
required:
  - email
  - password
  - audience
  - delivery
properties:
  email:
    type: string
    format: email
    maxLength: 254
    description: The email address the user registered with.
    examples:
      - owner@example.com
  password:
    type: string
    minLength: 1
    description: The user's password. It is never returned by the API.
    examples:
      - example-passphrase-2026
  audience:
    $ref: ./Audience.yaml
    description: >-
      The surface signed in to, required (`validation_failed` with `audience_required` on `/audience`): `partner`, `platform` or `agent`.
  delivery:
    $ref: ./Delivery.yaml
    description: How the session's refresh token travels, required (`delivery_required` on `/delivery`), `cookie` for browsers or `body` for apps; bound to the session for good.
examples:
  - email: owner@example.com
    password: example-passphrase-2026
    audience: partner
    delivery: cookie
