# Path item for /v1/platform/carriers/{carrier_id}/quotes. Referenced from openapi.yaml.
parameters:
  - name: carrier_id
    in: path
    required: true
    description: "The carrier, such as `simulated`."
    schema:
      type: string
get:
  operationId: listPlatformCarrierQuotes
  summary: "List a carrier's quotes"
  description: "The carrier's quotes, newest first, each with its delivery, the Location's ceiling and whether it was taken. `dispatch:read`."
  tags:
    - Deliveries
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: "1 to 100."
      schema:
        type: integer
    - name: cursor
      in: query
      required: false
      description: "The next page."
      schema:
        type: string
  responses:
    "200":
      description: "The quotes."
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/CarrierQuoteList.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied`, or a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: Not one the caller may see (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
