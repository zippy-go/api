type: object
description: The request body of `POST /v1/auth/password/sign-in`.
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
    maxLength: 254
    description: The email address the user registered with.
    examples:
      - owner@example.com
  password:
    type: string
    minLength: 1
    description: The user's password. It is never returned by the API.
    examples:
      - example-passphrase-2026
  audience:
    oneOf:
      - $ref: ./Audience.yaml
      - type: 'null'
    description: >-
      The surface signed in to: `partner`, `platform` or `agent`. With it, `delivery` is required (`validation_failed` with `delivery_required` on `/delivery`). A client that omits it keeps the step 1 behaviour: it signs in to Mission Control when the account holds platform access and to the Partner console otherwise.
  delivery:
    oneOf:
      - $ref: ./Delivery.yaml
      - type: 'null'
    description: How the session's refresh token travels, `cookie` for browsers or `body` for apps; bound to the session for good.
examples:
  - email: owner@example.com
    password: example-passphrase-2026
    audience: partner
    delivery: cookie
