type: object
description: Request body of `POST /v1/auth/customer/codes`.
required:
  - mobile
properties:
  mobile:
    type: string
    description: 'The mobile number as typed: ten digits, or with the country code (`+91 98765 43210`).'
    examples:
      - +91 98765 43210
  channel:
    oneOf:
      - $ref: ./CustomerCodeChannel.yaml
      - type: 'null'
    description: '`sms` (default), or `whatsapp` with SMS behind it when the number has no WhatsApp.'
  country:
    type:
      - string
      - 'null'
    description: The market the number is read against (alpha-2); India by default, whose bare ten-digit numbers get +91.
    examples:
      - IN
  device:
    oneOf:
      - $ref: ./DeviceIdentity.yaml
      - type: 'null'
    description: 'The device asking, when the client names it: an identifier it keeps, never a credential.'
examples:
  - mobile: +91 98765 43210
    country: IN
    channel: sms
    device:
      id: web-3f2a9c1d8e7b6a50
      platform: web
