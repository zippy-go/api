# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/mapping. Referenced from openapi.yaml.
parameters:
  - name: partner_id
    in: path
    required: true
    description: The partner.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  - name: location_id
    in: path
    required: true
    description: The store.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: getCatalogMapping
  summary: Read a store's mapping to the taxonomy
  description: |
    The store's catalogue against the shared taxonomy: each category with its
    term, or the terms suggested from its name while unmapped; the items mapped
    more narrowly, unmapped or missing an attribute their term requires; the
    tasks; and the counts. `catalog:read` at the Location; Mission Control
    `catalog:oversee`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  responses:
    "200":
      description: 'The mapping.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/CatalogMapping.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: '`access_denied` without `catalog:read` (Mission Control `catalog:oversee`), or `service_required` for a Location that sells nothing.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'Unknown partner or location (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
