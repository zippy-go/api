# Path item for /v1/platform/taxonomy/changes. Referenced from openapi.yaml.
get:
  operationId: listTaxonomyChanges
  summary: List the taxonomy's changes
  description: |
    Every change to the taxonomy, newest first: what it did in words, the version
    it made and the mappings it moved. `catalog:oversee`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  parameters:
    - name: vertical_id
      in: query
      required: false
      description: 'Only this Vertical''s changes.'
      schema:
        type: string
        format: uuid
    - name: term_id
      in: query
      required: false
      description: 'Only this term''s changes.'
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: 'How many per page. 1 to 100, 25 by default.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: 'The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.'
      schema:
        type: string
  responses:
    "200":
      description: 'A page of changes.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/TaxonomyChangePage.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `catalog:oversee` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
