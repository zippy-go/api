# Path item for /v1/partners/{partner_id}/services/{service_id}/shifts/{shift_id}/assignments/{agent_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: service_id
    in: path
    required: true
    description: The service, one of the Partner's that sends Agents out.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  - name: shift_id
    in: path
    required: true
    description: The shift.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c9101
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
delete:
  operationId: removeServiceShiftAgent
  summary: Take a shift from an Agent
  description: A dispatcher takes the shift from an Agent who picked it or was given it, before it ends; the Agent is told, and its hours make no more of their slots. Taking it from an Agent who does not have it answers the shift unchanged. Publishes `fleet.shift.removed`. `dispatch:manage` at the service.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The shift after.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/Shift.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`shift_closed`: the shift ended or was cancelled."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
