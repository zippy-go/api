# Path item for /v1/partners/{partner_id}/locations/{location_id}/reservations. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, one of the Partner's.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: listLocationReservations
  summary: List a Location's reservations on a day
  description: The day's reservations in time order, every state, with the party's name, mobile number and note, and how many parties and covers are booked or seated. Members need `reservation:read` at the Location.
  tags:
    - Reservations
  security:
    - Bearer: []
  parameters:
    - name: date
      in: query
      required: false
      description: The day, on the Location's clock; today by default.
      schema:
        type: string
        format: date
      example: 2026-11-07
  responses:
    "200":
      description: The day's reservations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reservations/LocationReservationList.yaml
    "400":
      description: "`validation_failed`: a malformed date; `malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without `reservation:read` at the Location."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the Partner, or a Location that is not its."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
