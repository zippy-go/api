# Path item for /v1/service-areas/{service_area_id}/fence. Referenced from openapi.yaml.
parameters:
  - name: service_area_id
    in: path
    required: true
    description: The area
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
put:
  operationId: putServiceAreaFence
  summary: Draws the fence
  description: 'Draws the fence; platform staff. A fence is drawn at one level only: refused when an ancestor or a descendant is fenced.'
  tags:
    - Service areas
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/Fence.yaml
  responses:
    '200':
      description: The area with its fence
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/ServiceArea.yaml
    '400':
      description: Malformed body or an invalid polygon
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not platform staff, or `access_denied` without `zone:write`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: An ancestor or a descendant is fenced
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
delete:
  operationId: deleteServiceAreaFence
  summary: Removes the fence
  description: Removes the fence; platform staff. Refused with `locations_stranded` while Locations sit in the area.
  tags:
    - Service areas
  security:
    - Bearer: []
  responses:
    '200':
      description: The area without a fence
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/ServiceArea.yaml
    '400':
      description: Malformed identifier
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not platform staff, or `access_denied` without `zone:write`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`locations_stranded`: Locations sit in the area'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
