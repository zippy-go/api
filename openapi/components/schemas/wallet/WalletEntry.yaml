type: object
description: "One entry of the Wallet's ledger: never edited or removed; a mistake is corrected by a new entry."
required:
  - id
  - kind
  - balance
  - amount
  - held
  - balance_after
  - held_after
  - reason
  - note
  - order_id
  - payment_id
  - refund_id
  - payer
  - by_user_id
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: The entry.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
  kind:
    $ref: ../wallet/WalletEntryKind.yaml
    description: What changed the Wallet.
  balance:
    $ref: ../wallet/WalletBalanceKind.yaml
    description: The balance it touched.
  amount:
    $ref: ../common/Money.yaml
    description: What it added to the balance (negative when it took away); zero for a hold and a release.
  held:
    $ref: ../common/Money.yaml
    description: What it added to the held amount (negative when a hold was spent or released).
  balance_after:
    $ref: ../common/Money.yaml
    description: The balance after it.
  held_after:
    $ref: ../common/Money.yaml
    description: The held amount after it.
  reason:
    type: string
    description: Why, in words the customer reads.
    examples:
      - Late delivery
  note:
    type:
      - string
      - "null"
    description: Support's note; the customer reads a credit's note as a message and never a correction's.
    maxLength: 1000
    examples:
      - null
  order_id:
    type:
      - string
      - "null"
    format: uuid
    description: The order it belongs to.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
  payment_id:
    type:
      - string
      - "null"
    format: uuid
    description: "The payment it belongs to: the top-up, or the order's payment."
    examples:
      - null
  refund_id:
    type:
      - string
      - "null"
    format: uuid
    description: The refund it came from.
    examples:
      - null
  payer:
    oneOf:
      - $ref: ../wallet/WalletPayer.yaml
      - type: "null"
    description: Who pays for a credit.
  by_user_id:
    type:
      - string
      - "null"
    format: uuid
    description: The person who made it, for a credit or a correction.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b20
  created_at:
    type: string
    format: date-time
    description: When.
    examples:
      - 2026-10-16T09:00:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
    kind: credit
    balance: promotional
    amount:
      minor_units: 5000
      currency: INR
    held:
      minor_units: 0
      currency: INR
    balance_after:
      minor_units: 5000
      currency: INR
    held_after:
      minor_units: 0
      currency: INR
    reason: Late delivery
    note: null
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
    payment_id: null
    refund_id: null
    payer:
      kind: platform
      partner_id: null
    by_user_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b20
    created_at: 2026-10-16T09:00:00Z
