type: object
description: A store found by its name or by what it sells, with its products that matched.
required:
  - store
  - products
  - product_count
  - name_matched
properties:
  store:
    $ref: ./SearchStore.yaml
    description: The store.
  products:
    type: array
    items:
      $ref: ./SearchProductHit.yaml
    description: The products that matched, best first, six at most.
  product_count:
    type: integer
    description: How many of its products matched in all ("See all").
    examples:
      - 1
  name_matched:
    type: boolean
    description: The store's own name matched.
examples:
  - store:
      location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
