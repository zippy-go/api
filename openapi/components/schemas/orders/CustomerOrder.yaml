type: object
description: "An order as its customer reads it: one status in plain words, the steps it went through, the promise still open, what was sold, the receipt, whether it can still be cancelled and the help it offers. Read it again on `order.changed`, and every 30 seconds without live updates."
required:
  - id
  - number
  - status
  - status_text
  - version
  - location_id
  - partner_id
  - store
  - fulfilment
  - placed_at
  - created_at
  - steps
  - promise
  - delivery_address
  - instructions
  - if_unavailable
  - lines
  - receipt
  - can_cancel
  - help
  - ended
properties:
  id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    description: The order.
  number:
    type: string
    examples:
      - AB0042
    description: The order's number, as said aloud.
  status:
    $ref: ./OrderStatus.yaml
    description: The status.
  status_text:
    type: string
    examples:
      - Being prepared, ready about 18:52
    description: The status in plain words, on the store's clock.
  version:
    type: integer
    examples:
      - 3
    description: Raised on every change; the entity tag.
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store.
  partner_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
    description: Its Partner.
  store:
    $ref: ./OrderStore.yaml
    description: The store as it was.
  fulfilment:
    $ref: ./OrderFulfilment.yaml
    description: Delivery or pickup.
  placed_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T13:00:00Z
    description: When it was placed; `null` while paying.
  created_at:
    type: string
    format: date-time
    examples:
      - 2026-10-16T13:00:00Z
    description: When the customer pressed place.
  steps:
    type: array
    items:
      $ref: ./OrderStep.yaml
    description: The steps it went through, oldest first.
  promise:
    $ref: ./OrderPromise.yaml
    description: The promise still open.
  delivery_address:
    oneOf:
      - $ref: ./OrderAddress.yaml
      - type: "null"
    description: Where it goes, for a delivery.
  instructions:
    type:
      - string
      - "null"
    examples:
      - Ring the bell twice
    description: The customer's instructions.
  if_unavailable:
    $ref: ./IfUnavailable.yaml
    description: What the customer asked the store to do with an unavailable item.
  lines:
    type: array
    items:
      $ref: ./OrderLine.yaml
    description: What was sold.
  receipt:
    $ref: ./Receipt.yaml
    description: The receipt.
  can_cancel:
    type: boolean
    examples:
      - false
    description: "Whether the customer may still cancel it alone: until the store accepts."
  help:
    $ref: ./OrderHelp.yaml
    description: The help it offers.
  ended:
    oneOf:
      - $ref: ./OrderEnd.yaml
      - type: "null"
    description: How it ended, when it was declined, cancelled or expired; the note is never shown here.
examples:
