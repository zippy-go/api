# Path item for /v1/partners/{partner_id}/locations/{location_id}/bookings. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000306
get:
  operationId: getLocationBookingDay
  summary: Read a day of bookings
  description: "A Location's bookings on a day: those awaiting confirmation apart, the rest in a column per Agent (or per service) with their travel buffers, and each service's set duration beside what its jobs take. `order:read` at the Location."
  tags:
    - Bookings
  security:
    - Bearer: []
  parameters:
    - name: date
      in: query
      required: false
      description: The day, at the Location; today by default.
      schema:
        type: string
        format: date
      example: 2026-11-07
    - name: group
      in: query
      required: false
      description: A column per `agent` (the default) or per `service`.
      schema:
        $ref: ../../components/schemas/bookings/BookingDayGroup.yaml
      example: agent
  responses:
    "200":
      description: The day.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/bookings/LocationBookingDay.yaml
    "400":
      description: "`validation_failed`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:read` at the Location), `not_enabled_for_partner`, or `forbidden` for a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such Partner, Location or booking for the caller."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
