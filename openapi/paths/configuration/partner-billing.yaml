# Path item for /v1/partners/{partner_id}/billing. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartnerBilling
  summary: Get how invoices are paid
  description: "How the Partner pays its monthly invoices: by deduction from its next payout statement by default, or by UPI or card. `billing:read`."
  tags: &a2
    - Billing
  security:
    - Bearer: []
  responses:
    "200":
      description: How invoices are paid.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/BillingSettings.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner is not one the caller belongs to, or does not exist (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
put:
  operationId: putPartnerBilling
  summary: Choose how invoices are paid
  description: Chooses how the Partner pays its monthly invoices from the next one issued. The Partner's owners (`plan:write`).
  tags: *a2
  security:
    - Bearer: []
  requestBody:
    required: true
    description: How.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/configuration/BillingSettingsUpdate.yaml
  responses:
    "200":
      description: How invoices are paid now.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/configuration/BillingSettings.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: The Partner is not one the caller belongs to, or does not exist (`not_found`); never 403 for another Partner's.
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
