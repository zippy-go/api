type: object
description: "A batch of single-use codes: 1 to 10,000 of them, 10 characters each with no look-alikes, and a label."
required:
  - count
properties:
  count:
    type: integer
    description: How many.
    examples:
      - 500
    minimum: 1
    maximum: 10000
  label:
    type:
      - string
      - "null"
    description: A label; an unlabelled batch is called by its size.
    examples:
      - College fest flyers
    maxLength: 80
examples:
  - count: 500
    label: College fest flyers
