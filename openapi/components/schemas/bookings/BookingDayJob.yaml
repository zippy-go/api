type: object
description: A job on a day's calendar.
required:
  - booking_id
  - number
  - state
  - service_name
  - starts_at
  - ends_at
  - buffer_before_minutes
  - buffer_after_minutes
  - agent_id
  - agent_first_name
  - area
properties:
  booking_id:
    type: string
    format: uuid
    description: The booking.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000b001
  number:
    type: string
    description: Its number.
    examples:
      - ZG-261107-0042
  state:
    $ref: ./BookingState.yaml
    description: Where it stands.
  service_name:
    type: string
    description: The service.
    examples:
      - AC service, split unit
  starts_at:
    type: string
    format: date-time
    description: The slot's start.
    examples:
      - 2026-11-07T10:00:00+05:30
  ends_at:
    type: string
    format: date-time
    description: The job's expected end.
    examples:
      - 2026-11-07T11:00:00+05:30
  buffer_before_minutes:
    type: integer
    description: The travel buffer before it.
    examples:
      - 30
  buffer_after_minutes:
    type: integer
    description: The travel buffer after it.
    examples:
      - 30
  agent_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its Agent.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000e001
  agent_first_name:
    type:
      - string
      - "null"
    description: Its Agent's first name.
    examples:
      - Kiran
  area:
    type: string
    description: Where, the address's second line or city.
    examples:
      - Road No. 5, Madhapur
examples:
  - booking_id: 019a3d10-2b00-7d00-8a00-00000000b001
    number: ZG-261107-0042
    state: confirmed
    service_name: AC service, split unit
    starts_at: 2026-11-07T10:00:00+05:30
    ends_at: 2026-11-07T11:00:00+05:30
    buffer_before_minutes: 30
    buffer_after_minutes: 30
    agent_id: 019a3d10-2b00-7d00-8a00-00000000e001
    agent_first_name: Kiran
    area: Road No. 5, Madhapur
