# Catalog of every event type ZippyGo publishes.
#
# One entry per (type, version). `payload_schema` and `example` are paths
# relative to this file; `pnpm events:check` compiles every schema and
# validates every example against the envelope and the payload schema.
#
# Adding a field to a payload is additive and keeps the version; removing or
# renaming a field, or changing its type, is a new version (see README.md).
events:
  - type: platform.ping
    version: 1
    domain: platform
    description: >-
      Sent on request to verify that a webhook endpoint receives and
      acknowledges deliveries. Carries no business data.
    payload_schema: ./payloads/platform.ping.v1.schema.json
    example: ./examples/platform.ping.v1.json

  - type: fleet.agent.online
    version: 1
    domain: fleet
    description: >-
      An agent went online in one of the partner's services and is
      reporting. The envelope's `partner_id` is the partner the agent is
      attached to.
    payload_schema: ./payloads/fleet.agent.online.v1.schema.json
    example: ./examples/fleet.agent.online.v1.json

  - type: fleet.agent.offline
    version: 1
    domain: fleet
    description: >-
      An agent went offline, by signing off or by not reporting for too
      long; the payload says when it was last heard from. The envelope's
      `partner_id` is the partner the agent is attached to.
    payload_schema: ./payloads/fleet.agent.offline.v1.schema.json
    example: ./examples/fleet.agent.offline.v1.json

  - type: fleet.membership.invited
    version: 1
    domain: fleet
    description: A Partner invited a person into one of its delivery services by mobile number or email; the person is told by message how to join. Dispatch ignores it. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.membership.invited.v1.schema.json
    example: ./examples/fleet.membership.invited.v1.json

  - type: fleet.membership.joined
    version: 1
    domain: fleet
    description: "The person accepted an invitation in the Agent app, or an individual Partner's owner joined their own delivery service: the membership is pending its documents. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.membership.joined.v1.schema.json
    example: ./examples/fleet.membership.joined.v1.json

  - type: fleet.membership.activated
    version: 1
    domain: fleet
    description: "The Partner (or Mission Control for the platform fleet) activated the membership once its documents were approved: the Agent may go on duty and receive work. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.membership.activated.v1.schema.json
    example: ./examples/fleet.membership.activated.v1.json

  - type: fleet.membership.suspended
    version: 1
    domain: fleet
    description: "The membership was suspended with a reason the Agent reads, at once: its duty stretch closed, its offers vanish and every task under way was returned, each announced by `fleet.task.returned`. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.membership.suspended.v1.schema.json
    example: ./examples/fleet.membership.suspended.v1.json

  - type: fleet.membership.reinstated
    version: 1
    domain: fleet
    description: "A suspension was lifted: the membership is active again, or pending when its documents no longer stand. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.membership.reinstated.v1.schema.json
    example: ./examples/fleet.membership.reinstated.v1.json

  - type: fleet.membership.offboarded
    version: 1
    domain: fleet
    description: The membership ended for good, or an invitation was withdrawn or declined, with a reason; what suspension does, and the person keeps their account. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.membership.offboarded.v1.schema.json
    example: ./examples/fleet.membership.offboarded.v1.json

  - type: fleet.document.submitted
    version: 1
    domain: fleet
    description: An Agent filed a document with its files; it waits for review by the Partner, or by platform staff for the platform fleet. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.document.submitted.v1.schema.json
    example: ./examples/fleet.document.submitted.v1.json

  - type: fleet.document.approved
    version: 1
    domain: fleet
    description: A reviewer approved a document; the Agent is told. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.document.approved.v1.schema.json
    example: ./examples/fleet.document.approved.v1.json

  - type: fleet.document.rejected
    version: 1
    domain: fleet
    description: A reviewer rejected a document with a reason the Agent reads; the Agent is told and may file it again. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.document.rejected.v1.schema.json
    example: ./examples/fleet.document.rejected.v1.json

  - type: fleet.duty.started
    version: 1
    domain: fleet
    description: "An Agent switched on duty in a zone: a duty stretch opened, and dispatch may offer them work there. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.duty.started.v1.schema.json
    example: ./examples/fleet.duty.started.v1.json

  - type: fleet.duty.ended
    version: 1
    domain: fleet
    description: "A duty stretch closed: switched off, closed at the last report after 30 minutes with nothing heard, or ended by a suspension or an offboarding. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.duty.ended.v1.schema.json
    example: ./examples/fleet.duty.ended.v1.json

  - type: fleet.task.assigned
    version: 1
    domain: fleet
    description: "A task of a trip was given to an Agent, as an accepted offer or directly, idempotently by the delivery and its attempt: one event per task (a pickup and a drop). The courier is named on the order only once the app received it. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.task.assigned.v1.schema.json
    example: ./examples/fleet.task.assigned.v1.json

  - type: fleet.task.received
    version: 1
    domain: fleet
    description: "The Agent app has the task: the courier is named on the order from now. A direct assignment may be handed back within 60 seconds from now. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.task.received.v1.schema.json
    example: ./examples/fleet.task.received.v1.json

  - type: fleet.task.started
    version: 1
    domain: fleet
    description: The Agent started towards the stop. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.started.v1.schema.json
    example: ./examples/fleet.task.started.v1.json

  - type: fleet.task.arrived
    version: 1
    domain: fleet
    description: The Agent arrived at the stop, within its geofence or with an override and its reason. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.arrived.v1.schema.json
    example: ./examples/fleet.task.arrived.v1.json

  - type: fleet.task.completed
    version: 1
    domain: fleet
    description: "The stop is complete at the step's recorded time: a pickup collected (the order goes on its way), a drop delivered with its proof (the order is delivered). No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.task.completed.v1.schema.json
    example: ./examples/fleet.task.completed.v1.json

  - type: fleet.task.failed
    version: 1
    domain: fleet
    description: The Agent failed the stop with a reason from the template's list; a drop failed leaves the order undelivered for dispatch to handle. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.failed.v1.schema.json
    example: ./examples/fleet.task.failed.v1.json

  - type: fleet.task.handed_back
    version: 1
    domain: fleet
    description: "The Agent handed a direct assignment back with a reason within its minute: the delivery waits for somebody else. No payload carries a phone number, an email address or a document number."
    payload_schema: ./payloads/fleet.task.handed_back.v1.schema.json
    example: ./examples/fleet.task.handed_back.v1.json

  - type: fleet.task.returned
    version: 1
    domain: fleet
    description: A task under way went back to the dispatcher because the membership was suspended or offboarded or the duty closed. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.returned.v1.schema.json
    example: ./examples/fleet.task.returned.v1.json

  - type: fleet.task.called_off
    version: 1
    domain: fleet
    description: Dispatch called the delivery's tasks off with a reason; the Agent was told with a sound. A task called off after the Agent started towards it pays the rule's amount. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.called_off.v1.schema.json
    example: ./examples/fleet.task.called_off.v1.json

  - type: fleet.task.help_requested
    version: 1
    domain: fleet
    description: The Agent asked for help on a task in their own words; dispatch puts it on the delivery for the Partner's dispatcher and Mission Control. No payload carries a phone number, an email address or a document number.
    payload_schema: ./payloads/fleet.task.help_requested.v1.schema.json
    example: ./examples/fleet.task.help_requested.v1.json

  - type: identity.user.registered
    version: 1
    domain: identity
    description: >-
      A user was created, by the first successful one-time code for an
      identifier or by accepting an invitation. The envelope's `partner_id`
      is `null`; the payload carries no email address or phone number.
    payload_schema: ./payloads/identity.user.registered.v1.schema.json
    example: ./examples/identity.user.registered.v1.json

  - type: customers.customer.registered
    version: 1
    domain: customers
    description: >-
      A customer account was opened: a registration completed with a code to
      the number, in the same transaction as the account. The envelope's
      `partner_id` is `null`; the payload carries no phone number, email
      address or address. A new user is also announced by
      `identity.user.registered`; a person who already held a membership
      opens a customer account without one.
    payload_schema: ./payloads/customers.customer.registered.v1.schema.json
    example: ./examples/customers.customer.registered.v1.json

  - type: identity.session.created
    version: 1
    domain: identity
    description: >-
      A user signed in and a session was created; the session id is the
      `sid` claim of its access tokens. Refreshing a session does not
      publish this event. The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/identity.session.created.v1.schema.json
    example: ./examples/identity.session.created.v1.json

  - type: identity.invitation.sent
    version: 1
    domain: identity
    description: >-
      An invitation to join a partner was created and its email is being
      sent. The envelope's `partner_id` is the partner that invited; the
      payload carries no email address.
    payload_schema: ./payloads/identity.invitation.sent.v1.schema.json
    example: ./examples/identity.invitation.sent.v1.json

  - type: identity.invitation.accepted
    version: 1
    domain: identity
    description: >-
      An invitation was accepted and turned into a membership;
      `tenancy.membership.created` is published alongside. The envelope's
      `partner_id` is the partner that invited.
    payload_schema: ./payloads/identity.invitation.accepted.v1.schema.json
    example: ./examples/identity.invitation.accepted.v1.json

  - type: tenancy.partner.created
    version: 1
    domain: tenancy
    description: >-
      A partner was created with the status `pending` and its creator
      became its first owner (`tenancy.membership.created` is published
      alongside). The envelope's `partner_id` is the new partner.
    payload_schema: ./payloads/tenancy.partner.created.v1.schema.json
    example: ./examples/tenancy.partner.created.v1.json

  - type: tenancy.partner.status_changed
    version: 1
    domain: tenancy
    description: >-
      The platform realm changed a partner's status along its lifecycle
      (pending, active, suspended, archived). The envelope's `partner_id` is
      the partner.
    payload_schema: ./payloads/tenancy.partner.status_changed.v1.schema.json
    example: ./examples/tenancy.partner.status_changed.v1.json

  - type: tenancy.location.created
    version: 1
    domain: tenancy
    description: >-
      A location was added to a partner. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.location.created.v1.schema.json
    example: ./examples/tenancy.location.created.v1.json

  - type: tenancy.membership.created
    version: 1
    domain: tenancy
    description: >-
      A user became a member of a partner, as its creator and first owner
      or by accepting an invitation. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.membership.created.v1.schema.json
    example: ./examples/tenancy.membership.created.v1.json

  - type: tenancy.service.updated
    version: 1
    domain: tenancy
    description: >-
      A partner's service was registered, enabled, disabled, configured,
      switched on or off at a location, or repriced; readers ask the
      registry where it trades. The envelope's `partner_id` is the partner;
      the configuration is not in the payload.
    payload_schema: ./payloads/tenancy.service.updated.v1.schema.json
    example: ./examples/tenancy.service.updated.v1.json

  - type: tenancy.partner.updated
    version: 1
    domain: tenancy
    description: >-
      A partner's profile, legal identity, kind, contacts, logo or
      banner changed; the payload names the members, never their values.
      The envelope's `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.partner.updated.v1.schema.json
    example: ./examples/tenancy.partner.updated.v1.json

  - type: tenancy.location.updated
    version: 1
    domain: tenancy
    description: >-
      A location's profile, settings, fulfilment, order settings,
      listing, pause, pictures or typed fields changed; the payload
      names the members. The envelope's `partner_id` is the location's
      partner.
    payload_schema: ./payloads/tenancy.location.updated.v1.schema.json
    example: ./examples/tenancy.location.updated.v1.json

  - type: tenancy.location.status_changed
    version: 1
    domain: tenancy
    description: >-
      A location moved along its lifecycle (pending, active, suspended,
      archived), including going live with its partner's activation. The
      envelope's `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.status_changed.v1.schema.json
    example: ./examples/tenancy.location.status_changed.v1.json

  - type: tenancy.location.deleted
    version: 1
    domain: tenancy
    description: >-
      A location was deleted softly, into the bin, from where it can be
      restored. The envelope's `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.deleted.v1.schema.json
    example: ./examples/tenancy.location.deleted.v1.json

  - type: tenancy.location.restored
    version: 1
    domain: tenancy
    description: >-
      A location was restored from the bin. The envelope's `partner_id`
      is the location's partner.
    payload_schema: ./payloads/tenancy.location.restored.v1.schema.json
    example: ./examples/tenancy.location.restored.v1.json

  - type: tenancy.location.paused
    version: 1
    domain: tenancy
    description: >-
      A location was paused until a moment, with a reason; it resumes by
      itself at `until`. The envelope's `partner_id` is the location's
      partner.
    payload_schema: ./payloads/tenancy.location.paused.v1.schema.json
    example: ./examples/tenancy.location.paused.v1.json

  - type: tenancy.location.resumed
    version: 1
    domain: tenancy
    description: >-
      A paused location was resumed before its moment. The envelope's
      `partner_id` is the location's partner.
    payload_schema: ./payloads/tenancy.location.resumed.v1.schema.json
    example: ./examples/tenancy.location.resumed.v1.json

  - type: tenancy.document.filed
    version: 1
    domain: tenancy
    description: >-
      A partner filed a compliance document for review. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.filed.v1.schema.json
    example: ./examples/tenancy.document.filed.v1.json

  - type: tenancy.document.removed
    version: 1
    domain: tenancy
    description: >-
      A compliance document was taken off file. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.removed.v1.schema.json
    example: ./examples/tenancy.document.removed.v1.json

  - type: tenancy.document.reviewed
    version: 1
    domain: tenancy
    description: >-
      Platform staff approved or rejected a compliance document;
      services waiting for it are enabled in the same act. The
      envelope's `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.document.reviewed.v1.schema.json
    example: ./examples/tenancy.document.reviewed.v1.json

  - type: tenancy.document.notice_sent
    version: 1
    domain: tenancy
    description: >-
      A notice about a document's expiry (thirty days, seven days, the
      day, the end of the grace) or rejection went to the partner's
      contacts, once per step. The envelope's `partner_id` is the
      partner.
    payload_schema: ./payloads/tenancy.document.notice_sent.v1.schema.json
    example: ./examples/tenancy.document.notice_sent.v1.json

  - type: tenancy.payout_account.changed
    version: 1
    domain: tenancy
    description: >-
      A partner stated or changed its payout account, unverified again;
      a changed number or IFSC holds the next payout. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.payout_account.changed.v1.schema.json
    example: ./examples/tenancy.payout_account.changed.v1.json

  - type: tenancy.payout_account.verified
    version: 1
    domain: tenancy
    description: >-
      Platform staff verified a partner's payout account. The envelope's
      `partner_id` is the partner.
    payload_schema: ./payloads/tenancy.payout_account.verified.v1.schema.json
    example: ./examples/tenancy.payout_account.verified.v1.json

  - type: tenancy.plan.changed
    version: 1
    domain: tenancy
    description: >-
      A partner's plan changed (by platform staff, at a scheduled
      moment, or when the trial ended); services of kinds the new plan
      lacks were disabled in the same act. The envelope's `partner_id`
      is the partner.
    payload_schema: ./payloads/tenancy.plan.changed.v1.schema.json
    example: ./examples/tenancy.plan.changed.v1.json

  - type: reference.vertical.transitioned
    version: 1
    domain: reference
    description: >-
      A Vertical moved along its lifecycle (active, inactive, archived), so
      every open screen re-reads its display grid. The envelope's
      `partner_id` is `null`.
    payload_schema: ./payloads/reference.vertical.transitioned.v1.schema.json
    example: ./examples/reference.vertical.transitioned.v1.json

  - type: reference.country.status_changed
    version: 1
    domain: reference
    description: >-
      A country's status or one of its switches (orders, sign-in) changed;
      the payload carries the country's whole operating state. The
      envelope's `partner_id` is `null`.
    payload_schema: ./payloads/reference.country.status_changed.v1.schema.json
    example: ./examples/reference.country.status_changed.v1.json

  - type: reference.service_area.status_changed
    version: 1
    domain: reference
    description: >-
      A service area's status changed; everything beneath it follows, since
      `effectively_active` is read through the chain. The envelope's
      `partner_id` is `null`.
    payload_schema: ./payloads/reference.service_area.status_changed.v1.schema.json
    example: ./examples/reference.service_area.status_changed.v1.json

  - type: identity.sign_in.failed
    version: 1
    domain: identity
    description: >-
      A sign-in, a second step, a proof of the signed-in person or a
      service credential failed, with its true reason, which the answer to
      the caller never carries, for detecting credential stuffing. The
      envelope's `partner_id` is `null`; the payload carries a digest of
      the identifier and never the address, the password or the code.
    payload_schema: ./payloads/identity.sign_in.failed.v1.schema.json
    example: ./examples/identity.sign_in.failed.v1.json

  - type: access.grant.granted
    version: 1
    domain: access
    description: >-
      A role was granted to a member at a scope: the whole partner, one
      Location or one Service, or the platform. The envelope's
      `partner_id` is the partner, or `null` for a platform grant.
    payload_schema: ./payloads/access.grant.granted.v1.schema.json
    example: ./examples/access.grant.granted.v1.json

  - type: access.grant.revoked
    version: 1
    domain: access
    description: >-
      A grant was revoked, directly, by setting the member's access, or by
      removing the membership. The envelope's `partner_id` is the partner,
      or `null` for a platform grant.
    payload_schema: ./payloads/access.grant.revoked.v1.schema.json
    example: ./examples/access.grant.revoked.v1.json

  - type: access.membership.status_changed
    version: 1
    domain: access
    description: >-
      A membership was disabled or enabled; a disabled member keeps their
      grants for re-enabling. The envelope's `partner_id` is the partner,
      or `null` for a platform membership.
    payload_schema: ./payloads/access.membership.status_changed.v1.schema.json
    example: ./examples/access.membership.status_changed.v1.json

  - type: access.membership.removed
    version: 1
    domain: access
    description: >-
      A membership was removed and its grants revoked; the person, their
      profile and their other memberships remain. The envelope's
      `partner_id` is the partner, or `null` for a platform membership.
    payload_schema: ./payloads/access.membership.removed.v1.schema.json
    example: ./examples/access.membership.removed.v1.json

  - type: access.role.changed
    version: 1
    domain: access
    description: >-
      A role was defined, renamed or given new permissions, or deleted.
      The envelope's `partner_id` is the partner that owns the role, or
      `null` for a platform role.
    payload_schema: ./payloads/access.role.changed.v1.schema.json
    example: ./examples/access.role.changed.v1.json

  - type: access.envelope.changed
    version: 1
    domain: access
    description: >-
      The platform changed what it withholds from a partner's
      entitlements; every role of the partner lost what is withheld at
      once. The envelope's `partner_id` is the partner.
    payload_schema: ./payloads/access.envelope.changed.v1.schema.json
    example: ./examples/access.envelope.changed.v1.json

  - type: catalog.item.changed
    version: 1
    domain: catalog
    description: >-
      An item of a store's catalogue was created, changed, deleted or
      duplicated, or its stock, prices, questions or categories changed;
      the store's menu is republished within about a second. The
      envelope's `partner_id` is the store's partner; the store's
      catalogue channel carries `catalog.changed`.
    payload_schema: ./payloads/catalog.item.changed.v1.schema.json
    example: ./examples/catalog.item.changed.v1.json

  - type: catalog.category.changed
    version: 1
    domain: catalog
    description: >-
      A category of a store's catalogue was created, changed, deleted,
      duplicated or reordered, or the items on it changed. The
      envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.category.changed.v1.schema.json
    example: ./examples/catalog.category.changed.v1.json

  - type: catalog.modifier.changed
    version: 1
    domain: catalog
    description: >-
      A question (a modifier) of a store's catalogue was created,
      changed, deleted or duplicated, or its answers changed. The
      envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.modifier.changed.v1.schema.json
    example: ./examples/catalog.modifier.changed.v1.json

  - type: catalog.brand.changed
    version: 1
    domain: catalog
    description: >-
      A brand of a store's own list was created, renamed (and so renamed
      on every item carrying it) or deleted (leaving its items without a
      brand). The envelope's `partner_id` is the store's partner.
    payload_schema: ./payloads/catalog.brand.changed.v1.schema.json
    example: ./examples/catalog.brand.changed.v1.json

  - type: catalog.menu.published
    version: 1
    domain: catalog
    description: >-
      A store's menu was rebuilt into a new published document, within
      about a second of the changes it carries; its version only rises.
      The envelope's `partner_id` is the store's partner; the store's
      public channel carries `menu.published` with the version only, and
      search re-indexes the store from the document.
    payload_schema: ./payloads/catalog.menu.published.v1.schema.json
    example: ./examples/catalog.menu.published.v1.json

  - type: catalog.search.missed
    version: 1
    domain: catalog
    description: >-
      A customer's search found nothing, across a service area or inside
      one store; kept without the customer's identity so synonym groups
      and catalogues can be improved. The envelope's `partner_id` is
      `null`.
    payload_schema: ./payloads/catalog.search.missed.v1.schema.json
    example: ./examples/catalog.search.missed.v1.json

  - type: catalog.taxonomy.changed
    version: 1
    domain: catalog
    description: >-
      A term of the shared taxonomy was created, renamed, moved,
      changed, deprecated, merged or deleted; a rename keeps the id,
      so every mapping holds. The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/catalog.taxonomy.changed.v1.schema.json
    example: ./examples/catalog.taxonomy.changed.v1.json

  - type: catalog.mapping.changed
    version: 1
    domain: catalog
    description: >-
      A store's category, or one item more narrowly, was mapped to a
      term of the shared taxonomy or unmapped, by its Partner or by
      Mission Control on its behalf. The envelope's `partner_id` is
      the store's Partner; search re-indexes the store.
    payload_schema: ./payloads/catalog.mapping.changed.v1.schema.json
    example: ./examples/catalog.mapping.changed.v1.json

  - type: crosssell.recommendation.shown
    version: 1
    domain: crosssell
    description: >-
      A recommendation was shown with its kind and its reason; the
      customer by id alone, `null` for a visitor. The envelope's
      `partner_id` is `null`, so no Partner reads who was shown its
      items.
    payload_schema: ./payloads/crosssell.recommendation.shown.v1.schema.json
    example: ./examples/crosssell.recommendation.shown.v1.json

  - type: crosssell.recommendation.accepted
    version: 1
    domain: crosssell
    description: >-
      A recommended item was added to a basket from the suggestion,
      published once per recommendation with its kind and the item.
      The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/crosssell.recommendation.accepted.v1.schema.json
    example: ./examples/crosssell.recommendation.accepted.v1.json

  - type: crosssell.reorder.prompted
    version: 1
    domain: crosssell
    description: >-
      A customer was prompted to reorder from a category they order
      at a steady interval, once its time came: at most one prompt a
      day, only with the push marketing consent and recommendations
      on. The notifications module sends the push. The envelope's
      `partner_id` is `null`.
    payload_schema: ./payloads/crosssell.reorder.prompted.v1.schema.json
    example: ./examples/crosssell.reorder.prompted.v1.json

  - type: notifications.notice.sent
    version: 1
    domain: notifications
    description: >-
      Mission Control sent a notice; it was stored for every Location it
      reached before any was told. Each Location's notices channel then
      carries `notice.sent` with the notice id, and the Location's signed-in
      devices are pushed. The envelope's `partner_id` is `null`.
    payload_schema: ./payloads/notifications.notice.sent.v1.schema.json
    example: ./examples/notifications.notice.sent.v1.json

  - type: notifications.message.failed
    version: 1
    domain: notifications
    description: >-
      A message was given up: its provider refused it, or it was still
      undeliverable after the retries at 1, 5 and 30 minutes. Operations
      watch the share of failures per channel. Never the number, the
      address or the words.
    payload_schema: ./payloads/notifications.message.failed.v1.schema.json
    example: ./examples/notifications.message.failed.v1.json

  - type: payments.payment.authorized
    version: 1
    domain: payments
    description: "A payment is confirmed: what checkout needs is secured by the provider's word (a card held, a UPI payment made), by the Wallet's hold or by the cash to collect, so the order may be placed. Ordering places the order on it. The envelope's `partner_id` is the order's Partner, `null` for a top-up."
    payload_schema: ./payloads/payments.payment.authorized.v1.schema.json
    example: ./examples/payments.payment.authorized.v1.json

  - type: payments.payment.captured
    version: 1
    domain: payments
    description: "Money was taken: a UPI payment made, a card charged at acceptance or at checkout, the Wallet's hold spent at acceptance (the promotional balance first), cash collected, or a top-up paid. Each field is what this capture took, by part; the ledger posts it at once. The envelope's `partner_id` is the order's Partner, `null` for a top-up."
    payload_schema: ./payloads/payments.payment.captured.v1.schema.json
    example: ./examples/payments.payment.captured.v1.json

  - type: payments.payment.failed
    version: 1
    domain: payments
    description: A try at the provider did not succeed (declined, refused, expired), or the charge at acceptance was refused. `final` says whether the payment can still be tried again within the order's time; a final failure releases the Wallet's hold. The envelope's `partner_id` is the order's Partner, `null` for a top-up.
    payload_schema: ./payloads/payments.payment.failed.v1.schema.json
    example: ./examples/payments.payment.failed.v1.json

  - type: payments.payment.released
    version: 1
    domain: payments
    description: "Holds were given back without taking money: a card hold voided, the Wallet's hold returned, the cash to collect cancelled, because the order was declined, cancelled or expired, or because less was kept at acceptance. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.payment.released.v1.schema.json
    example: ./examples/payments.payment.released.v1.json

  - type: payments.refund.issued
    version: 1
    domain: payments
    description: "A refund was made: what goes back to the original UPI or card payment and what goes to the Wallet, by balance; whether it gives back money the order never kept (`unsettled`) or money of a settled order (`settled`) and who bears it. The ledger posts it at once; the source part is sent to the provider when the customer can no longer take it in the Wallet. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.refund.issued.v1.schema.json
    example: ./examples/payments.refund.issued.v1.json

  - type: payments.refund.settled
    version: 1
    domain: payments
    description: "The source part of a refund reached its end: the provider completed it, or it went to the Wallet's paid balance instead, because the provider refused it or the customer took it there before it was sent. The ledger moves what went to the Wallet. The envelope's `partner_id` is the order's Partner."
    payload_schema: ./payloads/payments.refund.settled.v1.schema.json
    example: ./examples/payments.refund.settled.v1.json

  - type: wallet.entry.recorded
    version: 1
    domain: wallet
    description: "A customer's Wallet changed: a top-up, a credit, a refund, a hold for an order, its spend or release, a withdrawal or a correction, as one entry of one balance. The customer's channel carries `wallet.changed` to read again. The ledger posts credits and corrections from it; the other kinds are posted from the payments events that caused them. The envelope's `partner_id` is `null`, or the Partner that pays for a credit."
    payload_schema: ./payloads/wallet.entry.recorded.v1.schema.json
    example: ./examples/wallet.entry.recorded.v1.json

  - type: ledger.entry.posted
    version: 1
    domain: ledger
    description: "A journal entry was posted: its kind, what it is about and its postings, the debits equal to the credits. The envelope's `partner_id` is the Partner the entry is about, `null` otherwise."
    payload_schema: ./payloads/ledger.entry.posted.v1.schema.json
    example: ./examples/ledger.entry.posted.v1.json

  - type: payments.alert.raised
    version: 1
    domain: payments
    description: "A nightly check found a difference: a payment or refund the provider does not know, one it holds that nobody recorded, an amount the two disagree on, the ledger's provider clearing against the payments, or a Wallet against its entries or the ledger. Listed in Mission Control's Finance section until resolved. The envelope's `partner_id` is `null`."
    payload_schema: ./payloads/payments.alert.raised.v1.schema.json
    example: ./examples/payments.alert.raised.v1.json

  - type: ordering.order.placed
    version: 1
    domain: ordering
    description: >-
      An order was placed: paid, held, or with nothing to take now
      (cash); the store hears it. Consumers: notifications (the
      customer, the store's new order with its sound), the ledger and
      payments.
    payload_schema: ./payloads/ordering.order.placed.v1.schema.json
    example: ./examples/ordering.order.placed.v1.json

  - type: ordering.order.accepted
    version: 1
    domain: ordering
    description: >-
      The store, or Mission Control, accepted an order with a
      preparation time: it is promised ready at acceptance plus that
      time. Consumers: notifications (the customer, with the time), the
      ledger, dispatch from step 4.
    payload_schema: ./payloads/ordering.order.accepted.v1.schema.json
    example: ./examples/ordering.order.accepted.v1.json

  - type: ordering.order.lines_removed
    version: 1
    domain: ordering
    description: >-
      Lines were left out as the store accepted: never charged. A
      payment taken at checkout has what they cost refunded the way it
      was paid (an `ordering.order.refunded` follows); a held card is
      charged less. Published with `ordering.order.accepted`.
    payload_schema: ./payloads/ordering.order.lines_removed.v1.schema.json
    example: ./examples/ordering.order.lines_removed.v1.json

  - type: ordering.order.declined
    version: 1
    domain: ordering
    description: >-
      A placed order was declined: by the store with a reason, by
      Mission Control, or by the platform when nobody answered in time
      (`not_answered`) or the card could not be charged
      (`payment_failed`). Every hold is released and a payment taken at
      checkout refunded. Consumers: notifications (the customer, whether
      they were charged), payments, the ledger.
    payload_schema: ./payloads/ordering.order.declined.v1.schema.json
    example: ./examples/ordering.order.declined.v1.json

  - type: ordering.order.cancelled
    version: 1
    domain: ordering
    description: >-
      An order was cancelled: by the customer before acceptance (while
      still paying too, when they gave up paying: `previous_status`
      `paying`, nothing taken and the store never told), by the store
      after it, or by Mission Control at any point. Everything held is
      released and everything paid goes back, each part where it came
      from; `payer` bears a refund after acceptance. Consumers:
      notifications, payments (releases what ordering's own call did
      not), the ledger (reverses an accepted order's split).
    payload_schema: ./payloads/ordering.order.cancelled.v1.schema.json
    example: ./examples/ordering.order.cancelled.v1.json

  - type: ordering.order.expired
    version: 1
    domain: ordering
    description: >-
      An order was not paid within the platform's window
      (`ordering.unpaid_expiry_minutes`) and expired: every hold
      released, anything taken refunded; the customer's basket still
      holds what they chose and the order is not listed.
    payload_schema: ./payloads/ordering.order.expired.v1.schema.json
    example: ./examples/ordering.order.expired.v1.json

  - type: ordering.order.preparation_extended
    version: 1
    domain: ordering
    description: >-
      An accepted order was given more preparation time; its promise
      moved and the customer is told.
    payload_schema: ./payloads/ordering.order.preparation_extended.v1.schema.json
    example: ./examples/ordering.order.preparation_extended.v1.json

  - type: ordering.order.ready
    version: 1
    domain: ordering
    description: >-
      An accepted order was marked ready: a pickup waits to be
      collected, a delivery for its agent. Consumers: notifications (a
      pickup's customer), dispatch from step 4.
    payload_schema: ./payloads/ordering.order.ready.v1.schema.json
    example: ./examples/ordering.order.ready.v1.json

  - type: ordering.order.handed_over
    version: 1
    domain: ordering
    description: >-
      A ready delivery was handed to the agent and is on its way.
    payload_schema: ./payloads/ordering.order.handed_over.v1.schema.json
    example: ./examples/ordering.order.handed_over.v1.json

  - type: ordering.order.collected
    version: 1
    domain: ordering
    description: >-
      A ready pickup was collected at the counter: the order is
      complete.
    payload_schema: ./payloads/ordering.order.collected.v1.schema.json
    example: ./examples/ordering.order.collected.v1.json

  - type: ordering.order.delivered
    version: 1
    domain: ordering
    description: >-
      A delivery on its way was delivered: the order is complete.
    payload_schema: ./payloads/ordering.order.delivered.v1.schema.json
    example: ./examples/ordering.order.delivered.v1.json

  - type: ordering.order.refunded
    version: 1
    domain: ordering
    description: >-
      Money went back on an order: lines left out at acceptance, a
      decline or a cancellation of a paid order, Mission Control's
      refund of lines and fees with a reason, or a payment confirmed
      after its order ended. The payments module made the refund (to the
      source first, up to what it was charged less what was refunded to
      it, the rest to the Wallet) and `refund_id` is its id; the ledger
      posts it from `payments.refund.issued`. Consumers: notifications.
    payload_schema: ./payloads/ordering.order.refunded.v1.schema.json
    example: ./examples/ordering.order.refunded.v1.json

  - type: ordering.order.help_requested
    version: 1
    domain: ordering
    description: >-
      A customer asked for help with an order; Mission Control sees it
      at once as needing somebody.
    payload_schema: ./payloads/ordering.order.help_requested.v1.schema.json
    example: ./examples/ordering.order.help_requested.v1.json

  - type: ordering.order.help_resolved
    version: 1
    domain: ordering
    description: >-
      Support resolved a help request with a sentence saying what was
      done; the customer is told.
    payload_schema: ./payloads/ordering.order.help_resolved.v1.schema.json
    example: ./examples/ordering.order.help_resolved.v1.json

  - type: orchestration.delivery.created
    version: 1
    domain: orchestration
    description: >-
      A store accepted a delivery order and its delivery was written down, before any Provider is asked: one per order however many times the acceptance is heard, with the pickup at the ready time and the drop at the promised time, each moved up to the next five minutes, and when its offers go out.
    payload_schema: ./payloads/orchestration.delivery.created.v1.schema.json
    example: ./examples/orchestration.delivery.created.v1.json

  - type: orchestration.delivery.released
    version: 1
    domain: orchestration
    description: >-
      A delivery waiting for release was released: its offers go out so the Agent reaches the store as the order is ready.
    payload_schema: ./payloads/orchestration.delivery.released.v1.schema.json
    example: ./examples/orchestration.delivery.released.v1.json

  - type: orchestration.delivery.offered
    version: 1
    domain: orchestration
    description: >-
      A delivery was offered to one or more Agents. The Agent's devices are pushed and its task channel hears `offer.changed`.
    payload_schema: ./payloads/orchestration.delivery.offered.v1.schema.json
    example: ./examples/orchestration.delivery.offered.v1.json

  - type: orchestration.delivery.assigned
    version: 1
    domain: orchestration
    description: >-
      An Agent has the delivery: an offer accepted, a direct assignment by a strategy, or a choice by hand. The explanation summarised here is on the delivery in full.
    payload_schema: ./payloads/orchestration.delivery.assigned.v1.schema.json
    example: ./examples/orchestration.delivery.assigned.v1.json

  - type: orchestration.delivery.collected
    version: 1
    domain: orchestration
    description: >-
      The Agent completed the pickup: the order is on its way, as `ordering.order.on_its_way` says.
    payload_schema: ./payloads/orchestration.delivery.collected.v1.schema.json
    example: ./examples/orchestration.delivery.collected.v1.json

  - type: orchestration.delivery.delivered
    version: 1
    domain: orchestration
    description: >-
      The Agent completed the drop with its proof: the order is delivered, as `ordering.order.delivered` says.
    payload_schema: ./payloads/orchestration.delivery.delivered.v1.schema.json
    example: ./examples/orchestration.delivery.delivered.v1.json

  - type: orchestration.delivery.undelivered
    version: 1
    domain: orchestration
    description: >-
      The drop failed: the delivery failed with the Agent's reason, and the order is undelivered for the dispatcher and Mission Control to send again or cancel.
    payload_schema: ./payloads/orchestration.delivery.undelivered.v1.schema.json
    example: ./examples/orchestration.delivery.undelivered.v1.json

  - type: orchestration.delivery.called_off
    version: 1
    domain: orchestration
    description: >-
      The delivery was called off: its order ended before the courier did, or the order was sent again with a new delivery. Offers are withdrawn and the Agent's tasks called off with the reason.
    payload_schema: ./payloads/orchestration.delivery.called_off.v1.schema.json
    example: ./examples/orchestration.delivery.called_off.v1.json

  - type: orchestration.delivery.waiting_for_agent
    version: 1
    domain: orchestration
    description: >-
      A released delivery has waited 3 minutes with no Agent taking it: it is raised to the dispatcher and Mission Control, and still offered again every minute.
    payload_schema: ./payloads/orchestration.delivery.waiting_for_agent.v1.schema.json
    example: ./examples/orchestration.delivery.waiting_for_agent.v1.json

  - type: orchestration.delivery.needs_somebody
    version: 1
    domain: orchestration
    description: >-
      A delivery needs somebody: no Provider can carry it, the chain is exhausted, a Provider refused or lost it, the Agent handed it back or was let go, auto-assign is off or no team or zone holds it, or the Agent asked for help. It is listed first on the boards, with why.
    payload_schema: ./payloads/orchestration.delivery.needs_somebody.v1.schema.json
    example: ./examples/orchestration.delivery.needs_somebody.v1.json

  - type: ordering.order.on_its_way
    version: 1
    domain: ordering
    description: >-
      Dispatch moved a delivery order on its way, as the platform itself, when its Agent completed the pickup (through `ready` first when the store had not said so), naming the courier: the customer is told the Agent's first name and, for a cash order, the amount to keep ready.
    payload_schema: ./payloads/ordering.order.on_its_way.v1.schema.json
    example: ./examples/ordering.order.on_its_way.v1.json

  - type: ordering.order.undelivered
    version: 1
    domain: ordering
    description: >-
      Dispatch left an order on its way undelivered, as the platform itself, when its Agent failed the drop: the reason is for the dispatcher and Mission Control, who send it again or cancel it with a refund; the customer is told it could not be delivered and is being sorted out.
    payload_schema: ./payloads/ordering.order.undelivered.v1.schema.json
    example: ./examples/ordering.order.undelivered.v1.json

  - type: ordering.order.running_late
    version: 1
    domain: ordering
    description: >-
      An accepted, ready or on-its-way order is expected more than 5 minutes past its promise: the customer is told once, with the new time. The status does not change; told once per order however late it runs after.
    payload_schema: ./payloads/ordering.order.running_late.v1.schema.json
    example: ./examples/ordering.order.running_late.v1.json

  - type: reviews.review.written
    version: 1
    domain: reviews
    description: >-
      A customer reviewed a completed order, once and for good: a thumb, the tags chosen, whether a note and how many photos came with it, and the Agent who carried a delivery. It counts in the store's rating at once and, when it says the delivery was late and the delivery has no rating of its own, in the Agent's. Carries no note text.
    payload_schema: ./payloads/reviews.review.written.v1.schema.json
    example: ./examples/reviews.review.written.v1.json

  - type: reviews.review.hidden
    version: 1
    domain: reviews
    description: >-
      Mission Control hid a review's note and photos from the Partner and from customers, with a reason kept for the platform alone; its thumb and tags still count.
    payload_schema: ./payloads/reviews.review.hidden.v1.schema.json
    example: ./examples/reviews.review.hidden.v1.json

  - type: reviews.review.shown
    version: 1
    domain: reviews
    description: >-
      Mission Control showed a hidden review's note and photos again.
    payload_schema: ./payloads/reviews.review.shown.v1.schema.json
    example: ./examples/reviews.review.shown.v1.json

  - type: reviews.review.asked
    version: 1
    domain: reviews
    description: >-
      The platform asks a customer how their order was, once, between five and thirty minutes after it completed, at a store that takes reviews, unless it was reviewed already or the customer said "Not now": notifications pushes "How was your experience?" to the customer's devices.
    payload_schema: ./payloads/reviews.review.asked.v1.schema.json
    example: ./examples/reviews.review.asked.v1.json

  - type: reviews.reply.published
    version: 1
    domain: reviews
    description: >-
      Mission Control approved a Partner's reply to a review: it shows under the review on the store's page as the store's, by name, with its date, and the reviewer is told once.
    payload_schema: ./payloads/reviews.reply.published.v1.schema.json
    example: ./examples/reviews.reply.published.v1.json

  - type: reviews.reply.rejected
    version: 1
    domain: reviews
    description: >-
      Mission Control rejected a Partner's reply to a review with a reason the Partner reads (a reply naming the customer beyond their first name, carrying contact details, an offer or a code, or abusing the customer); the store's devices are told, and the Partner may write one more.
    payload_schema: ./payloads/reviews.reply.rejected.v1.schema.json
    example: ./examples/reviews.reply.rejected.v1.json

  - type: reviews.task_rating.written
    version: 1
    domain: reviews
    description: >-
      A customer rated a delivery once, apart from the food, for the Agent who carried it: a thumb and tags. It counts in the Agent's rating in place of the order's review.
    payload_schema: ./payloads/reviews.task_rating.written.v1.schema.json
    example: ./examples/reviews.task_rating.written.v1.json

  - type: reviews.flag.decided
    version: 1
    domain: reviews
    description: >-
      An Agent's flag on a rating they found unfair was decided: `excluded` stops the rating counting for the Agent with the reason kept, the order's review unchanged; `kept` leaves it.
    payload_schema: ./payloads/reviews.flag.decided.v1.schema.json
    example: ./examples/reviews.flag.decided.v1.json

  - type: customers.customer.blocked
    version: 1
    domain: customers
    description: >-
      Support blocked a customer's account with a reason: every session ended at once, refreshes and sign-in answer `account_blocked`, and placing an order is refused, while orders already placed run to their end. On the customer's timeline.
    payload_schema: ./payloads/customers.customer.blocked.v1.schema.json
    example: ./examples/customers.customer.blocked.v1.json

  - type: customers.customer.unblocked
    version: 1
    domain: customers
    description: >-
      Support unblocked a customer's account with a reason: they can sign in again with nothing else changed. On the customer's timeline.
    payload_schema: ./payloads/customers.customer.unblocked.v1.schema.json
    example: ./examples/customers.customer.unblocked.v1.json

  - type: customers.note.written
    version: 1
    domain: customers
    description: >-
      Support kept a note on a customer's account, signed with the operator and the moment, never edited or removed, never shown to the customer. On the customer's timeline. Carries no note text.
    payload_schema: ./payloads/customers.note.written.v1.schema.json
    example: ./examples/customers.note.written.v1.json

  - type: operations.alert.opened
    version: 1
    domain: operations
    description: >-
      An alert opened: an objective burning its error budget (a page at 14.4 times over an hour confirmed over five minutes, a ticket at 6 times over six hours confirmed over thirty minutes), a job overdue by twice its interval, an outbox row failed for five minutes, a statement unpaid or an account check failed. Locally and in `dev` it is recorded and shown, never sent.
    payload_schema: ./payloads/operations.alert.opened.v1.schema.json
    example: ./examples/operations.alert.opened.v1.json

  - type: operations.alert.acknowledged
    version: 1
    domain: operations
    description: >-
      A platform member acknowledged an alert by name: it stops repeating while it stays open, and closes by itself once what fired it clears.
    payload_schema: ./payloads/operations.alert.acknowledged.v1.schema.json
    example: ./examples/operations.alert.acknowledged.v1.json

  - type: operations.alert.closed
    version: 1
    domain: operations
    description: >-
      An alert closed because what fired it cleared: the burn fell, the job ran, the row published, the statement was paid or the account checked.
    payload_schema: ./payloads/operations.alert.closed.v1.schema.json
    example: ./examples/operations.alert.closed.v1.json
  - type: payouts.statement.locked
    version: 1
    domain: payouts
    description: >-
      A week was locked into its statement, once, by the clock on the Tuesday after it or by platform staff once it was over: its figures never change after. The ledger settles the week from it: the GST the invoice bills beyond the orders' own, the cancellation fees, fee credits, adjustments and the cash the Location or the Agent kept, and an Agent's pay and tips into what the Agent is owed.
    payload_schema: ./payloads/payouts.statement.locked.v1.schema.json
    example: ./examples/payouts.statement.locked.v1.json

  - type: payouts.statement.sent
    version: 1
    domain: payouts
    description: >-
      A due statement was sent as a transfer through the payout provider, recorded before it was sent with a key so it is sent at most once: it shows as sending until the provider answers.
    payload_schema: ./payloads/payouts.statement.sent.v1.schema.json
    example: ./examples/payouts.statement.sent.v1.json

  - type: payouts.statement.paid
    version: 1
    domain: payouts
    description: >-
      A statement was paid: the payout provider processed its transfer, or platform staff marked it paid by hand with the day and the transfer's reference. The ledger posts the payout; the Location's inbox gets "Payout sent" with the amount, the account's last four digits, the reference and the week, and an Agent is pushed the same. It says sent, not arrived.
    payload_schema: ./payloads/payouts.statement.paid.v1.schema.json
    example: ./examples/payouts.statement.paid.v1.json

  - type: payouts.statement.unpaid
    version: 1
    domain: payouts
    description: >-
      A statement could not be paid: the payout provider failed or reversed its transfer, such as "account closed", or platform staff marked it unpaid with why. A paid statement's day and reference are cleared and the ledger reverses its payout. Mission Control is alerted.
    payload_schema: ./payloads/payouts.statement.unpaid.v1.schema.json
    example: ./examples/payouts.statement.unpaid.v1.json

  - type: payouts.statement.archived
    version: 1
    domain: payouts
    description: >-
      A statement was archived: locked with nothing to pay, saying why, or archived by platform staff.
    payload_schema: ./payloads/payouts.statement.archived.v1.schema.json
    example: ./examples/payouts.statement.archived.v1.json

  - type: payouts.statement.reopened
    version: 1
    domain: payouts
    description: >-
      Platform staff put a statement back to due, which clears its paid day and reference or its note; a paid statement's payout is reversed in the ledger.
    payload_schema: ./payloads/payouts.statement.reopened.v1.schema.json
    example: ./examples/payouts.statement.reopened.v1.json

  - type: payouts.adjustment.added
    version: 1
    domain: payouts
    description: >-
      Platform staff added money to a payee's payout or took money off it, with a reason the payee reads; it lands in the first week not locked yet and is settled into the statement that locks it.
    payload_schema: ./payloads/payouts.adjustment.added.v1.schema.json
    example: ./examples/payouts.adjustment.added.v1.json

  - type: payouts.adjustment.removed
    version: 1
    domain: payouts
    description: >-
      Platform staff took an adjustment back before its week was locked.
    payload_schema: ./payloads/payouts.adjustment.removed.v1.schema.json
    example: ./examples/payouts.adjustment.removed.v1.json

  - type: payouts.question.asked
    version: 1
    domain: payouts
    description: >-
      A Location or an Agent asked about a locked week, "Something look wrong?"; Mission Control lists it on the week's statement. The words stay on the platform.
    payload_schema: ./payloads/payouts.question.asked.v1.schema.json
    example: ./examples/payouts.question.asked.v1.json

  - type: payouts.question.answered
    version: 1
    domain: payouts
    description: >-
      Mission Control answered a question about a week, once: the answer appears under the week signed by the platform, and the Location's inbox and devices, or the Agent, are told.
    payload_schema: ./payloads/payouts.question.answered.v1.schema.json
    example: ./examples/payouts.question.answered.v1.json

  - type: payouts.account_check.passed
    version: 1
    domain: payouts
    description: >-
      A payout destination passed its one-rupee check: the payout provider sent ₹1.00, which stays with the holder, and the bank returned the holder's legal name; or platform staff checked it by hand with a reason. A statement held for it is due without the hold at once.
    payload_schema: ./payloads/payouts.account_check.passed.v1.schema.json
    example: ./examples/payouts.account_check.passed.v1.json

  - type: payouts.account_check.failed
    version: 1
    domain: payouts
    description: >-
      A payout destination failed its one-rupee check: the bank returned a different name, "The account is not in your legal name", or the transfer failed. Statements stay held, the Partner or the Agent is told, and Mission Control is alerted.
    payload_schema: ./payloads/payouts.account_check.failed.v1.schema.json
    example: ./examples/payouts.account_check.failed.v1.json

  - type: promotions.offer.created
    version: 1
    domain: promotions
    description: >-
      An offer was made as a draft, by its owner or by running an earlier one again.
    payload_schema: ./payloads/promotions.offer.created.v1.schema.json
    example: ./examples/promotions.offer.created.v1.json

  - type: promotions.offer.changed
    version: 1
    domain: promotions
    description: >-
      An offer's terms changed: in full before it started, only its name, a later end and higher limits while it runs.
    payload_schema: ./payloads/promotions.offer.changed.v1.schema.json
    example: ./examples/promotions.offer.changed.v1.json

  - type: promotions.offer.published
    version: 1
    domain: promotions
    description: >-
      A draft was published: scheduled, or live at once. A campaign with a Partner share invites each Partner it reaches.
    payload_schema: ./payloads/promotions.offer.published.v1.schema.json
    example: ./examples/promotions.offer.published.v1.json

  - type: promotions.offer.started
    version: 1
    domain: promotions
    description: >-
      An offer went live: at its start by the platform's clock, once whichever instance reaches it first, or started now by its owner. Open store pages are told.
    payload_schema: ./payloads/promotions.offer.started.v1.schema.json
    example: ./examples/promotions.offer.started.v1.json

  - type: promotions.offer.paused
    version: 1
    domain: promotions
    description: >-
      An offer was paused by its owner, or by the platform with a reason the Partner reads.
    payload_schema: ./payloads/promotions.offer.paused.v1.schema.json
    example: ./examples/promotions.offer.paused.v1.json

  - type: promotions.offer.resumed
    version: 1
    domain: promotions
    description: >-
      A pause was lifted: live again, or scheduled until its start.
    payload_schema: ./payloads/promotions.offer.resumed.v1.schema.json
    example: ./examples/promotions.offer.resumed.v1.json

  - type: promotions.offer.ended
    version: 1
    domain: promotions
    description: >-
      An offer ended: at its end by the clock, or stopped by its owner; its codes are retired. Orders already placed keep it.
    payload_schema: ./payloads/promotions.offer.ended.v1.schema.json
    example: ./examples/promotions.offer.ended.v1.json

  - type: promotions.offer.cancelled
    version: 1
    domain: promotions
    description: >-
      A scheduled offer was cancelled before it started; its codes are retired.
    payload_schema: ./payloads/promotions.offer.cancelled.v1.schema.json
    example: ./examples/promotions.offer.cancelled.v1.json

  - type: promotions.offer.archived
    version: 1
    domain: promotions
    description: >-
      An ended or cancelled offer was moved out of its owner's lists.
    payload_schema: ./payloads/promotions.offer.archived.v1.schema.json
    example: ./examples/promotions.offer.archived.v1.json

  - type: promotions.offer.restored
    version: 1
    domain: promotions
    description: >-
      An archived offer was brought back.
    payload_schema: ./payloads/promotions.offer.restored.v1.schema.json
    example: ./examples/promotions.offer.restored.v1.json

  - type: promotions.offer.deleted
    version: 1
    domain: promotions
    description: >-
      A draft was deleted.
    payload_schema: ./payloads/promotions.offer.deleted.v1.schema.json
    example: ./examples/promotions.offer.deleted.v1.json

  - type: promotions.code.created
    version: 1
    domain: promotions
    description: >-
      A code was added to an offer, or a batch of single-use codes made (announced once with its size), or a personal or referral code given.
    payload_schema: ./payloads/promotions.code.created.v1.schema.json
    example: ./examples/promotions.code.created.v1.json

  - type: promotions.code.retired
    version: 1
    domain: promotions
    description: >-
      A code was retired, by its owner or with its offer; those who hold it keep the offer.
    payload_schema: ./payloads/promotions.code.retired.v1.schema.json
    example: ./examples/promotions.code.retired.v1.json

  - type: promotions.code.claimed
    version: 1
    domain: promotions
    description: >-
      A customer added a code to their offers, typed in the account or the basket. Engagement records a referral from a referral code's claim.
    payload_schema: ./payloads/promotions.code.claimed.v1.schema.json
    example: ./examples/promotions.code.claimed.v1.json

  - type: promotions.participation.invited
    version: 1
    domain: promotions
    description: >-
      A campaign the Partners pay a share of invited a Location; it applies there only once accepted. The Location's notices carry the invitation.
    payload_schema: ./payloads/promotions.participation.invited.v1.schema.json
    example: ./examples/promotions.participation.invited.v1.json

  - type: promotions.participation.accepted
    version: 1
    domain: promotions
    description: >-
      A Location accepted a campaign: it applies there from that moment.
    payload_schema: ./payloads/promotions.participation.accepted.v1.schema.json
    example: ./examples/promotions.participation.accepted.v1.json

  - type: promotions.participation.declined
    version: 1
    domain: promotions
    description: >-
      A Location declined a campaign, an invitation or one the platform pays for in full: it stops applying there at once; orders already placed keep it.
    payload_schema: ./payloads/promotions.participation.declined.v1.schema.json
    example: ./examples/promotions.participation.declined.v1.json

  - type: promotions.redemption.reserved
    version: 1
    domain: promotions
    description: >-
      An order was placed with an offer: one use reserved, counting against the customer's uses, the offer's total uses and its budget, once whatever the retries.
    payload_schema: ./payloads/promotions.redemption.reserved.v1.schema.json
    example: ./examples/promotions.redemption.reserved.v1.json

  - type: promotions.redemption.confirmed
    version: 1
    domain: promotions
    description: >-
      The order completed: its use of the offer confirmed, with the cost split, published once.
    payload_schema: ./payloads/promotions.redemption.confirmed.v1.schema.json
    example: ./examples/promotions.redemption.confirmed.v1.json

  - type: promotions.redemption.released
    version: 1
    domain: promotions
    description: >-
      The order was declined, expired or cancelled: its use given back.
    payload_schema: ./payloads/promotions.redemption.released.v1.schema.json
    example: ./examples/promotions.redemption.released.v1.json
  - type: engagement.campaign.created
    version: 1
    domain: engagement
    description: >-
      A reward campaign was made, kept as a draft, in Mission Control or by a Partner on its own Locations.
    payload_schema: ./payloads/engagement.campaign.created.v1.schema.json
    example: ./examples/engagement.campaign.created.v1.json

  - type: engagement.campaign.published
    version: 1
    domain: engagement
    description: >-
      A reward campaign was published: live at once, or scheduled until its start. A Partner's carries its word that its business pays.
    payload_schema: ./payloads/engagement.campaign.published.v1.schema.json
    example: ./examples/engagement.campaign.published.v1.json

  - type: engagement.campaign.started
    version: 1
    domain: engagement
    description: >-
      A reward campaign went live, when published or when its start came on the clock.
    payload_schema: ./payloads/engagement.campaign.started.v1.schema.json
    example: ./examples/engagement.campaign.started.v1.json

  - type: engagement.campaign.paused
    version: 1
    domain: engagement
    description: >-
      A reward campaign was paused by its owner or by the platform; it grants nothing while paused, and progress made stays.
    payload_schema: ./payloads/engagement.campaign.paused.v1.schema.json
    example: ./examples/engagement.campaign.paused.v1.json

  - type: engagement.campaign.resumed
    version: 1
    domain: engagement
    description: >-
      A paused reward campaign was resumed.
    payload_schema: ./payloads/engagement.campaign.resumed.v1.schema.json
    example: ./examples/engagement.campaign.resumed.v1.json

  - type: engagement.campaign.ended
    version: 1
    domain: engagement
    description: >-
      A reward campaign ended: stopped, cancelled before it started, past its end, or out of budget. Rewards granted stay.
    payload_schema: ./payloads/engagement.campaign.ended.v1.schema.json
    example: ./examples/engagement.campaign.ended.v1.json

  - type: engagement.reward.granted
    version: 1
    domain: engagement
    description: >-
      A reward was granted once for what the customer did, from its campaign's budget: promotional Wallet credit with its funder as payer, or an offer held for the customer that the basket prices. Payouts charges a Partner's share of credit to the Location whose order earned it, under "Rewards you paid for"; the customer is told once by push where they consented.
    payload_schema: ./payloads/engagement.reward.granted.v1.schema.json
    example: ./examples/engagement.reward.granted.v1.json

  - type: engagement.reward.held
    version: 1
    domain: engagement
    description: >-
      A reward was held for review instead of granted: a signal on the customer raised it. Mission Control releases or refuses it, and the customer sees it as being checked.
    payload_schema: ./payloads/engagement.reward.held.v1.schema.json
    example: ./examples/engagement.reward.held.v1.json

  - type: engagement.reward.released
    version: 1
    domain: engagement
    description: >-
      A reward held for review was released by Mission Control and granted; `engagement.reward.granted` follows.
    payload_schema: ./payloads/engagement.reward.released.v1.schema.json
    example: ./examples/engagement.reward.released.v1.json

  - type: engagement.reward.refused
    version: 1
    domain: engagement
    description: >-
      A reward held for review was refused by Mission Control: the customer receives nothing from it, and its budget is freed.
    payload_schema: ./payloads/engagement.reward.refused.v1.schema.json
    example: ./examples/engagement.reward.refused.v1.json

  - type: engagement.reward.clawed_back
    version: 1
    domain: engagement
    description: >-
      A reward was taken back after the order that earned it was refunded in full or cancelled: credit taken back where it was not spent and marked clawed back where it was, a held offer withdrawn. Payouts gives a Partner back its share of what was taken back.
    payload_schema: ./payloads/engagement.reward.clawed_back.v1.schema.json
    example: ./examples/engagement.reward.clawed_back.v1.json

  - type: engagement.streak.advanced
    version: 1
    domain: engagement
    description: >-
      A customer's weekly streak counted a week with a completed order.
    payload_schema: ./payloads/engagement.streak.advanced.v1.schema.json
    example: ./examples/engagement.streak.advanced.v1.json

  - type: engagement.streak.frozen
    version: 1
    domain: engagement
    description: >-
      A week passed without an order and the month's freeze kept the streak; the customer is told their freeze kept it.
    payload_schema: ./payloads/engagement.streak.frozen.v1.schema.json
    example: ./examples/engagement.streak.frozen.v1.json

  - type: engagement.streak.broken
    version: 1
    domain: engagement
    description: >-
      A week passed without an order and no freeze was left: the streak is broken and shown as 0.
    payload_schema: ./payloads/engagement.streak.broken.v1.schema.json
    example: ./examples/engagement.streak.broken.v1.json

  - type: engagement.quest.started
    version: 1
    domain: engagement
    description: >-
      A customer pressed Start on a quest: from now its steps count, until its days run out.
    payload_schema: ./payloads/engagement.quest.started.v1.schema.json
    example: ./examples/engagement.quest.started.v1.json

  - type: engagement.quest.completed
    version: 1
    domain: engagement
    description: >-
      A customer completed a quest's last step; its reward is granted once.
    payload_schema: ./payloads/engagement.quest.completed.v1.schema.json
    example: ./examples/engagement.quest.completed.v1.json

  - type: engagement.quest.expired
    version: 1
    domain: engagement
    description: >-
      A quest's days ran out before its steps were done.
    payload_schema: ./payloads/engagement.quest.expired.v1.schema.json
    example: ./examples/engagement.quest.expired.v1.json

  - type: engagement.tier.changed
    version: 1
    domain: engagement
    description: >-
      A customer's tier changed: at once on crossing a threshold, or at the month's look, dropping one tier at a time. The customer is told once.
    payload_schema: ./payloads/engagement.tier.changed.v1.schema.json
    example: ./examples/engagement.tier.changed.v1.json

  - type: engagement.referral.recorded
    version: 1
    domain: engagement
    description: >-
      A friend added a customer's referral code and the referral was recorded; the referrer earns once the friend's first order completes.
    payload_schema: ./payloads/engagement.referral.recorded.v1.schema.json
    example: ./examples/engagement.referral.recorded.v1.json

  - type: engagement.referral.rewarded
    version: 1
    domain: engagement
    description: >-
      A referred friend's first order completed and the referrer was credited, "Your friend's first order with ZippyGo".
    payload_schema: ./payloads/engagement.referral.rewarded.v1.schema.json
    example: ./examples/engagement.referral.rewarded.v1.json

  - type: engagement.incentive.published
    version: 1
    domain: engagement
    description: >-
      An incentive for a delivery service's Agents was published: they see it in the Agent app and join it before anything counts.
    payload_schema: ./payloads/engagement.incentive.published.v1.schema.json
    example: ./examples/engagement.incentive.published.v1.json

  - type: engagement.incentive.joined
    version: 1
    domain: engagement
    description: >-
      An Agent joined an incentive for its current period; drop-offs completed from now count.
    payload_schema: ./payloads/engagement.incentive.joined.v1.schema.json
    example: ./examples/engagement.incentive.joined.v1.json

  - type: engagement.incentive.earned
    version: 1
    domain: engagement
    description: >-
      An Agent earned from an incentive: reached a quest's tier, or completed a drop-off in a bonus's window. Payouts adds it to the platform fleet Agent's week under "Bonuses and quests", beside the pay for each task, or to a Partner's own Agent's week on the weekly report, for the Partner to pay.
    payload_schema: ./payloads/engagement.incentive.earned.v1.schema.json
    example: ./examples/engagement.incentive.earned.v1.json
