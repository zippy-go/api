type: object
description: "A try made: the payment as it stands and what the customer does next."
required:
  - payment
  - attempt
  - next_action
properties:
  payment:
    $ref: ../payments/Payment.yaml
    description: The payment.
  attempt:
    $ref: ../payments/PaymentAttempt.yaml
    description: The new try.
  next_action:
