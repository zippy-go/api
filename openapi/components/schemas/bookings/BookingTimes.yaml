type: object
description: When a booking moved.
required:
  - placed_at
  - confirmed_at
  - en_route_at
  - arrived_at
  - started_at
  - completed_at
  - ended_at
properties:
  placed_at:
    type:
      - string
      - "null"
    format: date-time
    description: Paid and placed.
    examples:
      - 2026-11-05T19:40:00+05:30
  confirmed_at:
    type:
      - string
      - "null"
    format: date-time
    description: Confirmed.
    examples:
      - 2026-11-05T19:52:00+05:30
  en_route_at:
    type:
      - string
      - "null"
    format: date-time
    description: The Agent on the way.
    examples:
      - null
  arrived_at:
    type:
      - string
      - "null"
    format: date-time
    description: Arrived.
    examples:
      - null
  started_at:
    type:
      - string
      - "null"
    format: date-time
    description: Started.
    examples:
      - null
  completed_at:
    type:
      - string
      - "null"
    format: date-time
    description: Completed.
    examples:
      - null
  ended_at:
    type:
      - string
      - "null"
    format: date-time
    description: Ended otherwise.
    examples:
      - null
examples:
  - placed_at: 2026-11-05T19:40:00+05:30
    confirmed_at: 2026-11-05T19:52:00+05:30
    en_route_at: null
    arrived_at: null
    started_at: null
    completed_at: null
    ended_at: null
