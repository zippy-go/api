# Path item for /v1/service-areas/resolve. Referenced from openapi.yaml.
get:
  operationId: resolveServiceArea
  summary: Resolves a pin to a service area
  description: "Resolves a pin to a service area: the fenced area containing it, else the nearest serving area within the cap, else the country's default. Public: the customer app asks before anybody signs in."
  tags:
    - Service areas
  security: []
  parameters:
    - name: lat
      in: query
      required: true
      description: Latitude in decimal degrees
      schema:
        type: number
    - name: lng
      in: query
      required: true
      description: Longitude in decimal degrees
      schema:
        type: number
    - name: cap
      in: query
      required: false
      description: How far a serving area may be, in metres; the platform setting when omitted
      schema:
        type: integer
  responses:
    '200':
      description: How the pin resolved
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/ResolvedPin.yaml
    '400':
      description: Malformed query
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
