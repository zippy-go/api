# Path item for /v1/platform/taxonomy/mapping. Referenced from openapi.yaml.
get:
  operationId: listCatalogMappings
  summary: See how far every store is mapped
  description: |
    Every store with a catalogue and how far it is mapped to the taxonomy: its
    categories and how many are mapped, its unmapped items and the items missing
    an attribute their term requires, by Partner and store name. Opening one, and
    mapping on the Partner's behalf, use the Partner's mapping operations with a
    Mission Control token. `catalog:oversee`.
  tags:
    - Taxonomy
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: 'Only this Partner''s stores.'
      schema:
        type: string
        format: uuid
    - name: vertical_id
      in: query
      required: false
      description: 'Only the stores of this Vertical.'
      schema:
        type: string
        format: uuid
    - name: tasks
      in: query
      required: false
      description: 'Only the stores with a task left (`true`), or without (`false`).'
      schema:
        type: boolean
    - name: limit
      in: query
      required: false
      description: 'How many per page. 1 to 100, 25 by default.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: 'The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.'
      schema:
        type: string
  responses:
    "200":
      description: 'A page of stores.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/taxonomy/LocationMappingSummaryPage.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `catalog:oversee` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
