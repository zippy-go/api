type: object
description: An item a bulk act did not change, with why.
required:
  - item_id
  - code
  - detail
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
  code:
    type: string
    description: The problem code it would have been refused with.
    examples:
      - category_has_subcategories
  detail:
    type: string
    description: Why, in a sentence a screen may show.
    examples:
      - Breakfast holds sub-categories; put the item on one of them.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    code: not_found
    detail: item 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101 was not found.
