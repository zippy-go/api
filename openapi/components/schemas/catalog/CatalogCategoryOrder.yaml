type: object
description: "Request body of `PUT .../catalog/categories/order`: every live category once, in the new order."
required:
  - category_ids
properties:
  category_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The categories in their new order.
examples:
  - category_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc002
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc001
