# Path item for /v1/platform/agents. Referenced from openapi.yaml.
get:
  operationId: listAllAgents
  summary: List every Agent across Partners
  description: Every Agent of every Partner, the platform fleet's included, by name, with the counts of the selection. Needs platform `agent:read`. The platform fleet is managed through the Partner routes with its Partner id.
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: partner_id
      in: query
      required: false
      description: Only this Partner's.
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    - name: service_id
      in: query
      required: false
      description: Only this service's.
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    - name: status
      in: query
      required: false
      description: Only Agents in this status.
      schema:
        $ref: ../../components/schemas/agents/AgentMembershipStatus.yaml
    - name: q
      in: query
      required: false
      description: Agents whose name holds these words, or whose mobile number ends in these digits.
      schema:
        type: string
        maxLength: 100
      example: Ravi
    - name: limit
      in: query
      required: false
      description: At most this many, 1 to 200; 50 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
      example: 50
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
  responses:
    "200":
      description: The Agents.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgentPage.yaml
    "400":
      description: "`validation_failed`: a malformed filter, or `cursor_invalid`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` naming the platform permission."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
