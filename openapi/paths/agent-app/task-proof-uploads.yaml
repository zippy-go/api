# Path item for /v1/agent/tasks/{task_id}/proof-uploads. Referenced from openapi.yaml.
parameters:
  - name: task_id
    in: path
    required: true
    description: "The task: one stop of a trip, held by the Agent."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
post:
  operationId: grantTaskProofUpload
  summary: Get an upload grant for proof
  description: "Issues a five-minute grant to post a proof photo or signature straight to private storage (purpose `proof_of_delivery_photo`: JPEG, PNG or WebP, at most 8 MB), for a task under way whose workflow asks for one, three files a step at most. Send the photo or signature step with the grant's asset id once the file is posted. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What the file is.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/TaskProofUpload.yaml
  responses:
    "201":
      description: The reservation and the form to post the file with.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/assets/AssetGrant.yaml
    "400":
      description: "`validation_failed` with `unsupported_file_type` or `file_too_large`, or a kind the workflow does not ask for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such task of the caller's memberships."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`task_closed`, or `conflict` when three files were granted for the step already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "503":
      description: "`unavailable`: the store is not configured or not answering."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
