# Path item for /v1/platform/customers/{customer_id}. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: "The customer (a user id)."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70"
get:
  operationId: getPlatformCustomer
  summary: "Read a customer"
  description: "A customer's page, read only: name, status, when they joined, the city of their selected address, mobile, email, the market, the marketing consent channel by channel, when they accepted the terms, their addresses with the selected one first, the devices they are signed in on now as each app described itself, and whether the account is blocked, by whom and why. Never the date of birth. Nothing here changes the customer's details. The Wallet is `GET .../wallet`, the orders `GET /v1/platform/orders` with `customer_id`. Mission Control tokens only, with `customer:read`."
  tags:
    - Customers
  security:
    - Bearer: []
  responses:
    "200":
      description: "The customer."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/customers/PlatformCustomer.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:read`, or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such customer."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
