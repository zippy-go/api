type: object
description: A question in the catalogue tree with its rule and its answers.
required:
  - id
  - name
  - hint
  - min
  - max
  - required
  - repeats
  - status
  - answers
properties:
  id:
    type: string
    format: uuid
    description: The question.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
  name:
    $ref: ./LocalizedText.yaml
    description: Its name.
  hint:
    oneOf:
      - $ref: ./LocalizedText.yaml
      - type: "null"
    description: Its hint.
  min:
    type: integer
    description: The least answers it asks for.
    examples:
      - 0
  max:
    type: integer
    description: The most it takes; 0 is no ceiling.
    examples:
      - 1
  required:
    type: boolean
    description: It asks for at least one answer.
  repeats:
    type: boolean
    description: An answer may be chosen more than once.
  status:
    $ref: ./CatalogItemStatus.yaml
    description: Asked or not.
  answers:
    type: array
    items:
      $ref: ./TreeAnswer.yaml
    description: Its answers, in order.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc301
    name:
      en: Choose your raita
    hint: null
    min: 0
    max: 1
    required: false
    repeats: false
    status: active
    answers:
      - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
        price: null
        offered: true
        position: 0
