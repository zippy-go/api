# Path item for /v1/receipts/{token}. Referenced from openapi.yaml.
parameters:
  - name: token
    in: path
    required: true
    description: The receipt's token, from its link.
    schema:
      type: string
      minLength: 8
    example: r_8f2k3m9q7x
get:
  operationId: getReceipt
  summary: Read a receipt
  description: "A payer's receipt from its link: their payment with the bill it paid. Anybody holding the link may read it."
  tags:
    - Dine-in
  security:
    - {}
  responses:
    "200":
      description: The receipt.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/tabs/TabReceipt.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such receipt."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
