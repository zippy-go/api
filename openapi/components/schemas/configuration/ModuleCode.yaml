type: string
description: "A module of the platform, the unit a Partner's edition is made of: `delivery` and `pickup` (product sales delivered or collected), `dine_in` (tables, tabs, the floor, the kitchen display and reservations), `subscriptions`, `field_services` (bookings), `promotions`, `loyalty` (reward campaigns), `inventory`, `own_fleet` (the Partner's own Agents delivering) and `developer` (API keys and webhooks). Clients must tolerate values they do not know."
enum:
  - delivery
  - pickup
  - dine_in
  - subscriptions
  - field_services
  - promotions
  - loyalty
  - inventory
  - own_fleet
  - developer
examples:
  - subscriptions
