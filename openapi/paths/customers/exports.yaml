  "post": {
    "operationId": "requestCustomerExport",
    "summary": "Ask for my data",
    "description": "Asks for an export of everything the platform holds about the customer, after a fresh proof in this session (`step_up_required` otherwise): ready within minutes as a JSON file and a readable PDF summary. One at a time and one a day (`export_in_progress`). The request is written to the audit log; `customers.export.ready` tells the customer.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "responses": {
      "202": {
        "description": "The export, preparing.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/CustomerExport.yaml"
            }
          }
        }
      },
