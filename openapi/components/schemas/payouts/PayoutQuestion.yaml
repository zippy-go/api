type: object
description: '"Something look wrong?": a question about a locked week, answered once by Mission Control and signed by the platform; neither can be changed after.'
required:
  - id
  - statement_id
  - reference
  - payee_kind
  - partner_id
  - location_id
  - agent_id
  - week
  - text
  - asked_at
  - asked_by_name
  - state
  - answer
  - answered_at
  - answered_by
properties:
  id:
    type: string
    format: uuid
    description: The question.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5301
  statement_id:
    type: string
    format: uuid
    description: The statement it is about.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  reference:
    type: string
    description: The statement's reference.
    examples:
      - ZG-2026W43
  payee_kind:
    $ref: ./PayeeKind.yaml
    description: A Location's or an Agent's.
  partner_id:
    type: string
    format: uuid
    description: The payee's Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  location_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Location, for a Location's statement.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  agent_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Agent, for an Agent's statement.
    examples:
      - null
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week.
    examples:
      - 2026W43
  text:
    type: string
    description: The question, at most 2,000 characters.
    examples:
      - Order AB0115 was refunded and I never heard why
  asked_at:
    type: string
    format: date-time
    description: When it was asked.
    examples:
      - 2026-10-28T06:00:00Z
  asked_by_name:
    type:
      - string
      - "null"
    description: Who asked it.
    examples:
      - Asha Rao
  state:
    $ref: ./PayoutQuestionState.yaml
    description: Whether it was answered.
  answer:
    type:
      - string
      - "null"
    description: The answer, once given.
    examples:
      - The customer reported the biryani missing and support refunded it from your share.
  answered_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was answered.
    examples:
      - 2026-10-28T09:00:00Z
  answered_by:
    type:
      - string
      - "null"
    description: "Who signed the answer: the platform, `ZippyGo`, for the payee; the operator's name in Mission Control."
    examples:
      - ZippyGo
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5301
    statement_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
    reference: ZG-2026W43
    payee_kind: location
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    location_id: 01a13a48-9e00-7000-8000-000000000301
    agent_id: null
    week: 2026W43
    text: Order AB0115 was refunded and I never heard why
    asked_at: 2026-10-28T06:00:00Z
    asked_by_name: Asha Rao
    state: answered
    answer: The customer reported the biryani missing and support refunded it from your share.
    answered_at: 2026-10-28T09:00:00Z
    answered_by: ZippyGo
