type: object
description: The store's published menu as its page refers to it.
required:
  - version
  - published_at
  - etag
  - url
properties:
  version:
    type: integer
    description: The version.
    examples:
      - 42
  published_at:
    type: string
    format: date-time
    description: When it was published.
    examples:
      - 2026-10-15T09:00:00Z
  etag:
    type: string
    description: Its entity tag.
    examples:
      - '"v42"'
  url:
    type: string
    description: Where to read it, naming the version.
    examples:
      - /v1/storefront/stores/0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40/menu?version=42
examples:
  - version: 42
    published_at: 2026-10-15T09:00:00Z
    etag: '"v42"'
    url: /v1/storefront/stores/0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40/menu?version=42
