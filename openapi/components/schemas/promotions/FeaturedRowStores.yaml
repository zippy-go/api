type: object
description: "A featured row's page, \"See all\" (since 0.38.0): every Location the row finds in the visitor's area, in its order, or why it finds none here."
required:
  - offer_id
  - headline
  - rule
  - stores
  - reason
properties:
  offer_id:
    type: string
    format: uuid
    description: The campaign.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d7001
  headline:
    type: string
    description: Its headline.
    examples:
      - Most popular
  rule:
    $ref: ./FeaturedRule.yaml
    description: How the row finds its Locations.
  stores:
    type: array
    items:
      $ref: ../storefront/StoreCard.yaml
    description: Every Location it finds, at most 100.
  reason:
    type:
      - string
      - "null"
    description: Why it finds none in this area, in words; `null` when it finds some.
    examples:
      - null
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d7001
    headline: Most popular
    rule: most_popular
    stores:
      - location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
        partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
        name: Dev Kitchen Gachibowli
        partner_name: ZippyGo Dev Partner
        partner_kind: organisation
        logo_url: null
        banner_url: null
        zone_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
        shelves:
          - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a13
            label: Biryani
            icon_url: null
        state: open
        state_until: 2026-10-15T17:30:00Z
        offline_message: null
        preparation_minutes: 20
        distance_metres: 1200
        delivers_to_pin: true
        fulfilment:
          - delivery
          - pickup
        is_new: true
        highlights: []
        delivery_fee:
          minor_units: 3000
          currency: INR
        minimum_order: null
        delivery_minutes: 30
        catalogue: null
        rating:
          percent: 72
          count: 18
          great: false
        offer:
          offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
          line: Buy 1, get 1 free
          more: 1
          code: null
          shelf: deals
    reason: null
