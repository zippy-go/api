type: object
description: The trip a delivery shares with other deliveries; `null` on a delivery carried alone. Counts only, so a store learns nothing of another Partner's orders.
required:
  - trip_id
  - route_id
  - reason
  - deliveries
  - position
properties:
  trip_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Agent's trip once one holds it; `null` before.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8201
  route_id:
    type:
      - string
      - "null"
    format: uuid
    description: The planned route, for a route.
    examples:
      - null
  reason:
    $ref: ./TripReason.yaml
    description: Why it shares a trip.
  deliveries:
    type: integer
    minimum: 2
    description: The deliveries on the trip.
    examples:
      - 2
  position:
    type: integer
    minimum: 1
    description: This delivery's drop among the trip's drops, from 1.
    examples:
      - 2
examples:
  - trip_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8201
    route_id: null
    reason: nearby
    deliveries: 2
    position: 2
