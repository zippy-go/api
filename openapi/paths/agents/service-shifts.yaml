# Path item for /v1/partners/{partner_id}/services/{service_id}/shifts. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: service_id
    in: path
    required: true
    description: The service, one of the Partner's that sends Agents out.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
get:
  operationId: listServiceShifts
  summary: List a service's shifts
  description: "The service's shifts, soonest first: by default those not ended, from now on. Filter by a range of days, a zone, an Agent who has them, or a state. `dispatch:read` at the service; Mission Control uses the same route with its platform permissions."
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: from
      in: query
      required: false
      description: Shifts ending after this; now by default.
      schema:
        type: string
        format: date-time
      example: 2026-11-07T00:00:00Z
    - name: to
      in: query
      required: false
      description: Shifts starting before this.
      schema:
        type: string
        format: date-time
      example: 2026-11-14T00:00:00Z
    - name: zone_id
      in: query
      required: false
      description: Only this zone.
      schema:
        type: string
        format: uuid
      example: 01a13a48-9e00-7000-8000-00000000a011
    - name: agent_id
      in: query
      required: false
      description: Only the shifts this Agent has.
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
    - name: state
      in: query
      required: false
      description: Only shifts in this state.
      schema:
        $ref: ../../components/schemas/agents/ShiftState.yaml
      example: open
    - name: limit
      in: query
      required: false
      description: How many, 1 to 100; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 50
    - name: cursor
      in: query
      required: false
      description: Where the page starts, from `next_cursor`.
      schema:
        type: string
      example: eyJrIjoiMjAyNi0xMS0wN1QwMzozMDowMFoifQ
  responses:
    "200":
      description: The shifts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ShiftPage.yaml
    "400":
      description: "`validation_failed`: a filter is malformed."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:read` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based`: the service does not send people out."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: publishServiceShifts
  summary: Publish shifts
  description: "Publishes a shift, or the same hours for up to 14 days in a row: a start and an end on the Location's clock, at most 16 hours long and not in the past, in a zone of the service's area, needing 1 to 50 Agents. The service's Agents see them in the Agent app and pick them, first come first served. Publishes `fleet.shift.published` for each. `dispatch:manage` at the service."
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The shifts.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/ShiftCreate.yaml
  responses:
    "201":
      description: The shifts published, in order.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ShiftList.yaml
    "400":
      description: "`validation_failed`: the hours, the zone or the count are out of bounds, each named."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based`: the service does not send people out."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
