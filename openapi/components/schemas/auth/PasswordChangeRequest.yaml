type: object
description: |
  The request body of `POST /v1/auth/password`. The new password must be
  12 to 200 characters and not blank; anything else is rejected with
  `validation_failed` and the detail code `password_weak`. A first
  password needs a fresh proof of the signed-in person first
  (`POST /v1/auth/step-up`); a change needs the current password.
required:
  - new_password
properties:
  current_password:
    type:
      - string
      - 'null'
    description: The current password. Send `null`, or omit the field, when the user has no password yet, as after signing up with a one-time code; when a password is set it must match, and a wrong one counts in the sign-in throttle.
    examples:
      - previous-passphrase-2025
  new_password:
    type: string
    minLength: 12
    description: The new password, 12 to 200 characters and not blank.
    examples:
      - example-passphrase-2026
examples:
  - current_password: null
    new_password: example-passphrase-2026
