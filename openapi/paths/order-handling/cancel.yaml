# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/{order_id}/cancel. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: order_id
    in: path
    required: true
    description: The order, which must be one of the store's; another store's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: cancelStoreOrder
  summary: Cancel an order the store accepted
  description: Cancels an accepted or ready order with a reason and a note. The customer gets back everything they paid, each part where it came from, the Partner bearing it, and spent stock is put back. A placed order is declined, not cancelled; an order on its way is Mission Control's to cancel. Members need `order:read` at the Location to read and `order:manage` to move an order; platform staff use the same routes with their platform permissions, every move written to the audit log. A Location of another Partner, and an order of another store, answer `404` before any permission is looked at.
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The reason and the note.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/StoreCancellation.yaml
  responses:
    "200":
      description: The order, moved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/StoreOrder.yaml
    "400":
      description: "`validation_failed`: a note missing or over 500 characters."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission at the Location) or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Location or the order."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`order_moved`: the order is not where the move needs it (another screen moved it first, or its status does not allow the move), with the status it is in now; read it again. `order_moved` too for a placed order (decline it) and for one on its way."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
