{
  "get": {
    "operationId": "listPlatformCustomerViews",
    "summary": "List the views of a customer's app",
    "description": "Every view of the app as the customer, with who, when and for how long. `customer:view_as`.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "customer_id",
        "in": "path",
        "required": true,
        "description": "The customer.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01"
      }
    ],
    "responses": {
      "200": {
        "description": "The views.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/CustomerViewRequestList.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `customer:view_as`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  },
  "post": {
    "operationId": "requestPlatformCustomerView",
    "summary": "Ask to view the app as the customer",
    "description": "Asks the customer, in their app, to let support view it as them; the request lapses after 30 minutes. `customer:view_as`; audited.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "customer_id",
        "in": "path",
        "required": true,
        "description": "The customer.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01"
      }
    ],
    "requestBody": {
      "required": true,
      "description": "The reason.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/customers/CustomerViewRequestInput.yaml"
          }
        }
      }
    },
    "responses": {
      "201": {
        "description": "The request.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/CustomerViewRequest.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `customer:view_as`.",
        "content": {
