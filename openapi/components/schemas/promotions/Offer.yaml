      time_zone: Asia/Kolkata
    min_spend: null
    fulfilments: []
    uses_per_customer: null
    total_uses: null
    budget: null
    max_off: null
    partner_share_percent: 100
    share_text: You pay for it
    code_only: false
    show_code: false
    state: live
    state_text: Live, ongoing
    pause: null
    archived_at: null
    copied_from: null
    playbook: buy_1_get_1
    confirmation: null
