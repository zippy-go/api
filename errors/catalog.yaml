# Catalog of error codes returned by the ZippyGo API.
#
# Every error response is an RFC 9457 problem details document (the `Problem`
# schema in the OpenAPI document) whose `code` is one of the entries below.
# `message` is the template for the `detail` member; placeholders in braces
# are filled per occurrence. `type` is `/problems/<code>`, resolved against
# the API host. Codes are stable: a code is never renamed or reused, and
# its status is part of the contract (`validation_failed` is 400 and
# `idempotency_key_reuse` is 409; both are settled, do not reopen them).
#
# `details` lists the stable field-level codes a response may carry in the
# `code` member of its `errors` entries. They are as stable as the codes
# themselves.
errors:
  - code: validation_failed
    status: 400
    title: Validation failed
    message: The request has {count} invalid field(s).
    retryable: false
    description: >-
      The request body, query or path parameters did not pass validation.
      The `errors` member lists each offending field with a JSON Pointer and
      a reason, and a `code` when one is defined below.
    details:
      - code: adjustment_out_of_range
        message: An adjustment is at most ₹100,000.00 either way and never nothing.
        description: An adjustment of nothing, or of more than ₹100,000.00 added or taken off; a fee correction must add.
      - code: payouts_date_backwards
        message: The payouts date only moves forward.
        description: A move of the payouts date to a moment at or before the date payouts work to now.
      - code: paid_on_in_future
        message: The day it was paid cannot be in the future.
        description: A statement marked paid by hand with a day after today.
      - code: week_invalid
        message: A week is written YYYYWww, such as 2026W43.
        description: A week that is not an ISO week-based year and a week number from 01 to its last week.
      - code: top_up_out_of_range
        message: A top-up is from ₹100.00 to ₹10,000.00.
        description: A Wallet top-up below the least or above the most one top-up may add (`wallet.top_up_min_minor`, `wallet.top_up_max_minor`).
      - code: upi_id_invalid
        message: A UPI ID is a name, an @ and the bank's handle, such as name@okhdfc.
        description: A UPI ID of the wrong shape, for a collect request or to be saved.
      - code: return_url_not_allowed
        message: The return address must be one of ZippyGo's own apps.
        description: A `return_url` whose origin is not one of the platform's own apps, so the provider's page cannot send a customer anywhere else.
      - code: password_weak
        message: The password must be at least 12 characters long.
        description: >-
          The password sent when setting or changing a password, or when
          choosing one while accepting an invitation, does not meet the
          policy. The `errors` entry points at the field that carried it.
      - code: audience_required
        message: "Say which surface: partner, platform or agent."
        description: >-
          A sign-in names the surface its session is for, and a refresh read
          from a cookie names whose cookie; the step 1 sign-in without a
          surface is retired.
      - code: delivery_required
        message: "Say how the tokens travel: cookie or body."
        description: >-
          A sign-in states the delivery of its refresh token, `cookie` for
          browsers or `body` for apps; it binds to the session for good.
      - code: code_invalid
        message: The code does not match, or has expired.
        description: >-
          A code sent to prove a new address, an authenticator code
          confirming a set-up, or a one-time code proving the signed-in
          person did not pass.
      - code: audience_not_allowed
        message: This way of signing in is not offered to that surface.
        description: >-
          The audience does not admit the credential or the operation, such
          as a one-time code for Mission Control, a password link for the
          Agent app, or a sign-in to the Customer app here.
      - code: malformed_identifier
        message: The identifier is not a well-formed id.
        description: >-
          A path, query or body identifier is not a UUID. Never a 404 and
          never a 500; the entry points at the parameter or member.
      - code: cursor_invalid
        message: The cursor was not issued for this query by this operation.
        description: >-
          The page cursor comes from another query, another caller, or was
          tampered with. Start again without a cursor.
      - code: idempotency_key_missing
        message: The Idempotency-Key header is required on this operation.
        description: >-
          A write that moves money or places an order was sent without an
          `Idempotency-Key`.
      - code: filter_unreadable
        message: The filter is not a readable filter tree.
        description: The `filter` parameter is not JSON in the documented shape.
      - code: filter_field_unknown
        message: The field is not filterable on this resource.
        description: The filter, sort or facets name a field the resource does not declare.
      - code: filter_operator_unsupported
        message: The field does not admit this operator.
        description: The operator is not one the field declares.
      - code: filter_value_unknown
        message: The value is not one of the field's values.
        description: A value outside a field's closed set, or of the wrong type for the field.
      - code: filter_or_unindexed
        message: Text search is only accepted as a top-level condition.
        description: A text condition sits inside an any-of group, where the plan cannot stay index-backed.
      - code: filter_in_empty
        message: An in condition needs at least one value.
        description: An `in` condition with no values.
      - code: filter_text_empty
        message: A text condition needs text.
        description: A `text` condition with an empty value.
      - code: filter_group_empty
        message: A group needs at least one operand.
        description: An all-of or any-of group with no operands.
      - code: filter_range_empty
        message: A range needs a lower or an upper bound.
        description: A `range` condition with neither bound.
      - code: filter_too_deep
        message: The filter nests deeper than three levels.
        description: Groups nested more than three levels deep.
      - code: filter_too_wide
        message: A list or group holds more than twenty operands.
        description: More than twenty operands in one `in` list or one group.
      - code: sort_too_many
        message: At most three sort keys are accepted.
        description: More than three keys in `sort`.
      - code: sort_field_unknown
        message: The field is not sortable on this resource.
        description: A sort key the resource does not declare sortable.
      - code: setting_out_of_range
        message: The value is outside the setting's range.
        description: A platform setting value outside its declared minimum and maximum.
      - code: unsupported_file_type
        message: The content type is not accepted for this purpose.
        description: An upload grant was requested with a MIME type the purpose does not accept.
      - code: file_too_large
        message: The file is larger than the purpose allows.
        description: An upload grant was requested for a file above the purpose's ceiling.
      - code: crop_outside
        message: The crop rectangle runs past the picture.
        description: A crop rectangle that does not fit inside the original picture.
      - code: gstin_invalid
        message: A GSTIN is fifteen characters, the state code, the PAN, an entity number, Z and a check character.
        description: A GSTIN of the wrong shape, with a wrong check character, or one that does not embed the partner's PAN.
      - code: pan_invalid
        message: A PAN is five letters, four digits and a letter, such as ABCDE1234F.
        description: A Permanent Account Number of the wrong shape.
      - code: ifsc_invalid
        message: An IFSC is four letters, a zero and six letters or digits, such as HDFC0001234.
        description: An Indian Financial System Code of the wrong shape on a payout account.
      - code: invalid_mobile
        message: "The number is not a mobile number: ten digits, or the country code and the number."
        description: >-
          A customer's number that does not read as a number of the stated
          market, checked before anything is sent.
      - code: not_a_mobile
        message: The number is not a mobile line; codes go to mobile numbers only.
        description: >-
          A customer's number that reads as a landline or a special number of
          the market, which cannot receive a code.
      - code: date_of_birth_future
        message: The date of birth is in the future.
        description: A customer's date of birth after today, at registration or in a profile edit.
      - code: too_young
        message: An account opens at sixteen or older.
        description: >-
          A customer's date of birth less than sixteen years ago: the account
          threshold, not the age-restricted-goods threshold, which is a rule of
          each order.
      - code: terms_not_accepted
        message: The terms must be accepted to open an account.
        description: A registration whose terms box was sent unticked; an account nobody agreed to is never opened.
      - code: consent_channel_missing
        message: "Consent is written for every channel at once: email, push, SMS and WhatsApp."
        description: >-
          A marketing consent naming fewer than all four channels; each
          missing channel is named, rather than an absent one being read as a
          refusal.
      - code: postal_code_invalid
        message: A PIN code is six digits.
        description: An Indian address whose PIN code is not six digits.
      - code: pin_far_from_address
        message: The pin is more than two kilometres from the address typed; confirm the pin.
        description: >-
          A customer's address whose map pin lies more than two kilometres from
          where its locality and PIN code geocode; the pin, not the text,
          decides where an agent goes.
      - code: capability_not_allowed
        message: This kind of store's items do not carry this.
        description: >-
          An item, a variant, a question or a brand uses what the store's
          catalogue type does not allow (brands, variants, modifiers,
          inventory, MRP, prescriptions and the rest); the entry points at
          the member and names the capability.
      - code: food_mark_required
        message: Every dish needs a veg or non-veg mark.
        description: >-
          The store's catalogue type carries the food mark and the item was
          saved without one.
      - code: tag_not_in_set
        message: The tag is not in this kind of store's closed set.
        description: >-
          A dietary or allergen tag outside the catalogue type's closed set;
          free text is never a tag.
      - code: offer_not_below_price
        message: An offer has to cost less than the price.
        description: A variant's offer price equal to or above its price.
      - code: price_above_mrp
        message: The price cannot exceed the MRP.
        description: >-
          A packaged good's price above the maximum retail price printed on
          its pack.
      - code: english_required
        message: Wording needs English; Hindi and Telugu may be added.
        description: A name, description or hint without its English wording.
      - code: language_unsupported
        message: Wording is kept in English, Hindi and Telugu.
        description: Wording in a language the platform does not keep yet.
      - code: axis_values_too_few
        message: An axis needs at least two values.
        description: An axis an item is sold along with fewer than two values.
      - code: variant_selection_invalid
        message: A variant chooses one declared value on every axis.
        description: >-
          A variant's selection misses an axis, names an unknown axis or
          value, or chooses something on an item with no axes.
      - code: variant_selection_repeated
        message: Two variants choose the same values.
        description: Two variants of one item with the same selection.
      - code: variant_combination_missing
        message: Every combination of the axes' values needs its variant.
        description: >-
          An item with axes is missing the variant of a combination of its
          axes' values; the entry names the combination.
      - code: no_enabled_variant
        message: At least one variant is enabled.
        description: Every variant of the item is disabled.
      - code: default_variant_required
        message: An item with no axes has exactly one variant, choosing nothing.
        description: An item with no axes sent with more than one variant.
      - code: answer_not_offered
        message: The question does not offer this answer.
        description: >-
          An item prices or hides an answer the question it asks does not
          offer.
      - code: answer_repeated
        message: An item is offered once per question.
        description: The same item offered twice as an answer of one question.
      - code: modifier_rule_unsatisfiable
        message: The least the question asks for is more than its answers offer, or above its most.
        description: >-
          A question whose least cannot be met by the answers it offers, or
          whose least is above its most.
      - code: order_incomplete
        message: Every live category is named once.
        description: >-
          A reorder that misses, repeats or names an unknown category; the
          entry points at the list.
      - code: item_unlisted
        message: An item that is not on the menu in its own right sits on no category.
        description: >-
          An unlisted item, which exists only as an answer to questions, put
          on a category.
      - code: pre_order_notice_invalid
        message: Pre-order notice is 24, 48 or 72 hours.
        description: A pre-order-only item's notice outside the three choices.
      - code: blank_text
        message: Must hold more than whitespace.
        description: >-
          A notice's title or message, or a notice template's name, title or
          message, that is empty or whitespace only; a notice is refused
          rather than sent empty.
      - code: selection_required
        message: Name the notices, or ask for all of them.
        description: >-
          Clearing a Location's notices named none and did not ask for all;
          the entry points at the request body.

      - code: note_too_long
        message: "A note is 2,000 characters at most; this one is {length}."
        description: >-
          A support note on a customer's account longer than 2,000
          characters; the detail says how long it is.
      - code: range_too_long
        message: A range is a year at most; ask for a shorter one.
        description: >-
          A range longer than it may be: a store's rating or its reviews, the
          orders report or a Location's worked-out payouts over more than a
          year, the metrics board over 31 days, the Agents numbers over 92.
          The message says the limit that applies.
  - code: channel_unknown
    status: 400
    title: Unknown channel
    message: The stream names a channel that does not exist.
    retryable: false
    description: >-
      A live stream was opened naming a channel no defined channel produces.
      The `errors` member points at the position of each unknown name.

  - code: unknown_permission
    status: 400
    title: Unknown permission
    message: "{permission} is not a permission of the catalogue."
    retryable: false
    description: >-
      A role or an envelope names a permission the catalogue does not have.
      The `detail` names it; `GET /v1/permissions` lists the catalogue.

  - code: invalid_scope
    status: 400
    title: Invalid scope
    message: "Invalid scope: {reason}."
    retryable: false
    description: >-
      A grant's scope has the wrong shape for its role: a platform role is
      held platform-wide, the owner role covers the whole Partner, an AGENT
      role is held at its own Service.

  - code: unauthenticated
    status: 401
    title: Unauthenticated
    message: The request has no valid credentials.
    retryable: false
    description: >-
      No API key or access token was sent, or the one sent is invalid,
      expired or revoked. Also the answer of the sign-in and refresh
      operations when the credentials they were given are wrong.

  - code: invalid_code
    status: 401
    title: Invalid code
    message: The code is not valid for this challenge.
    retryable: false
    description: >-
      The one-time code does not match the challenge, or the challenge does
      not exist. Request a new code with `POST /v1/auth/otp/request`.

  - code: code_expired
    status: 401
    title: Code expired
    message: The code has expired; request a new one.
    retryable: false
    description: >-
      The one-time code was correct but its challenge is past `expires_at`.
      Request a new code with `POST /v1/auth/otp/request`.

  - code: authentication_failed
    status: 401
    title: Authentication failed
    message: "The sign-in did not succeed. Check the details and try again."
    retryable: false
    description: >-
      The sign-in did not succeed. The same answer covers an unknown
      account, a wrong password or code, a disabled account and a surface
      the account may not enter, so nothing about the account is revealed.

  - code: forbidden
    status: 403
    title: Forbidden
    message: The credentials do not allow {action} on {resource}.
    retryable: false
    description: >-
      The caller is authenticated but is not allowed to perform the action,
      for example because the resource belongs to another partner or the
      key lacks the required scope.

  - code: not_in_plan
    status: 403
    title: Not in the plan
    message: The partner's plan does not include {what}; the {plan} plan does.
    retryable: false
    description: >-
      The partner's plan does not include what was asked for, a kind of
      service or the platform fleet; the detail names the lowest plan that
      does. Platform staff move a partner's plan.

  - code: access_denied
    status: 403
    title: Access denied
    message: "You do not have {permission} here; an owner can grant it."
    retryable: false
    description: >-
      The member's grants lack the permission the operation needs at that
      place; an owner can grant it. The `detail` names the permission.

  - code: not_enabled_for_partner
    status: 403
    title: Not enabled for the partner
    message: "{permission} is not switched on for this partner; ask ZippyGo to enable it."
    retryable: false
    description: >-
      The permission the operation needs is outside the Partner's
      entitlements; an owner asks the platform to switch it on. The `detail`
      names the permission.

  - code: permission_escalation
    status: 403
    title: Permission escalation
    message: "You cannot hand out {permission}: you do not hold it yourself."
    retryable: false
    description: >-
      Nobody hands out more than they hold: the acting member does not
      personally hold a permission of the role they define, change or grant.
      The `detail` names it.

  - code: no_location_assigned
    status: 403
    title: No location assigned
    message: "No location is assigned to you yet; an owner can assign one."
    retryable: false
    description: >-
      The member's grants cover no Location of the Partner; an owner assigns
      one.

  - code: step_up_required
    status: 403
    title: Step-up required
    message: "Confirm it is you: enter your password or a code, then repeat the request."
    retryable: false
    description: >-
      A sensitive act needs a fresh proof of the signed-in person: their
      password, an authenticator code or a one-time code, made in this
      session within the last ten minutes. Prove it and repeat the request;
      the session continues.

  - code: two_step_setup_required
    status: 403
    title: Two-step set-up required
    message: "Set up two-step sign-in with an authenticator app before anything else."
    retryable: false
    description: >-
      Platform staff reach Mission Control only with a second factor. Until
      an authenticator code proves one, the session reaches the two-step
      set-up and nothing else.

  - code: self_approval
    status: 403
    title: Not your own proposal
    message: "You proposed this; a different platform member decides it."
    retryable: false
    description: >-
      The proposer of an act cannot approve it, the super admin included.

  - code: consent_required
    status: 403
    title: Consent required
    message: "An owner of the partner has not consented in the last 24 hours; ask for consent first."
    retryable: false
    description: >-
      Viewing a Partner's console needs the consent of one of its owners,
      given within the last twenty-four hours; ask for it first.

  - code: impersonation_read_only
    status: 403
    title: Viewing only
    message: "The partner consented to viewing only; nothing can be changed here."
    retryable: false
    description: >-
      The Partner consented to viewing, not to changes; the impersonation
      session cannot write.

  - code: not_found
    status: 404
    title: Not found
    message: "{resource} {id} was not found."
    retryable: false
    description: >-
      The resource does not exist or is not visible to the caller. The API
      does not distinguish between the two.

  - code: menu_not_published
    status: 404
    title: Menu not published
    message: Store {id} has published no menu yet.
    retryable: false
    description: >-
      The store exists and is live but has published nothing yet; its page
      says so where the menu will be rather than pretend to load one.

  - code: notice_template_name_taken
    status: 409
    title: Notice template name taken
    message: A notice template is already named "{name}".
    retryable: false
    description: >-
      Another notice template has that name, whatever its case: two
      templates never share a name differing only in case. Choose another
      name, or change the template that has it.

  - code: method_not_allowed
    status: 405
    title: Method not allowed
    message: "{method} is not supported on {path}."
    retryable: false
    description: The path exists but does not support the HTTP method used.

  - code: conflict
    status: 409
    title: Conflict
    message: "{resource} {id} cannot be changed: {reason}."
    retryable: false
    description: >-
      The request conflicts with the current state of the resource, for
      example a state transition that is not allowed or a uniqueness
      constraint that would be violated.

  - code: illegal_transition
    status: 409
    title: Illegal transition
    message: The status cannot change from {from} to {to}.
    retryable: false
    description: >-
      A lifecycle status cannot move from its current value to the one
      requested, for example a country defined as inactive before it ever
      traded.

  - code: locations_stranded
    status: 409
    title: Locations would be stranded
    message: Dividing the service area would leave {count} location(s) outside every new area.
    retryable: false
    description: >-
      A service area division would leave the named locations outside every
      new area. The `errors` member names them; repeat with `force` to
      deactivate them.

  - code: sign_in_closed
    status: 409
    title: Sign-in closed
    message: Sign-in is closed for this market at the moment.
    retryable: false
    description: >-
      The country the identifier belongs to does not accept sign-ins at the
      moment. Nothing is sent and nothing is created.

  - code: asset_not_usable
    status: 409
    title: Asset not usable
    message: The asset cannot be used this way.
    retryable: false
    description: >-
      The asset is not in a state or of a purpose that allows the
      operation: a reservation attached as a picture, a document attached as
      a logo, a crop of a vector, or a confirmation that found the file
      outside its purpose's folder or readable by anyone.

  - code: activation_blocked
    status: 409
    title: Activation blocked
    message: "The {what} cannot go live yet: {count} blocker(s) stand in the way."
    retryable: false
    description: >-
      The partner or location cannot go live yet. The `errors` member names
      each blocker with a field-level code below, the same blockers the
      partner's and the location's activation reads carry; clear them and
      try again.
    details:
      - code: document_missing
        message: A required document is not on file.
        description: The partner must have a document of this kind approved before it is activated; none is on file.
      - code: document_pending
        message: A required document is awaiting review.
        description: A document of this kind is on file but platform staff have not reviewed it yet.
      - code: document_rejected
        message: A required document was rejected.
        description: The newest document of this kind was rejected; a replacement must be approved.
      - code: document_expired
        message: A required document has expired.
        description: The approved document of this kind is past its expiry and no replacement is approved.
      - code: no_administrator
        message: Nobody administers the partner yet.
        description: The partner has no owner; the administrator named at onboarding has not accepted the invitation.
      - code: partner_not_active
        message: The partner is not active.
        description: A location goes live only while its partner is active; asked while the partner is pending, it goes live with the partner's activation.
      - code: no_fulfilment
        message: The store offers neither delivery, pickup nor dine-in.
        description: A store needs at least one fulfilment method before it goes live.
      - code: closed_all_week
        message: The location is closed every day of the week.
        description: No day of the effective week has an opening window; give the location opening hours.
      - code: no_vertical
        message: The store belongs to no vertical.
        description: A store trades in at least one vertical its zone offers.
      - code: field_required
        message: A field the location's type requires is missing.
        description: The type of a service on at the location (a product-sales service's catalogue type, a field service's service type) declares a required field the location does not carry.

  - code: partner_archived
    status: 409
    title: Partner archived
    message: Partner {id} is archived; nothing new can be added to it until platform staff return it to pending.
    retryable: false
    description: >-
      The partner is archived, and nothing new may refer to an archived
      partner: no location is opened, no service enabled and no document
      filed until platform staff return it to pending.

  - code: zone_not_serving
    status: 409
    title: Zone does not serve
    message: "The pin lands in {zone}, which does not serve: it is not fenced or not active."
    retryable: false
    description: >-
      The location's pin lands in a zone that does not serve: it has no
      fence, or it or an area above it is not active. The detail names the
      zone.

  - code: vertical_not_offered
    status: 409
    title: Vertical not offered
    message: "{vertical} is not offered in the location's zone."
    retryable: false
    description: The location names a vertical its zone does not offer; the detail names the vertical.

  - code: service_required
    status: 409
    title: Service required
    message: "{sentence}"
    retryable: false
    description: >-
      The setting needs a service the partner does not run there, or a
      capability that does not exist yet: own agents without a delivery
      service, fulfilment at a branch, dine-in before tables, pricing on a
      service that is not a delivery service. The detail says which.

  - code: locations_open
    status: 409
    title: Locations still open
    message: The partner cannot be archived while {count} of its locations are not archived.
    retryable: false
    description: >-
      The partner cannot be archived while any of its locations is not
      archived; the `errors` member names each location still open.

  - code: category_too_deep
    status: 409
    title: Category too deep
    message: A category nests one level under another at most.
    retryable: false
    description: >-
      The parent named is itself a sub-category, or the category being
      moved under a parent has sub-categories of its own.

  - code: category_has_items
    status: 409
    title: Category holds items
    message: "{category} holds items of its own, so it cannot hold categories."
    retryable: false
    description: >-
      A category holding categories holds no items of its own: move the
      items to another category before nesting one under it.

  - code: category_has_subcategories
    status: 409
    title: Category holds sub-categories
    message: "{category} holds sub-categories; put the item on one of them: {subcategories}."
    retryable: false
    description: >-
      A category holding sub-categories holds no items of its own; the
      detail offers its sub-categories instead.

  - code: modifier_cycle
    status: 409
    title: Questions loop
    message: "{item} would ask itself through {chain}."
    retryable: false
    description: >-
      An item would reach itself through the answers of the questions it
      asks, for example a meal deal made an answer to a question the meal
      deal asks.

  - code: modifier_too_deep
    status: 409
    title: Questions nest too deep
    message: "Questions nest three deep at most; this would make {chain}."
    retryable: false
    description: >-
      Questions nest three deep at most (a meal deal, its burger, the
      burger's cooking). The save would make a longer chain, which the
      detail names question by question.

  - code: prescriptions_not_accepted
    status: 409
    title: Prescriptions not accepted
    message: This store does not accept prescriptions.
    retryable: false
    description: >-
      An item needing a prescription is sold only at a store whose order
      settings accept prescriptions, which platform staff switch on.

  - code: basket_empty
    status: 409
    title: Basket empty
    message: There is nothing in the basket to place.
    retryable: false
    description: The basket at the store holds no line; add something first.

  - code: store_not_trading
    status: 409
    title: Store not trading
    message: "{store} isn't taking orders right now."
    retryable: false
    description: The store is closed by its hours, paused, or not live; the
      detail says which and when it opens or resumes. Nothing is charged
      or held.

  - code: method_not_offered
    status: 409
    title: Way of ordering not offered
    message: The store does not offer {method}.
    retryable: false
    description: The basket asks for delivery or pickup and the store does
      not offer it.

  - code: address_missing
    status: 409
    title: Address missing
    message: Choose an address to deliver to.
    retryable: false
    description: A delivery needs one of the customer's saved addresses;
      none is chosen, or the customer has none yet.

  - code: address_outside_area
    status: 409
    title: Address outside the area
    message: The store doesn't deliver there.
    retryable: false
    description: The address lies outside the store's drawn delivery zone or
      beyond its coverage radius; the detail offers pickup where the store
      has it.

  - code: lines_refused
    status: 409
    title: Lines refused
    message: "{count} line(s) cannot be ordered now."
    retryable: false
    description: Lines of the basket, or the choice being added, cannot be
      ordered now. The `errors` member names each line by its id
      (`/lines/{line_id}`) with a field-level code below and a sentence;
      such a line stays in the basket, marked, until the customer removes
      it.
    details:
      - code: item_unavailable
        message: The item is unavailable.
        description: The item or its variant is off the menu, sold out today,
          out of stock or counted down to nothing, or an answer it carries
          is.
      - code: item_out_of_hours
        message: The item is not sold at this hour.
        description: The item, or its category, has hours of its own and now is
          outside them; the sentence says when it can next be ordered.
      - code: item_pre_order_only
        message: The item is sold ahead of time only.
        description: The item is sold only as a pre-order into a scheduled slot,
          which arrives in a later step.
      - code: item_not_this_way
        message: The item is not sold this way.
        description: The item is sold for delivery only, or for pickup only, and
          the basket asks for the other.
      - code: over_limit
        message: More than one order may take.
        description: The line asks for more of the item than one order may take;
          the sentence names the limit.
      - code: choice_invalid
        message: The answers do not fit the item's questions.
        description: An answer is not offered at its question, a required
          question is unanswered, too few or too many answers are chosen,
          an answer repeats where it may not, or the answers nest deeper
          than three.

  - code: below_minimum
    status: 409
    title: Below the minimum order
    message: Add {amount} more to order from this store.
    retryable: false
    description: The basket is below the store's minimum order and the store
      charges no small-order fee instead.

  - code: age_not_confirmed
    status: 409
    title: Age not confirmed
    message: Confirm you are 18 or over and will show ID to order this.
    retryable: false
    description: The basket holds an age-restricted item and the customer
      has not confirmed they are 18 or over.

  - code: age_under_18
    status: 409
    title: Under 18
    message: Items for over-18s only cannot be ordered on this account.
    retryable: false
    description: The customer's date of birth says they are under 18 and the
      basket holds an age-restricted item.

  - code: payment_method_missing
    status: 409
    title: Way to pay missing
    message: Choose how to pay.
    retryable: false
    description: The Wallet does not cover the order and no way to pay the
      rest is chosen.

  - code: tip_not_allowed
    status: 409
    title: Tip not allowed
    message: Tips are for the platform's agents on deliveries.
    retryable: false
    description: A tip was given on a pickup, a delivery by the store's own
      agents, or a cash order.

  - code: tip_too_high
    status: 409
    title: Tip too high
    message: The most a tip may be is {max}.
    retryable: false
    description: The tip is above the most the platform allows.

  - code: price_changed
    status: 409
    title: Price changed
    message: The price changed since it was shown; check the basket again.
    retryable: false
    description: "Something changed since the quote was shown (a price, an
      offer, a fee, what the Wallet covers): nothing was placed. Read the
      basket again and show the customer the difference before they
      confirm."

  - code: order_moved
    status: 409
    title: Order moved
    message: The order is {status} now.
    retryable: false
    description: The move is not one the order's status allows, or somebody
      else made a move first; the detail names the status the order is in
      now. Read it again.

  - code: order_not_cancellable
    status: 409
    title: Order not cancellable
    message: The store has already accepted your order; ask for help to cancel it.
    retryable: false
    description: The customer may cancel alone only until the store accepts;
      from then on "Get help" asks support.

  - code: remove_everything
    status: 409
    title: Every line left out
    message: Leaving every line out is declining the order.
    retryable: false
    description: An acceptance left out every line; decline the order instead.

  - code: customer_wants_all
    status: 409
    title: All or nothing
    message: The customer wants all of it or none; decline instead.
    retryable: false
    description: The customer asked for the whole order to be cancelled if
      anything is unavailable, so no line may be left out.

  - code: stock_short
    status: 409
    title: Stock short
    message: "{count} line(s) ask for more than remains."
    retryable: false
    description: Accepting would spend more of a tracked item than remains;
      the `errors` member names each line. Leave them out or restock, then
      accept again.

  - code: payment_failed
    status: 409
    title: Payment failed
    message: The card could not be charged; the order was declined and
      nothing was taken.
    retryable: false
    description: "Charging the held card as the store accepted failed: the
      order is declined as `payment_failed`, every hold released, and the
      store told not to prepare it."

  - code: help_not_offered
    status: 409
    title: Help not offered
    message: That help is not offered for this order now.
    retryable: false
    description: "The help asked for does not make sense for the order now:
      what arrived before it has, cancelling once it is complete, or any
      help on an order never placed."

  - code: service_not_agent_based
    status: 409
    title: Service does not send people out
    message: The service {service} does not send people out, so it has no Agents.
    retryable: false
    description: >-
      An Agent was invited into, or read for, a service that is not
      agent-based (a product-sales service). Agents join delivery services;
      field services take Agents with bookings in a later step.

  - code: kind_not_allowed
    status: 409
    title: Kind not allowed
    message: The service does not run the vehicle a {kind} Agent needs; it takes {kinds}.
    retryable: false
    description: >-
      The kind of Agent named needs a vehicle the delivery service does not
      run: a walker is always taken, a bicycle needs the vehicle type
      `bicycle`, a two-wheeler `two_wheeler`, a van `four_wheeler`; a service
      naming no vehicle types takes every kind.

  - code: agent_already_member
    status: 409
    title: Already an Agent of the service
    message: The person already holds a membership or an invitation in progress in this service.
    retryable: false
    description: >-
      The mobile number or email invited, or the person accepting or
      joining, already holds a membership in the service that is not
      offboarded, or an invitation in progress for it.

  - code: duty_refused
    status: 409
    title: Duty refused
    message: "You cannot go on duty: {reason}"
    retryable: false
    description: >-
      Going on duty, or choosing the membership to work under, was refused.
      The `detail` says why in words, and the `errors` member names each
      reason with a field-level code.
    details:
      - code: duty_not_active
        message: The membership is not active.
        description: The membership is pending, suspended or offboarded; only an active membership goes on duty.
      - code: duty_document_expired
        message: A required document has expired.
        description: A document the membership needs passed its expiry date on the India calendar; a driving licence stops duty at once.
      - code: duty_elsewhere
        message: You are on duty for another service.
        description: The person is on duty in another of their memberships; they go off duty there first.

  - code: tasks_under_way
    status: 409
    title: Deliveries under way
    message: "{count} delivery or deliveries are under way."
    retryable: false
    description: >-
      Going off duty was refused while a delivery is under way; complete it,
      or ask the dispatcher to take it back, first.

  - code: task_closed
    status: 409
    title: Task closed
    message: "This task ended: {what}."
    retryable: false
    description: >-
      A step, a receipt or a hand-back arrived for a task that was given to
      somebody else, called off, handed back or returned (a membership
      suspended or offboarded, a duty closed). The `detail` says what
      happened and when, so the Agent app can tell the Agent.

  - code: step_required
    status: 409
    title: Step required
    message: "Do this first: {steps}."
    retryable: false
    description: >-
      A step came before the steps it needs: a drop before its pickup is
      complete, arrival before starting, completion without a required
      step or the proof the task asks for. The `detail` names what is
      missing.

  - code: outside_geofence
    status: 409
    title: Not at the stop
    message: You are {distance} m from the stop; arrive within {radius} m or give a reason.
    retryable: false
    description: >-
      Arrival was recorded farther from the stop than its geofence (100 m by
      default). Send the arrival again with an `override_reason`, which is
      kept on the task and counted.

  - code: scan_mismatch
    status: 409
    title: Scan does not match
    message: The scanned number is not this order's.
    retryable: false
    description: >-
      The number scanned or typed at the pickup is not the order's number
      on its label.

  - code: code_wrong
    status: 409
    title: Wrong code
    message: That is not the customer's code; {attempts} attempt(s) left.
    retryable: false
    description: >-
      The 4-digit code entered at the drop is not the customer's. Five wrong
      codes lock the code; the Agent is then told to call the customer.

  - code: code_locked
    status: 409
    title: Code locked
    message: Five wrong codes were entered; call the customer.
    retryable: false
    description: >-
      Five wrong codes were entered for the drop. The code is no longer
      checked; call the customer, or fail the drop with a reason.

  - code: hand_back_closed
    status: 409
    title: Cannot hand back
    message: This task can no longer be handed back.
    retryable: false
    description: >-
      Only a delivery given directly may be handed back, within 60 seconds
      of the app receiving it and before starting towards the store.

  - code: idempotency_key_reuse
    status: 409
    title: Idempotency key reused
    message: Idempotency key {key} was already used with a different request.
    retryable: false
    description: >-
      The `Idempotency-Key` header value was previously used with a request
      that had a different method, path or body. Use a new key for a new
      request.

  - code: permission_not_grantable
    status: 409
    title: Permission not grantable
    message: "{permission} cannot be granted to the {pool} pool."
    retryable: false
    description: >-
      The permission exists but not in the pool of the role's owner:
      `partner:access` and `agent:access` never in a platform role, the
      platform's own permissions never in a Partner's role or envelope.

  - code: partner_cannot_sign_in
    status: 409
    title: Partner cannot sign in
    message: "The entitlements must keep partner:access, or nobody could sign in."
    retryable: false
    description: >-
      The envelope would withhold `partner:access`, leaving the Partner's
      people no way in. Nothing was written.

  - code: outside_entitlements
    status: 409
    title: Outside entitlements
    message: "{permission} is outside the partner's entitlements."
    retryable: false
    description: >-
      A Partner's role may only contain permissions inside the Partner's
      entitlement envelope. The `detail` names the one outside it.

  - code: cross_tenant_role
    status: 409
    title: Cross-tenant role
    message: "The role belongs to another tenant than the member."
    retryable: false
    description: >-
      A member holds only roles their own realm owns: platform staff
      platform roles, a Partner's staff that Partner's roles.

  - code: cross_tenant_scope
    status: 409
    title: Cross-tenant scope
    message: "The scope is outside the partner, or names a place the partner does not have."
    retryable: false
    description: >-
      The grant's scope is outside the member's Partner, or names a Location
      or a Service the Partner does not have.

  - code: role_maintained
    status: 409
    title: Role maintained by the platform
    message: "{role} is maintained by {owner} and cannot be changed that way."
    retryable: false
    description: >-
      The role is kept by the platform: `SUPER_ADMIN` and `OWNER` are
      neither edited nor deleted, default roles are tuned but neither
      renamed nor deleted.

  - code: role_name_reserved
    status: 409
    title: Role name reserved
    message: "{name} is reserved for the role the platform maintains."
    retryable: false
    description: >-
      The name belongs to a maintained role: `SUPER_ADMIN` among platform
      roles, `OWNER` within a Partner.

  - code: role_in_use
    status: 409
    title: Role in use
    message: "The role is held by {count} member(s); revoke it from them first."
    retryable: false
    description: >-
      A role is not deleted while any grant of it exists, enabled member or
      not; the `detail` says how many hold it. Revoke first.

  - code: last_owner
    status: 409
    title: Last owner
    message: "This is the last enabled owner; grant the owner role to another member first."
    retryable: false
    description: >-
      The act would leave the Partner without an enabled holder of its owner
      role (or the platform without an enabled `SUPER_ADMIN`). Grant the
      role to another member first.

  - code: cannot_disable_self
    status: 409
    title: Cannot disable yourself
    message: "You cannot disable your own membership."
    retryable: false
    description: >-
      Nobody disables their own membership.

  - code: two_step_self
    status: 409
    title: Not your own two-step
    message: "You cannot reset your own two-step sign-in; turn it off from your account."
    retryable: false
    description: >-
      An administrator turns two-step sign-in off for somebody else, never
      for themselves; they turn their own off with their password.

  - code: identifier_taken
    status: 409
    title: Address already in use
    message: "That address is already used by another account."
    retryable: false
    description: >-
      The new email address or phone number, proven by its code, already
      signs in another account.

  - code: approval_required
    status: 409
    title: Approval required
    message: "{action} needs a second pair of eyes: propose it at POST /v1/platform/approvals."
    retryable: false
    description: >-
      The act needs a second pair of eyes: propose it at POST
      /v1/platform/approvals, and a different platform member holding
      approval:decide and the act's permission decides.

  - code: approval_voided
    status: 409
    title: Proposal voided
    message: "What this proposal names changed since; propose it again."
    retryable: false
    description: >-
      What the proposal names changed after it was proposed, or its proposer
      left; a new proposal is needed.

  - code: approval_decided
    status: 409
    title: Proposal already decided
    message: "This proposal was already decided."
    retryable: false
    description: >-
      The proposal was already approved, rejected or voided.

  - code: precondition_failed
    status: 412
    title: Precondition failed
    message: "{resource} {id} was modified since the version you supplied."
    retryable: true
    description: >-
      A conditional request (`If-Match`) did not match the current version of
      the resource. Fetch the resource again and retry with the new version.

  - code: invitation_invalid
    status: 410
    title: Invitation no longer valid
    message: "The invitation is no longer valid: {reason}."
    retryable: false
    description: >-
      The invitation token exists but the invitation was revoked, has
      expired or was already accepted, so it cannot be accepted. Ask the
      partner for a new invitation. A token that never existed answers
      `not_found` instead.

  - code: version_retired
    status: 410
    title: API version retired
    message: This API version has been retired; use {replacement}.
    retryable: false
    description: >-
      The major version called is past its sunset. The `detail` names its
      replacement.

  - code: link_invalid
    status: 410
    title: Link no longer valid
    message: "The link has expired or was already used; ask for a new one from the sign-in page."
    retryable: false
    description: >-
      The password link has expired, was already used, was replaced by a
      newer one, or belongs to another console.

  - code: approval_expired
    status: 410
    title: Proposal expired
    message: "This proposal expired after seventy-two hours; propose it again."
    retryable: false
    description: >-
      Nobody decided the proposal within seventy-two hours; propose it
      again.

  - code: unsupported_media_type
    status: 415
    title: Unsupported media type
    message: "Content type {content_type} is not supported; use application/json."
    retryable: false
    description: The request body has a content type the endpoint does not accept.

  - code: unprocessable
    status: 422
    title: Unprocessable content
    message: "The request cannot be processed: {reason}."
    retryable: false
    description: >-
      The request is well formed and every field is valid on its own, but it
      cannot be processed as a whole, for example because it references an
      agent that does not exist. The `errors` member points at the offending
      items when the problem is specific to part of the request.

  - code: rate_limited
    status: 429
    title: Rate limited
    message: Rate limit exceeded; retry after {retry_after} seconds.
    retryable: true
    description: >-
      The caller exceeded its request quota. The response carries a
      `Retry-After` header with the number of seconds to wait.

  - code: too_many_requests
    status: 429
    title: Too many requests
    message: Too many requests for {resource}; retry after {retry_after} seconds.
    retryable: true
    description: >-
      A limit specific to one action and target was reached, for example
      the number of one-time codes that may be sent to one identifier or
      from one client in a period, as opposed to `rate_limited`, which is
      the caller's overall quota. The response carries a `Retry-After`
      header with the number of seconds to wait.

  - code: too_many_attempts
    status: 429
    title: Too many attempts
    message: Too many failed attempts; {resource} is locked.
    retryable: false
    description: >-
      Too many wrong one-time codes were tried against one challenge and
      the challenge is locked. Retrying with the same challenge cannot
      succeed; request a new code with `POST /v1/auth/otp/request`.

  - code: otp_invalid
    status: 401
    title: Code not valid
    message: That code is not valid. Check it, or ask for a new one.
    retryable: false
    description: >-
      A customer's one-time code did not pass. One answer covers an unknown
      or expired challenge, a code already used, a code issued for another
      purpose, too many attempts and a wrong code, so nothing about the
      challenge is revealed. Ask for a new code.

  - code: otp_too_soon
    status: 429
    title: Code asked too soon
    message: A code was just sent. Ask for another in {retry_after} seconds.
    retryable: true
    description: >-
      A code was sent to this number for the same purpose a moment ago.
      `Retry-After` says how many seconds to wait; a code for another purpose
      is not held back.

  - code: otp_daily_limit
    status: 429
    title: Too many codes
    message: Too many codes were asked for. Try again later.
    retryable: true
    description: >-
      Too many codes were asked for: to this number today, from this device
      or from this source. `Retry-After` says how many seconds to wait; the
      answer never says which limit was reached.

  - code: registration_expired
    status: 401
    title: Registration expired
    message: The registration has expired. Ask for a new code to start again.
    retryable: false
    description: >-
      The registration token is not one, was tampered with or is past its
      thirty minutes. Ask for a new code; nothing was kept from the abandoned
      registration.

  - code: account_blocked
    status: 403
    title: Account blocked
    message: Your account is blocked. {support}
    retryable: false
    description: >-
      The customer account behind the number is blocked. The detail says how
      to reach support; no session was issued.

  - code: addresses_full
    status: 409
    title: Too many addresses
    message: An account keeps at most {limit} addresses; remove one before adding another.
    retryable: false
    description: >-
      The customer keeps the most addresses an account may hold; remove one
      before adding another.

  - code: payment_method_not_offered
    status: 409
    title: Way to pay not offered
    message: The store does not take {method} for this order.
    retryable: false
    description: The chosen way to pay is not offered for this order; the detail says why. Where the payments capability knows the reason, the `errors` member names it with a field-level code, the reasons the ways to pay (`GET /v1/customer/payment-options`) give; the other ways remain.
    details:
      - code: upi_over_limit
        message: UPI pays up to the provider's limit; pay the rest by card.
        description: The amount left to pay is above the provider's UPI limit (`payments.upi_limit_minor`); refused before any request is made.
      - code: cod_withheld
        message: Cash is not offered after two cash orders were refused at the door; it returns after 90 days.
        description: The customer had two or more cash orders refused at the door, or not collected, in the last 90 days (`payments.cash_refusals_max`, `payments.cash_refusals_days`).
      - code: cod_not_offered
        message: Cash is not offered for this order.
        description: A scheduled order, a subscription, a dine-in bill, or a delivery no Provider that collects cash can carry.
      - code: cod_not_accepted
        message: This store does not take cash.
        description: The Location takes no cash on delivery, or on collection for a pickup.
      - code: provider_unavailable
        message: Paying by UPI or card is not available right now.
        description: The platform has no payment provider configured, or the provider is not answering; cash and the Wallet still pay.
      - code: card_expired
        message: This card has expired.
        description: A saved card past its expiry month.

  - code: payment_not_pending
    status: 409
    title: Payment not waiting
    message: The payment is {status}; it does not wait for another try.
    retryable: false
    description: A new try was asked for on a payment that is confirmed, settled, released or failed, or whose order's time to pay is up.

  - code: cod_over_limit
    status: 409
    title: Cash over the limit
    message: Cash orders are up to {limit}.
    retryable: false
    description: The order's total is above the most a cash order may be; the other ways to pay remain.

  - code: refund_exceeds_paid
    status: 409
    title: Refund exceeds what was paid
    message: At most {amount} can be refunded.
    retryable: false
    description: The refund asks for more than is left to refund on the order (or of a line, or a fee); the detail names the most.

  - code: not_refundable
    status: 409
    title: Nothing to refund
    message: Nothing was taken on this payment, so there is nothing to refund.
    retryable: false
    description: "A refund was asked for on a payment that has taken nothing yet: still waiting, only held, released, or cash not collected."

  - code: refund_already_sent
    status: 409
    title: Refund already sent
    message: The refund is already on its way to your account.
    retryable: false
    description: The customer asked to take a refund in the Wallet after its source part was sent to the provider.

  - code: notice_rejected
    status: 400
    title: Notice rejected
    message: "{reason}"
    retryable: false
    description: A notice to the payment notice endpoint whose signature, timestamp, amount or currency did not check out, or which names nothing the platform asked the provider for. Nothing changed.

  - code: wallet_cap_exceeded
    status: 409
    title: Wallet ceiling reached
    message: The Wallet holds at most {cap}; you can add up to {fits}.
    retryable: false
    description: A top-up or a credit would take the Wallet above its ceiling (`wallet.balance_cap_minor`); the detail offers what fits.

  - code: withdrawal_exceeds_available
    status: 409
    title: More than the paid balance
    message: At most {amount} can be sent back; promotional money is spent on ZippyGo and cannot be paid out.
    retryable: false
    description: A withdrawal asked for more than the paid balance that no order holds.

  - code: withdrawal_source_unavailable
    status: 409
    title: No source to send it back to
    message: "{amount} cannot go back to where it came from; it can be sent to a UPI ID you name in a later release."
    retryable: false
    description: Paid money from a cash order, or older than the provider allows a refund (`wallet.withdrawal_source_days`), goes to a UPI ID the customer names, which payouts bring later.

  - code: correction_exceeds_available
    status: 409
    title: Correction exceeds what is available
    message: At most {amount} can be taken from this balance.
    retryable: false
    description: A correction down asked for more than is available in the balance it corrects.

  - code: internal
    status: 500
    title: Internal error
    message: An unexpected error occurred.
    retryable: true
    description: >-
      Something failed on the server. The problem is logged with the
      `instance` value; retrying with backoff is safe for idempotent
      requests.

  - code: unavailable
    status: 503
    title: Service unavailable
    message: The service is temporarily unavailable; retry after {retry_after} seconds.
    retryable: true
    description: >-
      The API or a dependency it needs is temporarily unavailable, for
      example during maintenance. The response carries a `Retry-After`
      header when the duration is known.

  - code: two_step_unavailable
    status: 503
    title: Two-step sign-in unavailable
    message: "Two-step sign-in cannot be set up on this deployment."
    retryable: false
    description: >-
      This deployment holds no two-step key, so an authenticator cannot be
      set up here.

  - code: offer_taken
    status: 409
    title: Offer taken
    message: "Another Agent took this delivery first."
    retryable: false
    description: >-
      Two Agents accepted offers of one delivery at the same moment; the other one has it.

  - code: offer_closed
    status: 409
    title: Offer closed
    message: "The offer is no longer open: it {how}."
    retryable: false
    description: >-
      The offer expired unanswered, was withdrawn (the delivery went elsewhere or its order ended), or was answered already.

  - code: delivery_not_with_provider
    status: 409
    title: No Provider has the delivery
    message: "No Provider has the delivery yet; ask for it first."
    retryable: false
    description: >-
      A delivery is given by hand only once a Provider has it; ask a Provider for it first.

  - code: delivery_collected
    status: 409
    title: Delivery collected
    message: "The Agent has the order now; talk to them."
    retryable: false
    description: >-
      Once the order is collected nobody can give the delivery to anybody else, and there is nothing to ask for: the goods are with somebody.

  - code: delivery_ended
    status: 409
    title: Delivery ended
    message: "The delivery is {state}."
    retryable: false
    description: >-
      The delivery was delivered, failed at the door or was called off; nothing moves it any more.

  - code: nothing_to_ask
    status: 409
    title: Nothing to ask for
    message: "A Provider has the delivery and nothing is wrong with it; there is nothing to ask for."
    retryable: false
    description: >-
      Asking again is for a delivery needing somebody, or one no Provider has; this one is with a Provider and nothing is wrong with it.

  - code: delivery_not_failed
    status: 409
    title: Delivery not failed
    message: "Only an order whose delivery failed at the door is sent again; this delivery is {state}."
    retryable: false
    description: >-
      Sending again is for an undelivered order: its delivery failed at the door and it was neither sent again nor cancelled.

  - code: delivery_open
    status: 409
    title: Delivery under way
    message: "A delivery of the order is under way."
    retryable: false
    description: >-
      A delivery is asked for an order only when none of its deliveries is under way.

  - code: not_for_delivery
    status: 409
    title: Not for delivery
    message: "The order is a pickup; nothing is delivered."
    retryable: false
    description: >-
      Deliveries are asked for delivery orders only.

  - code: no_provider
    status: 409
    title: No Provider
    message: "The store names no Provider that can carry its deliveries; configure a delivery service or the platform fleet first."
    retryable: false
    description: >-
      The store's delivery setting names no Provider that can carry the delivery now: no delivery service of its own at the store, and the platform fleet neither chosen nor operating in the store's zone.

  - code: assignment_refused
    status: 409
    title: Assignment refused
    message: "{agent} cannot take it: {why}."
    retryable: false
    description: >-
      The delivery cannot be given to that Agent by hand; the detail says
      why in words and `errors[].code` names it.
    details:
      - code: agent_over_limit
        message: "The Agent carries the most deliveries the service allows."
        description: "The Agent has as many deliveries under way as the service's limit (3 by default)."
      - code: agent_kind_not_allowed
        message: "The Agent's kind is not allowed for this delivery."
        description: "The Agent's kind (walker, bicycle, two-wheeler, van) is not one the service or the delivery allows."
      - code: agent_suspended
        message: "The Agent is suspended."
        description: "The membership is suspended; it receives no work until the suspension is lifted."
      - code: agent_not_active
        message: "The Agent is not active."
        description: "The membership is pending or offboarded."
      - code: agent_cash_ceiling
        message: "The Agent holds too much cash for this delivery."
        description: "The delivery collects cash and the Agent's cash in hand would pass the service's cash ceiling."
      - code: agent_not_in_service
        message: "The Agent is not of a delivery service that may carry this delivery."
        description: "The Agent belongs to no delivery service of the delivery's chain that the caller may choose from."

  - code: order_not_completed
    status: 409
    title: Order not completed
    message: The order has not completed; it can be rated once it is delivered or collected.
    retryable: false
    description: >-
      A review, a review photo or a delivery rating asked for an order that
      is not completed yet, or ended without completing.

  - code: reviews_off
    status: 409
    title: Reviews off
    message: This store does not take reviews.
    retryable: false
    description: >-
      The store's listing says it takes no reviews: customers are not asked,
      and a review is refused. Reviews written before stay readable.

  - code: tag_not_offered
    status: 409
    title: Tag not offered
    message: "{tag} is not offered here."
    retryable: false
    description: >-
      A review or a rating named a tag its thumb or its way of ordering does
      not offer, such as "Late delivery" on a collection or a thumbs-up tag
      with a thumbs down.

  - code: already_reviewed
    status: 409
    title: Already reviewed
    message: The order was reviewed already; a review is written once.
    retryable: false
    description: >-
      The order has its review. A review is never edited; of two sent at the
      same moment one is kept.

  - code: delivery_not_rateable
    status: 409
    title: Delivery not rateable
    message: Only a delivery an Agent carried can be rated.
    retryable: false
    description: >-
      A delivery rating for an order that no Agent delivered: a collection,
      or a delivery not completed.

  - code: already_rated
    status: 409
    title: Already rated
    message: The delivery was rated already; a delivery is rated once.
    retryable: false
    description: The delivery has its rating, which is never edited.

  - code: reply_not_allowed
    status: 409
    title: Reply not allowed
    message: "{reason}"
    retryable: false
    description: >-
      A reply to a review cannot be written now: one is waiting or published,
      one was withdrawn, both replies a rejection allows were used, the
      platform hid the review, or the review is older than 90 days. The
      detail says which.

  - code: reply_decided
    status: 409
    title: Reply decided
    message: The reply was {status} already.
    retryable: false
    description: >-
      Moderation of a reply that is no longer waiting: approved, rejected or
      withdrawn.

  - code: nothing_to_hide
    status: 409
    title: Nothing to hide
    message: The review has no note or photos to hide.
    retryable: false
    description: >-
      Hiding a review with neither a note nor photos: its thumb and tags
      always count and show.

  - code: flag_window_closed
    status: 409
    title: Flag window closed
    message: A rating can be flagged within 14 days of it.
    retryable: false
    description: An Agent flagged a rating older than 14 days.

  - code: already_flagged
    status: 409
    title: Already flagged
    message: The rating is flagged already.
    retryable: false
    description: An Agent flags a rating once; the decision answers it.

  - code: flag_decided
    status: 409
    title: Flag decided
    message: The flag was decided already.
    retryable: false
    description: A decision on a flag that was excluded or kept already.

  - code: job_running
    status: 409
    title: Job running
    message: "{job} is running now."
    retryable: true
    description: >-
      Run now asked for a job with a run under way; its outcome shows in its
      runs.

  - code: job_not_runnable
    status: 409
    title: Job not runnable
    message: "{job} runs all the time; it cannot be run now."
    retryable: false
    description: >-
      Run now asked for a continuous job, such as the outbox relay or a
      durable consumer, which has no schedule to run outside.
  - code: week_not_over
    status: 409
    title: Week not over
    message: "Week {week} is not over yet: it can be locked from {from}."
    retryable: false
    description: >-
      A week can be locked only once its Sunday has passed on the payee's
      clock (as the payouts date reads it); the detail says when it can be.

  - code: week_locked
    status: 409
    title: Week locked
    message: "Week {week} is locked already, as {reference}."
    retryable: false
    description: >-
      A week is locked at most once, whoever locks it: one statement per
      payee and week. The detail names the statement.

  - code: week_carried_on
    status: 409
    title: Week carried on
    message: "Week {week} is before the latest statement, {reference}: its money was carried on."
    retryable: false
    description: >-
      A week before the payee's latest statement cannot be locked, because
      what it held was carried into the statements after it.

  - code: week_empty
    status: 409
    title: Nothing to lock
    message: "Nothing happened in week {week}, so it makes no statement."
    retryable: false
    description: >-
      A week with no order, refund, adjustment, cash or task makes no
      statement, whether the clock or platform staff lock it.

  - code: statement_move_refused
    status: 409
    title: Statement move refused
    message: "{reference} is {state}: it cannot be {move}."
    retryable: false
    description: >-
      A statement moves between due, sending, paid, unpaid and archived only
      as allowed: paid from due or unpaid, unpaid from due or paid, archived
      from due or unpaid, back to due from paid, unpaid or archived when
      there is something to pay, sent from due or unpaid once its
      destination is checked. The detail says why in words and
      `errors[].code` names it.
    details:
      - code: statement_state
        message: The statement's state does not allow the move.
        description: The move is not allowed from the statement's state.
      - code: nothing_to_pay
        message: The statement has nothing to pay.
        description: A statement whose week came to nothing or less cannot be due, sent or paid.
      - code: destination_not_checked
        message: The payout destination is not checked yet.
        description: A statement is sent only to a destination whose one-rupee check passed.
      - code: payee_gone
        message: The payee is gone.
        description: The Partner is archived, or the Agent's membership ended, so nothing is sent.

  - code: adjustment_settled
    status: 409
    title: Adjustment settled
    message: "The adjustment is settled into {reference}, which is locked: only another adjustment can undo it now."
    retryable: false
    description: >-
      An adjustment can be taken back only while its week is not locked;
      after the lock a new adjustment undoes it.

  - code: question_answered
    status: 409
    title: Question answered
    message: The question was answered already; an answer cannot be changed.
    retryable: false
    description: A question about a week is answered once, and the answer is kept as written.

  - code: payouts_date_fixed
    status: 409
    title: Payouts date fixed
    message: The payouts date moves only on a developer's machine or in the sandbox.
    retryable: false
    description: >-
      Platform staff may move the date payouts work to forward only where
      `APP_PROFILE` is `local` or `sandbox`; anywhere else it is the real date.

  - code: paid_by_partner
    status: 409
    title: Paid by the Partner
    message: "{partner} pays you, so ZippyGo needs no payout account."
    retryable: false
    description: >-
      A Partner's own Agents are reported, not paid: the platform keeps no
      payout account for them.
