type: object
description: "A review as the store reads it in the Partner console: the customer's first name, how the order reached them, when, the tags, the note, the photos, the order it was about and the replies. A review the platform hid arrives without its note and photos. The Agent who carried the order is named only when the Agent is the Partner's own."
required:
  - id
  - location_id
  - first_name
  - thumb
  - tags
  - note
  - photos
  - hidden
  - fulfilment
  - created_at
  - order
  - agent
  - replies
  - reply_allowed
  - reply_refusal
properties:
  id:
    type: string
    format: uuid
    description: "The review."
  location_id:
    type: string
    format: uuid
    description: "The store."
  first_name:
    type: string
    examples:
      - Asha
    description: "The reviewer's first name."
  thumb:
    $ref: ./ReviewThumb.yaml
    description: "Up or down."
  tags:
    type: array
    items:
      $ref: ./ReviewTagOption.yaml
    description: "The tags chosen."
  note:
    type:
      - string
      - "null"
    examples:
      - "The biryani arrived cold."
    description: "The note; `null` when there is none or the platform hid it."
  photos:
    type: array
    items:
      $ref: ./ReviewPhoto.yaml
    description: "The photos; empty when the platform hid them."
  hidden:
    type: boolean
    description: "Whether the platform hid its note and photos."
  fulfilment:
    $ref: ./ReviewFulfilment.yaml
    description: "Delivered, delivered by the Partner's own Agent, or collected."
  created_at:
    type: string
    format: date-time
    description: "When it was written."
  order:
    $ref: ./PartnerReviewOrder.yaml
    description: "The order it was about."
  agent:
    oneOf:
      - $ref: ./ReviewAgent.yaml
      - type: "null"
    description: "The Partner's own Agent who carried it; `null` otherwise."
  replies:
    type: array
    items:
      $ref: ./ReviewReply.yaml
    description: "The Partner's replies, oldest first."
  reply_allowed:
    type: boolean
    description: "Whether a reply may be written now."
  reply_refusal:
    type:
      - string
      - "null"
    examples:
      - "A reply was published; a review takes one reply."
    description: "Why not, in words; `null` when a reply may be written."
examples:
  - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0001"
    location_id: "01a13a48-9e00-7000-8000-000000000301"
    first_name: Asha
    thumb: down
    tags:
      - code: cold_damaged
        label: Cold/damaged
    note: "The biryani arrived cold."
    photos:
      - asset_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005"
        url: "https://objects.zippygo.example/zippygo-private/reviews/0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0005.jpg?signature=example"
    hidden: false
    fulfilment: delivered
    created_at: "2026-10-22T10:10:00Z"
    order:
      order_id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
      number: AB0042
      lines:
        - name: "Hyderabadi Biryani"
          variant_label: Full
          quantity: 1
          left_out: false
        - name: "Boondi raita"
          variant_label: null
          quantity: 1
          left_out: true
      total:
        minor_units: 58000
        currency: INR
      refunded: false
    agent: null
    replies:
      - id: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4c0002"
        text: "Sorry, we have changed our packaging"
        status: approved
        written_at: "2026-10-22T10:30:00Z"
        written_by: "Dev owner"
        decided_at: "2026-10-22T11:00:00Z"
        reason: null
    reply_allowed: false
    reply_refusal: "A reply was published; a review takes one reply."
