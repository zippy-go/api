# Path item for /v1/platform/customers/{customer_id}/flags. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: The customer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
post:
  operationId: raiseCustomerFlag
  summary: Flag a customer
  description: "Flags a customer with a fraud signal (since 0.41.0): it shows on their page, their rewards are held for review while it stands, and a refund to them waits for a second person. `customer:block`."
  tags:
    - Customers
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The signal and a note.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/CustomerFlagInput.yaml
  responses:
    "201":
      description: The flag.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerFlag.yaml
    "400":
      description: "`validation_failed`; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:block`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such customer."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
