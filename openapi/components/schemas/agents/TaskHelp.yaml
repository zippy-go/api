type: object
description: A request for help on a task.
required:
  - id
  - task_id
  - delivery_id
  - order_number
  - message
  - requested_at
properties:
  id:
    type: string
    format: uuid
    description: The request.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a99
  task_id:
    type: string
    format: uuid
    description: The task.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
  delivery_id:
    type: string
    format: uuid
    description: The delivery.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB1234
  message:
    type: string
    description: The Agent's words.
    examples:
      - Store refused to hand over the order
  requested_at:
    type: string
    format: date-time
    description: When.
    examples:
      - 2026-10-16T09:00:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a99
    task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
    delivery_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
    order_number: AB1234
    message: Store refused to hand over the order
    requested_at: 2026-10-16T09:00:00Z
