type: object
description: "A code chosen by the owner: 4 to 16 letters and digits, with an optional cap."
required:
  - code
properties:
  code:
    type: string
    description: The code; spaces and punctuation are dropped and letters made upper case.
    examples:
      - FEAST150
    minLength: 4
    maxLength: 40
  cap:
    type:
      - integer
      - "null"
    description: Uses this code allows.
    examples:
      - null
    minimum: 1
examples:
  - code: FEAST150
    cap: null
