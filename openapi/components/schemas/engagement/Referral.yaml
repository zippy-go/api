type: object
description: "A referral: who referred whom with which code, and what it earned."
required:
  - id
  - referrer_id
  - referrer_name
  - referred_id
  - referred_name
  - code
  - service_area_id
  - state
  - recorded_at
  - order_id
  - rewarded_at
  - amount
  - reason
properties:
  id:
    type: string
    format: uuid
    description: The referral.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e6101
  referrer_id:
    type: string
    format: uuid
    description: The referrer (a user id).
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7001
  referrer_name:
    type:
      - string
      - "null"
    description: The referrer's first name.
    examples:
      - Ravi
  referred_id:
    type: string
    format: uuid
    description: The friend (a user id).
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7002
  referred_name:
    type:
      - string
      - "null"
    description: The friend's first name.
    examples:
      - Priya
  code:
    type: string
    description: The code.
    examples:
      - RAVI7K
  service_area_id:
    type:
      - string
      - "null"
    format: uuid
    description: The city.
    examples:
      - 01a13a48-9e00-7000-8000-00000000a001
  state:
    $ref: ./ReferralState.yaml
    description: Where it stands.
  recorded_at:
    type: string
    format: date-time
    description: When the friend added the code.
    examples:
      - 2026-11-02T08:00:00Z
  order_id:
    type:
      - string
      - "null"
    format: uuid
    description: The friend's first order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  rewarded_at:
    type:
      - string
      - "null"
    format: date-time
    description: When the referrer was credited.
    examples:
      - 2026-11-02T09:10:00Z
  amount:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: What the referrer earned.
  reason:
    type:
      - string
      - "null"
    description: Why it lapsed or was taken back.
    examples:
      - null
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e6101
    referrer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7001
    referrer_name: Ravi
    referred_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7002
    referred_name: Priya
    code: RAVI7K
    service_area_id: 01a13a48-9e00-7000-8000-00000000a001
    state: rewarded
    recorded_at: 2026-11-02T08:00:00Z
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    rewarded_at: 2026-11-02T09:10:00Z
    amount:
      minor_units: 10000
      currency: INR
    reason: null
