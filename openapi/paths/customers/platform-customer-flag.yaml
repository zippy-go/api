# Path item for /v1/platform/customers/{customer_id}/flags/{flag_id}. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: The customer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
  - name: flag_id
    in: path
    required: true
    description: The flag.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7101
delete:
  operationId: clearCustomerFlag
  summary: Clear a flag
  description: "Clears a fraud flag (since 0.41.0): rewards held for it alone are for review as before, and refunds go as before. Clearing one cleared answers it as it is. `customer:block`."
  tags:
    - Customers
  security:
    - Bearer: []
  responses:
    "200":
      description: The flag, cleared.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerFlag.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:block`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such flag on the customer."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
