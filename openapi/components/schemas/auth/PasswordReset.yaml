type: object
description: 'The request body of `POST /v1/auth/password/reset`: the token from the emailed link, the console it is used at and the new password.'
required:
  - token
  - audience
  - new_password
properties:
  token:
    type: string
    description: The token from the link, the last segment of its path.
  audience:
    $ref: ./Audience.yaml
    description: 'The console the link is used at: the one it was asked from, `partner` or `platform`.'
  new_password:
    type: string
    description: The new password, 12 to 200 characters and not blank (`password_weak` otherwise).
examples:
  - token: c2FtcGxlLXBhc3N3b3JkLWxpbmstdG9rZW4
    audience: partner
    new_password: another-passphrase-2026
