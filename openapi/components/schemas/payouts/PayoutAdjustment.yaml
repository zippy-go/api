type: object
description: Money added to a payee's payout or taken off it, with a reason the payee reads. It lands in the first week not locked yet, is settled into the statement that locks that week, and can be taken back only until then.
required:
  - id
  - payee_kind
  - partner_id
  - location_id
  - agent_id
  - week
  - amount
  - fee_correction
  - reason
  - note
  - statement_id
  - settled
  - added_at
  - added_by_name
properties:
  id:
    type: string
    format: uuid
    description: The adjustment.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5401
  payee_kind:
    $ref: ./PayeeKind.yaml
    description: Whose payout.
  partner_id:
    type: string
    format: uuid
    description: The Location's Partner, or the Agent's.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  location_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Location, for a Location's payout.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  agent_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Agent, for an Agent's payout.
    examples:
      - null
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week it landed in.
    examples:
      - 2026W43
  amount:
    $ref: ../common/Money.yaml
    description: Positive adds, negative takes off.
  fee_correction:
    type: boolean
    description: "`true` when it credits back a fee found wrong: the statement adds its GST too and carries a credit note for both."
  reason:
    type: string
    description: Why, as the payee reads it.
    examples:
      - Goodwill for the outage on 21 October
  note:
    type:
      - string
      - "null"
    description: Staff's note, in Mission Control only.
    examples:
      - null
  statement_id:
    type:
      - string
      - "null"
    format: uuid
    description: The statement it was settled into, once locked.
    examples:
      - null
  settled:
    type: boolean
    description: Whether its week is locked, after which only another adjustment can undo it.
  added_at:
    type: string
    format: date-time
    description: When it was added.
    examples:
      - 2026-10-26T05:00:00Z
  added_by_name:
    type:
      - string
      - "null"
    description: Who added it, in Mission Control only.
    examples:
      - null
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5401
    payee_kind: location
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    location_id: 01a13a48-9e00-7000-8000-000000000301
    agent_id: null
    week: 2026W43
    amount:
      minor_units: 150000
      currency: INR
    fee_correction: false
    reason: Goodwill for the outage on 21 October
    note: null
    statement_id: null
    settled: false
    added_at: 2026-10-26T05:00:00Z
    added_by_name: null
