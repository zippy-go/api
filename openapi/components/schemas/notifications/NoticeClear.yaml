type: object
description: The notices to clear from the inbox, the request of `POST .../notices/clear`. Name them in `notice_ids`, or send `all` true to clear the whole inbox; one of the two is required (`selection_required`). Only the Location's own notices are cleared.
properties:
  notice_ids:
    type: array
    maxItems: 500
    uniqueItems: true
    description: The notices to clear.
    items:
      type: string
      format: uuid
  all:
    type: boolean
    description: Clear every notice of the inbox.
examples:
  - notice_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
  - all: true
