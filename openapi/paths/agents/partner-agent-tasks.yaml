# Path item for /v1/partners/{partner_id}/agents/{agent_id}/tasks. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: listPartnerAgentTasks
  summary: List an Agent's tasks
  description: An Agent's tasks, newest first, without the customer's number. Members need `agent:read` for the service; Mission Control uses the same route with its platform permissions.
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: At most this many, 1 to 100; 20 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
  responses:
    "200":
      description: The tasks.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentTaskPage.yaml
    "400":
      description: "`validation_failed`: a limit out of range, or `cursor_invalid`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
