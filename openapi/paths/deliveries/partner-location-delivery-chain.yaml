# Path item for /v1/partners/{partner_id}/locations/{location_id}/delivery-chain. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be one of the partner's; another's answers `404`.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000302
get:
  operationId: getPartnerLocationDeliveryChain
  summary: Read a Location's delivery chain
  description: "Who carries the Location's deliveries, in the order a delivery is asked of them: its own delivery service at the Location, then the platform fleet where it may carry them, each naming its Partner. Members need `dispatch:read` in the partner; platform staff use the same route with their platform permissions."
  tags:
    - Deliveries
  security:
    - Bearer: []
  responses:
    "200":
      description: The chain.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/DeliveryChain.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:read`, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the partner or the Location."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
