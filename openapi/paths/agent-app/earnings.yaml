# Path item for /v1/agent/memberships/{agent_id}/earnings. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: getAgentDay
  summary: Read the Agent's day
  description: "The day's earnings on the India calendar: each task's pay with its breakdown under the rule version it was offered under, at the measured distance; tips in full; the total; and the cash in hand now. Pay is earned on completion; a drop failed after arriving pays its base and the distance; a task called off after the Agent started towards it pays the rule's amount. Weekly statements come with payouts. Takes an Agent app token (audience `agent`) of the person holding the membership. Where `APP_PROFILE` is `local` or `sandbox`, the simulator's service token (job `simulator`) may act for an Agent who has no user, on the same routes; never for an Agent who has one."
  tags:
    - Agent app
  security:
    - Bearer: []
  parameters:
    - name: date
      in: query
      required: false
      description: The day; today by default.
      schema:
        type: string
        format: date
      example: 2026-10-16
  responses:
    "200":
      description: The day.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDay.yaml
    "400":
      description: "`validation_failed`: a malformed date."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface, or a service token acting for an Agent it may not act for."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such membership of the caller (another person's answers the same)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
