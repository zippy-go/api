type: object
description: "A Partner's plan, the `PartnerPlan` schema: the plan with what it includes, the trial, a change waiting, and the plans on offer."
required:
  - current
  - plan_after_trial
  - plans
  - price_change
properties:
  current:
    $ref: ./PlanOffer.yaml
    description: The plan in force, with what it includes.
  plan_after_trial:
    $ref: ./Plan.yaml
    description: The plan the Partner chose for after the trial; Starter unless chosen.
  plans:
    type: array
    items:
      $ref: ./PlanOffer.yaml
    description: The plans on offer.
  scheduled:
    oneOf:
      - $ref: ./ScheduledPlanChange.yaml
      - type: "null"
    description: A change platform staff scheduled.
  trial:
    oneOf:
      - $ref: ./PlanTrial.yaml
      - type: "null"
    description: The Pro trial, once the Partner has had one.
  price_change:
    oneOf:
      - $ref: ../configuration/PlanPriceVersion.yaml
      - type: "null"
    description: A new price announced for the Partner's plan, with the month it applies from; `null` when none.
examples:
  - current:
      plan: pro
      label: Pro
      monthly_fee: 499900
      kinds:
        - product_sales
        - field_service
        - delivery
      platform_fleet: true
      price:
        minor_units: 499900
        currency: INR
      modules: &a1
        - delivery
        - pickup
        - promotions
        - loyalty
        - subscriptions
        - inventory
        - own_fleet
        - dine_in
        - field_services
        - developer
      limits: &a2
        locations: 50
        staff: 200
        agents: 500
        api_keys: 20
        webhook_endpoints: 10
      takes_effect_on: null
      prorated: null
    trial:
      ends_at: 2026-11-14T09:00:00Z
      then: standard
      running: true
    plan_after_trial: standard
    scheduled: null
    plans:
      - plan: starter
        label: Starter
        monthly_fee: 0
        kinds:
          - product_sales
        platform_fleet: false
        price:
          minor_units: 0
          currency: INR
        modules:
          - delivery
          - pickup
        limits:
          locations: 1
          staff: 3
          agents: 5
          api_keys: 0
          webhook_endpoints: 0
        takes_effect_on: 2026-12-01
        prorated: null
      - plan: standard
        label: Standard
        monthly_fee: 199900
        kinds:
          - product_sales
          - field_service
          - delivery
        platform_fleet: true
        price:
          minor_units: 199900
          currency: INR
        modules:
          - delivery
          - pickup
          - promotions
          - loyalty
          - subscriptions
          - inventory
          - own_fleet
        limits:
          locations: 5
          staff: 20
          agents: 50
          api_keys: 5
          webhook_endpoints: 5
        takes_effect_on: 2026-12-01
        prorated: null
      - plan: pro
        label: Pro
        monthly_fee: 499900
        kinds:
          - product_sales
          - field_service
          - delivery
        platform_fleet: true
        price:
          minor_units: 499900
          currency: INR
        modules: *a1
        limits: *a2
        takes_effect_on: null
        prorated: null
    price_change: null
