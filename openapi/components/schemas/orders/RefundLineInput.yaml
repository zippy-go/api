type: object
description: A line to refund and how many of it.
required:
  - line_id
  - quantity
properties:
  line_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    description: The line.
  quantity:
    type: integer
    minimum: 1
    maximum: 99
    examples:
      - 1
    description: How many, at most what earlier refunds left.
examples:
  - line_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    quantity: 1
