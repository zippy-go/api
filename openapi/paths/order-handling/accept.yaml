# Path item for /v1/partners/{partner_id}/locations/{location_id}/orders/{order_id}/accept. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: order_id
    in: path
    required: true
    description: The order, which must be one of the store's; another store's answers `404`.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: acceptOrder
  summary: Accept an order with a preparation time
  description: "Accepts a placed order with a preparation time of 1 to 180 minutes, leaving out the lines the store cannot supply. Each line left out takes off exactly what it cost the customer and nothing else is re-priced. Accepting settles what will be sent: a held card is charged for the rest, a payment taken at checkout has the lines left out refunded the way it was paid, a cash order's amount to collect becomes what will be sent; tracked stock is spent. The order is promised ready at acceptance plus the preparation time, and at the door that long plus the delivery estimate. When two screens accept at once one acceptance stands and the card is charged once. Members need `order:read` at the Location to read and `order:manage` to move an order; platform staff use the same routes with their platform permissions, every move written to the audit log. A Location of another Partner, and an order of another store, answer `404` before any permission is looked at."
  tags:
    - Order handling
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The preparation time and the lines left out.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/AcceptOrder.yaml
  responses:
    "200":
      description: The order, moved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/StoreOrder.yaml
    "400":
      description: "`validation_failed`: a preparation time outside 1 to 180, or a line that is not the order's."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission at the Location) or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Location or the order."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`order_moved`: the order is not where the move needs it (another screen moved it first, or its status does not allow the move), with the status it is in now; read it again. `remove_everything` when every line is left out (decline instead); `customer_wants_all` when the customer asked to cancel rather than leave anything out; `stock_short` naming the lines that ask for more than remains; `payment_failed` when the card cannot be charged, the order then declined as `payment_failed` and the customer told they have not been charged."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
