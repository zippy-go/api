type: object
description: "A line of a tab: what was sent, by whom, at the dine-in price, and where it is."
required:
  - line_id
  - round_id
  - item_id
  - variant_id
  - name
  - variant_label
  - food_mark
  - quantity
  - unit_price
  - answers
  - total
  - state
  - member_id
  - member_name
  - note
  - reason
properties:
  line_id:
    type: string
    format: uuid
    description: The line.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0401
  round_id:
    type: string
    format: uuid
    description: Its round.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0301
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0601
  variant_id:
    type: string
    format: uuid
    description: The variant.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0602
  name:
    type: string
    description: The item's name as sent.
    examples:
      - Paneer Tikka
  variant_label:
    type:
      - string
      - "null"
    description: The variant's values.
    examples:
      - null
  food_mark:
    oneOf:
      - $ref: ../catalog/FoodMark.yaml
      - type: "null"
    description: Its veg or non-veg mark.
  quantity:
    type: integer
    minimum: 1
    description: How many.
    examples:
      - 1
  unit_price:
    $ref: ../common/Money.yaml
    description: "The price of one as sent: the dine-in price, its priced answers included."
  answers:
    type: array
    items:
      $ref: ../orders/OrderAnswer.yaml
    description: The answers to its questions, as sold.
  total:
    $ref: ../common/Money.yaml
    description: "What the line costs: the price times the quantity; nothing once declined, voided or recalled."
  state:
    $ref: ./TabLineState.yaml
    description: Where it is.
  member_id:
    type: string
    format: uuid
    description: Who added it.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0501
  member_name:
    type: string
    description: Their name.
    examples:
      - Asha
  note:
    type:
      - string
      - "null"
    description: The note for the kitchen.
    examples:
      - null
  reason:
    type:
      - string
      - "null"
    description: Why it was declined or voided.
    examples:
      - null
examples:
  - line_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0401
    round_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0301
    item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0601
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0602
    name: Paneer Tikka
    variant_label: null
    food_mark: veg
    quantity: 1
    unit_price:
      minor_units: 32000
      currency: INR
    answers: []
    total:
      minor_units: 32000
      currency: INR
    state: fired
    member_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d0501
    member_name: Asha
    note: null
    reason: null
