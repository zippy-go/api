# Path item for /v1/storefront/stores/{location_id}/items/{item_id}. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The store (a Location).
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: item_id
    in: path
    required: true
    description: An item of the published menu.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
get:
  operationId: getStoreItem
  summary: Read an item sheet
  description: "An item as its sheet draws it: its pictures, its axes, its variants with their prices and stock, and every question it asks and its answers ask in turn, three deep, with the prices that make up the total. Read from the published menu, at the version named or a later one."
  tags:
    - Store pages
  security: []
  parameters:
    - name: version
      in: query
      required: false
      description: The menu version the client was told of; the answer is that version or a later one, never an older one.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
  responses:
    "200":
      description: The item sheet, with the menu's version as the `ETag`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/ItemSheet.yaml
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The store, or the item on its published menu, is not found (`not_found`, `menu_not_published`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
