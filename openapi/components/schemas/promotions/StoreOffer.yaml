type: object
description: One of a Location's advertised live offers on its page, with its line and terms.
required:
  - offer_id
  - owner
  - line
  - small_print
  - mechanic
  - terms
  - code
  - item_ids
  - shelf
  - ends_at
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  owner:
    $ref: ./OfferOwner.yaml
    description: The Partner's or the platform's.
  line:
    type: string
    description: Its line.
    examples:
      - Buy 1, get 1 free
  small_print:
    type: string
    description: Its terms in words.
    examples:
      - On Hyderabadi Biryani · for everyone
  mechanic:
    $ref: ./OfferMechanic.yaml
    description: Its mechanic.
  terms:
    type: array
    items:
      type: string
    description: "Its terms one by one: the minimum spend, until when or its hours, who it is for."
  code:
    type:
      - string
      - "null"
    description: Its code, where the owner shows it, with the way to add it.
    examples:
      - null
  item_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The items it is on, for an offer on chosen items.
  shelf:
    oneOf:
      - $ref: ./OfferShelfKind.yaml
      - type: "null"
    description: The shelf it belongs on.
  ends_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it ends.
    examples:
      - null
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    owner: partner
    line: Buy 1, get 1 free
    small_print: On Hyderabadi Biryani · for everyone
    mechanic: multibuy
    terms:
      - Ongoing
    code: null
    item_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc101
    shelf: deals
    ends_at: null
