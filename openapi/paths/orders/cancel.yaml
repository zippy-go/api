# Path item for /v1/customer/orders/{order_id}/cancel. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: The order.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
post:
  operationId: cancelCustomerOrder
  summary: Cancel an order the store has not accepted
  description: "Cancels the customer's own order until the store accepts it, with a reason, an order still waiting for its payment too (the customer gave up paying): every hold is released, nothing is charged, a captured payment is refunded to its source or into the Wallet as the customer chooses, the store's sound stops and the store sees it cancelled by the customer (an order still paying never reached the store, which is told nothing). From acceptance on cancelling alone is refused (`order_not_cancellable`): \"Get help\" asks support instead. When cancelling races the store's acceptance exactly one of the two happens."
  tags:
    - Orders
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The reason.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/orders/CustomerCancellation.yaml
  responses:
    "200":
      description: The order, cancelled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/orders/CustomerOrder.yaml
    "400":
      description: "`validation_failed`: `other` without a note."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`order_not_cancellable`: the store has already accepted the order (or it ended), with the status it is in."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
