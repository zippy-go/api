type: object
description: The open and ready tickets of a Location, oldest first, with the cursor to read the changes after them.
required:
  - items
  - cursor
properties:
  items:
    type: array
    items:
      $ref: ./KitchenTicket.yaml
    description: The tickets; with `station_id`, each ticket's lines at that station only, and only tickets with one.
  cursor:
    type: string
    description: "Where the changes after this read start: give it to `listKitchenChanges`."
    examples:
      - eyJ2IjpbNDJdfQ.c2lnbmVk
