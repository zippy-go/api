type: object
description: A child in a division plan.
required:
  - kind
  - name
  - slug
  - ring
properties:
  kind:
    $ref: ./AreaKind.yaml
    description: Kind of the new area.
  name:
    type: string
    description: Its name.
    examples:
      - Gachibowli
  ring:
    type: array
    items:
      type: array
      items:
        type: number
        format: double
    description: Its fence as one ring of `[longitude, latitude]` points.
  slug:
    type: string
    description: Its slug.
    examples:
      - gachibowli
examples:
  - kind: region
    name: Gachibowli
    ring:
      - - 1.5
    slug: gachibowli
