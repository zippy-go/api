type: object
description: "One change of an offer: what happened, who did it or that the clock did, its state after and before, the reason where one was given, and the terms changed."
required:
  - id
  - at
  - action
  - actor
  - state
  - previous_state
  - reason
  - text
  - changes
properties:
  id:
    type: string
    format: uuid
    description: The entry.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6401
  at:
    type: string
    format: date-time
    description: When.
    examples:
      - 2026-11-06T10:30:00Z
  action:
    $ref: ./OfferHistoryAction.yaml
    description: What happened.
  actor:
    $ref: ./OfferActor.yaml
    description: Who.
  state:
    $ref: ./OfferState.yaml
    description: Its state after.
  previous_state:
    oneOf:
      - $ref: ./OfferState.yaml
      - type: "null"
    description: Its state before.
  reason:
    type:
      - string
      - "null"
    description: The reason given.
    examples:
      - null
  text:
    type: string
    description: The entry in a sentence.
    examples:
      - Started by the clock at 16:00
  changes:
    type: array
    items:
      $ref: ./OfferChange.yaml
    description: The terms changed.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6401
    at: 2026-11-06T10:30:00Z
    action: started
    actor:
      kind: clock
      user_id: null
      name: null
    state: live
    previous_state: scheduled
    reason: null
    text: Started by the clock at 16:00
    changes: []
