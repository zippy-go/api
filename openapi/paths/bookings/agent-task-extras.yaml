# Path item for /v1/agent/tasks/{task_id}/extras. Referenced from openapi.yaml.
parameters:
  - name: task_id
    in: path
    required: true
    description: The job's task, the Agent's own.
    schema:
      type: string
      format: uuid
    example: 019a3d10-2b00-7d00-8a00-00000000a101
post:
  operationId: proposeTaskExtra
  summary: Propose an extra
  description: The Agent proposes an extra during the job, with a photo where it helps; the customer sees it at once, and only an approved extra is done and charged.
  tags:
    - Agent app
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The extra.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/bookings/BookingExtraInput.yaml
  responses:
    "200":
      description: The booking, as the customer sees it.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/bookings/Booking.yaml
    "400":
      description: "`validation_failed`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface, or a task that is not the caller's."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such task of the caller's, or a task that is not a booking's job."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`booking_moved`: the booking has moved on and this no longer applies; the sentence says where it stands."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
