# Path item for /v1/service-areas/{service_area_id}/cross-sell. Referenced from openapi.yaml.
parameters:
  - name: service_area_id
    in: path
    required: true
    description: The city.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a50
get:
  operationId: getCrossSellSettings
  summary: Read a city's cross-sell configuration
  description: |
    The city's cross-sell configuration, or the platform's defaults while it saved
    none. `catalog:oversee`.
  tags:
    - Recommendations
  security:
    - Bearer: []
  responses:
    "200":
      description: 'The configuration.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/CrossSellSettings.yaml
    "400":
      description: 'A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `catalog:oversee` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such city (`not_found`); a zone has no configuration of its own.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putCrossSellSettings
  summary: Change a city's cross-sell configuration
  description: |
    Saves the city's cross-sell configuration, replaced whole, as its next version;
    it takes effect at the next recommendation, and other cities are unchanged.
    Honours `If-Match`. Audited. `taxonomy:write`.
  tags:
    - Recommendations
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: 'The configuration.'
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/crosssell/CrossSellSettingsInput.yaml
  responses:
    "200":
      description: 'The configuration as saved.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/CrossSellSettings.yaml
    "400":
      description: '`validation_failed`, with `taxonomy_term_retired` or `taxonomy_term_elsewhere` on a pair''s term.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: 'Not a Mission Control token (`forbidden`), or the member lacks `taxonomy:write` (`access_denied`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: 'There is no such city (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "412":
      description: '`precondition_failed`: the configuration changed since the `If-Match` version.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: 'Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: 'An unexpected server error, returned as an RFC 9457 problem details document.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
