# Path item for /v1/platform/bundles/{bundle_id}/publish. Referenced from openapi.yaml.
parameters:
  - name: bundle_id
    in: path
    required: true
    description: The bundle.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8401
post:
  operationId: publishPlatformBundle
  summary: Publish a bundle
  description: "Publishes a draft: each side's offer is made for the promotions engine, and each store is invited to accept. It goes live once both accept. Doing it again answers the same. Needs the platform's `promotion:write`. Audited."
  tags:
    - Bundles
  security:
    - Bearer: []
  responses:
    "200":
      description: The bundle.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/crosssell/Bundle.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without the platform's `promotion:write`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`conflict` for a stopped or declined bundle."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
