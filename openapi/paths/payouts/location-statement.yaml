# Path item for /v1/partners/{partner_id}/locations/{location_id}/statements/{statement_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the Partner's; a sister Location's statement answers `404`.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: statement_id
    in: path
    required: true
    description: The statement.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
get:
  operationId: getLocationStatement
  summary: Read a Location's statement
  description: "A locked week: how it was worked out order by order, the GST invoice for the platform's fee, refunds, adjustments and the carry, where the money stands and what holds it, the questions asked and their answers, its history without the names of the people at the platform who moved it, and its documents. `payout:read` at the Location."
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: The statement.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/Statement.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A member without `payout:read` at the Location (`access_denied`), or a Partner whose envelope lacks it (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner, the Location or the statement does not exist or is not the caller's (`not_found`); a sister Location's statement answers the same.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
