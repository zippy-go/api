type: object
description: "An order as Mission Control reads it: the store's view with operators named, the customer, the receipt with every refund, the help asked for and what needs attention."
required:
  - order
  - customer_id
  - customer
  - receipt
  - help
  - attention
  - commission_percent
  - store_name
properties:
  order:
    $ref: ./StoreOrder.yaml
    description: The order as its store runs it, operators named in its history.
  customer_id:
    type: string
    format: uuid
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
    description: The customer who placed it (a user id), to open their account and their Wallet.
  customer:
    $ref: ./OrderCustomer.yaml
    description: The customer.
  receipt:
    $ref: ./Receipt.yaml
    description: The receipt, refunds with who made them.
  help:
    type: array
    items:
      $ref: ./HelpRequest.yaml
    description: The help asked for, oldest first.
  attention:
    type: array
    items:
      $ref: ./AttentionReason.yaml
    description: What needs attention.
  commission_percent:
    type:
      - number
      - "null"
    examples:
      - 12
    description: The commission rate kept on the order when it was placed.
  store_name:
    type: string
    examples:
      - Dev Kitchen Gachibowli
    description: The store's name as it was.
  review:
    oneOf:
      - $ref: ../reviews/OrderReviewSummary.yaml
      - type: "null"
    description: "The customer's review of the order, hidden note included; `null` until written. Since 0.19.0."
  delivery_rating:
    oneOf:
      - $ref: ../reviews/DeliveryRating.yaml
      - type: "null"
    description: "The customer's rating of the delivery; `null` until given or for an order no Agent carried. Since 0.19.0."
