type: object
description: "A free item the basket's offer gives, as a line of its own at its worth with all of it off: the cheapest until the customer picks another."
required:
  - offer_id
  - line
  - variant_id
  - name
  - price
  - choices
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  line:
    type: string
    description: Its line.
    examples:
      - Free Gulab Jamun · over ₹299
  variant_id:
    type: string
    format: uuid
    description: The variant given.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
  name:
    type: string
    description: The item's name.
    examples:
      - Gulab Jamun
  price:
    $ref: ../common/Money.yaml
    description: What it is worth, all of it off.
  choices:
    type: array
    items:
      $ref: ./FreeItemChoice.yaml
    description: What can be had instead.
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    line: Free Gulab Jamun · over ₹299
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
    name: Gulab Jamun
    price:
      minor_units: 6000
      currency: INR
    choices:
      - variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc201
        item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
        name: Gulab Jamun
        variant_label: null
        price:
          minor_units: 6000
          currency: INR
        available: true
