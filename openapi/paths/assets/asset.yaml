# Path item for /v1/assets/{asset_id}. Referenced from openapi.yaml.
parameters:
  - name: asset_id
    in: path
    required: true
    description: The asset
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
get:
  operationId: getAsset
  summary: One asset
  description: "One asset: its state, the facts the destination reported and, for a stored public asset, its address. Platform assets are visible to every signed-in person; a Partner's to its members and platform staff."
  tags:
    - Assets
  security:
    - Bearer: []
  responses:
    '200':
      description: The asset
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/assets/Asset.yaml
    '400':
      description: Malformed identifier
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
delete:
  operationId: discardAsset
  summary: Discards an asset and everything derived from it, deleting the bytes at the destination
  description: "Discards an asset and everything derived from it, deleting the bytes at the destination; the row stays readable as discarded. With the permission that writes the file."
  tags:
    - Assets
  security:
    - Bearer: []
  responses:
    '200':
      description: The asset, discarded
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/assets/Asset.yaml
    '400':
      description: Malformed identifier
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without the permission that writes the file'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown, or not visible to the caller
      content:
        application/problem+json:
