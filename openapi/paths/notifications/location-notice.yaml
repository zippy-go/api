# Path item for /v1/partners/{partner_id}/locations/{location_id}/notices/{notice_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: 'The Location, which must belong to the partner in the path.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: notice_id
    in: path
    required: true
    description: 'The notice.'
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
delete:
  operationId: clearLocationNotice
  summary: Clear one notice
  description: |
    Clears one notice from the Location's inbox. A notice that is not in this Location's inbox clears nothing and answers `cleared: 0`, never `404`. `notice:read` at the Location.
  tags:
    - Notices
  security:
    - Bearer: []
  responses:
    '200':
      description: 'How many were cleared: one or none.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/notifications/NoticesCleared.yaml
    '400':
      description: '`validation_failed`: a malformed notice id.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: 'No valid access token was sent, or it was refused (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'The caller lacks `notice:read` at this Location (`access_denied`); platform staff read with `notice:send` and change nothing (`forbidden`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: 'Unknown partner or Location, or a Location of another partner (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
