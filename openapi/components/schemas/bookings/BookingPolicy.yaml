type: object
description: The policy a booking keeps as it was when booked, the `BookingPolicy` schema, with its words.
required:
  - confirmation_minutes
  - cancellation_window_hours
  - late_fee_percent
  - visit_charge
  - pay_after_job
  - confirm_automatically
  - words
properties:
  confirmation_minutes:
    type: integer
    description: Minutes the Location had to confirm.
    examples:
      - 60
  cancellation_window_hours:
    type: integer
    description: Hours before the slot from which cancelling costs a fee.
    examples:
      - 2
  late_fee_percent:
    type: integer
    description: The fee inside the window, a share of the fixed price.
    examples:
      - 20
  visit_charge:
    $ref: ../common/Money.yaml
    description: Kept once the Agent is on the way, or when the customer is not there.
  pay_after_job:
    type: boolean
    description: Whether the price may be paid after the job.
    examples:
      - false
  confirm_automatically:
    type: boolean
    description: Whether bookings confirm themselves.
    examples:
      - false
  words:
    type: string
    description: The policy in plain words, as the service's page says it.
    examples:
      - Free to cancel until 2 hours before. After that, cancelling costs 20%. Once the Agent is on the way, ₹99.00 is kept.
examples:
  - confirmation_minutes: 60
    cancellation_window_hours: 2
    late_fee_percent: 20
    visit_charge:
      minor_units: 9900
      currency: INR
    pay_after_job: false
    confirm_automatically: false
    words: Free to cancel until 2 hours before. After that, cancelling costs 20%. Once the Agent is on the way, ₹99.00 is kept.
