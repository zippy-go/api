type: object
description: "An Agent's rating: the share of thumbs up over the last 90 days, one rating per delivery (the delivery's own rating, else the order's review only when it says the delivery was late), excluded ratings left out, counted when asked for."
required:
  - percent
  - count
  - from
  - to
properties:
  percent:
    type: integer
    minimum: 0
    maximum: 100
    examples:
      - 80
    description: "The share of thumbs up, 0 to 100."
  count:
    type: integer
    minimum: 1
    examples:
      - 5
    description: "How many ratings it counts."
  from:
    type: string
    format: date-time
    description: "Where the window starts."
  to:
    type: string
    format: date-time
    description: "Where it ends: now."
examples:
  - percent: 80
    count: 5
    from: "2026-07-24T10:00:00Z"
    to: "2026-10-22T10:00:00Z"
