# Path item for /v1/partners/{partner_id}/locations/{location_id}/kitchen/marks. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
post:
  operationId: markKitchen
  summary: Mark the kitchen's tickets
  description: "One mark, or the queue a display kept while offline: fire a held course, mark a line or a course ready (at one station when it names one), serve from the floor, decline a line not fired yet as sold out, or bump a ready ticket. Each is applied by the moment it was made: a mark made earlier than the one that set what it marks is superseded, so the later stands, and the ticket's history keeps both with who made them. A mark sent again changes nothing and answers as it did. A course marked ready makes the ticket ready once every line on it is; a line fired can only be served, or refunded on the order. `order:manage` at the Location."
  tags:
    - Kitchen
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The marks, in the order they were made.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/kitchen/KitchenMarkBatch.yaml
  responses:
    "200":
      description: What became of each mark.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/kitchen/KitchenMarkResults.yaml
    "400":
      description: "`validation_failed`: no mark or more than 100, a mark without what it marks, a moment later than now, or a malformed identifier."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` (the member lacks `order:manage` at the Location), `not_enabled_for_partner`, or `forbidden` for a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no such Partner or Location for the caller."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
