# Path item for /v1/partners/{partner_id}/services/{service_id}/shifts/{shift_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: service_id
    in: path
    required: true
    description: The service, one of the Partner's that sends Agents out.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  - name: shift_id
    in: path
    required: true
    description: The shift.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c9101
get:
  operationId: getServiceShift
  summary: Read a shift
  description: One shift with its Agents. `dispatch:read` at the service.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The shift.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/Shift.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:read` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: changeServiceShift
  summary: Change a shift
  description: "Changes a shift before it starts: its hours, zone, count or note. A count below the Agents who have it is refused. Publishes `fleet.shift.changed`, and the Agents who have it are told. `dispatch:manage` at the service."
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: What changes.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/ShiftUpdate.yaml
  responses:
    "200":
      description: The shift after.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/Shift.yaml
    "400":
      description: "`validation_failed`: a member is out of bounds, named."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`shift_closed`: the shift has started, ended or was cancelled; `shift_full` when the count would fall below the Agents who have it."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
delete:
  operationId: cancelServiceShift
  summary: Cancel a shift
  description: "Cancels a shift before it ends: its Agents lose it and are told, and its hours make no more slots. Publishes `fleet.shift.changed` with the state `cancelled`. `dispatch:manage` at the service."
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The shift, cancelled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/Shift.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `dispatch:manage` at the service, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the service, the shift or the Agent is not one the caller can see; another Partner's answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`shift_closed`: the shift ended or was cancelled already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
