# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/categories/{category_id}/items. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  - name: category_id
    in: path
    required: true
    description: The category, which must be one of the store's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc001
get:
  operationId: listCatalogCategoryItems
  summary: Page through a category's items
  description: "The items on a category in its order, fifty at a time by default: the rest of a long category the tree shows the first page of. `catalog:read`."
  tags:
    - Catalog
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of the category's items.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/CatalogItemPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `catalog:read` at this Location (`access_denied`), the partner is not entitled to it (`not_enabled_for_partner`), or platform staff lack `catalog:oversee` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner is not visible to the caller, or the store or the record does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_required`: the Location is a branch, with no product-sales Service switched on, so it has no catalogue."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putCatalogCategoryItems
  summary: Set the items on a category
  description: Replaces the items on the category and their order. An item may sit on any number of categories; an item that is not listed sits on none. `catalog:write`.
  tags:
    - Catalog
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The items, in order.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/CatalogCategoryItems.yaml
  responses:
    "200":
      description: The category with its items.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/CatalogCategory.yaml
    "400":
      description: An item is unknown or deleted (`validation_failed`), or not listed (`item_unlisted`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `catalog:write` at this Location (`access_denied`), or the partner is not entitled to it (`not_enabled_for_partner`). Platform staff read catalogues and change none in this version (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner is not visible to the caller, or the store or the record does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`category_has_subcategories`: the category holds sub-categories, which the `detail` offers instead; or `service_required`: the Location is a branch, with no product-sales Service switched on, so it has no catalogue."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
