type: object
description: A category on the published menu with its first page of items.
required:
  - id
  - parent_id
  - name
  - description
  - picture
  - hours
  - outside_hours
  - item_count
  - items
  - next_offset
properties:
  id:
    type: string
    format: uuid
    description: The category.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc001
  parent_id:
    type:
      - string
      - "null"
    format: uuid
    description: Its parent, for a sub-category.
    examples:
      - null
  name:
    $ref: ./LocalizedText.yaml
    description: Its name.
  description:
    oneOf:
      - $ref: ./LocalizedText.yaml
      - type: "null"
    description: What it says about itself.
  picture:
    oneOf:
      - $ref: ./CataloguePicture.yaml
      - type: "null"
    description: Its picture.
  hours:
    oneOf:
      - type: array
        items:
          $ref: ../reference/DaySchedule.yaml
        description: The days and windows it is sold.
      - type: "null"
    description: Its own hours in the store's clock; `null` follows the store.
  outside_hours:
    $ref: ./OutsideHours.yaml
    description: What it does outside its hours.
  item_count:
    type: integer
    description: How many items it holds.
    examples:
      - 1
  items:
    type: array
    items:
      $ref: ./MenuItem.yaml
    description: Its first items, `page_size` at most.
  next_offset:
    type:
      - integer
      - "null"
    description: The offset of its next page at `GET .../menu/categories/{category_id}`; `null` when all are here.
    examples:
      - null
