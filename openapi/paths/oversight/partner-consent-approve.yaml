# Path item for /v1/partners/{partner_id}/impersonation/consents/{consent_id}/approve. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: consent_id
    in: path
    required: true
    description: The request to view the partner's console, which must be the partner's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a81
post:
  operationId: approveImpersonationConsent
  summary: Consent to being viewed
  description: An owner approves a request to view the console, for twenty-four hours; changes allowed only when asked for and allowed here.
  tags:
    - Oversight
  security:
    - Bearer: []
  requestBody:
    required: false
    description: Optionally, whether changes are allowed too.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/oversight/ImpersonationConsentApproval.yaml
  responses:
    '200':
      description: Consented.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oversight/ImpersonationConsent.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: Not an owner, or while being viewed.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown request.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: Decided already.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
