type: object
description: "An answer of a question: an item of the store, with the price that replaces its own when chosen here."
required:
  - item_id
  - name
  - food_mark
  - price
  - item_price
  - offered
  - position
  - sellable
  - asks
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
  name:
    $ref: ./LocalizedText.yaml
    description: The item's name.
  food_mark:
    oneOf:
      - $ref: ./FoodMark.yaml
      - type: "null"
    description: The item's own mark.
  price:
    oneOf:
      - $ref: ../common/Money.yaml
      - type: "null"
    description: The price when chosen here; `null` is the item's own.
  item_price:
    $ref: ../common/Money.yaml
    description: The item's own price.
  offered:
    type: boolean
    description: Offered here.
  position:
    type: integer
    description: Its place among the answers.
    examples:
      - 0
  sellable:
    type: boolean
    description: The item can be had now.
  asks:
    type: array
    items:
      type: string
      format: uuid
    description: The questions the item asks in turn.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bc102
    name:
      en: Boondi raita
    food_mark: veg
    price: null
    item_price:
      minor_units: 4900
      currency: INR
    offered: true
    position: 0
    sellable: true
    asks: []
