# Path item for /v1/settings/{key}. Referenced from openapi.yaml.
parameters:
  - name: key
    in: path
    required: true
    description: The setting key, such as reference.resolution_cap_metres
    schema:
      type: string
    example: reference.resolution_cap_metres
get:
  operationId: getSetting
  summary: One setting
  description: One setting.
  tags:
    - Settings
  security:
    - Bearer: []
  responses:
    '200':
      description: The setting
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/Setting.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: No setting with that key is declared
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
