type: object
description: "When an offer runs, as the Location's wall clock: its dates, written and read in the Location's time zone, and up to seven weekly windows."
properties:
  starts_at:
    type:
      - string
      - "null"
    description: Its start, `YYYY-MM-DDTHH:MM` on the wall clock; `null` for when it is published.
    examples:
      - 2026-11-06T16:00
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
  ends_at:
    type:
      - string
      - "null"
    description: Its end, `YYYY-MM-DDTHH:MM`; `null` for until it is stopped.
    examples:
      - null
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
  windows:
    type: array
    items:
      $ref: ./OfferWindow.yaml
    description: Weekly windows; none for all day.
  time_zone:
    type: string
    description: "Read only: the clock it is written in, the Location's."
    examples:
      - Asia/Kolkata
examples:
  - starts_at: 2026-11-06T16:00
    ends_at: null
    windows:
      - days:
          - friday
        start: 16:00
        end: 22:00
    time_zone: Asia/Kolkata
