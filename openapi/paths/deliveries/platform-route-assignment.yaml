# Path item for /v1/platform/dispatch/routes/{route_id}/assignment. Referenced from openapi.yaml.
parameters:
  - name: route_id
    in: path
    required: true
    description: The route.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8101
post:
  operationId: assignPlatformRoute
  summary: Give a route to an agent
  description: Gives a route to one Agent of its delivery service, before or after it is offered; its open offers go and the Agent's app receives the trip with a sound. Needs the platform's `dispatch:manage`. Audited.
  tags:
    - Deliveries
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The Agent, and why.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/dispatch/RouteAssignmentInput.yaml
  responses:
    "200":
      description: The route, assigned.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/Route.yaml
    "400":
      description: "`validation_failed`; `malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without the platform's `dispatch:manage`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the route or the Agent."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`route_not_assignable` for a route under way or ended; `assignment_refused` when the Agent cannot take it, naming why."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
