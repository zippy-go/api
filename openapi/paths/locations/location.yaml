# Path item for /v1/partners/{partner_id}/locations/{location_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The location, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
get:
  operationId: getLocation
  summary: Get a location
  description: Returns one of the partner's locations. Any member of the partner and the platform realm may read it.
  tags:
    - Locations
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfNoneMatchHeader.yaml
  responses:
    '200':
      description: The location, with its version as the `ETag`.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/Location.yaml
    '304':
      description: '`If-None-Match` named the current version; nothing is transferred.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner is not visible to the caller, or the location does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updateLocation
  summary: Update a location
  description: |
    Changes the members of the location that are present in the body,
    including `status`, and returns the location. Owners and managers may
    update locations; other members receive `403` (`forbidden`). Send
    `If-Match` with the version you hold to be refused with `412`
    (`precondition_failed`) when someone else changed the location first;
    every write raises the version by one.
  tags:
    - Locations
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: The members to change.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/locations/LocationUpdate.yaml
  responses:
    '200':
      description: The location after the change, with its new `ETag`.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/Location.yaml
    '400':
      description: The body failed validation (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is a member but neither owner nor manager (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner is not visible to the caller, or the location does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '412':
      description: '`If-Match` no longer matches the location''s version (`precondition_failed`); fetch it again and retry.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '422':
      description: The pin is outside every service area and too far from any to be placed (`unprocessable`, pointers `/lat` and `/lng`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
