openapi: 3.1.0

info:
  title: ZippyGo API
  version: 0.23.0
  summary: On-demand delivery and hyperlocal commerce API.
  description: |
    The ZippyGo API covers catalog, ordering, subscriptions, delivery
    orchestration and fleet management for businesses that sell and deliver
    locally: partners (organisations or individuals) sell products and
    services, and agents execute the tasks that fulfil them. This document is
    the contract: every endpoint, schema and error shape is defined here
    before it is implemented.

    The API is versioned by URL prefix (`/v1`). Changes within a major version
    are additive only; see the versioning policy in the repository.

    Conventions every operation honours (the developer portal's Conventions
    page has the detail): errors are RFC 9457 problems whose `code` is
    catalogued and dereferenceable at `/problems/{code}`; identifiers are
    UUIDs; amounts are `Money` in minor units; instants are RFC 3339 in
    UTC; collections page with `limit` and `cursor` and filter through a
    declared grammar; writes may carry `Idempotency-Key`; versioned
    resources answer with `ETag` and honour `If-None-Match` and
    `If-Match`; every response carries `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset` and `X-Correlation-Id`; a
    deprecated major answers with `Deprecation` and `Sunset`.
  contact:
    name: ZippyGo API
    url: https://github.com/zippy-go/api
  license:
    name: MIT
    identifier: MIT

# Placeholder hosts. The `.example` top-level domain is reserved for
# documentation (RFC 2606) and will be replaced by the real sandbox and
# production hosts before the first release.
servers:
  - url: https://sandbox.api.zippygo.example
    description: Sandbox (placeholder host, test data only)
  - url: https://api.zippygo.example
    description: Production (placeholder host)

# Operations without their own `security` accept either scheme.
security:
  - ApiKey: []
  - Bearer: []

tags:
  - name: Platform
    description: Service health, the token signing keys and other platform-level utilities.
  - name: Auth
    description: |
      Signing in and sessions: one-time codes by email or phone, passwords,
      two-step sign-in with an authenticator app, password links, step-up
      before sensitive acts, address changes, token refresh, sign-out, the
      signed-in user, and service tokens for background jobs.

      Every session is for one surface, its audience: `partner` (the
      Partner console), `platform` (Mission Control), `agent` (the Agent
      app) or `customer` (the Customer app and the Storefront). A client
      names it in `audience` when it signs in, together with
      `delivery`: `cookie` for browsers, whose refresh token is kept in an
      `httpOnly` cookie named for the surface (`zg_refresh_partner`,
      `zg_refresh_platform`, `zg_refresh_agent`) and scoped to `/v1/auth`,
      or `body` for apps, which receive `refresh_token` and keep it in the
      platform keystore. Both are required on every sign-in
      (`audience_required`, `delivery_required`); the step 1 sign-in that
      named no surface, its `zg_refresh` cookie and the `X-Client-Type`
      header are retired. A refresh token is valid for the surface's
      idle limit and the session ends at its absolute limit whatever the
      refreshes: fourteen and ninety days on the Partner console, thirty and
      one hundred and eighty days on the Agent app, sixty minutes and twelve
      hours on Mission Control, sixty days and a year for customers.
      Refresh tokens rotate on every use; the token spent by the latest
      rotation is forgiven for fifteen seconds, an older one revokes the
      session.

      Customers never have a password. They ask for a one-time code to
      their mobile number (`POST /v1/auth/customer/codes`, by SMS or on
      WhatsApp with SMS behind it) and verify it
      (`POST /v1/auth/customer/verify`): a registered number is signed in, a
      new one receives a registration context, valid thirty minutes, that
      `POST /v1/auth/customer/register` exchanges for the account and its
      session. Nothing about a person who verifies and walks away is kept.
      The market's sign-in gate is consulted when a code is asked for, when
      it is verified, at registration and at every refresh (`409`,
      `sign_in_closed`). A customer session's cookie is
      `zg_refresh_customer`; it renews and ends through
      `POST /v1/auth/refresh` and `POST /v1/auth/sign-out` with
      `audience: customer`, and a customer signing out everywhere ends
      every customer session of theirs.

      The sign-in operations return a `TokenResponse`, or `202` with a
      `TwoStepChallenge` when the account has two-step sign-in on. The
      access token is a JSON Web Token typed `at+jwt`, signed with EdDSA
      (Ed25519), valid for 15 minutes and verifiable with the keys from
      `GET /.well-known/jwks.json`; the key that signed it is named by `kid`
      in the token header. A token is refused by every surface it does not
      name. The claims:

      | Claim         | Meaning                                                                                                   |
      | ------------- | --------------------------------------------------------------------------------------------------------- |
      | `sub`         | The user id; on a service token, the job's credential.                                                    |
      | `iss`         | The issuer: the base URL of the API host that issued the token.                                           |
      | `aud`         | The surface: `partner`, `platform`, `agent`, or `service` for a background job.                           |
      | `iat`, `exp`  | Issued-at and expiry as Unix timestamps; `exp` is at most 15 minutes after `iat`, an hour on a service token. |
      | `jti`         | The token id, unique per token.                                                                           |
      | `sid`         | The session id. A session ends on sign-out, on reuse of an old refresh token, at its idle or absolute limit, or when the user is offboarded. |
      | `memberships` | On a `partner` token, the user's memberships as a compact list of `{ "p": "<partner_id>", "r": "<role>" }`; empty elsewhere. |
      | `platform`    | On a `platform` token, the user's platform role names; empty elsewhere.                                   |
      | `job`         | On a `service` token only, the one job it may do.                                                         |
      | `act`         | On an impersonation token only, `{ "sub": "<platform member>", "writes": <bool> }`: the platform member viewing the Partner console as `sub` with an owner's consent. |

      The `memberships` and `platform` claims are hints fixed at issue
      time: the API resolves what a user holds from its records on every
      request (see the `Access` tag), and checks every Mission Control
      session on every request, so a session ended elsewhere stops at once.

      Platform staff sign in to Mission Control with a password and a
      second factor; without one, the session reaches only `GET /v1/me`,
      the two-step set-up and sign-out, and everything else answers `403`
      (`two_step_setup_required`). Every failed sign-in answers `401`
      (`authentication_failed`), whatever the reason; five failures in
      fifteen minutes for one identifier on one surface, or from one
      client, lock it for the rest of the window.
  - name: Partners
    description: Partners, the supply-side tenants (organisations or individuals). Their locations, members, invitations and services have tags of their own.
  - name: Locations
    description: A partner's physical places, such as stores, restaurants, dark stores, warehouses and service bases.
  - name: Memberships
    description: The users who work in a partner and the role each of them holds.
  - name: Invitations
    description: Inviting users into a partner by email, and accepting an invitation.
  - name: Services
    description: "The registry of services a partner runs: product sales, field service and delivery, several of a kind allowed, each with its configuration, the locations it is switched on at and whether it trades; a field service's settings at its locations and a delivery service's pricing as a provider."
  - name: Plans
    description: "A partner's plan, which decides the kinds of service it may run: the thirty-day Pro trial from activation, moves scheduled by platform staff, and what a move would stop."
  - name: Partner documents
    description: "A partner's compliance documents (GST registration, PAN, FSSAI licence, shop and establishment registration, identity, bank proof), what it must have on file and the review queue platform staff work through."
  - name: Payout accounts
    description: "The bank account a partner is paid into, held until platform staff verify it."
  - name: Payouts
    description: "What ZippyGo pays each Location every week for what it sold, and each platform fleet Agent for the work they did, and how both are shown and explained. A week runs Monday to Sunday on the payee's clock, is locked once, by the clock on the Tuesday after or by Mission Control once it is over, and is paid on the Friday at 10:00 through a payout provider behind a port (a simulated one on a developer's machine and in the sandbox), to a destination checked by a one-rupee transfer. A Location's statement adds up order by order: sales, the platform's fee with the GST its invoice bills, the charges that are the Location's, refunds, cash it collected, adjustments and the carry. Statements move between due, sending, paid, unpaid and archived, each move kept with who made it. Documents are drawn when asked for. A Partner's own Agents are reported, not paid. Members need `payout:read` at the Location; platform staff `payout:read` and `payout:manage`."
  - name: Reports
    description: "Reports computed from the event warehouse, which every domain event published through the outbox reaches within a minute, each saying the moment its data is current to: the orders report and its spreadsheet, the metrics board of preparation, delivery and fulfilment times against each order's promise, the Agents numbers, and the weekly report of a Partner's own Agents. Mission Control needs `report:read` (`agent:read` for the Agents numbers); a Partner sees its own Agents with `agent:read`."
  - name: Audit
    description: The append-only audit log of privileged acts, readable by the platform realm and, for their own records, by a partner's members.
  - name: Access
    description: |
      Who may do what. A permission names one act (`<entity>:<action>`,
      such as `location:write`); a role is a named set of permissions,
      owned by the platform or by one partner; a grant gives a member a role
      at a scope: the platform, a whole partner, one Location or one
      Service. What a member may do at a place is the union of the
      permissions of the grants that cover it, limited by the partner's
      entitlements (what the platform lets its roles contain). Nobody hands
      out more than they hold: defining, changing or granting a role that
      holds a permission the actor lacks answers `403`
      (`permission_escalation`).

      Every operation states the permission it needs. A member lacking it
      at the place receives `403` (`access_denied`), a partner not entitled
      to it `403` (`not_enabled_for_partner`), and somebody who is not a
      member `404`, as for a record that does not exist. Every grant and
      revocation is kept in the access history.
  - name: Oversight
    description: |
      The second pair of eyes on the most dangerous platform acts, and
      platform staff viewing a partner's console with an owner's consent.

      Granting or revoking a platform role, turning a platform member's
      two-step sign-in off and disabling a platform member are proposed and
      run only when a different platform member approves them (four eyes).
      Viewing a partner's console needs the consent of one of its owners,
      given for twenty-four hours, viewing only unless changes were asked
      for and allowed; every viewing session lasts at most sixty minutes,
      is told to the owner, and is recorded in the audit log, with the
      platform member as the actor and the owner as the person acted for.
  - name: Assets
    description: "Assets"
  - name: Customer account
    description: |
      What a signed-in customer sees and changes about themselves: the
      profile, consent per channel, addresses and the selected one, the
      sessions and devices holding the account, where they browse from and
      the account's sections. Every operation acts on the session's own
      customer: no customer identifier appears anywhere, and a token of any
      other surface is refused (`403`, `forbidden`).
  - name: Storefront
    description: |
      What a visitor sees before choosing anything, with no account: where
      they are placed (inside a zone's fence, the nearest zone within the
      caller's cap, a zone they chose, the country's default service area,
      the platform's fallback, or explicitly nothing), the zones that
      serve, whether a pin can be served, the opening screen in one
      request, and a Vertical's stores as cards with their distance from the
      pin. An answer that carries a pin is private and never stored by a
      shared cache.
  - name: Geocoding
    description: |
      Words for a pin and places for what was typed, to pre-fill an address
      form: Google Maps Platform in deployment, a bundled table of
      Hyderabad's localities locally. Never stored; the pin, not the words,
      decides where an agent goes.
  - name: Campaign slots
    description: "Promotional slots placed on the opening screen of a service area and everything beneath it."
  - name: Countries
    description: "Countries: the markets ZippyGo trades in, with their switches for orders and sign-in, holiday calendars, and the country layer of service policy and schedules."
  - name: Currencies
    description: "The currencies the platform operates in, with the display conventions of each."
  - name: Partner policy
    description: "The Partner and Location layers of service policy and schedules, the explain of the effective policy and whether a Location trades at an instant."
  - name: Service areas
    description: "The geography tree with its fences: resolving a pin to a service area, dividing and merging fenced areas, the Verticals an area offers, its campaign slots, its display grid and its policy and schedule layers."
  - name: Service types
    description: "What a Partner's field service does: workflows, durations, radii and the typed fields of the closed catalogue."
  - name: Settings
    description: "The closed, bounded set of platform settings, each with its default, bounds and the sentence saying what it does."
  - name: Store types
    description: "What a Location that sells is: the vocabulary of stores, their typed fields from the closed catalogue and what their items may carry."
  - name: Verticals
    description: "The categories of trade customers browse, with their categories, images and the service areas they reach."
  - name: Catalog
    description: "A store's catalogue as its staff keep it: categories, items sold as variants, questions (modifiers) whose answers are items, brands, stock and prices with their history, edited as a tree, a list and a form. Every save is live: within about a second the store's menu is rebuilt into one published document (see Store pages). Reading needs `catalog:read` at the Location, changing anything customers see `catalog:write`, marking stock `catalog:stock` (which `catalog:write` covers). Platform staff read every catalogue with `catalog:oversee` and change none in this version."
  - name: Store pages
    description: "What the storefront draws for one store, signed out: the store page (open or shut, its hours, the reference to its published menu), the published menu with its version as the entity tag, a large category's further pages and an item sheet. Public; no credential."
  - name: Search
    description: "Finding stores and products by typing, across the stores of the customer's city and inside one store, forgiving misspellings and the common spellings of Indian dishes, with names suggested as the customer types. The ranking is published: a store whose name matches exactly what was typed comes first; the rest are ordered open before closed, then nearer the customer's pin before farther, then by how well the words matched; no store is ranked higher for a fee. The searches are public; the synonym groups are Mission Control's."
  - name: Taxonomy
    description: "The shared taxonomy: per Vertical, a tree of categories at most four levels deep that every store's catalogue maps to, with the attributes a product of a category may or must carry (the food Vertical's dietary mark is read from the vegetarian mark items carry). Public to read; Mission Control creates, renames, moves, merges and deprecates terms with `taxonomy:write`, a rename keeping the id so mappings hold, a term in use never deleted, every change versioned and published as `catalog.taxonomy.changed`. A store maps its categories, and items more narrowly, with `catalog:write`; Mission Control on the Partner's behalf with `taxonomy:write`, recorded as such. An item without a term is sold on its store's page and left out of search across stores, recommendations and shelves."
  - name: Recommendations
    description: "Cross-sell, each suggestion with its reason: often ordered with (items completed orders at the same store carried together, at least 5 orders in 90 days), nearby, goes with your order (another Partner's item within 2 km in a category the city pairs with what the order holds) and reorder prompts (a category the customer orders at a steady interval, after three repeats, at most one prompt a day, by push only with consent). Built from the customer's own orders: no Partner learns of a customer through cross-sell until the customer orders from it. Organic only in this version, ranked by relevance, then the store's rating, then distance. A customer turns all of it off with `recommendations` in their notification preferences; Mission Control keeps each city's configuration."
  - name: Notifications
    description: |
      How the platform tells people what happened. Every message leaves
      through one outbox, queued with the change that causes it, and one
      sender, by push, SMS under DLT, WhatsApp to a customer who opted in, or
      email; each channel has a local stand-in that files its copy in the
      local message inbox. A signed-in device registers for pushes
      (`/v1/me/push`); a customer chooses whether order updates may use
      WhatsApp; Mission Control reads every message in the delivery log and
      sends one again.
  - name: Notices
    description: |
      Notices Mission Control sends to Locations: templates kept by name as
      a starting point and withdrawn rather than deleted, a notice with its
      own words sent to the Locations named, the send log with who saw it,
      a Location's inbox shared by everybody who signs in to it, and how a
      Location's screen presents a notice.
  - name: Payments
    description: "How a customer's money reaches ZippyGo and goes back, through one payment provider behind a port: a simulated provider with sandbox semantics on a developer's machine and in the sandbox, a Razorpay-class gateway with marketplace split settlement once chosen, and no UPI or card payments where none is configured. UPI is paid at once; a card is held at checkout and charged when the Location accepts, for what it will send, and released when it declines; the Wallet pays first; cash on delivery is taken within a ceiling. The provider's word decides: every notice is verified and seen once, every money move is recorded before it is attempted with a key that makes the provider do it once, and a sweeper finishes what an interruption left. Refunds go back to the payment they came from, never more than was taken, the rest to the Wallet. Card data never reaches the platform: a card is its brand, last four digits, expiry and the provider's token. Every night the provider's records are compared with the payments and the ledger."
  - name: Wallet
    description: "A customer's money on ZippyGo in rupees, a ledger that explains itself: every balance is the sum of its entries, each with its reason, never edited, nothing expiring. Two balances: paid (the customer's own money, which may go back to its source) and promotional (money given, spent first and never paid out). The Wallet pays first and cannot be spent twice: held when an order is placed, spent when the Location accepts, returned otherwise. It is checked every night against its entries and against the ledger."
  - name: Ledger
    description: "The double-entry journal every money move is posted to from the moment it is confirmed: immutable, every entry's debits equal to its credits, enforced by the database when it is written. Accounts for every customer's Wallet, every Partner's payable, the platform's commission and delivery fee revenue, GST payable, tips owed to the platform fleet, money at the provider and cash in transit. An order's money is split when the Location accepts: the Partner's share after the commission its Location's policy sets and the GST on it, the delivery fee and tips to the platform fleet (or to the Partner when its own agents carry), the small-order fee to the platform. Mission Control reads accounts, entries, an order's split and the trial balance with `ledger:read`."
  - name: Baskets
    description: "A customer's baskets, one per store, kept on the server and priced by the platform on every read as they will be charged: prices from the store's published menu, tax included, the MRP never exceeded, the delivery fee by straight-line distance, the tip for the platform's agents, the Wallet's share; and checkout, which asks only what the store offers and saves each answer as it is given. A visitor's baskets wait under a visitor token (`X-Visitor-Token`) and become the customer's when they sign in."
  - name: Orders
    description: "A customer's orders: placing the basket with every check made again and the price shown, paying for it, the order's one status and its live page, cancelling until the store accepts, help after that, My orders, the receipt and reorder. Every move signals `order.changed` on the order's channel and the customer's orders channel."
  - name: Order handling
    description: "How a store runs the orders it receives and how Mission Control watches and intervenes: the live board with the one move each order waits for and its timer, accepting with a preparation time and lines left out, declining with a reason, more preparation time, pausing new orders, ready, collected, handed over and delivered (a stand-in for dispatch until step 4), the store's cancellation and its history; Mission Control's board across every store with what needs attention, cancellation at any point, refunds of lines bounded by what was paid, and help resolved. Members need `order:read` and `order:manage` at the Location; platform staff `order:read`, `order:manage` and `order:refund`."
  - name: Deliveries
    description: "Dispatch: an accepted delivery order becomes one delivery, asked of the store's Provider (its own delivery service, then the platform fleet), offered or given to an Agent by the service's strategy with an explanation, given by hand from a dispatch board, moved forward by what the Agent does with the order following, and kept to its promise. The Agent app's offers; the Partner's and Mission Control's dispatch boards, deliveries, choices by hand, asking again and sending again; each delivery service's dispatch settings. Boards hear `delivery.changed` on `private-partner-{partner_id}-deliveries` and `private-deliveries`; an Agent hears `offer.changed` on its task channel; an order's channel carries its courier's `courier.position` from collection until delivery."
  - name: Agent app
    description: "The Agent app: the person's Agent memberships and invitations, documents with upload grants, the duty switch with the zone, position reports, tasks with their steps and proof, help on a task, the day's earnings, cash in hand and the pay rule. Takes Agent app tokens (audience `agent`)."
  - name: Agents
    description: "A Partner's Agents in its delivery services: invitations by mobile number or email, statuses with who, when and why, onboarding documents and their review, the default team, how a service runs its Agents' work, pay rules, and proof of delivery; Mission Control sees every Agent across Partners and manages the platform fleet with the same routes."
  - name: Fleet
    description: Providers, agents, vehicles and capacity.
  - name: Live
    description: Server-sent event streams that push agent positions, statuses and events as they happen.
  - name: Events
    description: The events the platform publishes, as a list to poll and as a stream.
  - name: Subscriptions
    description: Plans and schedules that generate recurring orders.
  - name: Webhooks
    description: Webhook endpoints and event delivery.
  - name: Reviews
    description: "What customers say about what they bought, and how Agents are rated: a thumb up or down on one completed order with tags from a short list, a note and photos, asked once by push; the delivery rated apart from the food; a store's rating as the share of thumbs up, counted when asked for; the Partner's reading and its one reply, moderated by the platform; Mission Control's reading, hiding a note and moderating replies; an Agent's rating, one per delivery over 90 days, and the flags an Agent raises on a rating they find unfair. Customers read reviews with no account; Partner staff with `review:read` at the Location and reply with `review:reply`; platform staff read with `review:read` and moderate with `review:manage`."
  - name: Customers
    description: "Mission Control's Customers section: finding a customer by what a caller can say, their page read and never edited, the timeline of what happened on the account drawn from the domain events, support's notes signed and kept for good, and blocking and unblocking with a reason. Reading needs `customer:read`, writing a note `customer:note`, blocking and unblocking `customer:block`. Partner staff never see this section."
  - name: Promotions
    description: "Offers and the engine that prices them: a Partner's offers on its own Locations built from playbooks, the platform's campaigns across Locations with the Partners' share and their opt-in, and store promotions; one mechanic per offer with the line and small print the platform writes; a lifecycle with its clock; codes of four kinds in one registry with batches and the guess limit; a customer's offers, held offers and stamp cards; uses reserved, confirmed and released; and what a store's page, a basket and a placed order carry from the one engine. Partner staff read with `promotion:read` and write with `promotion:write` at the Location; platform staff likewise platform-wide; customers read and add codes with a customer token."
  - name: Operations
    description: "Mission Control's Operations section beyond health, events and the audit log: the service level objectives with their attainment, error budget and burn; the alerts they and the jobs, the outbox and the payouts open, acknowledged by name; the registry of jobs with their runs and run now; the outbox's pending and failed rows with replay. Reading needs a Mission Control token; acting needs `operations:manage`."

  - name: Rewards
    description: "What brings customers back (step 6, engagement): reward campaigns of kind streak, quest, tier and punch card, run by Mission Control across Partners and by a Partner on its own Locations, each with versioned rules, a funder or a split, a budget, a schedule, an audience, caps and a control group, moved as an offer is; the rewards engine reading the platform's events once each, granting promotional Wallet credit or an offer held for the customer, with claw-backs, caps, the review of held grants and exclusions; the customer's Rewards and its history; and the referral programme, a friend's first order crediting the referrer. Customers read their own; Partner staff read with `engagement:read` and change with `engagement:write` at the Location; platform staff read with `engagement:read`, change with `engagement:write` and decide held grants and exclusions with `engagement:manage`."
  - name: Incentives
    description: "The Agents' incentives (step 6): quests of drop-off tiers and bonuses a drop-off on a delivery service, joined by the Agent before anything counts, never replacing the pay rule, each with a budget; paid by the platform on its fleet's weekly statements under \"Bonuses and quests\", and reported to a Partner for its own Agents. Who runs the service configures them with `agent:manage`: Mission Control for the platform fleet, a Partner for its own; the Agent app joins them."

