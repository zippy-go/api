# Path item for /v1/partners/{partner_id}/activation. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartnerActivation
  summary: Read what activation needs
  description: |-
    What activating the partner needs: its status and every blocker (nobody administering it, the documents it must have approved), the checklist the consoles show before an attempt and the same blockers an attempt is refused with. Members and platform staff.

    Permissions once access lands: `partner:access` for members, `partner:read` for platform staff.
  tags:
    - Partners
  security:
    - Bearer: []
  responses:
    '200':
      description: The status and the blockers.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/PartnerActivation.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
