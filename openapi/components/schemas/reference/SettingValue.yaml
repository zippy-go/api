type: object
description: Request body of `PUT /v1/settings/{key}`, the `SettingValue` schema.
required:
  - value
properties:
  value:
    type: integer
    format: int64
    description: The value, within the declared bounds.
    examples:
      - 25000
  reason:
    type:
      - string
      - "null"
    maxLength: 1000
    description: Why, for a change a second person decides (a retention period). Since 0.33.0.
examples:
  - value: 25000
