# Path item for /v1/platform/locations/{location_id}/payouts. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The Location.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: getPlatformLocationPayouts
  summary: Read a Location's payouts
  description: What the Location reads, and with `from` and `until` any range of its days up to a year worked out as a payout would be. `payout:read`.
  tags:
    - Payouts
  security:
    - Bearer: []
  parameters:
    - name: from
      in: query
      required: false
      description: The first day of a range to work out, on the Location's clock.
      schema:
        type: string
        format: date
    - name: until
      in: query
      required: false
      description: The last day of the range, included; a year at most after `from`.
      schema:
        type: string
        format: date
  responses:
    "200":
      description: The Location's payouts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/LocationPayouts.yaml
    "400":
      description: "`validation_failed`: `range_too_long`, or `from` after `until`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Location (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
