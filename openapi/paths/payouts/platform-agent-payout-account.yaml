# Path item for /v1/platform/agents/{agent_id}/payout-account. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000107
get:
  operationId: getAgentPayoutAccount
  summary: Read where an Agent is paid
  description: Where a platform fleet Agent is paid, masked, with the one-rupee check's state and reason. `payout:read`.
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: Where the Agent is paid.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/AgentPayoutAccount.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Agent, or no account given yet (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
