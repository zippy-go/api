type: object
description: |
  The last known position of an agent: WGS 84 coordinates, the heading and
  speed reported with them, and the time the position was recorded on the
  agent's device.
required:
  - lat
  - lng
  - heading_deg
  - speed_mps
  - recorded_at
properties:
  lat:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude in decimal degrees (WGS 84).
    examples:
      - 12.9716
  lng:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in decimal degrees (WGS 84).
    examples:
      - 77.5946
  heading_deg:
    type:
      - number
      - 'null'
    minimum: 0
    maximum: 360
    description: Direction of travel in degrees clockwise from true north, or `null` when the device did not report one.
    examples:
      - 270.5
  speed_mps:
    type:
      - number
      - 'null'
    minimum: 0
    description: Ground speed in metres per second, or `null` when the device did not report one.
    examples:
      - 4.2
  recorded_at:
    type: string
    format: date-time
    description: When the position was recorded on the device, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-14T08:00:00Z
examples:
  - lat: 12.9716
    lng: 77.5946
    heading_deg: 270.5
    speed_mps: 4.2
    recorded_at: 2026-10-14T08:00:00Z
