# Path item for /v1/partners/{partner_id}/locations/{location_id}/schedule/trading. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The location
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
get:
  operationId: getLocationTrading
  summary: Whether the location trades at an instant and when that changes
  description: Whether the location trades at an instant and when that changes.
  tags:
    - Partner policy
  security:
    - Bearer: []
  parameters:
    - name: at
      in: query
      required: false
      description: The instant asked about (RFC 3339); now when omitted
      schema:
        type: string
  responses:
    '200':
      description: Open or closed, and until when
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/Trading.yaml
    '400':
      description: Malformed query
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `location:read` at this Location (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or location
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
