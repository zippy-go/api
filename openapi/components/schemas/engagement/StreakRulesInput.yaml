type: object
description: A weekly streak as set; milestones at 4, 8 and 12 weeks with free delivery by default.
required:
  - milestones
properties:
  milestones:
    type: array
    items:
      $ref: ./StreakMilestoneInput.yaml
    description: One to six milestones.
    minItems: 1
    maxItems: 6
  repeat_every_weeks:
    type:
      - integer
      - "null"
    description: 4 by default.
    minimum: 1
    maximum: 52
    examples:
      - 4
  freezes_per_month:
    type:
      - integer
      - "null"
    description: 1 by default.
    minimum: 0
    maximum: 4
    examples:
      - 1
  at_risk_push:
    type:
      - boolean
      - "null"
    description: "`true` by default."
    examples:
      - true
examples:
  - milestones:
      - weeks: 4
        reward:
          kind: free_delivery
          worth_up_to:
            minor_units: 6000
            currency: INR
          valid_days: 14
    repeat_every_weeks: 4
    freezes_per_month: 1
    at_risk_push: true
