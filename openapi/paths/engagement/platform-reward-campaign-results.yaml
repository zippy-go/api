# Path item for /v1/platform/reward-campaigns/{campaign_id}/results. Referenced from openapi.yaml.
parameters:
  - name: campaign_id
    in: path
    required: true
    description: The reward campaign.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000006002
get:
  operationId: getPlatformRewardCampaignResults
  summary: Read a campaign's results
  description: "The campaign against its control group: customers, completed orders, sales, retention at 30 days and reward cost, treated and held out, worked out when asked for. Mission Control tokens only, with `engagement:read`."
  tags:
    - Rewards
  security:
    - Bearer: []
  responses:
    "200":
      description: Its results.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardCampaignResults.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` (the member lacks `engagement:read`)."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such campaign."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
