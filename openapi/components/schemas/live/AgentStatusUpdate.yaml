type: object
description: The data of a `status` frame on `GET /v1/live/agents`, sent when an agent goes online, busy or offline, and when its task changes.
required:
  - agent_id
  - status
  - last_seen_at
properties:
  agent_id:
    type: string
    format: uuid
    description: The agent whose status changed.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
  status:
    $ref: ../fleet/AgentStatus.yaml
    description: The agent's new status.
  last_seen_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When the agent was last heard from, as an RFC 3339 timestamp in UTC, or `null` if never.
    examples:
      - 2026-10-14T08:00:00Z
  current_task:
    oneOf:
      - $ref: ../agents/AgentTaskBrief.yaml
      - type: 'null'
    description: The task under way when the agent is busy, with the stop it is heading to; `null` or absent otherwise.
  service_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The service the agent works in; absent when unknown.
    examples:
      - 01a13a48-9e00-7000-8000-000000000202
  service_name:
    type:
      - string
      - 'null'
    description: The service's name; absent when unknown.
    examples:
      - ZippyGo Fleet
examples:
  - agent_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
    status: offline
    last_seen_at: 2026-10-14T08:00:00Z
