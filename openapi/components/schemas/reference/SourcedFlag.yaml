type: object
description: A yes or no with the layer that supplied it, the `SourcedFlag` schema.
required:
  - value
  - source
properties:
  source:
    $ref: ./LayerRef.yaml
    description: 'Whose decision it was: the layer and the version that supplied the value.'
  value:
    type: boolean
    description: The value in force.
    examples:
      - true
examples:
  - source:
      key: IN
      kind: country
      label: India
      set_at: 2026-10-15T09:00:00Z
      set_by: 01a13a48-9e00-7000-8000-00000000a014
      version: 3
    value: true
