type: object
description: "What a Location will be paid and why: its next payment, the week so far, six months of past statements with their documents, where it is paid and whether that is checked, and what would hold a payout now. Mission Control may also ask for any range of its days, worked out."
required:
  - location_id
  - location_name
  - partner_id
  - currency
  - time_zone
  - today
  - fee_explained
  - next_payment
  - week_so_far
  - statements
  - destination
  - holds
  - range
properties:
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  location_name:
    type: string
    description: Its name.
    examples:
      - Dev Kitchen Gachibowli
  partner_id:
    type: string
    format: uuid
    description: Its Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  currency:
    type: string
    description: The currency.
    examples:
      - INR
  time_zone:
    type: string
    description: Its clock.
    examples:
      - Asia/Kolkata
  today:
    type: string
    format: date
    description: "The day on its clock that payouts work to: today, unless platform staff moved the payouts date on a developer's machine or in the sandbox."
    examples:
      - 2026-10-26
  fee_explained:
    type: string
    description: What the fee is for, in plain words.
    examples:
      - The platform's fee is 12% of what you sold through ZippyGo, for the orders, the payments and the customers it brings; GST is charged on the fee.
  next_payment:
    oneOf:
      - $ref: ./PayoutWeekSummary.yaml
      - type: "null"
    description: The next payment; `null` when nothing has happened yet.
  week_so_far:
    $ref: ./PayoutWorking.yaml
    description: The week in progress, as an estimate.
  statements:
    type: array
    items:
      $ref: ./StatementSummary.yaml
      description: A statement.
    description: Six months of statements, newest first.
  destination:
    oneOf:
      - $ref: ./PayoutDestination.yaml
      - type: "null"
    description: Where it is paid; `null` when no account is stated.
  holds:
    type: array
    items:
      $ref: ./PayoutHold.yaml
      description: A hold.
    description: What would hold a payout now.
  range:
    oneOf:
      - $ref: ./PayoutWorking.yaml
      - type: "null"
    description: The range asked for with `from` and `until`, in Mission Control; `null` otherwise.
