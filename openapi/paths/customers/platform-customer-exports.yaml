{
  "post": {
    "operationId": "requestPlatformCustomerExport",
    "summary": "Export a customer's data",
    "description": "Support asking for the customer's export on their behalf, as the customer would; offered to the customer's own session. `customer:export`; audited.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "customer_id",
        "in": "path",
        "required": true,
        "description": "The customer.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01"
      }
    ],
    "responses": {
      "202": {
        "description": "The export, preparing.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/CustomerExport.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `customer:export`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`export_in_progress`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
