type: object
description: "The Wallet's part of a payment: held when the order is placed, spent when the Location accepts (the promotional balance first), released otherwise."
required:
  - amount
  - held
  - spent
  - spent_promotional
  - spent_paid
  - released
  - refunded
properties:
  amount:
    $ref: ../common/Money.yaml
    description: What the Wallet pays of the order.
  held:
    $ref: ../common/Money.yaml
    description: What is held now.
  spent:
    $ref: ../common/Money.yaml
    description: What was spent at acceptance.
  spent_promotional:
    $ref: ../common/Money.yaml
    description: Of what was spent, from the promotional balance.
  spent_paid:
    $ref: ../common/Money.yaml
    description: Of what was spent, from the paid balance.
  released:
    $ref: ../common/Money.yaml
    description: What was released back to the Wallet without being spent.
  refunded:
    $ref: ../common/Money.yaml
    description: What refunds returned to the Wallet from what it spent.
examples:
  - amount:
      minor_units: 20000
      currency: INR
    held:
      minor_units: 20000
      currency: INR
    spent:
      minor_units: 0
      currency: INR
    spent_promotional:
      minor_units: 0
      currency: INR
    spent_paid:
      minor_units: 0
      currency: INR
    released:
      minor_units: 0
      currency: INR
    refunded:
      minor_units: 0
      currency: INR
