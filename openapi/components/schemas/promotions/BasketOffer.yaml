type: object
description: "An offer applied to a basket: what it is, what it takes off and from which lines, and the code it came through."
required:
  - offer_id
  - line
  - kind
  - saving
  - code
  - line_ids
  - chosen
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  line:
    type: string
    description: Its line.
    examples:
      - Buy 1, get 1 free
  kind:
    $ref: ./BasketOfferKind.yaml
    description: What it takes off.
  saving:
    $ref: ../common/Money.yaml
    description: What it takes off.
  code:
    type:
      - string
      - "null"
    description: The code it came through.
    examples:
      - null
  line_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The lines it takes off, for an item offer.
  chosen:
    type: boolean
    description: Whether the customer chose it over the best.
    examples:
      - false
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    line: Buy 1, get 1 free
    kind: item
    saving:
      minor_units: 42900
      currency: INR
    code: null
    line_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b11
    chosen: false
