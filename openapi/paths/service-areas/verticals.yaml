# Path item for /v1/service-areas/{service_area_id}/verticals. Referenced from openapi.yaml.
parameters:
  - name: service_area_id
    in: path
    required: true
    description: The area
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-00000000a014
get:
  operationId: listServiceAreaVerticals
  summary: The Verticals the area offers
  description: 'The Verticals the area offers: declared here or inherited, in its order.'
  tags:
    - Service areas
  security:
    - Bearer: []
  responses:
    '200':
      description: The offers
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/VerticalOfferList.yaml
    '400':
      description: Malformed identifier
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied`: a Mission Control token without `zone:read`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
put:
  operationId: putServiceAreaVerticals
  summary: Replaces the Verticals the area declares itself
  description: Replaces the Verticals the area declares itself; platform staff.
  tags:
    - Service areas
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The request body.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/reference/VerticalIds.yaml
  responses:
    '200':
      description: The offers after the change
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/reference/VerticalOfferList.yaml
    '400':
      description: Malformed body, or an unknown or archived Vertical
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid token
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: 'Not platform staff, or `access_denied` without `zone:write`'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown area
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
