type: object
description: A session, as the sign-in operations of the Customer app and the Storefront return it, the `CustomerSession` schema. With cookie delivery the refresh token is set in the `zg_refresh_customer` cookie instead and `refresh_token` is `null`.
required:
  - access_token
  - token_type
  - expires_in
  - audience
  - customer
  - existing_account
properties:
  access_token:
    type: string
    description: 'The access token: a JWT typed `at+jwt`, audience `customer`, for `Authorization: Bearer`.'
  token_type:
    type: string
    description: Always `Bearer`.
    examples:
      - Bearer
  expires_in:
    type: integer
    description: Seconds until the access token expires (900).
    minimum: 0
    examples:
      - 900
  audience:
    $ref: ./Audience.yaml
    description: Always `customer`.
  customer:
    $ref: ../customers/CustomerProfile.yaml
    description: The customer's profile.
  existing_account:
    type: boolean
    description: '`true` when the number already had an account: always after a verification, and after a registration that met an account another device opened meanwhile (its draft was dropped).'
  refresh_token:
    type:
      - string
      - 'null'
    description: The refresh token when the delivery is `body`; `null` with cookie delivery.
examples:
  - access_token: eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJFZERTQSJ9.e30.c2lnbmF0dXJl
    token_type: Bearer
    expires_in: 900
    refresh_token: null
    audience: customer
    customer:
      user_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
      mobile: '+919876543210'
      given_name: Asha
      family_name: Reddy
      email: asha@example.com
      email_verified: false
      date_of_birth: null
      language: en
      marketing:
        email: false
        push: false
        sms: false
        whatsapp: false
        agreed_at: null
      terms_accepted_at: null
      registered_entry: delivery
      needs:
        - address
      created_at: 2026-10-15T09:00:00Z
      updated_at: 2026-10-15T09:00:00Z
      version: 1
    existing_account: false
