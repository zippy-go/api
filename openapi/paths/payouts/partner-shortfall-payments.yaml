# Path item for /v1/partners/{partner_id}/locations/{location_id}/shortfalls/{shortfall_id}/payments. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: shortfall_id
    in: path
    required: true
    description: The shortfall.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4e7201
post:
  operationId: payShortfall
  summary: Pay a shortfall
  description: Starts paying a shortfall by UPI on the provider's page (since 0.41.0); it is settled, and the carry cleared, on the provider's word. Once per `Idempotency-Key`. The Partner's owners (`plan:write`).
  tags:
    - Payouts
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: true
    description: How it is paid.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/payouts/ShortfallPaymentInput.yaml
  responses:
    "201":
      description: The payment started.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/ShortfallPaymentStarted.yaml
    "400":
      description: "`validation_failed`; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `plan:write`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such shortfall of the Location."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`shortfall_settled`: it is paid already."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
