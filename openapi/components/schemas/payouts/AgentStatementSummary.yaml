type: object
description: An Agent's statement as lists show it.
required:
  - id
  - reference
  - agent_id
  - agent_name
  - partner_id
  - week
  - starts_on
  - ends_on
  - state
  - standing
  - holds
  - total
  - payable
  - pays_on
  - paid_on
  - transfer_reference
  - unanswered_questions
  - locked_at
properties:
  id:
    type: string
    format: uuid
    description: The statement.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5201
  reference:
    type: string
    description: Its reference.
    examples:
      - AG-2026W43
  agent_id:
    type: string
    format: uuid
    description: The Agent membership.
    examples:
      - 01a13a48-9e00-7000-8000-000000000107
  agent_name:
    type: string
    description: The Agent's name.
    examples:
      - Ravi Kumar
  partner_id:
    type: string
    format: uuid
    description: The platform fleet.
    examples:
      - 01a13a48-9e00-7000-8000-000000000002
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The week.
    examples:
      - 2026W43
  starts_on:
    type: string
    format: date
    description: Its Monday.
    examples:
      - 2026-10-19
  ends_on:
    type: string
    format: date
    description: Its Sunday.
    examples:
      - 2026-10-25
  state:
    $ref: ./StatementState.yaml
    description: Where it stands.
  standing:
    $ref: ./StatementStanding.yaml
    description: Where the money stands.
  holds:
    type: array
    items:
      $ref: ./PayoutHold.yaml
      description: A hold.
    description: What holds it.
  total:
    $ref: ../common/Money.yaml
    description: The week's total.
  payable:
    $ref: ../common/Money.yaml
    description: What is paid.
  pays_on:
    type: string
    format: date
    description: Its payday.
    examples:
      - 2026-10-30
  paid_on:
    type:
      - string
      - "null"
    format: date
    description: The day it was paid.
    examples:
      - null
  transfer_reference:
    type:
      - string
      - "null"
    description: The transfer's reference.
    examples:
      - null
  unanswered_questions:
    type: integer
    description: Questions not answered yet.
    examples:
      - 0
  locked_at:
    type: string
    format: date-time
    description: When it was locked.
    examples:
      - 2026-10-27T00:15:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5201
    reference: AG-2026W43
    agent_id: 01a13a48-9e00-7000-8000-000000000107
    agent_name: Ravi Kumar
    partner_id: 01a13a48-9e00-7000-8000-000000000002
    week: 2026W43
    starts_on: 2026-10-19
    ends_on: 2026-10-25
    state: due
    standing:
      code: due
      sentence: Due on Friday 30 October
    holds: []
    total:
      minor_units: 269000
      currency: INR
    payable:
      minor_units: 269000
      currency: INR
    pays_on: 2026-10-30
    paid_on: null
    transfer_reference: null
    unanswered_questions: 0
    locked_at: 2026-10-27T00:15:00Z
