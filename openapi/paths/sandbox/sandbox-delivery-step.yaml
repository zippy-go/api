# Path item for /v1/sandbox/deliveries/{delivery_id}/step. Referenced from openapi.yaml.
parameters:
  - name: delivery_id
    in: path
    required: true
    description: A delivery of the sandbox's.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b5d01
post:
  operationId: stepSandboxDelivery
  summary: Step a sandbox delivery
  description: "Moves a delivery of the sandbox to `to`, or to its next state, at once, as its Agent would: assigned to the sandbox's Agent, collected at the store, delivered with a stock proof. The states between are passed in order, each announced, and a webhook follows each. A sandbox key only."
  tags:
    - Sandbox
  security:
    - ApiKey: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
  requestBody:
    required: false
    description: Where to step it.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/sandbox/SandboxStepInput.yaml
  responses:
    "200":
      description: The delivery, stepped.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/sandbox/SandboxDelivery.yaml
    "400":
      description: "`validation_failed`: `to` is not a step; `malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No sandbox key was sent, or it was refused (`unauthenticated`)."
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`sandbox_key_required`: a production key, or a token; the sandbox's operations take a sandbox key (`zg_test_`) only."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: no delivery of the key's sandbox."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`delivery_step_passed`: the delivery is at that state or past it, or it ended."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
