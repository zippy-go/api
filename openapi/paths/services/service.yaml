# Path item for /v1/partners/{partner_id}/services/{kind}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: kind
    in: path
    required: true
    description: The kind of service to create or replace.
    schema:
      $ref: ../../components/schemas/services/ServiceKind.yaml
    example: delivery
put:
  operationId: upsertService
  summary: Create or replace a service
  description: |
    Creates the partner's first service of this kind, switched on at every
    location, or changes its status, configuration and name when it exists,
    and returns it with `200` in both cases. Enabling a kind the plan lacks
    is refused with `403` (`not_in_plan`); enabling a kind that needs
    documents not yet approved lands in `awaiting_documents`. Owners and
    managers may put services; other members receive `403` (`forbidden`);
    platform staff acting for the partner give a `reason`. Publishes
    `tenancy.service.updated`.
  tags:
    - Services
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The status and, optionally, the configuration of the service.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/services/ServiceUpsert.yaml
  responses:
    '200':
      description: The service as stored, whether it was created or replaced.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/Service.yaml
    '400':
      description: The path or the body failed validation (`validation_failed`), for example a `kind` that is not one of the known kinds or a missing `status`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller is a member but neither owner nor manager (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The partner is archived (`partner_archived`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
get:
  operationId: getService
  summary: Get a service
  description: "One Service: by its id, or by a kind for the Partner's first Service of that kind. Members and platform staff; another Partner's Service is not found."
  tags:
    - Services
  security:
    - Bearer: []
  parameters:
    - name: kind
      in: path
      required: true
      description: A service's id, or a kind (`product_sales`, `field_service`, `delivery`) naming the partner's first service of that kind.
      schema:
        type: string
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  responses:
    '200':
      description: The Service.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/Service.yaml
    '400':
      description: Neither a Service id nor a kind.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updateService
  summary: Change a service
  description: 'Changes a Service, by id or by kind: its name, its configuration as a whole, where it is switched on, and enabling or disabling it. Disabling stops its trade at once and keeps the configuration; re-enabling restores it as it was, waiting for documents its kind needs. Owners and managers; platform staff with a reason.'
  tags:
    - Services
  security:
    - Bearer: []
  parameters:
    - name: kind
      in: path
      required: true
      description: A service's id, or a kind (`product_sales`, `field_service`, `delivery`) naming the partner's first service of that kind.
      schema:
        type: string
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  requestBody:
    required: true
    description: The request.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/services/ServiceUpdate.yaml
  responses:
    '200':
      description: The Service as changed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/Service.yaml
    '400':
      description: Malformed body, a configuration of the wrong shape, `awaiting_documents` sent, a Location not the Partner's, or platform staff without a reason.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: Neither owner nor manager, or `not_in_plan` on enabling.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner, or the resource named in the path, does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
