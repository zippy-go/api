type: object
description: >-
  The request body of `POST /v1/auth/otp/verify`: the challenge, the code that was delivered for it, and how the session's refresh token travels.
required:
  - challenge_id
  - code
  - audience
  - delivery
properties:
  challenge_id:
    type: string
    format: uuid
    description: The `challenge_id` from the response of `POST /v1/auth/otp/request`.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a23
  code:
    type: string
    pattern: ^[0-9]{6}$
    minLength: 6
    maxLength: 6
    description: The six-digit code, sent as a string so that leading zeros are kept.
    examples:
      - '123456'
  audience:
    $ref: ./Audience.yaml
    description: The surface the code was asked for, required (`validation_failed` with `audience_required` on `/audience`).
  delivery:
    $ref: ./Delivery.yaml
    description: How the session's refresh token travels, required (`delivery_required` on `/delivery`), `cookie` for browsers or `body` for apps; bound to the session for good.
examples:
  - challenge_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a23
    code: '123456'
    audience: partner
    delivery: cookie
