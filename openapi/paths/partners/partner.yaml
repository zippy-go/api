# Path item for /v1/partners/{partner_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: getPartner
  summary: Get a partner
  description: |
    Returns one partner. Members of the partner, in any role, and the
    platform realm may read it; for everyone else the partner is not
    visible and the response is `404` (`not_found`), the same as for a
    partner that does not exist.
  tags:
    - Partners
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfNoneMatchHeader.yaml
  responses:
    '200':
      description: The partner, with its version as the `ETag`.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/Partner.yaml
    '304':
      description: '`If-None-Match` named the current version; nothing is transferred.'
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `400` (`validation_failed`) for a `partner_id` that is not a UUID or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updatePartner
  summary: Update a partner
  description: |
    Changes the members of the partner that are present in the body and
    returns the partner. Changing the profile, the legal identity
    (`legal_name`, `registration_number`, `gstin`, `pan`,
    `registered_address`) and the `contacts` needs `partner:profile:write`
    (platform staff `partner:write`); `status`, `kind` and
    `gst_unregistered` may only be changed by the platform realm: `kind` and
    `gst_unregistered` with `partner:write` and a `reason`, activating a
    pending partner with `partner:approve`, any other status with
    `partner:write`. A caller without the permission for a member in the
    body receives `403` (`access_denied`, or `forbidden` for a member only
    the platform realm changes) and nothing is changed.

    `status` follows the lifecycle: activating a pending partner is refused
    with `409` (`activation_blocked`) naming every blocker (read them first
    with `GET /v1/partners/{partner_id}/activation`), suspending needs a
    `reason` kept on the partner with when and by whom, and archiving is
    refused while locations are open (`locations_open`). A status change
    publishes `tenancy.partner.status_changed`, any other change
    `tenancy.partner.updated`, and both append an audit entry with the
    `reason`. Send `If-Match` with the version you hold to be refused with
    `412` (`precondition_failed`) when someone else changed the partner
    first; every write raises the version by one.
  tags:
    - Partners
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: The members to change.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/partners/PartnerUpdate.yaml
  responses:
    '200':
      description: The partner after the change, with its new `ETag`.
      headers:
        ETag:
          $ref: ../../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/partners/Partner.yaml
    '400':
      description: The body failed validation (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks the permission for a member in the body (`access_denied`), or sent `status` from outside the platform realm (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: 'The change breaks the lifecycle: activation names its blockers (`activation_blocked`, with one error per blocker), a move the lifecycle does not allow (`illegal_transition`), archiving while locations are open (`locations_open`), or a change to an archived partner (`partner_archived`).'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '412':
      description: '`If-Match` no longer matches the partner''s version (`precondition_failed`); fetch it again and retry.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
