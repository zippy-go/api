type: object
description: "A shift a Partner published for one of its services: a start and an end on the Location's clock, a zone and how many Agents it needs, with the Agents who picked it or were given it. An Agent working a shift is offered work in its zone, and the bookings' slots come from the hours of the shifts Agents have, less their booked jobs."
required:
  - id
  - partner_id
  - service_id
  - zone_id
  - zone_name
  - starts_at
  - ends_at
  - needed
  - taken
  - state
  - agents
  - note
  - version
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    description: The shift.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c9101
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  service_id:
    type: string
    format: uuid
    description: The service it staffs.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
  zone_id:
    type: string
    format: uuid
    description: The zone its Agents work.
    examples:
      - 01a13a48-9e00-7000-8000-00000000a011
  zone_name:
    type: string
    description: The zone's name.
    examples:
      - Madhapur
  starts_at:
    type: string
    format: date-time
    description: When it starts.
    examples:
      - 2026-11-07T03:30:00Z
  ends_at:
    type: string
    format: date-time
    description: When it ends, after its start, at most 16 hours later.
    examples:
      - 2026-11-07T12:30:00Z
  needed:
    type: integer
    format: int32
    minimum: 1
    maximum: 50
    description: How many Agents it needs.
    examples:
      - 2
  taken:
    type: integer
    format: int32
    minimum: 0
    description: How many have it.
    examples:
      - 1
  state:
    $ref: ./ShiftState.yaml
    description: Where it stands.
  agents:
    type: array
    items:
      $ref: ./ShiftAgent.yaml
    description: Who has it, first come first.
  note:
    type:
      - string
      - "null"
    maxLength: 200
    description: What the Partner says about it.
    examples:
      - null
  version:
    type: integer
    format: int64
    description: Raised by every change.
    examples:
      - 2
  created_at:
    type: string
    format: date-time
    description: When it was published.
    examples:
      - 2026-11-05T10:00:00Z
  updated_at:
    type: string
    format: date-time
    description: When it last changed.
    examples:
      - 2026-11-06T09:12:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c9101
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    service_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    zone_id: 01a13a48-9e00-7000-8000-00000000a011
    zone_name: Madhapur
    starts_at: 2026-11-07T03:30:00Z
    ends_at: 2026-11-07T12:30:00Z
    needed: 2
    taken: 1
    state: open
    agents:
      - agent_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
        display_name: Meena
        how: picked
        at: 2026-11-06T09:12:00Z
    note: null
    version: 2
    created_at: 2026-11-05T10:00:00Z
    updated_at: 2026-11-06T09:12:00Z
