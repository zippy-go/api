type: object
description: Why a way to pay is not offered for this order, with a sentence checkout may show as it is.
required:
  - code
  - message
properties:
  code:
    type: string
    description: "The reason: `upi_over_limit`, `cod_over_limit`, `cod_withheld`, `cod_not_offered`, `cod_not_accepted`, `provider_unavailable`, `wallet_empty`, `wallet_off`, `nothing_left_to_pay`."
    examples:
      - cod_over_limit
  message:
    type: string
    description: A sentence a screen may show as it is.
    examples:
      - Cash orders are up to ₹2,000.00.
examples:
  - code: cod_over_limit
    message: Cash orders are up to ₹2,000.00.
