# Path item for /v1/platform/customers/{customer_id}/wallet/entries. Referenced from openapi.yaml.
get:
  tags:
    - Wallet
  security:
    - Bearer: []
  operationId: listCustomerWalletEntries
  summary: A customer's Wallet entries
  description: Every entry of a customer's Wallet, newest first, with support's notes and who made each credit or correction. `wallet:read`.
  parameters:
    - name: customer_id
      in: path
      required: true
      description: The customer.
      schema:
        type: string
        format: uuid
    - name: kind
      in: query
      required: false
      description: Only entries of this kind.
      schema:
        $ref: ../../components/schemas/wallet/WalletEntryKind.yaml
    - name: limit
      in: query
      required: false
      description: How many per page. 1 to 100, 25 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; a cursor from another query or another caller is refused with `cursor_invalid`.
      schema:
        type: string
  responses:
    "200":
      description: A page of entries.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/wallet/WalletEntryPage.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `wallet:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
