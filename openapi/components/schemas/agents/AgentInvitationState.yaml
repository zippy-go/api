type: object
description: An invitation in progress, as the Partner sees it.
required:
  - channel
  - sent_at
  - expires_at
  - expired
  - invited_by
properties:
  channel:
    $ref: ./AgentContactChannel.yaml
    description: How the person was told.
  sent_at:
    type: string
    format: date-time
    description: When it was last sent.
    examples:
      - 2026-10-16T09:00:00Z
  expires_at:
    type: string
    format: date-time
    description: When it lapses; the Partner may send it again.
    examples:
      - 2026-10-30T09:00:00Z
  expired:
    type: boolean
    description: Whether it has lapsed.
    examples:
      - false
  invited_by:
    type:
      - string
      - "null"
    format: uuid
    description: Who invited.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
examples:
  - channel: phone
    sent_at: 2026-10-16T09:00:00Z
    expires_at: 2026-10-30T09:00:00Z
    expired: false
    invited_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
