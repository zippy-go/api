type: object
description: A Service at one Location, the `ServiceAtLocation` schema.
required:
  - service_id
  - location_id
  - switched_on
  - everywhere
  - trading
properties:
  service_id:
    type: string
    format: uuid
    description: The Service.
  location_id:
    type: string
    format: uuid
    description: The Location.
  switched_on:
    type: boolean
    description: Whether the Service is switched on there.
  everywhere:
    type: boolean
    description: Whether it is on there because it is on everywhere.
  trading:
    type: boolean
    description: Whether it trades there now.
  settings:
    oneOf:
      - $ref: ./FieldServiceSettings.yaml
      - type: 'null'
    description: 'For a field Service: its bookable area, hours and slots there, defaults filled in.'
examples:
  - service_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a47
    location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
    switched_on: true
    everywhere: false
    settings:
      area:
        radius_km: 10
        polygon: null
        whole_zone: false
      hours:
        - day: monday
          open:
            - from: 09:00
              to: 22:00
      slot_minutes: 60
      buffer_minutes: 15
      min_notice_minutes: 120
      booking_window_days: 14
    trading: false
