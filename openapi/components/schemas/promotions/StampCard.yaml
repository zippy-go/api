type: object
description: "A customer's stamp card at a Location: a stamp for each order counted, how many of their orders count towards the next reward and which of their next orders it is."
required:
  - offer_id
  - line
  - every
  - counted
  - next_reward_in
  - reward_text
  - once
  - had
properties:
  offer_id:
    type: string
    format: uuid
    description: The stamp card.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  line:
    type: string
    description: Its line.
    examples:
      - Free delivery on every 5th order
  every:
    type: integer
    description: Orders to a reward.
    examples:
      - 5
  counted:
    type: integer
    description: Orders counted towards the next reward.
    examples:
      - 4
  next_reward_in:
    type: integer
    description: "Which of their next orders is rewarded: 1 for the very next."
    examples:
      - 1
  reward_text:
    type: string
    description: The reward in words.
    examples:
      - Your next order has free delivery
  once:
    type: boolean
    description: Whether it rewards the nth order alone.
    examples:
      - false
  had:
    type: boolean
    description: Whether a one-off card's reward was had.
    examples:
      - false
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    line: Free delivery on every 5th order
    every: 5
    counted: 4
    next_reward_in: 1
    reward_text: Your next order has free delivery
    once: false
    had: false
