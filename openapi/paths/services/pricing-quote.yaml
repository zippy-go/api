# Path item for /v1/partners/{partner_id}/services/{service_id}/pricing/quote. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: service_id
    in: path
    required: true
    description: The service, which must belong to the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
get:
  operationId: quoteDelivery
  summary: Quote a delivery
  description: "What a delivery costs at the Service's pricing: the flat fee, the per-kilometre charge beyond the base distance band by band, the waiting beyond the free minutes, rounded once, with the version that explains it. Members and platform staff."
  tags:
    - Services
  security:
    - Bearer: []
  parameters:
    - name: distance_metres
      in: query
      required: true
      description: The distance from pickup to drop-off, in metres.
      schema:
        type: integer
        minimum: 0
    - name: waiting_minutes
      in: query
      required: false
      description: The minutes of waiting to price; none when absent.
      schema:
        type: integer
        minimum: 0
    - name: version
      in: query
      required: false
      description: A pricing version to quote at; the latest when absent.
      schema:
        type: integer
        minimum: 1
  responses:
    '200':
      description: The quote.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/DeliveryQuote.yaml
    '400':
      description: A negative or missing distance.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown, not visible, or no pricing yet.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`service_required`: the Service is not a delivery Service.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
