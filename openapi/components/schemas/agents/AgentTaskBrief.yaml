type: object
description: "An Agent's current task in short, for live maps and lists: the delivery, the order number and the stop the Agent is heading to."
required:
  - task_id
  - delivery_id
  - order_number
  - kind
  - status
  - heading_to
properties:
  task_id:
    type: string
    format: uuid
    description: The task.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
  delivery_id:
    type: string
    format: uuid
    description: The delivery.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
  order_number:
    type: string
    description: The order's number.
    examples:
      - AB1234
  kind:
    $ref: ./TaskKind.yaml
    description: The stop's kind.
  status:
    $ref: ./TaskStatus.yaml
    description: Where the task stands.
  heading_to:
    $ref: ./TaskStop.yaml
    description: The stop.
examples:
  - task_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9c01
    delivery_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9d01
    order_number: AB1234
    kind: pickup
    status: on_the_way
    heading_to:
      name: Dev Kitchen Gachibowli
      address: Plot 12, DLF Cyber City, Gachibowli, 500032
      point:
        lat: 17.4401
        lng: 78.3489
      location_id: 01a13a48-9e00-7000-8000-000000000301
      geofence_metres: 100
