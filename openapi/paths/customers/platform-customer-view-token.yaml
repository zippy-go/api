{
  "post": {
    "operationId": "startPlatformCustomerView",
    "summary": "Start viewing the app as the customer",
    "description": "Once the customer agreed: a read-only token of the customer surface for 30 minutes at most, the view logged as started (`customers.view.started`). `customer:view_as`; audited.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "view_id",
        "in": "path",
        "required": true,
        "description": "The view.",
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9f11"
      }
    ],
    "responses": {
      "201": {
        "description": "The token.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/customers/CustomerViewToken.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: another member's request.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`view_not_agreed`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
