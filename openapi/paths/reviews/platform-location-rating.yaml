# Path item for /v1/platform/locations/{location_id}/rating. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: "The store (a Location)."
    schema:
      type: string
      format: uuid
    example: "01a13a48-9e00-7000-8000-000000000301"
get:
  operationId: getPlatformLocationRating
  summary: "Read a store's rating over a range"
  description: "A store's rating over a range of days on its clock, a year at most, with each day's thumbs; its reviews over the range are `GET /v1/platform/reviews` with `location_id`. The last 30 days by default. Mission Control tokens only, with `review:read`."
  tags:
    - Reviews
  security:
    - Bearer: []
  parameters:
    - name: from
      in: query
      required: false
      description: "The first day, on the store's clock."
      schema:
        type: string
        format: date
      example: "2026-09-23"
    - name: to
      in: query
      required: false
      description: "The last day, on the store's clock."
      schema:
        type: string
        format: date
      example: "2026-10-22"
  responses:
    "200":
      description: "The store's rating over the range."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/LocationRatingReport.yaml
    "400":
      description: "`validation_failed`: a range that ends before it starts, or one over a year (`range_too_long`), saying to ask for a shorter range."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` (the member lacks the permission) or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such store."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
