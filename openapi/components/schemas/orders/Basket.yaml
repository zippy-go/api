type: object
description: "A basket at one store, kept on the server and priced by the platform on every read as it will be charged. One per customer per store; a visitor's waits under its visitor token and becomes the customer's at sign-in. `quote` names exactly this price: send it back to place the order."
required:
  - location_id
  - partner_id
  - store
  - owner
  - version
  - lines
  - item_count
  - choices
  - pricing
  - refusals
  - placeable
  - quote
  - menu_version
  - updated_at
properties:
  location_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
    description: The store.
  partner_id:
    type: string
    format: uuid
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
    description: Its Partner.
  store:
    $ref: ./BasketStore.yaml
    description: The store's name and what it is doing now.
  owner:
    $ref: ./BasketOwner.yaml
    description: A customer's or a visitor's.
  version:
    type: integer
    examples:
      - 3
    description: Raised by one on every change, so a client keeps the newest answer whatever order answers arrive in; 0 for a basket with nothing in it yet.
  lines:
    type: array
    items:
      $ref: ./BasketLine.yaml
    description: The lines, in the order they were added.
  item_count:
    type: integer
    examples:
      - 2
    description: How many items, quantities counted.
  choices:
    $ref: ./BasketChoices.yaml
    description: Checkout's answers as saved.
  pricing:
    $ref: ./BasketPricing.yaml
    description: What it will be charged.
  refusals:
    type: array
    items:
      $ref: ./BasketRefusal.yaml
    description: What stops it being placed now; empty when nothing does.
  placeable:
    type: boolean
    examples:
      - true
    description: "Whether it can be placed now: a customer's basket with lines and no refusal."
  quote:
    type: string
    examples:
      - q1-5f0c9d2e7b1a4c3d
    description: A digest of the price shown; placing with another is refused with `price_changed`.
  menu_version:
    type:
      - integer
      - "null"
    examples:
      - 42
    description: The version of the published menu it was priced from.
  updated_at:
    type:
      - string
      - "null"
    format: date-time
    examples:
      - 2026-10-16T12:58:00Z
    description: When it last changed; `null` for an empty basket never changed.
  offers:
    type: array
    items:
      $ref: ../promotions/BasketOffer.yaml
    description: "The offers applied, from the engine: at most one item offer on each unit and one basket offer, money off, a free item or free delivery."
  alternatives:
    type: array
    items:
      $ref: ../promotions/BasketAlternative.yaml
    description: The other basket offers the customer could have instead, with what each would save; choose one with `basket_offer_id`.
  reasons:
    type: array
    items:
      $ref: ../promotions/OfferReason.yaml
    description: Why each advertised or held offer that does not apply does not, in the engine's words.
  nudges:
    type: array
    items:
      $ref: ../promotions/OfferNudge.yaml
    description: 'Minimum spends not met by offers that would beat the one applied: "Spend ₹201.00 more for ₹50 off".'
  free_item:
    oneOf:
      - $ref: ../promotions/BasketFreeItem.yaml
      - type: "null"
    description: The free item a basket offer gives, as a line of its own; `null` when none does.
