type: object
description: "A Location's statement for one week, Monday to Sunday on its clock, written when the week is locked and never changed after: how it was worked out order by order, the GST invoice for the platform's fee, the refunds, adjustments and carry, where the money stands and what holds it, the questions asked about it, its history and its documents. Reference `ZG-{ISO week-based year}W{week}`."
required:
  - id
  - reference
  - payee_kind
  - partner_id
  - partner_name
  - location_id
  - location_name
  - week
  - starts_on
  - ends_on
  - time_zone
  - currency
  - state
  - standing
  - holds
  - locked_at
  - locked_by
  - pays_on
  - paid_on
  - transfer_reference
  - figures
  - fee_explained
  - no_fee_sentence
  - invoice
  - credit_notes
  - rows
  - refunds
  - adjustments
  - days
  - questions
  - unanswered_questions
  - history
  - documents
  - version
properties:
  id:
    type: string
    format: uuid
    description: The statement.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c5101
  reference:
    type: string
    description: Its reference, which the transfer quotes.
    examples:
      - ZG-2026W43
  payee_kind:
    $ref: ./PayeeKind.yaml
    description: Always `location` here.
  partner_id:
    type: string
    format: uuid
    description: The Location's Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  partner_name:
    type: string
    description: The Partner's name.
    examples:
      - ZippyGo Dev Partner
  location_id:
    type: string
    format: uuid
    description: The Location.
    examples:
      - 01a13a48-9e00-7000-8000-000000000301
  location_name:
    type: string
    description: The Location's name.
    examples:
      - Dev Kitchen Gachibowli
  week:
    type: string
    pattern: ^[0-9]{4}W[0-9]{2}$
    description: The ISO week, `YYYYWww`.
    examples:
      - 2026W43
  starts_on:
    type: string
    format: date
    description: Its Monday.
    examples:
      - 2026-10-19
  ends_on:
    type: string
    format: date
    description: Its Sunday.
    examples:
      - 2026-10-25
  time_zone:
    type: string
    description: The Location's clock.
    examples:
      - Asia/Kolkata
  currency:
    type: string
    description: The currency.
    examples:
      - INR
  state:
    $ref: ./StatementState.yaml
    description: Where it stands.
  standing:
    $ref: ./StatementStanding.yaml
    description: Where the money stands, in a sentence.
  holds:
    type: array
    items:
      $ref: ./PayoutHold.yaml
      description: A hold.
    description: What holds it while it is due or unpaid, waiting to be sent again; empty when nothing does.
  locked_at:
    type: string
    format: date-time
    description: When the week was locked.
    examples:
      - 2026-10-27T00:15:00Z
  locked_by:
    $ref: ./StatementActor.yaml
    description: "Who locked it: the clock on the Tuesday after, or platform staff once the week was over."
  pays_on:
    type: string
    format: date
    description: "Its payday: the Friday after the lock, at 10:00 on the Location's clock."
    examples:
      - 2026-10-30
  paid_on:
    type:
      - string
      - "null"
    format: date
    description: The day it was paid.
    examples:
      - null
  transfer_reference:
    type:
      - string
      - "null"
    description: The transfer's reference, once paid.
    examples:
      - null
  figures:
    $ref: ./StatementFigures.yaml
    description: How it was worked out.
  fee_explained:
    type: string
    description: What the fee is for, in plain words.
    examples:
      - The platform's fee is 12% of what you sold through ZippyGo, for the orders, the payments and the customers it brings; GST is charged on the fee.
  no_fee_sentence:
    type:
      - string
      - "null"
    description: '"The platform charged no fee this week." when the week had no fee and so no invoice; `null` otherwise.'
    examples:
      - null
  invoice:
    oneOf:
      - $ref: ./StatementInvoice.yaml
      - type: "null"
    description: The GST invoice for the platform's fee; `null` for a week with no fee.
  credit_notes:
    type: array
    items:
      $ref: ./StatementCreditNote.yaml
      description: A credit note.
    description: Credit notes settled in this week.
  rows:
    type: array
    items:
      $ref: ./StatementOrderRow.yaml
      description: An order's part.
    description: Every order that ended in the week, oldest first.
  refunds:
    type: array
    items:
      $ref: ./StatementRefund.yaml
      description: A refund.
    description: Refunds charged to the Partner in the week, of orders of earlier weeks too.
  adjustments:
    type: array
    items:
      $ref: ./PayoutAdjustment.yaml
      description: An adjustment.
    description: Adjustments settled into the week.
  days:
    type: array
    items:
      $ref: ./StatementDay.yaml
      description: A day.
    description: Day by day, Monday first.
  questions:
    type: array
    items:
      $ref: ./PayoutQuestion.yaml
      description: A question.
    description: Questions asked about the week, oldest first.
  unanswered_questions:
    type: integer
    description: How many of them are unanswered.
    examples:
      - 0
  history:
    type: array
    items:
      $ref: ./StatementMove.yaml
      description: A move.
    description: Every move, oldest first.
  documents:
    type: array
    items:
      $ref: ./StatementDocument.yaml
      description: A document.
    description: "Its documents: the statement, the invoice when there is one, and the order list."
  version:
    type: integer
    description: The version, raised on every move.
    examples:
      - 1
  promotions:
    type: array
    items:
      $ref: ../promotions/StatementPromotion.yaml
    description: '"Promotions you paid for": each promotion that ran in the week with its orders, what it took off for customers and what the Partner and the platform paid.'
  rewards:
    type: array
    items:
      $ref: ./StatementRewardRow.yaml
      description: A campaign.
    description: "\"Rewards you paid for\": each reward campaign the Partner paid towards in the week, with its grants on the Location's orders and the Partner's share; they add up to `figures.rewards`, which the total takes off."
