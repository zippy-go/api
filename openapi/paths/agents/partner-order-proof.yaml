# Path item for /v1/partners/{partner_id}/orders/{order_id}/proof-of-delivery. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: order_id
    in: path
    required: true
    description: The order the delivery fulfils.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
get:
  operationId: getPartnerOrderProof
  summary: Read an order's proof of delivery
  description: The proof kept on the drop of an order the Partner's store sold or its Agents carried, with ten-minute links to its files, every reading recorded. Members need `order:read` at the store, or `agent:read` for the service that carried it; Mission Control reads it at `/v1/platform/orders/{order_id}/proof-of-delivery`.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The proof.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/ProofOfDelivery.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no drop for the order that the Partner sold or carried."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
