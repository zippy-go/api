# Path item for /v1/auth/service-tokens. Referenced from openapi.yaml.
post:
  operationId: mintServiceToken
  summary: Mint a service token for a background job
  description: |-
    Mints a service token for a background job (workers, the simulator, CI) from its bootstrap credential: audience `service`, the credential's one job, at most an hour. A service token holds no memberships and is refused by every human surface; only the routes a job may call accept it.

    The credential is a secret of the job's deployment; the platform keeps only its digest. Mint attempts are rate limited per caller.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    description: The job's credential.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/ServiceTokenRequest.yaml
  responses:
    '200':
      description: The token.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/ServiceToken.yaml
    '400':
      description: Malformed body.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: '`authentication_failed`: an unknown or revoked credential.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '429':
      description: '`too_many_requests`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
