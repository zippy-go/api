type: object
description: "An offer in a list: what a card in the consoles shows."
required:
  - id
  - owner
  - partner_id
  - partner_name
  - kind
  - purpose
  - name
  - line
  - small_print
  - mechanic
  - state
  - state_text
  - pause
  - aim_text
  - location_ids
  - when
  - partner_share_percent
  - share_text
  - archived_at
  - uses
  - actions
  - updated_at
properties:
  id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  owner:
    $ref: ./OfferOwner.yaml
    description: Whose it is.
  partner_id:
    type:
      - string
      - "null"
    format: uuid
    description: The owning Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  partner_name:
    type:
      - string
      - "null"
    description: The owning Partner's name.
    examples:
      - ZippyGo Dev Partner
  kind:
    $ref: ./OfferKind.yaml
    description: What it was made as.
  purpose:
    oneOf:
      - $ref: ./OfferPurpose.yaml
      - type: "null"
    description: A campaign's purpose.
  name:
    type: string
    description: The owner's name.
    examples:
      - Biryani BOGO
  line:
    type: string
    description: The line a customer reads.
    examples:
      - Buy 1, get 1 free
  small_print:
    type: string
    description: Its small print.
    examples:
      - On Hyderabadi Biryani · for everyone
  mechanic:
    $ref: ./OfferMechanic.yaml
    description: Its mechanic.
  state:
    $ref: ./OfferState.yaml
    description: Its state.
  state_text:
    type: string
    description: Its state in a sentence.
    examples:
      - Live, ongoing
  pause:
    oneOf:
      - $ref: ./OfferPause.yaml
      - type: "null"
    description: Its pause.
  aim_text:
    type: string
    description: Where it runs, in words.
    examples:
      - Dev Kitchen Gachibowli
  location_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Locations it names, for an offer on named Locations.
  when:
    $ref: ./OfferWhen.yaml
    description: When it runs.
  partner_share_percent:
    type: integer
    description: The Partners' share.
    examples:
      - 100
  share_text:
    type: string
    description: Who pays, in words.
    examples:
      - You pay for it
  archived_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was archived.
    examples:
      - null
  uses:
    $ref: ./OfferUses.yaml
    description: Its uses.
  actions:
    type: array
    items:
      $ref: ./OfferAction.yaml
    description: What the caller may do now.
  updated_at:
    type: string
    format: date-time
    description: When it last changed.
    examples:
      - 2026-11-02T06:30:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    owner: partner
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    partner_name: ZippyGo Dev Partner
    kind: partner_offer
    purpose: null
    name: Biryani BOGO
    line: Buy 1, get 1 free
    small_print: On Hyderabadi Biryani · for everyone
    mechanic: multibuy
    state: live
    state_text: Live, ongoing
    pause: null
    aim_text: Dev Kitchen Gachibowli
    location_ids:
      - 01a13a48-9e00-7000-8000-000000000301
    when:
      starts_at: 2026-11-02T00:00
      ends_at: null
      windows: []
      time_zone: Asia/Kolkata
    partner_share_percent: 100
    share_text: You pay for it
    archived_at: null
    uses:
      reserved: 1
      confirmed: 11
    actions:
      - edit
      - pause
      - stop
    updated_at: 2026-11-02T06:30:00Z
