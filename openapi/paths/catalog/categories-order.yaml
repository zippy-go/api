# Path item for /v1/partners/{partner_id}/locations/{location_id}/catalog/categories/order. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The store, which must be a Location of the partner in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
put:
  operationId: reorderCatalogCategories
  summary: Reorder the categories
  description: Puts the store's categories in a new order. The list names every live category once; sub-categories keep their parent and follow it in the order given. `catalog:write`.
  tags:
    - Catalog
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Every live category, in order.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/catalog/CatalogCategoryOrder.yaml
  responses:
    "200":
      description: The categories in their new order.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/catalog/CatalogCategoryList.yaml
    "400":
      description: The list misses, repeats or names an unknown category (`validation_failed` with `order_incomplete`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: The caller lacks `catalog:write` at this Location (`access_denied`), or the partner is not entitled to it (`not_enabled_for_partner`). Platform staff read catalogues and change none in this version (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The partner is not visible to the caller, or the store or the record does not exist or belongs to another partner (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_required`: the Location is a branch, with no product-sales Service switched on, so it has no catalogue."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
