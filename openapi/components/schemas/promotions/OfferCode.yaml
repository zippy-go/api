type: object
description: A code that unlocks an offer, counted on its own with its own cap. Letters and digits, matched in any case with spaces and punctuation ignored, unique across the platform while its offer is scheduled, live or paused.
required:
  - id
  - offer_id
  - code
  - kind
  - cap
  - uses
  - holders
  - batch_id
  - customer_id
  - retired_at
  - created_at
properties:
  id:
    type: string
    format: uuid
    description: The code.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6101
  offer_id:
    type: string
    format: uuid
    description: The offer it unlocks.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
  code:
    type: string
    description: The code, upper case.
    examples:
      - FEAST150
  kind:
    $ref: ./OfferCodeKind.yaml
    description: Its kind.
  cap:
    type:
      - integer
      - "null"
    description: Uses this code allows; `null` for the offer's own limits.
    examples:
      - null
  uses:
    type: integer
    description: Uses reserved and confirmed through it.
    examples:
      - 1
    minimum: 0
  holders:
    type: integer
    description: Customers who hold it in their offers.
    examples:
      - 1
    minimum: 0
  batch_id:
    type:
      - string
      - "null"
    format: uuid
    description: The batch it was made in.
    examples:
      - null
  customer_id:
    type:
      - string
      - "null"
    format: uuid
    description: The customer a personal or referral code belongs to.
    examples:
      - null
  retired_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was retired; customers who hold it keep the offer.
    examples:
      - null
  created_at:
    type: string
    format: date-time
    description: When it was made.
    examples:
      - 2026-11-02T06:31:00Z
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6101
    offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6001
    code: FEAST150
    kind: open
    cap: null
    uses: 1
    holders: 1
    batch_id: null
    customer_id: null
    retired_at: null
    created_at: 2026-11-02T06:31:00Z
