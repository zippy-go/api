{
  "get": {
    "operationId": "listCustomerFavourites",
    "summary": "List my favourite stores",
    "description": "The customer's favourite stores, the most recently kept first, each with the card a Vertical's listing draws, across every city and Vertical; a store closed for good is left out.",
    "tags": [
      "Customers"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "lat",
        "in": "query",
        "required": false,
        "description": "Latitude of the pin, for each card's distance.",
        "schema": {
          "type": "number"
        }
      },
      {
        "name": "lng",
        "in": "query",
        "required": false,
        "description": "Longitude of the pin.",
        "schema": {
          "type": "number"
        }
      }
    ],
    "responses": {
      "200": {
        "description": "The favourites.",
        "content": {
          "application/json": {
