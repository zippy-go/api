# Path item for /v1/partners/{partner_id}/memberships. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listMemberships
  summary: List members
  description: |
    Returns the partner's members with their role labels, oldest first;
    reading them needs `staff:read`. The list is not paginated. The grants
    behind each label, per scope, are under
    `GET /v1/partners/{partner_id}/members`. Members join through invitations
    (`POST /v1/partners/{partner_id}/invitations`); the user who created
    the partner is its first owner.
  tags:
    - Memberships
  security:
    - Bearer: []
  responses:
    '200':
      description: The partner's memberships.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/memberships/MembershipList.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `staff:read` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
