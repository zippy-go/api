# Path item for /v1/platform/agents/{agent_id}. Referenced from openapi.yaml.
parameters:
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: getAnyAgent
  summary: Read any Agent
  description: One Agent of any Partner with every change of status. Needs platform `agent:read`.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The Agent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden` (not a Mission Control token) or `access_denied` naming the platform permission."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such Agent."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
