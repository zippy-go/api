type: object
description: A document the membership needs, with where it stands.
required:
  - kind
  - required
  - reason
  - status
  - document_id
  - expires_on
  - satisfied
properties:
  kind:
    $ref: ./AgentDocumentKind.yaml
    description: The document.
  required:
    type: boolean
    description: Whether the membership needs it to become active.
    examples:
      - true
  reason:
    type: string
    description: Why it is needed, in words.
    examples:
      - Two-wheelers and vans need a driving licence.
  status:
    oneOf:
      - $ref: ./AgentDocumentStatus.yaml
      - type: "null"
    description: Where the latest document of this kind stands; `null` when none is filed.
  document_id:
    type:
      - string
      - "null"
    format: uuid
    description: The latest document of this kind.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
  expires_on:
    type:
      - string
      - "null"
    format: date
    description: When it expires, for a licence and a registration.
    examples:
      - 2030-04-30
  satisfied:
    type: boolean
    description: Whether it is approved and not expired.
    examples:
      - true
examples:
  - kind: driving_licence
    required: true
    reason: Two-wheelers and vans need a driving licence.
    status: approved
    document_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9e01
    expires_on: 2030-04-30
    satisfied: true
