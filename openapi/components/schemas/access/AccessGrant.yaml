type: object
description: "A role held by a member at one scope: the whole partner, one Location or one Service of it, or the platform. A member may hold several grants; each lists the permissions held at its scope, never merged with another's."
required:
  - id
  - role_id
  - role_name
  - role_kind
  - scope
  - permissions
  - granted_at
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the grant.
  role_id:
    type: string
    format: uuid
    description: The role granted.
  role_name:
    type: string
    description: The role's name.
    examples:
      - STAFF
  role_kind:
    $ref: ./RoleKind.yaml
    description: Whether the role is maintained by the platform, a default every partner receives, or the realm's own.
  scope:
    $ref: ./AccessScope.yaml
    description: Where the role applies.
  permissions:
    type: array
    items:
      type: string
    description: "The permissions held at that scope, sorted: the role's, within the partner's entitlements."
    examples:
      - - location:read
        - partner:access
  granted_at:
    type: string
    format: date-time
    description: When it was granted, as an RFC 3339 timestamp in UTC.
  granted_by:
    type:
      - string
      - 'null'
    format: uuid
    description: Who granted it; `null` when the platform did, at onboarding or provisioning.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a71
    role_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
    role_name: STAFF
    role_kind: default
    scope:
      kind: location
      partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
      location_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
      service_id: null
    permissions:
      - catalog:read
      - catalog:stock
      - dispatch:read
      - location:read
      - order:manage
      - order:read
      - partner:access
      - promotion:read
    granted_at: 2026-10-15T09:00:00Z
    granted_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
