{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    }
  ],
  "get": {
    "operationId": "listApiKeys",
    "summary": "List the Partner's API keys",
    "description": "The Partner's keys in both environments, the newest first, with their name, prefix, scopes, creator, creation and last use, and the keys unused for 180 days flagged. Members need `developer:read` to read and `developer:manage` to change; owners and the Developer role hold both. A key cannot manage keys.",
    "tags": [
      "Developer"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "name": "environment",
        "in": "query",
        "required": false,
        "description": "Only this environment's.",
        "schema": {
          "$ref": "../../components/schemas/developer/ApiKeyEnvironment.yaml"
        }
      }
    ],
    "responses": {
      "200": {
        "description": "The keys.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/ApiKeyList.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `developer:read`; `forbidden` for an API key.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  },
  "post": {
    "operationId": "createApiKey",
    "summary": "Create an API key",
    "description": "A key for the Partner in one environment with its scopes, shown in full this once and kept hashed. A production key needs an active Partner; a sandbox key works at once and makes the Partner's sandbox at the first. At most 20 active keys per environment. Audited, announced as `developer.key.created` and told to the Partner's owners. Members need `developer:read` to read and `developer:manage` to change; owners and the Developer role hold both. A key cannot manage keys.",
    "tags": [
      "Developer"
    ],
    "security": [
      {
        "Bearer": []
      }
    ],
    "parameters": [
      {
        "$ref": "../../components/parameters/IdempotencyKeyHeader.yaml"
      }
    ],
    "requestBody": {
      "required": true,
      "description": "The key.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/developer/ApiKeyInput.yaml"
          }
        }
      }
    },
    "responses": {
      "201": {
        "description": "The key and its secret.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/ApiKeyCreated.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: a name or scope out of bounds.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied` without `developer:manage`; `forbidden` for an API key.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`api_key_limit` at 20 active keys in the environment; `production_key_needs_active_partner` while the Partner is not active.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
