# Path item for /v1/partners/{partner_id}/reward-campaigns/{campaign_id}/results. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: campaign_id
    in: path
    required: true
    description: The reward campaign.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000006002
get:
  operationId: getPartnerRewardCampaignResults
  summary: Read a reward campaign's results
  description: "The campaign against its control group: customers, completed orders, sales, retention at 30 days and reward cost, treated and held out, worked out when asked for. `engagement:read`."
  tags:
    - Rewards
  security:
    - Bearer: []
  responses:
    "200":
      description: Its results.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/engagement/RewardCampaignResults.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `engagement:read` at the Partner or the Location, or `not_enabled_for_partner`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such campaign of the Partner."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
