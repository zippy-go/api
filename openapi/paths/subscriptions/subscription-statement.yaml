# Path item for /v1/customer/subscriptions/{subscription_id}/statements/{month}. Referenced from openapi.yaml.
parameters:
  - name: subscription_id
    in: path
    required: true
    description: The subscription, the customer's own.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
  - name: month
    in: path
    required: true
    description: The month, YYYY-MM; the month in progress reads so far.
    schema:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    example: 2026-11
get:
  operationId: getSubscriptionStatement
  summary: Read a month's statement
  description: "The subscription's statement for a month: each day delivered with its amount, the skipped and failed days, the Wallet's top-ups and credits back, and the opening and closing balance. Issued on the 1st of the next month at 08:00 on the store's clock and told to the customer."
  tags:
    - Subscriptions
  security:
    - Bearer: []
  responses:
    "200":
      description: The statement.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/SubscriptionStatement.yaml
    "400":
      description: "`validation_failed`: a malformed identifier or month."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription, or a month it had no day in."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
