type: object
description: "A tab as the floor reads it: the members' tab with its history."
required:
  - tab
  - history
  - flagged
  - service_charge_removed
  - party_name
  - reservation_id
properties:
  tab:
    $ref: ./Tab.yaml
    description: The tab.
  history:
    type: array
    items:
      $ref: ./TabHistoryEntry.yaml
    description: Every act on it, the latest last.
  flagged:
    type: boolean
    description: "Whether the Location's closing time passed with it open: staff settle it."
    examples:
      - false
  service_charge_removed:
    type: boolean
    description: Whether the diners removed the service charge.
    examples:
      - false
  party_name:
    type:
      - string
      - "null"
    maxLength: 120
    description: "The party's name: staff's when they opened the tab, or the reservation's once its party was seated at the table, which the tab keeps."
    examples:
      - Sharma
  reservation_id:
    type:
      - string
      - "null"
    format: uuid
    description: "The reservation it is bound to: its party was seated at the table while the tab was open, or within the hour before it opened (`reservations.reservation.seated`)."
    examples:
      - null
