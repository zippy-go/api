# Path item for /v1/customer/orders/{order_id}/review/not-now. Referenced from openapi.yaml.
parameters:
  - name: order_id
    in: path
    required: true
    description: "The order."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01"
post:
  operationId: declineOrderReviewAsk
  summary: "Say \"Not now\" to the ask"
  description: "Records that the customer said \"Not now\" to \"How was your order?\": the platform does not ask again, and the customer may still review the order from its page. Saying it twice changes nothing."
  tags:
    - Reviews
  security:
    - Bearer: []
  responses:
    "200":
      description: "The order's rating state."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/OrderReviewState.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such order of the customer's."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
