# Path item for /v1/auth/password/reset-request. Referenced from openapi.yaml.
post:
  operationId: requestPasswordReset
  summary: Ask for a password link
  description: |-
    Asks for a password link. The answer is always 202, whether or not the address signs in at this console: when it does, a link is emailed that works once, for thirty minutes, and only at this console, and earlier links stop working. Five asks in fifteen minutes per address and per caller are allowed; beyond that nothing is sent and the answer is the same.

    The link opens `/reset-password/{token}` on the console that asked, whose page sends the token to `POST /v1/auth/password/reset`.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    description: The account's email address and the console asking.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/PasswordResetLinkRequest.yaml
  responses:
    '202':
      description: Accepted.
    '400':
      description: Malformed email, or `audience_not_allowed` on `/audience` (the Agent app has no password link).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
