# Path item for /v1/partners/{partner_id}/locations. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
post:
  operationId: createLocation
  summary: Create a location
  description: |
    Adds a location to the partner. It needs `location:write` across the
    whole partner; other members receive `403` (`access_denied`), and a
    partner whose entitlements lack it `403` (`not_enabled_for_partner`). The location
    starts `active`. Publishes `tenancy.location.created`.
  tags:
    - Locations
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The name, address and coordinates of the location, with the optional time zone and phone number.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/locations/LocationCreate.yaml
  responses:
    '201':
      description: The location was created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/Location.yaml
    '400':
      description: The body failed validation (`validation_failed`), for example a coordinate out of range, a `country` that is not two upper-case letters or an unknown `time_zone`.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `location:write` across the partner (`access_denied`), or the partner is not entitled to it (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: The pin lands in a zone that does not serve (`zone_not_serving`), a vertical is not offered there (`vertical_not_offered`), or the partner is archived (`partner_archived`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '422':
      description: The pin is outside every service area and too far from any to be placed (`unprocessable`, pointers `/lat` and `/lng`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
get:
  operationId: listLocations
  summary: List locations
  description: |
    Returns the partner's locations, oldest first, in every status: every
    Location for a member holding `location:read` across the partner, and
    only the Locations their grants name for a member holding it at chosen
    Locations. The list
    is not paginated.
  tags:
    - Locations
  security:
    - Bearer: []
  responses:
    '200':
      description: The partner's locations.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/locations/LocationList.yaml
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: The caller lacks `location:read` (`access_denied`), or holds it at no Location (`no_location_assigned`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: The partner does not exist or is not visible to the caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
