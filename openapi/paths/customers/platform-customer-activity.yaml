# Path item for /v1/platform/customers/{customer_id}/activity. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: The customer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70
get:
  operationId: getCustomerActivity
  summary: Read how a customer orders
  description: A customer's completed orders over a range by way of ordering, the stores they order from, their average order, cancellations and refunds, worked out from ordering's orders when asked (since 0.41.0). The last 90 days by default, a year at most, on India's clock. `customer:read`.
  tags:
    - Customers
  security:
    - Bearer: []
  parameters:
    - name: from
      in: query
      required: false
      description: The first day, `YYYY-MM-DD`.
      schema:
        type: string
        format: date
    - name: until
      in: query
      required: false
      description: The last day, `YYYY-MM-DD`; today by default.
      schema:
        type: string
        format: date
  responses:
    "200":
      description: The activity.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerActivity.yaml
    "400":
      description: "`validation_failed`: a range backwards or over a year; `malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:read`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such customer."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
