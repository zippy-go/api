{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    },
    {
      "name": "location_id",
      "in": "path",
      "required": true,
      "description": "The Location, one of the Partner's (the sandbox twin's for a sandbox key).",
      "schema": {
        "type": "string",
        "format": "uuid"
      },
      "example": "01a13a48-9e00-7000-8000-000000000301"
    }
  ],
  "post": {
    "operationId": "placeApiOrder",
    "summary": "Place an order through the API",
    "description": "Places an order at one of the Partner's Locations for its own customer, from the published menu at its prices, paid to the Partner already or in cash on delivery: channel `api`, no marketplace fee, on the board like any order, and never in a marketplace customer's account. `ordering.order.placed` names the key (`api_key_id`). Needs `Idempotency-Key`; a key needs `orders:write`, a member `order:manage` at the Location.",
    "tags": [
      "Order handling"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "parameters": [
      {
        "$ref": "../../components/parameters/IdempotencyKeyHeader.yaml"
      }
    ],
    "requestBody": {
      "required": true,
      "description": "The order.",
      "content": {
        "application/json": {
          "schema": {
            "$ref": "../../components/schemas/orders/ApiOrderInput.yaml"
          }
        }
      }
    },
    "responses": {
      "201": {
        "description": "The order, placed.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/orders/StoreOrder.yaml"
            }
          }
        }
      },
      "400": {
        "description": "`validation_failed`: a line not on the menu, an answer that does not fit, an address missing for a delivery; `idempotency_key_required`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`forbidden` naming `orders:write` for a key without it; `access_denied`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`: the Partner or the Location.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`store_not_trading`; `idempotency_key_reuse`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
