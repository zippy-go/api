type: object
description: A delivery service's dispatch settings as a whole, with an optional reason, recorded with who made the change.
required:
  - strategy
  - mode
  - auto_assign
  - offer_timeout_seconds
  - max_tasks_per_agent
  - fallback_minutes
  - cash_ceiling
  - drop_code_required
properties:
  strategy:
    $ref: ./DispatchStrategy.yaml
    description: How Agents are chosen.
  mode:
    $ref: ./DispatchMode.yaml
    description: Offers or direct assignment.
  auto_assign:
    type: boolean
    description: Whether deliveries go to Agents by themselves.
    examples:
      - true
  offer_timeout_seconds:
    type: integer
    description: 30 to 120 seconds.
    examples:
      - 45
    minimum: 30
    maximum: 120
  max_tasks_per_agent:
    type: integer
    description: 1 to 10.
    examples:
      - 3
    minimum: 1
    maximum: 10
  fallback_minutes:
    type: integer
    description: 1 to 60 minutes.
    examples:
      - 10
    minimum: 1
    maximum: 60
  cash_ceiling:
    $ref: ../common/Money.yaml
    description: The cash ceiling, in the service's currency, ₹0 to ₹50,000.
  drop_code_required:
    type: boolean
    description: Whether every drop needs the customer's code.
    examples:
      - false
  reason:
    type:
      - string
      - "null"
    description: Why, kept in the audit log; at most 500 characters.
    examples:
      - null
    maxLength: 500
examples:
  - strategy: nearest_available
    mode: offers
    auto_assign: true
    offer_timeout_seconds: 45
    max_tasks_per_agent: 3
    fallback_minutes: 10
    cash_ceiling:
      minor_units: 500000
      currency: INR
    drop_code_required: false
    reason: null
