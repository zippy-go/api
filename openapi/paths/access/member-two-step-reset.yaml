# Path item for /v1/partners/{partner_id}/members/{membership_id}/two-step/reset. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: membership_id
    in: path
    required: true
    description: The membership, which must belong to the realm in the path.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a30
post:
  operationId: resetMemberTwoStep
  summary: Turn a member's two-step sign-in off
  description: "Turns a member's two-step sign-in off when they lost their phone and their recovery codes: `staff:write`, never for oneself (`two_step_self`). The member's sessions end, the act is in the audit log, and they sign in with the password alone."
  tags:
    - Access
  security:
    - Bearer: []
  responses:
    '204':
      description: Two-step sign-in is off for the member.
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`access_denied` without `staff:write`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '404':
      description: Unknown partner or membership.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: '`two_step_self`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store the operation needs is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
