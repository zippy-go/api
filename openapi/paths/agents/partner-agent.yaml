# Path item for /v1/partners/{partner_id}/agents/{agent_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: agent_id
    in: path
    required: true
    description: "The Agent: one membership of a person in one of a Partner's delivery services."
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a10
get:
  operationId: getPartnerAgent
  summary: Read an Agent
  description: One Agent of the Partner with every change of status, who made it, when and why. Members need `agent:read` for the service; Mission Control uses the same route with its platform permissions. Another Partner's Agent answers `404`.
  tags:
    - Agents
  security:
    - Bearer: []
  responses:
    "200":
      description: The Agent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
patch:
  operationId: updatePartnerAgent
  summary: Change an Agent's name or kind
  description: "Changes the name, or the kind, which must be one the service takes: an active membership of a new kind goes back to pending until that kind's documents are approved. Honours `If-Match`. Members need `agent:manage` for the service; Mission Control manages the platform fleet, and any Partner's Agents, with the same route and its platform permissions, every change written to the audit log."
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - $ref: ../../components/parameters/IfMatchHeader.yaml
  requestBody:
    required: true
    description: What changes.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentUpdate.yaml
  responses:
    "200":
      description: The Agent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "400":
      description: "`validation_failed`: a blank or long name."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`kind_not_allowed`, or `illegal_transition` for an offboarded membership."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "412":
      description: "`precondition_failed`: the Agent changed since the `ETag` sent."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
