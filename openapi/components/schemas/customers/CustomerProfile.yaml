type: object
description: The customer's profile, the `CustomerProfile` schema.
required:
  - user_id
  - given_name
  - email_verified
  - language
  - marketing
  - registered_entry
  - needs
  - created_at
  - updated_at
  - version
properties:
  user_id:
    type: string
    format: uuid
    description: The customer (the user).
  given_name:
    type: string
    description: The given name.
    examples:
      - Asha
  email_verified:
    type: boolean
    description: Whether a code proved the email.
  language:
    $ref: ./CustomerLanguage.yaml
    description: The language screens and messages use.
  marketing:
    $ref: ./MarketingConsent.yaml
    description: Marketing consent per channel.
  registered_entry:
    $ref: ../auth/RegistrationEntry.yaml
    description: What the registration served.
  needs:
    type: array
    items:
      $ref: ../auth/RegistrationStep.yaml
    description: 'What the account still lacks: `address` until one is saved.'
  created_at:
    type: string
    format: date-time
    description: When the account was opened.
  updated_at:
    type: string
    format: date-time
    description: When the profile last changed.
  version:
    type: integer
    description: Raised by one on every change; the entity tag of reads.
    examples:
      - 1
  date_of_birth:
    type:
      - string
      - 'null'
    format: date
    description: The date of birth, when given.
    examples:
      - 1994-05-01
  email:
    type:
      - string
      - 'null'
    description: An email for recovery, lower-cased; unverified until a code proves it, and never a way to sign in.
    examples:
      - asha@example.com
  family_name:
    type:
      - string
      - 'null'
    description: The family name; single names are ordinary.
    examples:
      - Reddy
  mobile:
    type:
      - string
      - 'null'
    description: The number they sign in with, E.164; changed only through the change of number.
    examples:
      - '+919876543210'
  terms_accepted_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When the terms were accepted, when they were.
examples:
  - user_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    mobile: '+919876543210'
    given_name: Asha
    family_name: Reddy
    email: asha@example.com
    email_verified: false
    date_of_birth: null
    language: en
    marketing:
      email: false
      push: false
      sms: false
      whatsapp: false
      agreed_at: null
    terms_accepted_at: null
    registered_entry: delivery
    needs:
      - address
    created_at: 2026-10-15T09:00:00Z
    updated_at: 2026-10-15T09:00:00Z
    version: 1
