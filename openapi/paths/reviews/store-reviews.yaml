# Path item for /v1/storefront/stores/{location_id}/reviews. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: "The store (a Location)."
    schema:
      type: string
      format: uuid
    example: "01a13a48-9e00-7000-8000-000000000301"
get:
  operationId: listStoreReviews
  summary: "Read a store's reviews"
  description: "A store's reviews as customers read them, signed in or not, newest first, twenty at a time, with the store's rating: each as the reviewer's first name, the thumb, the tags, the note, whether it was delivered or collected, when, and the store's published reply; never the order and never the photos. A review whose note the platform hid is listed with its thumb and tags and no note, so the list counts what the rating counts."
  tags:
    - Reviews
  security: []
  parameters:
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 50; 20 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "A page of the store's reviews."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/reviews/StoreReviewPage.yaml
    "400":
      description: "`validation_failed`: a limit out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such store live on the storefront."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
