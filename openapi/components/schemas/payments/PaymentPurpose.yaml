type: string
description: "What a payment is for: an order, a top-up of the customer's Wallet, or, since 0.33.0, a Partner's monthly invoice paid by UPI or card (`invoice`); since 0.39.0 an Agent's deposit of the cash they collected (`cash_deposit`), and since 0.41.0 a week below nothing a Partner pays by UPI (`shortfall`). Clients must tolerate values they do not know."
enum:
  - order
  - wallet_top_up
  - invoice
  - cash_deposit
  - shortfall
examples:
  - order
