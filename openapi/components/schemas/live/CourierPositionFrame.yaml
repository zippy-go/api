type: object
description: "Data of a `courier.position` frame on an order's channel: where its courier is, from the moment the order is collected until it is delivered, never before, with how old the position is."
required:
  - channel
  - order_id
  - position
  - age_seconds
properties:
  channel:
    type: string
    description: The channel.
    examples:
      - private-order-0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  order_id:
    type: string
    format: uuid
    description: The order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  position:
    $ref: ../fleet/AgentPosition.yaml
    description: The courier's position.
  age_seconds:
    type: integer
    description: How old the position is, in seconds, when sent.
    examples:
      - 2
    minimum: 0
examples:
  - channel: private-order-0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    position:
      lat: 17.4511
      lng: 78.3567
      heading_deg: 40
      speed_mps: 6.1
      recorded_at: 2026-10-16T13:30:00Z
    age_seconds: 2
