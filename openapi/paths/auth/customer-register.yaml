# Path item for /v1/auth/customer/register. Referenced from openapi.yaml.
post:
  operationId: registerCustomer
  summary: Complete a customer's registration
  description: "Completes a registration: the profile the platform can stand behind (a given name, the number proved, an optional email) and, optionally, a first address, written at once with a session. The market's gate is consulted again. A number another device registered meanwhile signs in to that account (`existing_account`), this draft dropped. A registration token past its thirty minutes, or anything that is not one, is `registration_expired`."
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    description: The registration token and the profile the platform can stand behind, with an optional first address.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/CustomerRegisterRequest.yaml
  responses:
    '200':
      description: Registered and signed in; `existing_account` is `true` when another device registered the number meanwhile and this draft was dropped.
      headers:
        Set-Cookie:
          description: With cookie delivery, the refresh token in `zg_refresh_customer`, `Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`. Absent with body delivery.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/CustomerSession.yaml
    '400':
      description: '`validation_failed`: the given name, the email, `date_of_birth_future`, `too_young`, `terms_not_accepted`, the address (`postal_code_invalid`, `pin_far_from_address`, `invalid_mobile`), or `delivery_required`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '401':
      description: '`registration_expired`: the token is not a registration token, was tampered with or is past its thirty minutes.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`account_blocked`.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '409':
      description: "`sign_in_closed`: the number's market closed to sign-in meanwhile."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '503':
      description: A store is unavailable (`unavailable`); retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
