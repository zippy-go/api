# Path item for /v1/partners/{partner_id}/agents. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
get:
  operationId: listPartnerAgents
  summary: List the Partner's Agents
  description: The Agents of the Partner's delivery services, invited ones included, by name, with their status and why, documents, duty and presence, current task and cash in hand, and the counts of the whole selection. Members need `agent:read` for the service; Mission Control uses the same route with its platform permissions. A member sees the services their grants reach.
  tags:
    - Agents
  security:
    - Bearer: []
  parameters:
    - name: service_id
      in: query
      required: false
      description: Only this service's.
      schema:
        type: string
        format: uuid
      example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
    - name: status
      in: query
      required: false
      description: Only Agents in this status.
      schema:
        $ref: ../../components/schemas/agents/AgentMembershipStatus.yaml
    - name: q
      in: query
      required: false
      description: Agents whose name holds these words, or whose mobile number ends in these digits.
      schema:
        type: string
        maxLength: 100
      example: Ravi
    - name: limit
      in: query
      required: false
      description: At most this many, 1 to 200; 50 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
      example: 50
    - name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
  responses:
    "200":
      description: The Agents.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgentPage.yaml
    "400":
      description: "`validation_failed`: a malformed filter, or `cursor_invalid`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
post:
  operationId: inviteAgent
  summary: Invite an Agent
  description: Invites a person by mobile number (+91 by default) or email into one of the Partner's delivery services with a kind the service takes. The person is told by message how to join (an SMS, or an email) and may then ask the Agent app for a code to that number; the Agents list shows them invited until they accept. The invitation lapses after 14 days and may be sent again. Members need `agent:manage` for the service; Mission Control manages the platform fleet, and any Partner's Agents, with the same route and its platform permissions, every change written to the audit log.
  tags:
    - Agents
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Who, into which service, as what.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentInvite.yaml
  responses:
    "201":
      description: The Agent, invited.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/PartnerAgent.yaml
    "400":
      description: "`validation_failed`: a missing name, neither or both of a number and an email, a number that is not a mobile number (`invalid_mobile`, `not_a_mobile`), a malformed email."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` naming the permission the member lacks at the service, or `forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: the Partner, the Agent or the service is not one the caller can see; another Partner's Agent answers the same."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`service_not_agent_based` (the service does not send people out), `kind_not_allowed` (the service does not run that kind's vehicle), `agent_already_member` (the person holds a membership or an invitation in progress in the service), `partner_archived`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
