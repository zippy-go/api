type: object
description: "One order's part of a week: its sales, promotions, net sales, the rule and rate its fee came from, the fee and its GST, the charges that are the Location's, cash the Location collected, refunds charged on it in the week, and what the Partner got for it."
required:
  - order_id
  - number
  - outcome
  - ended_at
  - carrier
  - fulfilment
  - sales
  - promotions
  - net_sales
  - plan
  - rate_bp
  - fee
  - fee_gst
  - delivery_charge
  - tip
  - cutlery_charge
  - cash_collected
  - refunds
  - partner_gets
properties:
  order_id:
    type: string
    format: uuid
    description: The order.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
  number:
    type: string
    description: The order's number, as said aloud.
    examples:
      - AB0042
  outcome:
    $ref: ./StatementOrderOutcome.yaml
    description: How it counts.
  ended_at:
    type: string
    format: date-time
    description: "When it ended: completed, or cancelled."
    examples:
      - 2026-10-22T13:40:00Z
  carrier:
    $ref: ./StatementCarrier.yaml
    description: Who carried it.
  fulfilment:
    $ref: ./StatementFulfilment.yaml
    description: How it was fulfilled, so a tab's row and a booking's stand apart from a pickup's.
  sales:
    $ref: ../common/Money.yaml
    description: Its item sales; nothing for an order the Partner cancelled.
  promotions:
    $ref: ../common/Money.yaml
    description: What the Partner paid towards its promotion.
  net_sales:
    $ref: ../common/Money.yaml
    description: Sales after the Partner's promotion.
  plan:
    type:
      - string
      - "null"
    description: The policy layer the fee's rate came from, as the order was placed under it.
    examples:
      - country India
  rate_bp:
    type: integer
    description: "The fee's rate in basis points: 1200 is 12%."
    examples:
      - 1200
  fee:
    $ref: ../common/Money.yaml
    description: The platform's fee on it, or the cancellation fee for an order the Partner cancelled.
  fee_gst:
    $ref: ../common/Money.yaml
    description: GST on the fee, as the ledger split the order.
  delivery_charge:
    $ref: ../common/Money.yaml
    description: Its delivery charge, when the Location's own Agents carried it.
  tip:
    $ref: ../common/Money.yaml
    description: Its tip, when the Location's own Agents carried it.
  cutlery_charge:
    $ref: ../common/Money.yaml
    description: Its cutlery charge.
  cash_collected:
    $ref: ../common/Money.yaml
    description: Cash the Location collected on it.
  refunds:
    $ref: ../common/Money.yaml
    description: Refunds of it given in the same week and charged to the Partner.
  partner_gets:
    $ref: ../common/Money.yaml
    description: "What the Partner got for it: net sales less the fee and its GST, plus its charges, less cash and refunds."
examples:
  - order_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9b01
    number: AB0042
    outcome: completed
    ended_at: 2026-10-22T13:40:00Z
    carrier: platform_fleet
    fulfilment: delivery
    sales:
      minor_units: 50000
      currency: INR
    promotions:
      minor_units: 0
      currency: INR
    net_sales:
      minor_units: 50000
      currency: INR
    plan: country India
    rate_bp: 1200
    fee:
      minor_units: 6000
      currency: INR
    fee_gst:
      minor_units: 1080
      currency: INR
    delivery_charge:
      minor_units: 0
      currency: INR
    tip:
      minor_units: 0
      currency: INR
    cutlery_charge:
      minor_units: 0
      currency: INR
    cash_collected:
      minor_units: 0
      currency: INR
    refunds:
      minor_units: 0
      currency: INR
    partner_gets:
      minor_units: 42920
      currency: INR
