type: object
description: "A Partner's monthly invoice, the `Invoice` schema: its lines with GST at 18% apart, the month's order fees already settled weekly for reference, how it is paid and its credit notes. It never changes once issued."
required:
  - id
  - number
  - partner_id
  - partner_name
  - partner_gstin
  - platform_gstin
  - month
  - issued_at
  - due_on
  - state
  - lines
  - subtotal
  - gst_rate_percent
  - gst
  - total
  - credited
  - paid
  - outstanding
  - method
  - paid_at
  - payment_reference
  - statement_id
  - order_fees
  - credit_notes
  - document_url
properties:
  id:
    type: string
    format: uuid
    description: The invoice.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000c901
  number:
    type: string
    description: Its number, one counter a calendar year.
    examples:
      - PB-2026-00007
  partner_id:
    type: string
    format: uuid
    description: The Partner.
    examples:
      - 01a13a48-9e00-7000-8000-000000000001
  partner_name:
    type: string
    description: The Partner's legal name.
    examples:
      - ZippyGo Dev Foods Private Limited
  partner_gstin:
    type:
      - string
      - "null"
    description: The Partner's GSTIN, where given.
    examples:
      - 36AAACZ4321D1Z5
  platform_gstin:
    type: string
    description: The platform's GSTIN.
    examples:
      - 36AABCZ1234F1Z9
  month:
    type: string
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    description: The month it bills, `YYYY-MM`.
    examples:
      - 2026-11
  issued_at:
    type: string
    format: date-time
    description: "When it was issued: the 1st at 06:00 India time for the month before."
    examples:
      - 2026-12-01T00:30:00Z
  due_on:
    type: string
    format: date
    description: When it is due, 15 days after.
    examples:
      - 2026-12-16
  state:
    $ref: ./InvoiceState.yaml
    description: Where it stands.
  lines:
    type: array
    items:
      $ref: ./InvoiceLine.yaml
    description: Its lines.
  subtotal:
    $ref: ../common/Money.yaml
    description: The lines, before GST.
  gst_rate_percent:
    type: integer
    description: The GST rate.
    examples:
      - 18
  gst:
    $ref: ../common/Money.yaml
    description: The GST, apart.
  total:
    $ref: ../common/Money.yaml
    description: What it comes to.
  credited:
    $ref: ../common/Money.yaml
    description: What credit notes took off, GST included.
  paid:
    $ref: ../common/Money.yaml
    description: What was paid.
  outstanding:
    $ref: ../common/Money.yaml
    description: What remains.
  method:
    $ref: ./BillingMethod.yaml
    description: How it is paid.
  paid_at:
    type:
      - string
      - "null"
    format: date-time
    description: When it was paid.
    examples:
      - null
  payment_reference:
    type:
      - string
      - "null"
    description: The payment's reference.
    examples:
      - null
  statement_id:
    type:
      - string
      - "null"
    format: uuid
    description: The payout statement that settled it by deduction.
    examples:
      - null
  order_fees:
    type: array
    items:
      $ref: ./InvoiceOrderFee.yaml
    description: The month's order fees, already settled weekly, for reference.
  credit_notes:
    type: array
    items:
      $ref: ./InvoiceCreditNote.yaml
    description: Its credit notes.
  document_url:
    type: string
    description: Its PDF.
    examples:
      - /v1/partners/01a13a48-9e00-7000-8000-000000000001/invoices/019a3d10-2b00-7d00-8a00-00000000c901/document
examples:
  - id: 019a3d10-2b00-7d00-8a00-00000000c901
    number: PB-2026-00007
    partner_id: 01a13a48-9e00-7000-8000-000000000001
    partner_name: ZippyGo Dev Foods Private Limited
    partner_gstin: 36AAACZ4321D1Z5
    platform_gstin: 36AABCZ1234F1Z9
    month: 2026-11
    issued_at: 2026-12-01T00:30:00Z
    due_on: 2026-12-16
    state: issued
    lines:
      - kind: plan
        description: Pro plan, November 2026
        quantity: 1
        unit_price:
          minor_units: 499900
          currency: INR
        amount:
          minor_units: 499900
          currency: INR
    subtotal:
      minor_units: 499900
      currency: INR
    gst_rate_percent: 18
    gst:
      minor_units: 89982
      currency: INR
    total:
      minor_units: 589882
      currency: INR
    credited:
      minor_units: 0
      currency: INR
    paid:
      minor_units: 0
      currency: INR
    outstanding:
      minor_units: 589882
      currency: INR
    method: deduction
    paid_at: null
    payment_reference: null
    statement_id: null
    order_fees:
      - kind: delivery_orders
        count: 412
        amount:
          minor_units: 618000
          currency: INR
    credit_notes: []
    document_url: /v1/partners/01a13a48-9e00-7000-8000-000000000001/invoices/019a3d10-2b00-7d00-8a00-00000000c901/document
