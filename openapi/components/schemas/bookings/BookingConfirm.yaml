type: object
description: Confirming a booking.
properties:
  agent_id:
    type:
      - string
      - "null"
    format: uuid
    description: The Agent; the one proposed by default, or `null` to leave the service to choose the nearest one free with the qualifications.
    examples:
      - 019a3d10-2b00-7d00-8a00-00000000e001
examples:
  - agent_id: 019a3d10-2b00-7d00-8a00-00000000e001
