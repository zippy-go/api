# Path item for /v1/customer/sessions. Referenced from openapi.yaml.
get:
  operationId: listCustomerSessions
  summary: List the sessions holding the account
  description: The sessions holding the account, newest first, each with its device (or marked unrecognised), where it was last used and when it ends; the one asking is `current`.
  tags:
    - Customer account
  security:
    - Bearer: []
  responses:
    '200':
      description: The live sessions, newest first.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerSessionList.yaml
    '401':
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '403':
      description: '`forbidden`: a token of another surface.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
