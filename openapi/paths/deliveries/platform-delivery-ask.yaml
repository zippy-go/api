# Path item for /v1/platform/deliveries/{delivery_id}/ask. Referenced from openapi.yaml.
parameters:
  - name: delivery_id
    in: path
    required: true
    description: The delivery.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4bd401
post:
  operationId: askPlatformDeliveryAgain
  summary: Ask a Provider for any delivery again
  description: As the partner's own route, for any delivery. Mission Control tokens holding platform `dispatch:manage`; every act is written to the audit log.
  tags:
    - Deliveries
  security:
    - Bearer: []
  responses:
    "200":
      description: The delivery, asked again.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/DeliveryDetail.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`forbidden`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`nothing_to_ask` while a Provider has the delivery and nothing is wrong with it; `delivery_collected` once collected; `delivery_ended` once it ended; `no_provider` while the store names no Provider that can carry it."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
