type: object
description: A new plan. The store must take scheduled orders and deliver (`scheduled_delivery_off`).
required:
  - name
  - items
  - frequencies
properties:
  name:
    type: string
    minLength: 1
    maxLength: 80
    description: Its name, 1 to 80 characters.
    examples:
      - Daily milk
  description:
    type:
      - string
      - "null"
    maxLength: 500
    description: What it is, at most 500 characters.
    examples:
      - Fresh toned milk at your door every morning.
  items:
    type: array
    items:
      $ref: ./SubscriptionPlanItemInput.yaml
    description: Its items, 1 to 10.
  frequencies:
    type: array
    items:
      $ref: ../subscriptions/SubscriptionFrequency.yaml
    description: The frequencies it allows, at least one.
  window:
    $ref: ../subscriptions/DeliveryWindow.yaml
    description: The delivery window, 06:00 to 08:00 by default; at least 30 minutes.
  min_deliveries:
    type: integer
    minimum: 1
    maximum: 60
    description: The minimum term in deliveries, 1 to 60; 7 by default.
    examples:
      - 7
  substitutions_allowed:
    type: boolean
    description: Whether substitutions are allowed; `true` by default.
    examples:
      - true
  delivery_fee:
    $ref: ../common/Money.yaml
    description: The delivery fee of each delivery; none by default.
examples:
  - name: Daily milk
    description: Fresh toned milk at your door every morning.
    items:
      - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7101
        variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
        unit_price:
          minor_units: 3200
          currency: INR
        default_quantity: 1
        min_quantity: 1
        max_quantity: 6
    frequencies:
      - daily
      - weekdays
      - alternate_days
    window:
      starts: 06:00
      ends: 08:00
    min_deliveries: 7
    substitutions_allowed: true
    delivery_fee:
      minor_units: 0
      currency: INR
