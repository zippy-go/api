type: object
description: One item of a subscription with its everyday quantity and price.
required:
  - item_id
  - variant_id
  - name
  - variant_label
  - quantity
  - unit_price
  - next_price
properties:
  item_id:
    type: string
    format: uuid
    description: The item.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7101
  variant_id:
    type: string
    format: uuid
    description: The variant.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
  name:
    type: string
    description: The item.
    examples:
      - Toned milk
  variant_label:
    type:
      - string
      - "null"
    description: The variant.
    examples:
      - 500 ml
  quantity:
    type: integer
    minimum: 1
    description: How many each delivery day, unless a day says otherwise.
    examples:
      - 2
  unit_price:
    $ref: ../common/Money.yaml
    description: The price of one now.
  next_price:
    oneOf:
      - $ref: ./SubscriptionPrice.yaml
      - type: "null"
    description: A new price announced and when it applies.
examples:
  - item_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7101
    variant_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7102
    name: Toned milk
    variant_label: 500 ml
    quantity: 2
    unit_price:
      minor_units: 3200
      currency: INR
    next_price: null
