# Path item for /v1/platform/customers/{customer_id}/timeline. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: "The customer (a user id)."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70"
get:
  operationId: listCustomerTimeline
  summary: "Read what happened on the account"
  description: "A dated timeline of the account, newest first, drawn from the domain events: registered, signed in, orders placed, accepted, delivered, collected, cancelled, declined or expired, refunds, help asked for and resolved, Wallet credits and corrections, reviews written, support's notes, blocked and unblocked. Each entry names who did it: the customer, a named operator, the store's staff, or the platform. Mission Control tokens only, with `customer:read`."
  tags:
    - Customers
  security:
    - Bearer: []
  parameters:
    - name: limit
      in: query
      required: false
      description: "How many, 1 to 100; 50 by default."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      description: "Where the page starts."
      schema:
        type: string
  responses:
    "200":
      description: "A page of the timeline."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/customers/CustomerTimelinePage.yaml
    "400":
      description: "`validation_failed`: a parameter out of range or a cursor this caller was not given (`cursor_invalid`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:read`, or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such customer."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
