{
  "parameters": [
    {
      "$ref": "../../components/parameters/PartnerIdPath.yaml"
    },
    {
      "name": "endpoint_id",
      "in": "path",
      "required": true,
      "description": "The endpoint.",
      "schema": {
        "type": "string",
        "format": "uuid"
      },
      "example": "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b7e01"
    }
  ],
  "post": {
    "operationId": "enableWebhookEndpoint",
    "summary": "Enable a disabled endpoint",
    "description": "Enables a disabled endpoint and replays every delivery that failed since it was disabled. Announced as `developer.endpoint.enabled`. Members need `developer:read` to read and `developer:manage` to change; a key needs `webhooks:manage`.",
    "tags": [
      "Webhooks"
    ],
    "security": [
      {
        "Bearer": []
      },
      {
        "ApiKey": []
      }
    ],
    "responses": {
      "200": {
        "description": "Done.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../../components/schemas/developer/WebhookEndpoint.yaml"
            }
          }
        }
      },
      "403": {
        "description": "`access_denied`; `forbidden` naming `webhooks:manage`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "404": {
        "description": "`not_found`.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "409": {
        "description": "`conflict`: the endpoint is not disabled (enable).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "401": {
        "description": "No valid access token or key was sent, or it was refused (`unauthenticated`).",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "4XX": {
        "description": "Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      },
      "default": {
        "description": "An unexpected server error, returned as an RFC 9457 problem details document.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../../components/schemas/common/Problem.yaml"
            }
          }
        }
      }
    }
  }
}
