type: object
description: "A playbook or a type: its name and example, whether it is built yet, and the answers it opens the editor with."
required:
  - code
  - name
  - example
  - mechanic
  - built
  - answers
properties:
  code:
    type: string
    description: Its stable code.
    examples:
      - buy_1_get_1
  name:
    type: string
    description: Its name.
    examples:
      - Buy 1, get 1 free
  example:
    type: string
    description: An example of it.
    examples:
      - Buy 1 biryani, get 1 free
  mechanic:
    $ref: ./OfferMechanic.yaml
    description: Its mechanic.
  built:
    type: boolean
    description: Whether it can be made yet; one not built is shown as coming.
    examples:
      - true
  answers:
    $ref: ./OfferInput.yaml
    description: The answers it fills in, every one changeable.
examples:
