type: object
description: |
  A physical place that belongs to a partner: a store, a restaurant, a dark
  store, a warehouse or a service base. Pickups happen at locations and the
  partner's local operations are anchored to them. Coordinates are WGS 84.
required:
  - id
  - partner_id
  - name
  - address
  - lat
  - lng
  - time_zone
  - phone
  - status
  - created_at
  - updated_at
  - version
  - created_by
  - updated_by
  - service_area_id
  - pin_in_zone
  - contacts
  - vertical_ids
  - category_ids
  - fulfilment
  - order_settings
  - listing
  - fields
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the location.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
  partner_id:
    type: string
    format: uuid
    description: The partner the location belongs to.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
  name:
    type: string
    minLength: 1
    maxLength: 200
    description: The name the location is known by within the partner.
    examples:
      - Location 40
  address:
    $ref: ../common/Address.yaml
    description: The postal address.
  lat:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude in decimal degrees (WGS 84).
    examples:
      - 12.9716
  lng:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in decimal degrees (WGS 84).
    examples:
      - 77.5946
  time_zone:
    type: string
    minLength: 1
    description: The IANA time zone the location operates in, for example `Asia/Kolkata`. Opening hours and local times are interpreted in it.
    examples:
      - Asia/Kolkata
  phone:
    type:
      - string
      - 'null'
    pattern: ^\+[1-9][0-9]{1,14}$
    description: The phone number of the location in E.164 format, or `null`.
    examples:
      - '+15555550102'
  status:
    $ref: ./LocationStatus.yaml
    description: Whether the location takes part in operations.
  created_at:
    type: string
    format: date-time
    description: When the location was created, as an RFC 3339 timestamp in UTC.
    examples:
      - 2026-10-14T08:10:00Z
  updated_at:
    type: string
    format: date-time
    description: When the location was last changed, as an RFC 3339 timestamp in UTC; equal to `created_at` until the first change.
    examples:
      - 2026-10-14T08:10:00Z
  version:
    type: integer
    format: int64
    minimum: 1
    description: The version, raised by one on every change. Reads return it as the `ETag` (`"v<version>"`); send it in `If-Match` on a write to be refused with `412` when the location moved.
    examples:
      - 1
  created_by:
    type:
      - string
      - 'null'
    format: uuid
    description: The user who created the location, or `null` for seeded locations.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  updated_by:
    type:
      - string
      - 'null'
    format: uuid
    description: The user who last changed the location, or `null` until it is changed through the API.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
  service_area_id:
    type:
      - string
      - 'null'
    format: uuid
    description: The service area the location's pin resolves to, set when the location is created or its pin moves; `null` for locations placed before service areas existed. See `GET /v1/service-areas/resolve`.
    examples:
      - 01a13a48-9e00-7000-8000-00000000a014
  pin_in_zone:
    type: boolean
    description: Whether the pin lies inside the zone's fence; outside is a warning, not a refusal.
  contacts:
    type: array
    items:
      $ref: ../partners/Contact.yaml
    description: The people to reach at the Location, with their consent per channel.
  vertical_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Verticals it trades in, each offered in its zone.
  category_ids:
    type: array
    items:
      type: string
      format: uuid
    description: Its categories within those Verticals.
  fulfilment:
    $ref: ./Fulfilment.yaml
    description: How orders leave it (a store's).
  order_settings:
    $ref: ./OrderSettings.yaml
    description: How it takes orders (a store's).
  listing:
    $ref: ./Listing.yaml
    description: How it appears on the storefront (a store's).
  fields:
    type: object
    description: Typed extra fields the types of its Services declare (a food store's FSSAI licence number), checked against the reference data's field catalogue.
  banner_asset_id:
    type:
      - string
      - 'null'
    format: uuid
    description: Its banner, a `location_banner` asset twice as wide as tall.
  blockers:
    type:
      - array
      - 'null'
    items:
      $ref: ../partners/Blocker.yaml
    description: What keeps it from going live, the same blockers an activation is refused with; on reads.
  currency:
    type:
      - string
      - 'null'
    description: The currency of its zone's country.
    examples:
      - INR
  deleted_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When it was deleted, for a Location in the bin.
  description:
    type:
      - string
      - 'null'
    description: What the Location is, in its own words.
  go_live_requested_at:
    type:
      - string
      - 'null'
    format: date-time
    description: "Set when somebody asked it to go live while its Partner was pending: the Partner's activation brings it live with it."
  live:
    oneOf:
      - $ref: ./LocationLive.yaml
      - type: 'null'
    description: What it is doing now, at one instant; on reads.
  logo_asset_id:
    type:
      - string
      - 'null'
    format: uuid
    description: Its tile on the storefront, a square `location_logo` asset.
  pause:
    oneOf:
      - $ref: ./Pause.yaml
      - type: 'null'
    description: The pause in force or last set; it ends by itself at `until`.
  reads_as:
    oneOf:
      - $ref: ./ReadsAs.yaml
      - type: 'null'
    description: A store when a product-sales Service or a field Service is on there, else a branch; on reads.
  services:
    type:
      - array
      - 'null'
    items:
      $ref: ./LocationService.yaml
    description: The Services switched on here and whether each trades here now, from the registry; on reads.
  status_changed_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When the status last changed.
  status_changed_by:
    type:
      - string
      - 'null'
    format: uuid
    description: Who last changed the status.
  status_reason:
    type:
      - string
      - 'null'
    description: Why it is in that status, for a suspension.
  warnings:
    type:
      - array
      - 'null'
    items:
      $ref: ../partners/Blocker.yaml
    description: Softer gaps shown without stopping anybody (a pin outside the zone, nobody to call); on reads.
  went_live_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When it first went live.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a40
    partner_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a02
    name: Location 40
    address:
      line1: 1 Example Street
      line2: null
      city: Bengaluru
      state: Karnataka
      postal_code: '560001'
      country: IN
    lat: 12.9716
    lng: 77.5946
    time_zone: Asia/Kolkata
    phone: null
    status: active
    created_at: 2026-10-14T08:10:00Z
    updated_at: 2026-10-14T08:10:00Z
    version: 1
    created_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    updated_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a20
    service_area_id: 01a13a48-9e00-7000-8000-00000000a014
    pin_in_zone: true
    contacts:
      - purpose: operations
        name: Example Person
        role: Store manager
        email: person@example.com
        phone: '+15555550102'
        consent:
          email: true
          sms: true
          whatsapp: false
    vertical_ids:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a12
    category_ids: []
    fulfilment:
      delivery:
        carrier: platform_fleet
        zone: null
      pickup:
        ready_offset_minutes: 10
      dine_in: null
    order_settings:
      preparation:
        mode: fixed
        minutes: 20
      scheduled:
        accepts: false
        slot_minutes: 30
        cap_per_slot: null
        window_days: 2
      auto_reject_minutes: null
      cutlery:
        asks: true
        fee: 0
      prescriptions: false
    listing:
      tags:
        - example
      highlights: []
      reviews: true
    fields: {}
    banner_asset_id: null
    blockers: []
    currency: INR
    deleted_at: null
    description: null
    go_live_requested_at: null
    live:
      state: online
      reason: null
      until: 2026-10-15T17:30:00Z
      pause: null
      preparation_minutes: 20
      at: 2026-10-15T09:00:00Z
    logo_asset_id: null
    pause: null
    reads_as: store
    services:
      - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a45
        kind: product_sales
        name: Product sales
        status: enabled
        trading: true
    status_changed_at: 2026-10-14T08:20:00Z
    status_changed_by: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a21
    status_reason: null
    warnings: []
    went_live_at: 2026-10-14T08:20:00Z
