# Path item for /v1/platform/customers/{customer_id}/block. Referenced from openapi.yaml.
parameters:
  - name: customer_id
    in: path
    required: true
    description: "The customer (a user id)."
    schema:
      type: string
      format: uuid
    example: "0192b6f4-9b0a-7cde-8f3a-6d2c1e4b9a70"
post:
  operationId: blockCustomer
  summary: "Block a customer"
  description: "Blocks the account with a reason: every session ends at once (the app and the storefront are signed out at their next request), every refresh and sign-in answers `403` `account_blocked` saying \"Your account is blocked. If you think this is a mistake, contact ZippyGo support.\", and placing an order is refused; an order already placed runs to its end and its refunds stay possible. On the timeline and in the audit log; publishes `customers.customer.blocked`. Mission Control tokens only, with `customer:block`."
  tags:
    - Customers
  security:
    - Bearer: []
  requestBody:
    required: true
    description: Why.
    content:
      "application/json":
        schema:
          $ref: ../../components/schemas/customers/CustomerBlockInput.yaml
  responses:
    "200":
      description: "The customer, blocked."
      content:
        "application/json":
          schema:
            $ref: ../../components/schemas/customers/PlatformCustomer.yaml
    "400":
      description: "`validation_failed`: an empty reason or one over 300 characters."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: "No valid access token was sent, or it was refused (`unauthenticated`)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without `customer:block`, or `forbidden` (another surface)."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: no such customer."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`illegal_transition`: the account is blocked already."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: "Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: "An unexpected server error, returned as an RFC 9457 problem details document."
      content:
        "application/problem+json":
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
