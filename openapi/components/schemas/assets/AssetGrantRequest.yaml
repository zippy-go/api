type: object
description: Request body of `POST /v1/assets/grants`, the `GrantRequest` schema.
required:
  - purpose
  - file_name
  - content_type
  - size_bytes
properties:
  content_type:
    type: string
    description: The file's content type as the client reads it.
    examples:
      - image/png
  file_name:
    type: string
    description: The file name as the person has it.
    examples:
      - food.png
  purpose:
    $ref: ./AssetPurposeCode.yaml
    description: The purpose; a platform purpose here.
  size_bytes:
    type: integer
    format: int64
    description: The file's size in bytes as the client reads it.
    examples:
      - 48213
examples:
  - content_type: image/png
    file_name: food.png
    purpose: vertical_image
    size_bytes: 48213
