type: object
description: What became of one mark, with its ticket as it stands after the batch.
required:
  - id
  - outcome
  - reason
  - ticket
properties:
  id:
    type: string
    format: uuid
    description: The mark.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8301
  outcome:
    $ref: ./KitchenMarkOutcome.yaml
    description: What became of it.
  reason:
    type:
      - string
      - "null"
    description: Why it was refused or superseded, in words.
    examples:
      - null
  ticket:
    oneOf:
      - $ref: ./KitchenTicket.yaml
      - type: "null"
    description: The ticket as it stands now; `null` for a ticket of another Location or none.
examples:
  - id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d8301
    outcome: applied
    reason: null
