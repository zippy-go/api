# Path item for /v1/customer/subscriptions/{subscription_id}/quantities. Referenced from openapi.yaml.
parameters:
  - name: subscription_id
    in: path
    required: true
    description: The subscription, the customer's own.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c7201
put:
  operationId: setSubscriptionQuantities
  summary: Change the everyday quantities from a day
  description: Sets the everyday quantities from a day onward, each within its range; the days before keep theirs, and a day set on its own keeps its own. A day whose cutoff passed moves the change to the next delivery day.
  tags:
    - Subscriptions
  security:
    - Bearer: []
  requestBody:
    required: true
    description: The day and the quantities.
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/subscriptions/SubscriptionQuantitiesInput.yaml
  responses:
    "200":
      description: The subscription after the change.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/subscriptions/SubscriptionChange.yaml
    "400":
      description: "`validation_failed`: a malformed member, or a quantity out of range (`quantity_out_of_range`)."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`forbidden`: a token of another surface."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the subscription is not the customer's."
      content:
        application/problem+json:
          schema: *a1
    "409":
      description: "`subscription_ended`."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
