# Path item for /v1/auth/sign-out. Referenced from openapi.yaml.
post:
  operationId: signOut
  summary: Sign out
  description: |
    Revokes the session the access token belongs to (its `sid` claim): the
    session's refresh token can no longer be used, and for browsers the
    `zg_refresh` cookie is cleared. The access token itself stays valid
    until its `exp`, at most 15 minutes; clients discard it. Other sessions
    of the same user are not affected.
  tags:
    - Auth
  security:
    - Bearer: []
  responses:
    '204':
      description: The session was revoked.
      headers:
        Set-Cookie:
          description: For browsers, clears the refresh token cookie (`zg_refresh=; Path=/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict`).
          schema:
            type: string
    '401':
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    '4XX':
      description: Another client error, such as `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
