# Path item for /v1/platform/locations/{location_id}/weeks/{week}/lock. Referenced from openapi.yaml.
parameters:
  - name: location_id
    in: path
    required: true
    description: The Location.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
  - name: week
    in: path
    required: true
    description: The ISO week, `YYYYWww`, Monday to Sunday on the payee's clock.
    schema:
      type: string
      pattern: ^[0-9]{4}W[0-9]{2}$
    example: 2026W43
  - $ref: ../../components/parameters/IdempotencyKeyHeader.yaml
post:
  operationId: lockLocationWeek
  summary: Lock a Location's week
  description: "Locks a Location's week once it is over, as the clock does on the Tuesday after: one statement per Location and week, whoever locks it, with the invoice number taken only by the statement that won the lock. A week not over yet is refused saying when it can be locked; a week before the Location's latest statement is refused, its money carried on; a week with no order, refund, adjustment or cash makes no statement. Written to the audit log. `payout:manage`."
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "201":
      description: The statement written.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/Statement.yaml
    "400":
      description: "`validation_failed`: a week not written `YYYYWww`, or `idempotency_key_missing`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: Not a Mission Control token (`forbidden`), or the member lacks `payout:manage` (`access_denied`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: No such Location (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`week_not_over` with when it can be locked, `week_locked` naming its statement, `week_carried_on`, or `week_empty`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
