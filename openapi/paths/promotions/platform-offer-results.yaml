# Path item for /v1/platform/offers/{offer_id}/results. Referenced from openapi.yaml.
parameters:
  - name: offer_id
    in: path
    required: true
    description: The offer.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d7001
get:
  operationId: getPlatformOfferResults
  summary: Read an offer's results
  description: "An offer's results since it started, worked out from completed orders when asked: the orders that used it, their sales, its cost and who paid, new and returning customers, and sales per rupee of cost, against the same hours in the four weeks before it started. `code_id` narrows them to one of its codes. A display kind prices nothing and answers `offer_not_priced`. `promotion:read`."
  tags:
    - Promotions
  security:
    - Bearer: []
  parameters:
    - name: code_id
      in: query
      required: false
      description: One of its codes, to narrow the figures to.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Its results.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/promotions/OfferResults.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: "`access_denied` without the permission."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: "`not_found`: not an offer the caller may read, or a code not its own."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "409":
      description: "`offer_not_priced`: a featured row, a shelf or an announcement."
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
