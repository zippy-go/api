type: object
description: A step of the spend bar towards the next basket offer.
required:
  - offer_id
  - line
  - min_spend
properties:
  offer_id:
    type: string
    format: uuid
    description: The offer.
    examples:
      - 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6002
  line:
    type: string
    description: Its line.
    examples:
      - Free delivery over ₹199
  min_spend:
    $ref: ../common/Money.yaml
    description: What the items must come to.
examples:
  - offer_id: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4d6002
    line: Free delivery over ₹199
    min_spend:
      minor_units: 19900
      currency: INR
