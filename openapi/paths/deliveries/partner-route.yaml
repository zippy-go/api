# Path item for /v1/partners/{partner_id}/dispatch/routes/{route_id}. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: route_id
    in: path
    required: true
    description: The route.
    schema:
      type: string
      format: uuid
    example: 0192b6f4-9b0a-7cde-8f3a-6d2c1e4c8101
get:
  operationId: getPartnerRoute
  summary: Read a route with the partner's stops
  description: "A planned route with this Partner's stops in the route's order, each with its state. A route is the morning's scheduled and subscription deliveries of one zone and window, built at 22:00 on the stores' clock the evening before into a trip for one Agent: its pickups first, at most 20 drops, every drop inside the window. It is re-optimised as orders join or leave until it is offered, 45 minutes before its window, to the Agents on duty in its zone, unless a dispatcher gave it to an Agent before. Members need `dispatch:read`. A route carrying none of the Partner's stops is not found."
  tags:
    - Deliveries
  security:
    - Bearer: []
  responses:
    "200":
      description: The route.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/dispatch/Route.yaml
    "400":
      description: "`malformed_identifier`."
      content:
        application/problem+json:
          schema: &a1
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema: *a1
    "403":
      description: "`access_denied` without `dispatch:read`."
      content:
        application/problem+json:
          schema: *a1
    "404":
      description: "`not_found`: the partner, or a route carrying none of its stops."
      content:
        application/problem+json:
          schema: *a1
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema: *a1
