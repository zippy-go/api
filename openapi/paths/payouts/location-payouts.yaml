# Path item for /v1/partners/{partner_id}/locations/{location_id}/payouts. Referenced from openapi.yaml.
parameters:
  - $ref: ../../components/parameters/PartnerIdPath.yaml
  - name: location_id
    in: path
    required: true
    description: The Location, which must be one of the Partner's; a sister Location's statement answers `404`.
    schema:
      type: string
      format: uuid
    example: 01a13a48-9e00-7000-8000-000000000301
get:
  operationId: getLocationPayouts
  summary: Read what a Location will be paid
  description: "What the Location will be paid and why: the next payment (the oldest locked week not paid yet; else the week just ended until it locks; else the week in progress so far, as an estimate while it can still change), where the money stands in a sentence, the week so far order by order, six months of past statements with their documents, where it is paid and whether that is checked, and what would hold a payout now. Members need `payout:read` at the Location: Managers hold it, Staff do not."
  tags:
    - Payouts
  security:
    - Bearer: []
  responses:
    "200":
      description: What the Location will be paid.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payouts/LocationPayouts.yaml
    "400":
      description: A parameter or the body failed validation (`validation_failed`), or an identifier is malformed (`malformed_identifier`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "401":
      description: No valid access token was sent, or it was refused (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "403":
      description: A member without `payout:read` at the Location (`access_denied`), or a Partner whose envelope lacks it (`not_enabled_for_partner`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    "404":
      description: The Partner or the Location does not exist or is not the caller's (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    4XX:
      description: Another client error, such as `415` for a body that is not JSON or `429` when rate limited, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
    default:
      description: An unexpected server error, returned as an RFC 9457 problem details document.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/common/Problem.yaml
